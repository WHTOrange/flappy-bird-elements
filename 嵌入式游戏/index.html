    const R = CFG.ORB_R;
    const t = frameCount * 0.012;                        // 渐变起始角：缓慢旋转的流光
    const glow = 12 + 5 * Math.sin(frameCount * 0.06);   // 光晕呼吸
    ctx.save();
    ctx.shadowColor = 'hsla(' + ((frameCount * 0.6) % 360) + ', 95%, 65%, 0.9)';
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.arc(o.x, o.y, R, 0, Math.PI * 2);
    const HUES = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#007AFF', '#AF52DE'];
    let g;
    if (ctx.createConicGradient) {
      g = ctx.createConicGradient(t, o.x, o.y);          // 锥形渐变：七色环形流光
    } else {
      g = ctx.createLinearGradient(o.x - R, o.y - R, o.x + R, o.y + R);
    }
    for (let i = 0; i < 7; i++) g.addColorStop(i / 7, HUES[i]);
    g.addColorStop(1, HUES[0]);                          // 首尾同色闭合，环带无缝
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';             // 细描边：问号在七彩底上依旧醒目
    // 光学居中：按问号「实际墨迹边界」（水平 + 垂直）把墨迹几何中心精确对准圆心
    //（全角？在字体内留白不均，textAlign/middle 只对齐字身框，必须用墨迹边界二次校正）
    const m = ctx.measureText('？');
    let dx = 0, dy = 2;
    if (m.actualBoundingBoxAscent !== undefined) {
      dy = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      if (m.actualBoundingBoxLeft !== undefined) {
        dx = (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2;
      }
    }
    ctx.strokeText('？', o.x + dx, o.y + dy);
    ctx.fillStyle = '#FFFFFF';                           // 白色粗体大问号直接铺在彩虹上
    ctx.fillText('？', o.x + dx, o.y + dy);
    ctx.restore();
  }

  /** 绘制草元素节点：四叶印（四叶草，浅绿填充深绿描边 + 中心白色发光点），旋转 + 透明度呼吸 */
  function drawGrassNodes() {
    for (const n of grassNodes) {
      if (n.taken) continue;
      const a = 0.65 + 0.35 * Math.sin(n.phase * 1.7);
      ctx.save();
      ctx.translate(n.x, n.y);
      ctx.rotate(n.phase);                                   // 缓慢旋转
      ctx.globalAlpha = a;                                   // 呼吸闪烁
      ctx.beginPath();
      const d = 8, pr = 8.5;                                 // 叶瓣中心距 / 叶瓣半径
      for (let k = 0; k < 4; k++) {
        const ang = k * Math.PI / 2 + Math.PI / 4;           // 四瓣呈 X 形排布
        const px = Math.cos(ang) * d, py = Math.sin(ang) * d;
        ctx.moveTo(px + pr, py);
        ctx.arc(px, py, pr, 0, Math.PI * 2);
      }
      ctx.fillStyle = '#A5D6A7';                             // 浅绿填充
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2E7D32';                           // 深绿描边
      ctx.stroke();
      ctx.shadowColor = '#FFFFFF';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, 3.5, 0, Math.PI * 2);                    // 中心白色发光点
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.restore();
    }
  }

  /** 草冲刺轨迹：从小鸟到目标节点的一条深绿色藤蔓直线 */
  // ===== 七元素「紧贴身体」荧光特效（双层：物理生效期高亮 / 附着等待期弱光）=====
  /**
   * 物理效果生效期间的强荧光（null = 无物理效果；'blink' = 物理生效但当前处于灭相）。
   * 优先级：雷 > 火 > 水 > 冰 > 草 > 岩 > 风。
   */
  function physicalGlow() {
    // 水+雷：漏电麻痹 —— 本体荧光稳定常亮，带电滋滋闪烁交给 drawShockRing 专门表现
    if (reaction && reaction.id === 'shock') {
      return { color: '#00E5FF', blur: 11, alpha: 0.62 };
    }
    // 雷：高亮紫 #9C27B0 —— 仅冲刺瞬间，疯狂闪烁（2 帧亮 / 2 帧灭）
    if (thunderDashT > 0) {
      return (frameCount % 4 < 2) ? { color: '#9C27B0', blur: 18, alpha: 0.95 } : 'blink';
    }
    // 火：高亮赤红 #FF4500 —— 前 3 秒（爆发加速段）慢闪；后 2 秒（平滑降速段）高频快闪
    if (fireSpeedT > 0) {
      return (frameCount % 36 < 24) ? { color: '#FF4500', blur: 15, alpha: 0.85 } : 'blink';
    }
    if (fireDecelT > 0) {
      return (frameCount % 6 < 3) ? { color: '#FF4500', blur: 15, alpha: 0.85 } : 'blink';
    }
    // 水：深蓝水滴 #1E90FF —— 仅回血触发后 1 秒
    if (waterGlowT > 0) return { color: '#1E90FF', blur: 14, alpha: 0.8 };
    // 冰：清透冰蓝 #00FFFF —— 减速 7 秒：前 5 秒常亮高亮，最后 2 秒高频闪烁（3 帧亮 / 3 帧灭）
    if (iceT > 120) return { color: '#00FFFF', blur: 14, alpha: 0.85 };
    if (iceT > 0) return (frameCount % 6 < 3) ? { color: '#00FFFF', blur: 14, alpha: 0.85 } : 'blink';
    // 草：翠绿 #32CD32 —— 仅节点机制生效期间（5 秒解锁/吃完即消失）
    if (grassT > 0) return { color: '#32CD32', blur: 14, alpha: 0.8 };
    // 岩：岩石暗金 #DAA520 —— 仅重力加重生效期（护盾还在也立刻隐藏），更厚更重
    if (rockT > 0) return { color: '#DAA520', blur: 17, alpha: 0.95 };
    // 风：薄荷青绿 #00FA9A —— 气流罩 7 秒：前 5 秒常亮，最后 2 秒高频闪烁预警
    if (windT > 120) return { color: '#00FA9A', blur: 14, alpha: 0.85 };
    if (windT > 0) return (frameCount % 6 < 3) ? { color: '#00FA9A', blur: 14, alpha: 0.85 } : 'blink';
    return null;
  }

  /**
   * 小鸟贴身荧光总入口（两层）：
   * ① 物理效果生效期间 → 高亮强荧光（其中闪烁类的灭相直接跳过，不叠加弱光）；
   * ② 物理效果结束、但仍处于 12 秒附着等待期 → 半透明弱光（不闪、更淡、模糊更小）；
   * ③ UI 倒计时归零（element.type 被清空）→ 彻底熄灭。
   */
  /**
   * 元素反应专属荧光（内白外荧光）：只决定「紧贴小鸟外缘的一圈颜色」，
   * 小鸟本体始终保持纯白，绝不整只染色。
   */
  function reactionGlow() {
    if (!reaction) return null;
    switch (reaction.id) {
      case 'melt': return { color: '#FF9B9B', blur: 15, alpha: 0.90 };      // 火+冰：外层淡红
      case 'overload': return { color: '#D24BC4', blur: 18, alpha: 0.94 };  // 火+雷：红紫混合
      case 'char':
      case 'turb': return { color: '#FF4D4D', blur: 16, alpha: 0.90 };      // 火+草 / 火+风：外层红
      case 'cruise':
      case 'void':
      case 'netlag': return { color: '#B15CFF', blur: 16, alpha: 0.90 };    // 雷系（雷草/雷岩/雷冰）：外层紫
      default: return null;
    }
  }

  function birdGlow() {
    const rg = reactionGlow();
    if (rg) return rg;                               // 反应期间：外层仅一圈反应色荧光
    const p = physicalGlow();
    if (p === 'blink') return null;                  // 闪烁灭相：本帧完全不画
    if (p) return p;                                 // 物理生效：高亮强荧光
    if (element.type !== null && element.t > 0) {    // 附着等待期：弱光
      return {
        color: ICON_COLORS[element.type] || '#FFFFFF',
        blur: 7,
        alpha: 0.22
      };
    }
    return null;
  }

  /**
   * 紧贴小鸟身体的霓虹荧光：与 drawBird 共用同一套几何与变换（先画在小鸟底层），
   * 用元素色填充+描边整只鸟的剪影并施加 shadowBlur；正常绘制覆盖后只留下
   * 紧紧包裹全身的发光边缘（绝不改变小鸟本体颜色）。
   * 注意：以下坐标必须与 drawBird 的绘制路径严格保持一致。
   */
  function drawBirdGlow(g) {
    // 继承外层透明度（受击无敌闪烁）：否则荧光会盖过变透明的本体，导致小鸟被染色
    const baseA = ctx.globalAlpha;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 内白外荧光：把「身体 + 翅膀」剪影从发光区域中挖掉（evenodd 裁剪），
    // 荧光在任何透明度下都只会出现在轮廓外侧，本体内部永远保持纯白。
    const sil = new Path2D();
    sil.moveTo(16.5, -3.8);
    sil.bezierCurveTo(13, -9.5, 7, -11.5, 1, -10.5);
    sil.bezierCurveTo(-6, -9.3, -12, -6.5, -17, -2.5);
    sil.bezierCurveTo(-14, 0.5, -13, 3.5, -14.5, 6.5);
    sil.bezierCurveTo(-8, 8.8, -2, 9.6, 4, 8.2);
    sil.bezierCurveTo(10, 6.8, 14.5, 3.5, 16.5, -0.5);
    sil.closePath();
    const wingSil = new Path2D();
    wingSil.moveTo(0, 0);
    wingSil.lineTo(-17.5, 10);
    wingSil.lineTo(-20.3, 6.4);
    wingSil.lineTo(-21.3, 2.7);
    wingSil.closePath();
    const wingM = new DOMMatrix()
      .translateSelf(7.5, -3.2)
      .rotateSelf((0.19 + 0.19 * Math.sin(bird.wing)) * 180 / Math.PI);
    sil.addPath(wingSil, wingM);
    const clipPath = new Path2D();
    clipPath.rect(-400, -400, 800, 800);
    clipPath.addPath(sil);
    ctx.clip(clipPath, 'evenodd');

    ctx.strokeStyle = g.color;
    ctx.fillStyle = g.color;
    ctx.shadowColor = g.color;
    ctx.shadowBlur = g.blur;
    ctx.globalAlpha = g.alpha * baseA;
    // 尾羽（三根细直线）
    ctx.lineWidth = 3.8;
    ctx.beginPath();
    ctx.moveTo(-14.5, -1.5); ctx.lineTo(-25.5, -4.6);
    ctx.moveTo(-15, 1.8);    ctx.lineTo(-26, 0.8);
    ctx.moveTo(-14.2, 4.8);  ctx.lineTo(-24.5, 6);
    ctx.stroke();
    // 身体剪影（发光填充 + 描边：shadowBlur 让整只鸟的外缘均匀发光）
    ctx.lineWidth = 5.0;
    ctx.beginPath();
    ctx.moveTo(16.5, -3.8);
    ctx.bezierCurveTo(13, -9.5, 7, -11.5, 1, -10.5);
    ctx.bezierCurveTo(-6, -9.3, -12, -6.5, -17, -2.5);
    ctx.bezierCurveTo(-14, 0.5, -13, 3.5, -14.5, 6.5);
    ctx.bezierCurveTo(-8, 8.8, -2, 9.6, 4, 8.2);
    ctx.bezierCurveTo(10, 6.8, 14.5, 3.5, 16.5, -0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 翅膀（同一肩部变换与折线几何）
    ctx.save();
    ctx.translate(7.5, -3.2);
    ctx.rotate(0.19 + 0.19 * Math.sin(bird.wing));
    ctx.lineWidth = 4.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-17.5, 10);
    ctx.lineTo(-20.3, 6.4);
    ctx.lineTo(-21.3, 2.7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  /**
   * 全局拖尾锥形曲线：k = 1（靠近小鸟的「前端」）→ 1.0；k → 0（尾端）→ 约 0.045。
   * 前端最粗最实，向后平滑收细，形成完美的锥形 / 流线型渐变收尾。
   */
  function trailTaper(k) {
    return 0.045 + 0.955 * Math.pow(k, 1.35);
  }

  /** #RGB / #RRGGBB / rgb() → rgba(...)（把透明度烘焙进渐变，才能做出连续过渡色） */
  function cssToRgba(c, a) {
    let r = 255, g = 255, b = 255, aa = a;
    if (typeof c === 'string' && c.charAt(0) === '#') {
      let h = c.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      r = parseInt(h.slice(0, 2), 16) || 0;
      g = parseInt(h.slice(2, 4), 16) || 0;
      b = parseInt(h.slice(4, 6), 16) || 0;
    } else if (typeof c === 'string' && c.indexOf('rgb') === 0) {
      const m = c.match(/[\d.]+/g);
      if (m) { r = +m[0]; g = +m[1]; b = +m[2]; if (m.length > 3 && aa == null) aa = +m[3]; }
    } else {
      return c;
    }
    if (aa == null) aa = 1;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + Math.max(0, Math.min(1, aa)).toFixed(3) + ')';
  }

  /** 两色线性混合（用于生成连续色阶的关键帧颜色） */
  function mixCss(c1, c2, t) {
    const p = c => {
      let h = c.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      return [parseInt(h.slice(0, 2), 16) || 0, parseInt(h.slice(2, 4), 16) || 0, parseInt(h.slice(4, 6), 16) || 0];
    };
    const a = p(c1), b = p(c2);
    const m = i => Math.round(a[i] + (b[i] - a[i]) * Math.max(0, Math.min(1, t)));
    return 'rgb(' + m(0) + ',' + m(1) + ',' + m(2) + ')';
  }

  /**
   * 通用：细长平滑「连续色带」—— 单条闭合多边形 + 沿 前端→尾端 的线性渐变填充。
   * 旧实现逐段描边，半透明圆头互相重叠 → 一节一节的珠链并伴随机抖动；
   * 这里整条一次性填充，宽度与颜色沿轨迹连续过渡，彻底顺滑、无生硬色块。
   * 接口保持 { fade, alpha, color(k, i), w(k, i) } 不变。
   */
  function strokeRibbon(list, o) {
    const n = list.length;
    if (n < 3) return;
    const fade = o.fade == null ? 1 : o.fade;
    const amp = o.alpha == null ? 1 : o.alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const capArc = (c, a0, a1) => {
      const steps = 7;
      for (let s = 1; s < steps; s++) {
        const a = a0 + (a1 - a0) * (s / steps);
        ctx.lineTo(c.x + Math.cos(a) * c.hw, c.y + Math.sin(a) * c.hw);
      }
    };

    const fillRun = run => {
      const m = run.length;
      if (m < 2) return;
      const L = [], R = [];
      let maxHW = 0;
      for (let i = 0; i < m; i++) {
        const a = run[Math.max(0, i - 1)], b = run[Math.min(m - 1, i + 1)];
        let dx = b.x - a.x, dy = b.y - a.y;
        const dl = Math.hypot(dx, dy) || 1;
        dx /= dl; dy /= dl;
        const hw = Math.max(0.2, o.w(run[i].k, run[i].i) * 0.5);
        if (hw > maxHW) maxHW = hw;
        const p = run[i];
        p.dx = dx; p.dy = dy; p.hw = hw;
        L.push({ x: p.x - dy * hw, y: p.y + dx * hw });
        R.push({ x: p.x + dy * hw, y: p.y - dx * hw });
      }
      const head = run[m - 1], tail = run[0];
      const span = Math.hypot(head.x - tail.x, head.y - tail.y);
      let grd;
      if (span < 2) {
        grd = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, Math.max(6, maxHW * 2.2));
      } else {
        grd = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
      }
      const STOPS = 12;
      for (let s = 0; s <= STOPS; s++) {
        const u = s / STOPS;                                    // 0 = 前端（最亮最粗），1 = 尾端
        const fi = (m - 1) * (1 - u);
        const i0 = Math.floor(fi), i1 = Math.min(m - 1, i0 + 1);
        const kk = run[i0].k + (run[i1].k - run[i0].k) * (fi - i0);
        const col = o.color(kk, run[i0].i);
        grd.addColorStop(Math.min(1, Math.max(0, u)),
                         cssToRgba(col, Math.pow(Math.max(0, kk), fade) * amp));
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(L[0].x, L[0].y);
      for (let i = 1; i < m; i++) ctx.lineTo(L[i].x, L[i].y);
      // 前端圆头（沿运动方向鼓出，避免出现平切口）
      const aHL = Math.atan2(head.dx, -head.dy);
      const aHD = Math.atan2(head.dy, head.dx);
      const aHEnd = aHL + (Math.sin(aHD - aHL) >= 0 ? Math.PI : -Math.PI);
      capArc(head, aHL, aHEnd);
      for (let i = m - 2; i >= 0; i--) ctx.lineTo(R[i].x, R[i].y);
      // 尾端圆头（向后收窄，形成丝滑流线收尾）
      const aTL = Math.atan2(tail.dx, -tail.dy);
      const aTR = aTL + Math.PI;
      const aTD = Math.atan2(tail.dy, tail.dx) + Math.PI;
      const aTEnd = aTR + (Math.sin(aTD - aTR) >= 0 ? Math.PI : -Math.PI);
      capArc(tail, aTR, aTEnd);
      ctx.closePath();
      ctx.fill();
    };

    // 按「寿命归零」与「离群断点」切分为若干连续段，逐段整条填充（绝不分段描边）
    let run = [];
    for (let i = 0; i < n; i++) {
      const p = list[i];
      const k = Math.max(0, p.t / p.max);
      if (k <= 0.02) { if (run.length) { fillRun(run); run = []; } continue; }
      if (run.length) {
        const q = run[run.length - 1];
        if (Math.hypot(p.x - q.x, p.y - q.y) > 48) { fillRun(run); run = []; }
      }
      run.push({ x: p.x, y: p.y, k: k, i: i });
    }
    if (run.length) fillRun(run);
  }

  /** 火+雷：红紫融合交织成「一条」粗壮拖尾，前端最亮、尾部收细 */
  function drawOverloadFusedTrail() {
    const list = fireTrail;
    if (list.length < 3) return;
    // 外层：红 / 紫同轨迹双层辉光 → 视觉上彻底融为一体，绝不分叉成两条线（前沿偏红、尾部偏紫）
    strokeRibbon(list, {
      fade: 1.22, alpha: 0.18, color: k => mixCss('#FF3F6E', '#A855F7', 1 - k),
      w: k => 14.2 * trailTaper(k)
    });
    strokeRibbon(list, {
      fade: 1.22, alpha: 0.18, color: k => mixCss('#A855F7', '#FF3F6E', k),
      w: k => 11.2 * trailTaper(k)
    });
    // 内核：前端亮白粉 → 橙红 → 紫，沿轨迹连续过渡（红紫交织，无生硬色块）
    strokeRibbon(list, {
      fade: 1.02, alpha: 0.97,
      color: k => (k > 0.62 ? mixCss('#FF5A46', '#FFF1FF', (k - 0.62) / 0.38)
                            : mixCss('#B45CFF', '#FF5A46', k / 0.62)),
      w: k => 5.2 * trailTaper(k)
    });
  }

  /** 雷元素拖尾：前端粗壮高亮、向后锥形收细消散的紫色曲线 + 尾部电尘 */
  function drawThunderTrail() {
    if (!thunderTrail.length) return;
    const overload = !!reaction && reaction.id === 'overload';
    const cruiseK = (reaction && reaction.id === 'cruise') ? 1.34 : 1;   // 雷+草：冲锋拖尾专属加粗
    const voidR = !!reaction && reaction.id === 'void';                  // 雷+岩：粗度与「单吃火元素」完全一致
    const outerW = voidR ? 12.8 : 13.4 * cruiseK;
    const coreW = voidR ? 3.9 : 4.6 * cruiseK;
    ctx.save();
    const curve = thunderTrail.filter(t => !t.spark);
    if (overload) {
      drawOverloadFusedTrail();                                // 火+雷：红紫融合为一条带
    } else {
      // 外层辉光：前端粗壮，向后平滑收细（颜色也由亮紫连续过渡到暗紫，不是色块）
      strokeRibbon(curve, {
        fade: 1.25, alpha: 0.2,
        color: k => mixCss('#7C2AC8', '#C084FC', k),
        w: k => outerW * trailTaper(k)
      });
      // 内核电光：前端最亮最实 → 尾部半透明紫，连续过渡
      strokeRibbon(curve, {
        fade: 1.05, alpha: 0.96,
        color: k => (k > 0.70 ? mixCss('#C084FC', '#F7EFFF', (k - 0.70) / 0.30)
                    : k > 0.35 ? mixCss('#9B4DE0', '#C084FC', (k - 0.35) / 0.35)
                    : mixCss('#7A35C8', '#9B4DE0', k / 0.35)),
        w: k => coreW * trailTaper(k)
      });
    }
    // 粒子消散：尾部随寿命碎裂成紫色电尘（贴图化：不再逐颗 arc+fill 走路径）
    const dustOld = dotSprite('#7B2FBF');
    const dustNew = dotSprite('#D9B4FF');
    for (let i = 0; i < thunderTrail.length; i += 3) {
      const t = thunderTrail[i];
      const k = Math.max(0, t.t / t.max);
      const age = 1 - k;
      const a = Math.pow(k, 1.4) * (t.spark ? 0.95 : 0.5);
      if (a <= 0.02) continue;
      const rr = (t.spark ? 2.6 : 1.5) * (0.5 + 0.8 * k);
      ctx.globalAlpha = a;
      const spr = age > 0.6 ? dustOld : dustNew;
      const px = t.x + Math.sin((t.seed || 0) + frameCount * 0.12) * age * 3;
      const py = t.y + Math.cos((t.seed || 0) * 1.7 + frameCount * 0.09) * age * 2.4;
      ctx.drawImage(spr, px - rr, py - rr, rr * 2, rr * 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /** 火+冰：柱子被轨迹融化冒出的白色水汽（浓密、明显上扬、渐隐） */
  function drawMeltSteam() {
    if (!meltSteam.length) return;
    const spr = glowSprite('melt', [
      [0.00, '255,255,255', 0.92],
      [0.45, '240,251,255', 0.62],
      [0.78, '222,243,255', 0.28],
      [1.00, '214,240,255', 0]
    ]);
    for (const m of meltSteam) {
      const f = m.t / m.max;
      const grow = 1 + (1 - f) * 1.1;                      // 上升过程中持续膨胀
      const rr = m.r * grow;
      const a = (f > 0.75 ? 1 : f / 0.75) * 0.85;          // 前 25% 快速成型，之后线性渐隐
      drawGlow(spr, m.x, m.y, rr, a);
    }
    ctx.globalAlpha = 1;
  }

  /** 火+草：柱子碳化后的细碎碳灰 + 浓密烟雾 + 黑色块状碳末（上扬飘散、渐隐）
   *  —— 三遍绘制：烟团（底）→ 碳末碎块 → 火星/碳灰（面），层次清晰不透支性能 */
  function drawCharDust() {
    if (!charDust.length) return;
    // ① 烟团：大半径径向渐变（已预渲染成贴图，这里只做 drawImage）
    const smokeSpr = glowSprite('cdSmoke', [
      [0.00, '58,56,52', 1],
      [0.55, '74,71,66', 0.62],
      [1.00, '88,85,79', 0]
    ]);
    for (const d of charDust) {
      if (!d.smoke) continue;
      const f = d.t / d.max;
      const rr = d.r * (1.15 - 0.35 * f);
      const a = (0.10 + 0.20 * f) * (0.55 + 0.45 * (d.shade == null ? 0.2 : d.shade));
      drawGlow(smokeSpr, d.x, d.y, rr, a);
    }
    ctx.globalAlpha = 1;
    // ② 黑色块状碳末：不规则多边形 + 自转 + 左上受光棱边
    for (const d of charDust) {
      if (!d.chunk) continue;
      const f = d.t / d.max;
      const sz = d.size * (0.55 + 0.45 * f);
      const n = d.n || 6;
      ctx.globalAlpha = 0.92 * Math.min(1, f * 1.8);
      ctx.fillStyle = f > 0.45 ? '#141312' : '#26241F';
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const ang = d.rot + (i / n) * Math.PI * 2;
        const rk = sz * (1 - d.jag * 0.45 * (0.5 + 0.5 * Math.sin(i * 12.9898 + d.rot * 3.7)));
        const px = d.x + Math.cos(ang) * rk;
        const py = d.y + Math.sin(ang) * rk * 0.92;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      // 左上受光棱边：让碳块有实体厚度，不像是纯黑贴片
      if (f > 0.25 && sz > 2.2) {
        ctx.globalAlpha = 0.30 * f;
        ctx.strokeStyle = 'rgba(126, 122, 114, 0.85)';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
    // ③ 火星 / 余烬 / 细碳灰
    for (const d of charDust) {
      if (d.smoke || d.chunk) continue;
      const f = d.t / d.max;
      const sh = d.shade == null ? 0.5 : d.shade;
      if (d.hot) {
        // 火星 / 余烬：沿速度方向拉长的细短拖尾（不是圆点光球）
        const spd = Math.hypot(d.vx, d.vy) || 0.4;
        const ux = d.vx / spd, uy = d.vy / spd;
        const ln = Math.min(7.5, 1.4 + spd * 3.4) * (0.42 + 0.58 * f);
        ctx.globalAlpha = 0.78 * f;
        ctx.strokeStyle = f > 0.55 ? 'rgba(255, 206, 140, 0.95)' : 'rgba(255, 138, 96, 0.85)';
        ctx.lineWidth = Math.max(0.45, d.r * 1.05);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(d.x - ux * ln, d.y - uy * ln);
        ctx.lineTo(d.x, d.y);
        ctx.stroke();
        continue;
      }
      ctx.globalAlpha = 0.85 * f;
      ctx.fillStyle = sh < 0.30 ? '#1A1917' : (sh < 0.60 ? '#3B3A38' : (sh < 0.85 ? '#5C5A56' : '#7C7A75'));
      const rr = Math.max(0.5, d.r * (0.45 + 0.55 * f));
      ctx.beginPath();
      ctx.arc(d.x, d.y, rr, 0, Math.PI * 2);
      ctx.fill();
      // 轻烟：更淡更大的一层，营造向上扩散的烟雾感
      if (sh > 0.55) {
        ctx.globalAlpha = 0.16 * f;
        ctx.beginPath();
        ctx.arc(d.x, d.y - rr * 1.4, rr * 1.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /** 水+冰：小鸟专属淡蓝「冰水结合」拖尾（比火拖尾更淡、更冷） */
  function drawIceTrail() {
    if (!iceTrail.length) return;
    for (let i = 0; i < iceTrail.length; i++) {
      const s = iceTrail[i];
      const f = s.t / s.max;                     // 1 → 0
      const k = i / iceTrail.length;
      const rr = s.r * (0.7 + 0.5 * f);
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr);
      g.addColorStop(0.00, 'rgba(226, 245, 255,' + (0.62 * f).toFixed(3) + ')');
      g.addColorStop(0.52, 'rgba(176, 220, 250,' + (0.38 * f * (0.4 + 0.6 * k)).toFixed(3) + ')');
      g.addColorStop(1.00, 'rgba(150, 205, 240, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, rr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /**
   * 火元素拖尾（全局统一规范）：
   * · 常规：细长、轻盈的曲线带 + 尾端余烬粒子消散（像随风飘动的丝带），绝不使用团状色块；
   * · pale（火+冰）：颜色更淡、更轻、更细；
   * · big（火+岩）：岩浆球专属 → 大团火焰 + 火星飞溅。
   */
  function drawFireTrail() {
    if (!fireTrail.length) return;
    if (!!reaction && reaction.id === 'overload') return;   // 火+雷：由融合带统一绘制（绝不分叉两条线）
    ctx.save();
    const big = !!fireTrail[0].big;
    if (!big) {
      const pale = !!fireTrail[0].pale;
      const emitK = pale ? 0.62 : 1;
      // 外层柔光（前端粗壮，向后锥形收细；颜色沿轨迹连续过渡，不是色块）
      strokeRibbon(fireTrail, {
        fade: 1.3, alpha: 0.22 * emitK,
        color: k => (pale ? mixCss('#FFA9A9', '#FFDCDC', k) : mixCss('#FF6E37', '#FFB4A0', k)),
        w: k => (pale ? 10.4 : 12.8) * trailTaper(k)
      });
      // 内核高光线：前端亮橙红 → 尾部淡红，连续过渡
      strokeRibbon(fireTrail, {
        fade: 1.15, alpha: 0.9 * emitK,
        color: k => (pale ? mixCss('#FFAFAF', '#FFEDED', k)
                    : k > 0.70 ? mixCss('#FFA24E', '#FFF6DE', (k - 0.70) / 0.30)
                    : k > 0.34 ? mixCss('#FF5B32', '#FFA24E', (k - 0.34) / 0.36)
                    : mixCss('#FF9A96', '#FF5B32', k / 0.34)),
        w: k => (pale ? 2.7 : 3.9) * trailTaper(k)
      });
      // 尾端粒子消散：沿曲线每隔几点飘出细小余烬
      for (let i = 0; i < fireTrail.length; i += 2) {
        const f = fireTrail[i];
        const k = Math.max(0, f.t / f.max);
        const age = 1 - k;
        const a = Math.pow(k, 1.6) * (pale ? 0.42 : 0.72);
        if (a <= 0.02) continue;
        const rr = Math.max(0.5, (pale ? 0.9 : 1.25) * (0.45 + 0.9 * k));
        ctx.globalAlpha = a;
        ctx.fillStyle = age > 0.62 ? '#E2553F' : (pale ? '#FFC4C4' : '#FFD08A');
        ctx.beginPath();
        ctx.arc(f.x + Math.sin((f.seed || 0) + frameCount * 0.14) * age * 2.6,
                f.y - age * 5 + Math.cos((f.seed || 0) * 1.3 + frameCount * 0.1) * age * 2.2,
                rr, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // 火+岩：岩浆球专属 —— 先铺一条「初始宽度接近球体直径」的粗壮岩浆带，再叠火焰团块
      strokeRibbon(fireTrail, {
        fade: 1.05, alpha: 0.34,
        color: k => mixCss('#D8391F', '#FFB020', k),
        w: k => CFG.REACT_MAGMA_R * 1.95 * (0.03 + 0.97 * Math.pow(k, 1.5))
      });
      strokeRibbon(fireTrail, {
        fade: 1.0, alpha: 0.8,
        color: k => (k > 0.55 ? mixCss('#FF7A2A', '#FFE9A8', (k - 0.55) / 0.45) : mixCss('#E2452A', '#FF7A2A', k / 0.55)),
        w: k => CFG.REACT_MAGMA_R * 0.78 * (0.03 + 0.97 * Math.pow(k, 1.5))
      });
      // 大团火焰（膨胀虚化） + 火星飞溅（细长亮点）—— 火焰主体使用预渲染贴图
      const flameSpr = glowSprite('magmaFlame', [
        [0.00, '255,238,190', 0.95],
        [0.30, '255,150,60', 0.72],
        [0.66, '226,62,40', 0.32],
        [1.00, '180,40,30', 0]
      ]);
      for (const f of fireTrail) {
        const k = Math.max(0, f.t / f.max);
        const age = 1 - k;
        const a = Math.pow(k, 1.15) * 0.8;
        if (a <= 0.01) continue;
        const wob = Math.sin((f.seed || 0) + frameCount * 0.1) * age * 3.4;
        const rr = (f.r || 4.5) * (1.5 + age * 2.9);
        drawGlow(flameSpr, f.x, f.y + wob, rr, a);
      }
      // 火星：沿气流方向拉长的细小亮点
      for (let i = 0; i < fireTrail.length; i += 2) {
        const f = fireTrail[i];
        const k = Math.max(0, f.t / f.max);
        const a = Math.pow(k, 1.5) * 0.9;
        if (a <= 0.02) continue;
        const ln = 2.4 + (1 - k) * 5.2;
        const ang = -0.85 + Math.sin((f.seed || 0) * 2.1 + frameCount * 0.2) * 0.7;
        ctx.globalAlpha = a;
        ctx.strokeStyle = k > 0.55 ? 'rgba(255, 236, 170, 0.95)' : 'rgba(255, 138, 70, 0.8)';
        ctx.lineWidth = 1.1;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(f.x, f.y);
        ctx.lineTo(f.x - Math.cos(ang) * ln, f.y + Math.sin(ang) * ln - ln * 0.35);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /** 水草/冰草滑道粒子：滑行时的冰霜飞雪 + 退场时的绿色叶片 / 冰晶碎屑 */
  function drawRideParticles() {
    if (slideSnow.length > 0) {
      ctx.save();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = '#BFE9FF';
      ctx.shadowBlur = 6;
      for (const s of slideSnow) {
        ctx.globalAlpha = Math.max(0, s.t / s.max) * 0.9;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.6 + (s.t / s.max) * 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (rideBurst.length === 0) return;
    for (const p of rideBurst) {
      const a = Math.max(0, p.t / p.max);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.kind === 'leaf') {                       // 绿色叶片：水滴形，向四周飘散
        ctx.fillStyle = '#43A047';
        ctx.shadowColor = 'rgba(76,175,80,0.7)';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(0, -4.2);
        ctx.quadraticCurveTo(3.6, 0, 0, 4.2);
        ctx.quadraticCurveTo(-3.6, 0, 0, -4.2);
        ctx.fill();
      } else {                                       // 冰晶碎屑：细长六芒星
        ctx.strokeStyle = '#FFFFFF';
        ctx.shadowColor = '#8FD8FF';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-4, 0); ctx.lineTo(4, 0);
        ctx.moveTo(0, -4); ctx.lineTo(0, 4);
        ctx.moveTo(-2.6, -2.6); ctx.lineTo(2.6, 2.6);
        ctx.moveTo(2.6, -2.6); ctx.lineTo(-2.6, 2.6);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  /** 水草/冰草滑行轨道：固定在世界坐标系中（随锚点/背景左移滚动，绝不跟随小鸟）
   *  —— 全面重写：不再是「实心渐变带」，而是「双股藤蔓螺旋交叉」的麻花结构
   *  · 水+草（生机巨藤）：每股线宽 4~8 动态起伏，深绿投影 + 体积渐变 + 亮绿高光 + 藤结小叶
   *  · 冰+草（冰封细藤）：每股线宽 2~4，浅蓝→纯白纵向 Lerp 渐变 + 白色边缘高光 + 交叉冰晶
   *  · 生成段 0.6 秒（先冰后草 = 0.3s 前奏 + 0.3s 铺桥；其余 = 0.6s）从左向右蔓延；
   *    空地回拉时首段反向「从第 1 根柱子长到小鸟脚下」 */
  function drawRideTrack() {
    drawRideParticles();
    if (!reaction || (reaction.id !== 'vine' && reaction.id !== 'slide') || ridePath.length < 2) return;
    const r = reaction;
    if (r.phase === 'pre') return;                       // 先冰后草：前 0.3 秒只长柱上藤蔓，不铺滑道
    const isSlide = r.id === 'slide';
    const h32 = n => { const s = Math.sin(n * 12.9898 + 3.7) * 43758.5453; return s - Math.floor(s); };
    const DROP = 14;                                     // 轨道整体下移：小鸟踩在桥面上，而不是被桥穿过身体
    const fade = r.phase === 'exit' ? Math.max(0, r.t / CFG.REACT_RIDE_EXIT) : 1;
    if (fade <= 0) return;
    const growDur = r.growDur || CFG.REACT_RIDE_GROW;    // 先冰后草仅剩 0.3s 铺桥，其余 0.6s
    const growBase = r.growBase || 0;                    // 前奏已消耗帧数（先冰后草 = 18）
    const growP = r.phase === 'grow'
      ? Math.max(0, Math.min(1, (CFG.REACT_RIDE_TOTAL - r.t - growBase) / growDur)) : 1;
    const growW = 0.42 + 0.58 * growP;                   // 生长段：从细到粗迅速长成
    const startX = rideStartX(), endX = rideEndX();

    // —— 材质参数：双股缠绕振幅 / 频率 / 沿 X 逐点线宽 ——
    const AMP = isSlide ? 3.6 : 6.6;                     // 冰藤更纤细，藤桥更粗壮
    const FREQ = isSlide ? 0.040 : 0.029;                // 麻花缠绕频率
    const baseW = x => isSlide
      ? 2 + 2 * (0.5 + 0.5 * Math.sin((x + rideShift) * 0.052))    // 冰：2~4
      : 4 + 4 * (0.5 + 0.5 * Math.sin((x + rideShift) * 0.044));   // 水：4~8
    const offA = (x, seed) => AMP * Math.sin((x + rideShift) * FREQ + seed * 0.7);

    // ① 逐段采样：只画相邻锚点之间。生长段【双向奔赴】——每一段由左右两端同时向中间延伸，
    //    在空地中以双股螺旋交织缠绕，越靠前的段越早开始生长（贯穿 8 根柱子）
    const segs = [];
    const spanAll = Math.max(1, endX - startX);
    for (let i = 0; i < ridePath.length - 1; i++) {
      let x0 = anchorX(ridePath[i]);
      const x1 = anchorX(ridePath[i + 1]);
      if (i === 0) x0 = startX;                          // 引桥从触发位置/脚下柱子左缘开始
      const a0 = Math.max(x0, -60, startX);
      const b0 = Math.min(x1, CFG.W + 60, endX);         // 终点硬截断在第 8 根柱子右缘，绝不超出
      if (b0 - a0 < 1) continue;
      const isLead = !!r.lead && i === 0;
      // 反应中途才进场的柱子（rideNew）：它所属的滑道段必须一次性完整出现，
      // 与柱子作为一个整体进入屏幕 —— 绝不允许进屏后再长 1 秒
      // 判定：段两端任意一端属于新进场柱子 → 该段整体预加载（含「上一根柱子 → 新柱子」的间隙段）
      const preload = !!((ridePath[i].p && ridePath[i].p.rideNew) ||
                         (ridePath[i + 1].p && ridePath[i + 1].p.rideNew));
      const pieces = [];
      if (isLead) {
        const span = b0 - a0;                            // 空地回拉：由第 1 根柱子向左反向长到脚下
        pieces.push([b0 - span * growP, b0]);
      } else if (preload || growP >= 1) {
        pieces.push([a0, b0]);
      } else {
        const u = Math.max(0, Math.min(1, ((a0 + b0) * 0.5 - startX) / spanAll));
        const sp = Math.max(0, Math.min(1, (growP - u * 0.34) / 0.66));   // 近端先长、远端稍晚
        const len = b0 - a0;
        const lEnd = a0 + len * 0.5 * sp;                 // 左端向右延伸
        const rBeg = b0 - len * 0.5 * sp;                 // 右端向左延伸
        if (lEnd - a0 > 1) pieces.push([a0, lEnd]);
        if (b0 - rBeg > 1) pieces.push([rBeg, b0]);
      }
      for (const [pa, pb] of pieces) {
        if (pb - pa < 1) continue;
        const a = pa, b = pb;
        const pts = [];
        if (isLead) {
          // 回拉引桥单独走 S 形曲线（脚下 y → 桥面 y），避免出现一根近乎垂直的硬直线
          const lx = anchorX(ridePath[0]);
          const ly = ridePath[0].y + DROP;
          const ty = rideYAt(b) + DROP;
          const span = Math.max(1, b - lx);
          for (let x = Math.max(a, lx - 2); x < b; x += 10) {
            const t = Math.max(0, Math.min(1, (x - lx) / span));
            const s = t * t * (3 - 2 * t);
            pts.push({ x: x, y: ly + (ty - ly) * s });
          }
          pts.push({ x: b, y: ty });
        } else {
          for (let x = a; x < b; x += 10) pts.push({ x: x, y: rideYAt(x) + DROP });
          pts.push({ x: b, y: rideYAt(b) + DROP });
        }
        segs.push({ x0: a, x1: b, pts: pts, seed: ridePath[i].p ? ridePath[i].p.seed : 3.1 + i });
      }
    }
    if (!segs.length) return;

    // ② 通用描边：按小块成段绘制，线宽/材质沿 X 逐段变化（圆角线段，无棱角）
    const CHUNK = 5;
    const strokeChunks = (pts, offFn, wFn, styleFn, alpha, blur, shadow) => {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash([]);
      ctx.globalAlpha = alpha * fade;
      if (blur) { ctx.shadowBlur = blur; ctx.shadowColor = shadow; }
      for (let k = 0; k < pts.length - 1; k += CHUNK) {
        const e = Math.min(pts.length - 1, k + CHUNK);
        ctx.beginPath();
        let sx = 0, sy = 0, n = 0;
        for (let j = k; j < e; j++) {
          const p0 = pts[j], p1 = pts[j + 1];
          const y0 = p0.y + offFn(p0.x), y1 = p1.y + offFn(p1.x);
          if (j === k) ctx.moveTo(p0.x, y0);
          ctx.lineTo(p1.x, y1);
          sx += (p0.x + p1.x) * 0.5; sy += (y0 + y1) * 0.5; n++;
        }
        sx /= n; sy /= n;
        const w = Math.max(0.6, wFn(sx));
        ctx.lineWidth = w;
        ctx.strokeStyle = styleFn(sx, sy, w);
        ctx.stroke();
      }
      ctx.restore();
    };

    for (const s of segs) {
      const sd = s.seed;
      // ②-1 桥下投影：表现藤蔓悬空与厚度（不参与缠绕，纯粹压暗）
      strokeChunks(s.pts, () => (isSlide ? 12 : 13), () => 6.2 * growW,
        () => isSlide ? 'rgba(110, 160, 200, 0.30)' : 'rgba(18, 62, 30, 0.40)',
        1, 10, isSlide ? 'rgba(120, 190, 230, 0.45)' : 'rgba(10, 40, 18, 0.45)');

      if (isSlide) {
        // ②-2 冰链：外发光 → 双股冰质（浅蓝→纯白纵向 Lerp）→ 白色边缘高光
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd), x => (baseW(x) + 2.4) * growW,
            () => 'rgba(147, 210, 242, 0.45)', 0.9, 12, 'rgba(150, 220, 255, 0.9)');
        }
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd), x => baseW(x) * growW,
            (x, y, w) => {
              const g = ctx.createLinearGradient(0, y - w * 1.15, 0, y + w * 1.15);
              g.addColorStop(0.00, 'rgba(140, 205, 240, 0.92)');
              g.addColorStop(0.30, 'rgba(205, 236, 252, 0.98)');
              g.addColorStop(0.52, 'rgba(255, 255, 255, 1)');
              g.addColorStop(0.74, 'rgba(206, 236, 252, 0.98)');
              g.addColorStop(1.00, 'rgba(147, 210, 242, 0.90)');
              return g;
            }, 1);
        }
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd) - baseW(x) * growW * 0.42,
            x => Math.max(0.7, baseW(x) * 0.32) * growW,
            () => 'rgba(255, 255, 255, 0.88)', 1);
        }
      } else {
        // ②-3 巨藤：深绿外轮廓 → 双股体积渐变 → 顶面亮绿高光
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd), x => (baseW(x) + 2.4) * growW,
            () => '#1B5E20', 0.85);
        }
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd), x => baseW(x) * growW,
            (x, y, w) => {
              const g = ctx.createLinearGradient(0, y - w * 0.75, 0, y + w * 0.75);
              g.addColorStop(0.00, '#8FD694');
              g.addColorStop(0.42, '#4CAF50');
              g.addColorStop(1.00, '#1F6B2A');
              return g;
            }, 0.97);
        }
        for (const sgn of [1, -1]) {
          strokeChunks(s.pts, x => sgn * offA(x, sd) - baseW(x) * growW * 0.34,
            x => Math.max(0.8, baseW(x) * 0.30) * growW,
            () => 'rgba(200, 245, 190, 0.62)', 1);
        }
      }

      // ③ 交叉节点：两股藤蔓在此拧成麻花 —— 藤结（水+草）/ 冰晶（冰+草）
      const ph = sd * 0.7;
      const k0 = Math.ceil(((s.x0 + rideShift) * FREQ + ph) / Math.PI);
      const k1 = Math.floor(((s.x1 + rideShift) * FREQ + ph) / Math.PI);
      for (let kk = k0; kk <= k1; kk++) {
        const nx = (kk * Math.PI - ph) / FREQ - rideShift;
        if (nx < s.x0 + 3 || nx > s.x1 - 3) continue;
        if (nx < -40 || nx > CFG.W + 40) continue;
        const ny = rideYAt(nx) + DROP;
        if (isSlide) {
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(nx, ny);
          ctx.rotate(h32(kk * 3.3 + sd) * Math.PI);
          const L = 3 + h32(kk * 7.7 + sd) * 3.2;                 // 细小冰晶颗粒（四芒星）
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 1.2;
          ctx.shadowColor = 'rgba(150, 220, 255, 0.95)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(-L, 0); ctx.lineTo(L, 0);
          ctx.moveTo(0, -L); ctx.lineTo(0, L);
          ctx.moveTo(-L * 0.56, -L * 0.56); ctx.lineTo(L * 0.56, L * 0.56);
          ctx.moveTo(L * 0.56, -L * 0.56); ctx.lineTo(-L * 0.56, L * 0.56);
          ctx.stroke();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.fillStyle = 'rgba(46, 125, 50, 0.95)';              // 藤结：两股拧紧的粗节
          ctx.beginPath();
          ctx.ellipse(nx, ny, 5, 3.6, h32(kk + sd) > 0.5 ? 0.5 : -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(190, 240, 180, 0.55)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }
      }

      if (isSlide) {
        // ④ 冰面上零星的草苔草簇：冰封细藤仍保留「草」的生命痕迹
        ctx.save();
        ctx.globalAlpha = fade;
        for (let k = 0; k < 2; k++) {
          const f = 0.24 + k * 0.42 + (h32(sd + k * 5.3) - 0.5) * 0.1;
          const mx = s.x0 + (s.x1 - s.x0) * f;
          if (mx < -40 || mx > CFG.W + 40) continue;
          const cy = rideYAt(mx) + DROP - (AMP + 2);
          ctx.fillStyle = 'rgba(76, 175, 80, ' + (0.28 + h32(sd + k * 1.7) * 0.22).toFixed(2) + ')';
          ctx.beginPath();
          ctx.ellipse(mx, cy, 4.4 + h32(sd + k * 3.7) * 3.6, 2.2, (h32(sd + k) - 0.5) * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(46, 125, 50, 0.7)';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(mx, cy + 1);
          ctx.quadraticCurveTo(mx + 2, cy - 4, mx + 4.5, cy - 6.5);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // ⑤ 旁支小叶：位置由锚点 seed 决定（世界坐标），随轨道一起左移
        ctx.save();
        ctx.globalAlpha = fade;
        for (let k = 0; k < 2; k++) {
          const f = 0.28 + k * 0.42 + (h32(sd + k * 4.3) - 0.5) * 0.1;
          const bx = s.x0 + (s.x1 - s.x0) * f;
          if (bx < -40 || bx > CFG.W + 40) continue;
          const by = rideYAt(bx) + DROP;
          const sgn = h32(sd + k * 6.1) > 0.5 ? -1 : 1;
          const blen = 13 + h32(sd + k * 8.7) * 9;
          ctx.strokeStyle = '#2E7D32';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(bx, by - sgn * (AMP + 1));
          ctx.quadraticCurveTo(bx + blen * 0.45, by - sgn * (AMP + blen * 0.5), bx + blen, by - sgn * (AMP + blen));
          ctx.stroke();
          ctx.fillStyle = '#43A047';
          ctx.beginPath();
          ctx.ellipse(bx + blen * 1.06, by - sgn * (AMP + blen * 1.06), 5.6, 2.9, sgn * 0.75, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // ⑥ 每根柱子顶端与滑道的「接根」小弧：藤蔓确实从柱顶（缝隙下沿锚点）长出来
    const seen = new Set();
    ctx.save();
    ctx.globalAlpha = fade;
    for (const a of ridePath) {
      if (!a.p || a.e !== 0 || seen.has(a.p)) continue;
      seen.add(a.p);
      const cx = a.p.x + CFG.PIPE_W / 2;
      if (cx < -40 || cx > CFG.W + 40) continue;
      // 生长段：接根弧随双向蔓延逐步点亮（越靠右越晚），绝不一上来就出现半截断弧
      const uRoot = Math.max(0, Math.min(1, (cx - startX) / Math.max(1, endX - startX)));
      const rootA = Math.max(0, Math.min(1, (growP - uRoot * 0.34) / 0.5));
      if (rootA <= 0.02) continue;
      ctx.globalAlpha = fade * rootA;
      const by = rideYAt(cx) + DROP;
      ctx.strokeStyle = isSlide ? 'rgba(46, 125, 80, 0.78)' : '#2E7D32';
      ctx.lineWidth = isSlide ? 2.6 : 3.6;
      ctx.beginPath();
      ctx.moveTo(cx - 18, by + 8);
      ctx.quadraticCurveTo(cx - 7, by - 12, cx + 2, by - 4);
      ctx.quadraticCurveTo(cx + 9, by + 2, cx + 18, by + 8);
      ctx.stroke();
      if (isSlide) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';      // 结霜泛白的高光
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(cx - 18, by + 8);
        ctx.quadraticCurveTo(cx - 7, by - 12, cx + 2, by - 4);
        ctx.quadraticCurveTo(cx + 9, by + 2, cx + 18, by + 8);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /**
   * 雷+岩异空间：全屏高浓度深紫天空滤镜。
   * 画在背景之后、金币之前 —— 天空/云整体沉入暗紫色调，而满屏金币保持极高清晰度。
   */
  function drawVoidSky() {
    if (!reaction || reaction.id !== 'void') return;
    const fade = Math.min(1, Math.min(reaction.t, 45) / 45);
    const pulse = 0.03 * Math.sin(frameCount / 9);
    const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
    g.addColorStop(0.00, 'rgba(34, 4, 66, ' + ((0.82 + pulse) * fade).toFixed(3) + ')');
    g.addColorStop(0.55, 'rgba(62, 10, 104, ' + ((0.72 + pulse) * fade).toFixed(3) + ')');
    g.addColorStop(1.00, 'rgba(24, 3, 48, ' + ((0.80 + pulse) * fade).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    // 异空间劈落闪电：高亮发光、带分叉（仅在天空区域，绝不压住金币与 UI）
    if (fade > 0.02) {
      const period = 54;                                          // 0.9 秒换一次形态
      const step = Math.floor(frameCount / period);
      const phaseK = 1 - (frameCount % period) / period;           // 越新越亮
      for (let b = 0; b < 3; b++) {
        const seed = b * 977 + step * 131;
        const x0 = (seed * 631) % CFG.W;
        const y0 = (seed * 271) % (CFG.H * 0.16);
        const bolt = boltFromSeed(seed, x0, y0,
                                  x0 + ((seed * 353) % 140) - 70, y0 + 180 + (seed % 130),
                                  9, 34);
        drawBoltShape(bolt, fade * (0.30 + 0.55 * phaseK),
                      'rgba(248, 238, 255, 1)', 'rgba(190, 120, 255, 1)', 1.0);
      }
    }
  }

  /** 雷+岩异空间暗幕 + 反应闪光 + 所有全屏滤镜：
   *  统一在 updateFxOverlays() 里以 CSS opacity 驱动（见渲染管线），
   *  这里不再保留任何 Canvas 全屏渐变绘制。 */
  function drawVoidOverlay() { /* 已迁移至 CSS 覆盖层：#fxVoid / #fxVoidVig */ }

  /** 反应闪光层：雷+岩 = 全屏紫光；风+草 = 全屏金光（压在最上层）
   *  已迁移至 CSS：#flashPurple / #flashGold，由 updateFxOverlays() 驱动 opacity */
  function drawReactionFlash() { /* moved to CSS flash layer */ }

  /** 贴身粒子层：风 = 轮廓周围快速旋转的细小风痕；冰 = 一点点雪花颗粒（画在小鸟上层） */
  function drawElementExtras() {
    if (windT > 0) windMarksTight();
    if (iceT > 0) iceSnow();
  }

  /** 冰：小鸟周身一点点飘亮的雪花颗粒（仅减速生效的 7 秒） */
  function iceSnow() {
    ctx.save();
    ctx.fillStyle = '#E0FFFF';
    for (let i = 0; i < 5; i++) {
      const a = frameCount * 0.05 + i * (Math.PI * 2 / 5);
      const px = bird.x + Math.cos(a) * (CFG.BIRD_R + 9);
      const py = bird.y + Math.sin(a * 1.4 + i) * (CFG.BIRD_R + 7);
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(frameCount * 0.25 + i * 2);
      ctx.beginPath();
      ctx.arc(px, py, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /** 风：紧贴小鸟轮廓（约 BIRD_R+6）快速旋转的细小弧段风痕（sin/cos 驱动，仅气流罩 7 秒） */
  function windMarksTight() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);                                  // 跟随小鸟俯仰，始终贴身
    ctx.strokeStyle = '#00FA9A';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a0 = frameCount * 0.28 + i * Math.PI / 2;      // 快速旋转
      const r = CFG.BIRD_R + 6 + Math.sin(frameCount * 0.18 + i * 1.3) * 2;
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(frameCount * 0.22 + i);
      ctx.beginPath();
      ctx.arc(0, 0, r, a0, a0 + 0.9);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGrassVine() {
    if (!grassDash || grassDash.taken) return;
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = '#2E7D32';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bird.x, bird.y);
    ctx.lineTo(grassDash.x, grassDash.y);
    ctx.stroke();
    ctx.restore();
  }

  /**
   * 绘制地面。
   * 左右各多画 8 逻辑像素、上下各多画 8 像素（OVER）：
   * 屏幕宽高比换算成逻辑尺寸时难免有 ±1px 的取整误差，
   * 多画的这部分保证地面永远完整覆盖底部，不会露出缝隙或黑边。
   */
  function drawGround() {
    const OVER = 8;
    const y = CFG.H - CFG.GROUND_H;
    // 竖屏：地面向下延伸铺满屏幕底部（消除下部留白）
    const bottom = Math.max(CFG.H, viewBottom) + OVER;

    // 地面主体：米白色纸张感
    ctx.fillStyle = '#fcfaf2';
    ctx.fillRect(-OVER, y, CFG.W + OVER * 2, bottom - y + OVER);

    // 地面顶部的线稿描边
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-OVER, y);
    ctx.lineTo(CFG.W + OVER, y);
    ctx.stroke();

    // 装饰性斜纹（浅灰色手绘感）
    ctx.save();
    ctx.beginPath();
    ctx.rect(-OVER, y + 2, CFG.W + OVER * 2, bottom - y);
    ctx.clip();
    ctx.strokeStyle = 'rgba(85, 85, 85, 0.15)';
    ctx.lineWidth = 2;
    const offset = (frameCount * CFG.PIPE_SPEED) % 32;
    for (let x = -32; x < CFG.W + 64; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x - offset, y);
      ctx.lineTo(x - offset + 40, bottom);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 风元素气流拖尾：小鸟背后一串渐隐白色气团 */
  function drawWindTrail() {
    for (const d of windTrail) {
      const k = d.t / d.max;                       // 1 → 0 渐隐
      ctx.globalAlpha = k * 0.5;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * (1.4 - k * 0.6), 0, Math.PI * 2);   // 越旧越小
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;
  }

  /** 风元素气流墙波纹：管道边缘接触点激发的半透明白色半圆弧，沿外法线方向扩散 */
  function drawWindRipples() {
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    for (const r of windRipples) {
      const k = 1 - r.t / r.max;                   // 0 → 1 扩散进度
      const ang = Math.atan2(r.ny, r.nx);          // 外法线方向 = 半圆朝向
      ctx.globalAlpha = (r.t / r.max) * 0.75;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 6 + k * 18, ang - Math.PI / 2, ang + Math.PI / 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }

  /**
   * 风元素扁平穹顶可视化：每根管道靠近缝隙的管口画一条「扁平拱门」弧形带——
   * 横向大跨度（比管口左右各宽 WIND_DOME_EXT），拱起 WIND_DOME_H（约 40px），
   * 三次贝塞尔曲线勾出圆润不尖的拱面；两条平行拱线围出带体厚度（THICK），
   * 中间填充半透明白色（约 0.3）。上管口穹顶向下凸（v）、下管口向上凸（^），
   * 外缘拱线 = 免死判定边界，出现/消失渐显渐隐 + 呼吸脉动。
   */
  function drawWindArcs() {
    if (windT <= 0) return;
    const fade = Math.min(1, Math.min(windT, 40) / 40);            // 出现/消失前 0.7 秒渐显渐隐
    const pulse = 0.8 + 0.2 * Math.sin(frameCount / 10);           // 呼吸脉动
    const THICK = 10;                                              // 带体厚度（内外拱线顶点差）

    /** 从 (x0,y0) 向 (x0+w,y0) 连一条向外(dir)拱起 apex 的三次贝塞尔曲线（不移动起点） */
    function curveTo(x0, y0, w, apex, dir) {
      const c = apex * 4 / 3;                      // 三次贝塞尔顶点高度 = 控制高 × 3/4
      ctx.bezierCurveTo(x0 + w / 3, y0 + dir * c, x0 + w * 2 / 3, y0 + dir * c, x0 + w, y0);
    }

    /** 从 (x0+w,y0) 反向连回 (x0,y0)（拱起方向不变，用于围合带体填充区） */
    function curveBack(x0, y0, w, apex, dir) {
      const c = apex * 4 / 3;
      ctx.bezierCurveTo(x0 + w * 2 / 3, y0 + dir * c, x0 + w / 3, y0 + dir * c, x0, y0);
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const p of pipes) {
      const g = windBandGeom(p);
      const w = g.x1 - g.x0;
      const faces = [
        { y: g.top, dir: 1 },                      // 上管口：穹顶向缝隙下方凸（v）
        { y: g.bot, dir: -1 }                      // 下管口：穹顶向缝隙上方凸（^）
      ];
      for (const f of faces) {
        // 1) 带体填充：外缘拱线 + 反向内缘拱线围成的扁弧区域
        ctx.beginPath();
        ctx.moveTo(g.x0, f.y);
        curveTo(g.x0, f.y, w, CFG.WIND_DOME_H, f.dir);
        curveBack(g.x0, f.y, w, CFG.WIND_DOME_H - THICK, f.dir);
        ctx.closePath();
        ctx.fillStyle = '#FFFFFF';
        ctx.globalAlpha = 0.3 * fade * pulse;
        ctx.fill();
        // 2) 两条平行拱线勾边
        ctx.strokeStyle = '#FFFFFF';
        ctx.globalAlpha = 0.9 * fade * pulse;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(g.x0, f.y);
        curveTo(g.x0, f.y, w, CFG.WIND_DOME_H, f.dir);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(g.x0, f.y);
        curveTo(g.x0, f.y, w, CFG.WIND_DOME_H - THICK, f.dir);
        ctx.stroke();
      }
    }
    ctx.restore();                                 // 恢复 globalAlpha
  }

  /** 雷元素闪电残影：高亮紫锯齿电弧渐隐（内芯叠一条白色细线增强电感） */
  function drawThunderBolts() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const b of thunderBolts) {
      const a = b.t / b.max;
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = '#9C27B0';               // 高亮紫
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.pts[0].x, b.pts[0].y);
      for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i].x, b.pts[i].y);
      ctx.stroke();
      ctx.globalAlpha = a * 0.55;                // 同一路径描白芯
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }

  /** 碎块：雷击纸片 / 水+冰 极细玻璃渣与冰晶 / 风化沙尘（极细，绝不做大石块） */
  function drawPipeDebris() {
    // —— 水+冰 500 片碎玻璃：按透明度分 3 档、每档合并成多条路径批量填充 ——
    // 500×6 根柱子若逐片 save/rotate/fill 会拖垮帧率，这里手动旋转顶点批量绘制。
    // 【立体厚度】每片不再是单层平面色块，而是「厚度侧壁(暗) → 冰体主体(中亮) → 内部暗部 → 内部高光」
    // 四层叠加 + 顶部亮边，颜色取自柱子冻结底色（浅蓝白），既有立体厚度又不会过深。
    if (pipeDebris.length) {
      const buckets = [[], [], []];
      for (const s of pipeDebris) {
        if (!s.shard) continue;
        // 粉尘碎片按自身寿命淡出，并在原地持续收缩（化粉消散）；坠地碎片仍按 20 帧淡出
        const a = s.dust ? Math.min(1, s.t / s.max) : Math.min(1, s.t / 20);
        s._k = s.dust ? (0.16 + 0.84 * (s.t / s.max)) : 1;
        buckets[a > 0.7 ? 0 : (a > 0.4 ? 1 : 2)].push(s);
      }
      if (buckets[0].length || buckets[1].length || buckets[2].length) {
        const alphas = [0.94, 0.66, 0.36];
        // 顶点变换：以质心为原点缩放 k → 旋转 → 再平移 (ox, oy)；cos/sin 每帧每片只算一次
        for (const arr of buckets) {
          for (const s of arr) { s._c = Math.cos(s.rot); s._s = Math.sin(s.rot); }
        }
        const addShard = (s, k, ox, oy) => {
          const cos = s._c, sin = s._s, pts = s.pts;
          const kk = k * (s._k || 1);
          for (let i = 0; i < pts.length; i++) {
            const lx = pts[i][0] * kk, ly = pts[i][1] * kk;
            const px = s.x + lx * cos - ly * sin + ox;
            const py = s.y + lx * sin + ly * cos + oy;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
        };
        const fillPass = (arr, k, ox, oy, color) => {
          ctx.beginPath();
          for (const s of arr) addShard(s, k, ox, oy);
          ctx.fillStyle = color;
          ctx.fill();
        };
        for (let bi = 0; bi < 3; bi++) {
          const arr = buckets[bi];
          if (!arr.length) continue;
          ctx.save();
          ctx.globalAlpha = alphas[bi];
          // ① 最深的厚度侧壁：整体向右下平移 → 露出背面冰壁，形成真实"块"的厚度
          fillPass(arr, 1.0, 2.0, 2.5, 'rgba(84, 134, 178, 0.95)');
          // ② 中间过渡挤出面：半程偏移的一层中间调，让侧壁不是「一刀切」的硬边
          fillPass(arr, 1.0, 1.0, 1.25, 'rgba(106, 156, 198, 0.95)');
          // ③ 冰体正面：rgb(125, 177, 216) —— 与「水+冰加深后的柱体底色」完全同色
          fillPass(arr, 0.995, 0, 0, 'rgba(125, 177, 216, 0.97)');
          // ④ 正面暗部：缩小并向右下偏移 → 片内形成从亮到暗的斜面过渡
          fillPass(arr, 0.72, 0.85, 1.05, 'rgba(100, 152, 196, 0.55)');
          fillPass(arr, 0.48, 1.25, 1.55, 'rgba(88, 138, 184, 0.40)');
          // ⑤ 左上受光棱边：沿轮廓的亮线（比中心一亮斑更像玻璃棱面的高光）
          ctx.beginPath();
          for (const s of arr) addShard(s, 0.90, -0.85, -1.05);
          ctx.lineWidth = 0.9;
          ctx.strokeStyle = 'rgba(196, 222, 240, 0.85)';
          ctx.stroke();
          // ⑥ 细暗边勾勒轮廓（让碎片在雾气/雪景里仍然清晰可辨）
          ctx.beginPath();
          for (const s of arr) addShard(s, 0.995, 0, 0);
          ctx.lineWidth = 0.7;
          ctx.strokeStyle = 'rgba(66, 112, 156, 0.52)';
          ctx.stroke();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
    }
    for (const s of pipeDebris) {
      if (s.shard) continue;                    // 已批量绘制
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.t / 20);
      ctx.translate(s.x, s.y);
      if (s.crystal) {                          // 冰晶微粒（与加深后柱体同源的浅冰蓝）
        ctx.fillStyle = 'rgba(178, 208, 232, 0.95)';
        ctx.beginPath();
        ctx.arc(0, 0, s.r, 0, 6.283);
        ctx.fill();
      } else if (s.tone === 'dust') {           // 极细沙尘：随风倾斜的短划线
        ctx.rotate(s.rot);
        const len = s.len || 2.2;
        ctx.strokeStyle = 'rgba(160, 148, 114, 0.72)';
        ctx.lineWidth = s.size;
        ctx.beginPath();
        ctx.moveTo(-len * 0.5, 0.25);
        ctx.lineTo(len * 0.5, -0.25);
        ctx.stroke();
      } else if (s.tone === 'flake') {          // 微小碎屑薄片
        ctx.rotate(s.rot);
        const sz = s.size || 1.2;
        ctx.fillStyle = 'rgba(124, 130, 102, 0.75)';
        ctx.fillRect(-sz * 0.5, -sz * 0.35, sz, sz * 0.7);
      } else if (s.rock) {                      // 火+岩：不规则多边形岩石碎块（深灰石头，绝不变白）
        ctx.rotate(s.rot);
        const pts = s.pts;
        const sc = s.shade;
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]);
          else ctx.lineTo(pts[i][0], pts[i][1]);
        }
        ctx.closePath();
        if (s.hot) {                            // 撞击点附近：深灰底 + 暗红熔痕
          ctx.fillStyle = 'rgb(' + Math.round(104 * sc) + ',' + Math.round(58 * sc) + ',' + Math.round(48 * sc) + ')';
          ctx.strokeStyle = 'rgba(196, 64, 26, 0.88)';
        } else {
          ctx.fillStyle = 'rgb(' + Math.round(76 * sc) + ',' + Math.round(72 * sc) + ',' + Math.round(68 * sc) + ')';
          ctx.strokeStyle = 'rgba(40, 36, 34, 0.88)';
        }
        ctx.lineWidth = 0.9;
        ctx.fill();
        ctx.stroke();
      } else {                                  // 雷击 / 焦黑纸片 / 岩浆碎渣
        ctx.rotate(s.rot);
        if (s.kind === 'char') {
          ctx.fillStyle = '#2B2B2B';
          ctx.strokeStyle = '#111111';
        } else if (s.kind === 'magma') {
          // 火+岩：仍在发红的岩浆碎渣（中心亮橙、边缘暗红）
          ctx.fillStyle = s.hot ? '#FFB067' : '#E8611F';
          ctx.strokeStyle = '#A83C12';
        } else {
          ctx.fillStyle = '#fcfaf2';
          ctx.strokeStyle = '#555555';
        }
        ctx.lineWidth = 1;
        ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
        ctx.strokeRect(-s.w / 2, -s.h / 2, s.w, s.h);
      }
      ctx.restore();
    }
  }

  /** 冰元素霜冻滤镜：四边浅蓝渐晕已迁移为 CSS 覆盖层（#fxFrost，由 opacity 驱动）；
   *  这里只保留极寒冰裂期的 26 条裂纹折线（画在世界层，层级与原先完全一致）。 */
  function drawFrostCracks() {
    if (!fxLayout.frostDeep) return;                 // 仅水+冰极寒期有裂纹
    const fade = Math.min(1, iceBorderA);
    if (fade <= 0.004) return;
    ctx.save();
    ctx.globalAlpha = fade * 0.75;
    ctx.strokeStyle = 'rgba(232, 248, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    const hh = s => { const v = Math.sin(s * 91.7 + 17.3) * 43758.5453; return v - Math.floor(v); };
    // 四条边上随机折线裂纹
    for (let i = 0; i < 26; i++) {
      const side = i % 4;
      let x0, y0, dx, dy;
      if (side === 0)      { x0 = hh(i * 3 + 1) * CFG.W; y0 = 0;                 dx = 0; dy = 1; }
      else if (side === 1) { x0 = hh(i * 3 + 2) * CFG.W; y0 = CFG.H;             dx = 0; dy = -1; }
      else if (side === 2) { x0 = 0;                     y0 = hh(i * 3 + 3) * CFG.H; dx = 1; dy = 0; }
      else                 { x0 = CFG.W;                 y0 = hh(i * 3 + 4) * CFG.H; dx = -1; dy = 0; }
      const segs = 3 + Math.floor(hh(i * 5 + 7) * 3);
      let px = x0, py = y0;
      const len = 14 + hh(i * 7 + 9) * 46;
      ctx.beginPath();
      ctx.moveTo(px, py);
      for (let s2 = 1; s2 <= segs; s2++) {
        const lat = (hh(i * 11 + s2) - 0.5) * 12;
        px += dx * (len / segs) + (dx === 0 ? lat : 0);
        py += dy * (len / segs) + (dy === 0 ? lat : 0);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 雷瞬闪：全屏白色闪光（约 0.13 秒，压在最上层）——已迁移至 CSS：#flashWhite */
  function drawThunderFlash() { /* moved to CSS flash layer */ }

  /**
   * 火+水 反应「极速气化」：白色翻滚蒸汽云（范围约自身 3 倍）+ 身后淡淡蒸汽拖尾。
   * 最后 2 秒与小鸟同步高频闪烁提醒。
   */
  function drawSteam() {
    if (!reaction || reaction.id !== 'steam') return;
    const blink = reaction.t <= 120 ? (Math.floor(frameCount / 2) % 2 === 0 ? 0.35 : 1) : 1;
    const R = CFG.BIRD_R * 3;
    ctx.save();
    // ① 蒸汽拖尾：白雾团 + 淡青灰边缘；越靠尾端越淡，尾部透明度归 0
    // 蒸汽拖尾（预渲染贴图：颜色/透明度比例固定，强度由 globalAlpha 驱动）
    const trailSpr = glowSprite('steamTrail', [
      [0.00, '255,255,255', 0.52],
      [0.52, '240,248,252', 0.30],
      [0.82, '178,206,220', 0.16],
      [1.00, '178,206,220', 0]
    ]);
    for (const s of steamTrail) {
      const f = s.t / s.max;                       // 1 → 0
      const rr = s.r * (2.4 - 0.9 * (1 - f));
      drawGlow(trailSpr, s.x, s.y, rr, f * blink);
    }
    // ② 云底柔和冷灰投影：白雾在浅色天空里也有体积感（约自身 3 倍范围）
    const shSpr = glowSprite('steamShadow', [
      [0.00, '118,156,178', 0.17],
      [0.62, '140,176,196', 0.09],
      [1.00, '150,185,204', 0]
    ]);
    ctx.globalAlpha = blink;
    ctx.drawImage(shSpr, bird.x - R * 1.5, bird.y + 4 - R * 1.15, R * 3, R * 2.3);
    // ③ 翻滚蒸汽云：14 团白雾环绕小鸟 —— 先灰蓝体积边，再白色高光核心
    const edgeSpr = glowSprite('steamEdge', [
      [0.00, '160,192,210', 0],
      [0.30, '160,192,210', 0],
      [0.72, '160,192,210', 0.26],
      [1.00, '160,192,210', 0]
    ]);
    const coreSpr = glowSprite('steamCore', [
      [0.00, '255,255,255', 0.90],
      [0.50, '250,253,255', 0.62],
      [1.00, '255,255,255', 0]
    ]);
    for (let i = 0; i < 14; i++) {
      const ph = i * 0.7854 + frameCount * 0.05;
      const rr = R * (0.42 + 0.30 * Math.sin(frameCount * 0.07 + i));
      const px = bird.x + Math.cos(ph) * rr;
      const py = bird.y + Math.sin(ph * 1.13 + i) * rr * 0.72;
      const pr = R * (0.58 + 0.24 * Math.sin(frameCount * 0.09 + i * 1.7));
      drawGlow(edgeSpr, px, py, pr, blink);
      drawGlow(coreSpr, px, py - pr * 0.08, pr * 0.94, blink);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /**
   * 绘制小鸟 —— 极简线稿风「雨燕」（纯 Canvas Path，无任何图片依赖）。
   * 造型：细长流线型身体 + 小尖嘴 + 折线翅 + 三根细直尾羽，轻盈不圆胖。
   * 配色：米白 #FAFAFA 身体 / 深灰 #555555 细线勾勒（lineWidth 2）/ 黑点眼。
   * 以身体中心为原点绘制，与碰撞中心（hitbox）对齐；
   * bird.rot 由物理更新按垂直速度算出：上升抬头、下坠低头、坠亡头朝下。
   */
  /* ============================================================
   * 9.5 Round D 视觉：岩浆球 / 倒塌板体 / 雷草印记 / 7 种 Debuff
   * ============================================================ */

  /** 火+岩：五边形 / 六边形深色岩壳拼接（缝隙透出红黄高亮岩浆） */
  let magmaShellTiles = null;
  function magmaShell() {
    if (magmaShellTiles) return magmaShellTiles;
    const R = CFG.REACT_MAGMA_R;
    const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
    const tiles = [];
    const push = (cx, cy, rad, n, rot, sd, depth) => {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = rot + (i + (hash(sd, i) - 0.5) * 0.24) * Math.PI * 2 / n;
        const rr = rad * (0.86 + hash(sd + i, 7) * 0.26);
        pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
      }
      tiles.push({ pts, depth, sd });
    };
    push(0, 0, R * 0.46, 5, 0.4, 1, 0);                                  // 中心五边形
    for (let i = 0; i < 6; i++) {                                        // 内圈六边形
      const a = i * Math.PI / 3 + 0.26;
      push(Math.cos(a) * R * 0.60, Math.sin(a) * R * 0.60, R * 0.40, 6, a, i + 2, 1);
    }
    for (let i = 0; i < 6; i++) {                                        // 外圈五边形（贴球面）
      const a = i * Math.PI / 3;
      push(Math.cos(a) * R * 0.94, Math.sin(a) * R * 0.94, R * 0.34, 5, -a, i + 9, 2);
    }
    magmaShellTiles = tiles;
    return tiles;
  }

  /** 火+岩：多边形岩壳 + 熔岩缝隙的岩浆球（贴地滚动，岩壳随滚动旋转） */
  function drawMagmaBall() {
    const R = CFG.REACT_MAGMA_R;
    const form = reaction && reaction.formP != null ? reaction.formP : 1;
    const sc = 0.74 + 0.26 * form;
    const groundY = CFG.H - CFG.GROUND_H;
    ctx.save();
    // 地面投影（极简、极淡）
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#4A2E28';
    ctx.beginPath();
    ctx.ellipse(bird.x, groundY + 1, R * 0.92 * sc, R * 0.24 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(bird.x, bird.y);
    // 外圈柔光：橙红热辐射（呼吸）
    const glowPulse = 0.82 + 0.18 * Math.sin(frameCount * 0.22);
    const og = ctx.createRadialGradient(0, 0, R * 0.55, 0, 0, R * 1.86 * sc);
    og.addColorStop(0.00, 'rgba(255, 122, 53,' + (0.30 * glowPulse).toFixed(3) + ')');
    og.addColorStop(0.55, 'rgba(255, 96, 32,' + (0.13 * glowPulse).toFixed(3) + ')');
    og.addColorStop(1.00, 'rgba(255, 96, 32, 0)');
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.86 * sc, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(sc, sc);
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    // ① 熔岩底：整球先铺一层红黄高亮岩浆，多边形缝隙即由此透出
    const lava = ctx.createRadialGradient(-R * 0.22, -R * 0.26, R * 0.08, 0, 0, R);
    lava.addColorStop(0.00, '#FFF0B8');
    lava.addColorStop(0.34, '#FFB03A');
    lava.addColorStop(0.68, '#F2601C');
    lava.addColorStop(1.00, '#8E2109');
    ctx.fillStyle = lava;
    ctx.fillRect(-R, -R, R * 2, R * 2);
    // ② 岩壳：深灰岩板随滚动旋转，板间留缝 = 流淌的岩浆
    ctx.rotate(bird.rot);
    for (const t of magmaShell()) {
      ctx.beginPath();
      for (let i = 0; i < t.pts.length; i++) {
        if (i === 0) ctx.moveTo(t.pts[i][0], t.pts[i][1]);
        else ctx.lineTo(t.pts[i][0], t.pts[i][1]);
      }
      ctx.closePath();
      const lum = t.depth === 0 ? '#4B4744' : (t.depth === 1 ? '#413D3A' : '#383533');
      const rim = t.depth === 0 ? '#5C5754' : '#4A4643';
      ctx.fillStyle = lum;
      ctx.fill();
      ctx.strokeStyle = rim;
      ctx.lineWidth = 1.1;
      ctx.stroke();
      // 板缘被岩浆烤灼的高亮描边（缝隙发光）
      ctx.strokeStyle = 'rgba(255, 176, 74,' + (0.34 + 0.18 * Math.sin(frameCount * 0.2 + t.sd)).toFixed(3) + ')';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    ctx.restore();
    // ③ 球体轮廓 + 顶部细微高光，保持体积感
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(38, 30, 27, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#FFE3B0';
    ctx.beginPath();
    ctx.ellipse(-R * 0.3, -R * 0.42, R * 0.42, R * 0.22, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // ④ 溅出的火星（贴球面，轻微呼吸）
    for (let i = 0; i < 4; i++) {
      const aa = frameCount * 0.06 + i * 1.7;
      const rr = R * (0.7 + 0.14 * Math.sin(frameCount * 0.18 + i));
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(frameCount * 0.24 + i);
      ctx.fillStyle = i % 2 ? '#FFC078' : '#FF8A3D';
      ctx.beginPath();
      ctx.arc(Math.cos(aa) * rr, Math.sin(aa) * rr, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /** 火+岩：地面岩浆流 + 永久腐蚀痕 + 溅出的小水滴/火星 */
  function drawMagmaGround() {
    if (!magmaPuddles.length && !magmaDrops.length && !magmaScars.length) return;
    const groundY = CFG.H - CFG.GROUND_H;
    ctx.save();
    // —— 永久腐蚀痕：暗红熔岩底 + 黄色熔金交织亮纹，像被岩浆腐蚀过的地面，绝不消散 ——
    const scarSpr = glowSprite('magmaScar', [
      [0.00, '96,20,8', 0.96],
      [0.52, '122,30,10', 0.86],
      [0.82, '84,20,8', 0.58],
      [1.00, '60,14,6', 0]
    ]);
    for (const s of magmaScars) {
      const rr = s.r;
      const sy = groundY + 2;
      // 椭圆底痕（贴图按 1:0.30 压扁绘制，等价原来的 ellipse 填充）
      ctx.globalAlpha = 1;
      ctx.drawImage(scarSpr, s.x - rr, sy - rr * 0.30, rr * 2, rr * 0.60);
      // 黄色熔金交织纹（2 条随 seed 起伏的细流）
      ctx.strokeStyle = 'rgba(255, 186, 62, 0.80)';
      ctx.lineCap = 'round';
      for (let j = 0; j < 2; j++) {
        const ph = s.seed * 1.7 + j * 2.9;
        const amp = rr * 0.11;
        ctx.lineWidth = 1.2 + (j === 0 ? 0.5 : 0);
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
          const t = i / 6;
          const xx = s.x - rr * 0.72 + rr * 1.44 * t;
          const yy = sy - rr * 0.10 + Math.sin(t * 5.4 + ph) * amp + j * rr * 0.13;
          if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      // 中心一点更亮的橙黄余烬
      ctx.fillStyle = 'rgba(255, 214, 120, 0.55)';
      ctx.beginPath();
      ctx.ellipse(s.x + (s.seed % 3 - 1) * rr * 0.16, sy - 1, rr * 0.22, rr * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const puddleSpr = glowSprite('magmaPuddle', [
      [0.00, '255,226,150', 0.72],
      [0.45, '255,122,46', 0.50],
      [1.00, '190,48,18', 0]
    ]);
    for (const q of magmaPuddles) {
      const k = Math.max(0, q.t / q.max);
      const rr = q.r * (1.25 - 0.25 * k);
      ctx.globalAlpha = k;
      ctx.drawImage(puddleSpr, q.x - rr, groundY + 1 - rr * 0.34, rr * 2, rr * 0.68);
    }
    for (const d of magmaDrops) {
      const k = Math.max(0, d.t / d.max);
      ctx.globalAlpha = 0.35 + 0.6 * k;
      ctx.fillStyle = k > 0.5 ? '#FFC978' : '#F06A24';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * (0.55 + 0.6 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /** 火+岩：被切下的上半截柱子 —— 绕切口向右倒塌，砸地后由粒子系统碎裂
   *  铁律：全程保持岩元素深灰石头质感，绝不发白；仅撞击端（左侧）带岩浆暗红灼痕 */
  function drawMagmaSlabs() {
    if (!magmaSlabs.length) return;
    const groundY = CFG.H - CFG.GROUND_H;
    for (const s of magmaSlabs) {
      const prog = Math.min(1, s.ang / (Math.PI / 2));
      const drop = (groundY - s.cutY) * prog;
      const w = s.w, hs = s.h;
      ctx.save();
      ctx.translate(s.pivotX, s.cutY + drop);
      ctx.rotate(s.ang);
      // —— 板体：不规则崩边的深灰岩石（上略亮、下暗，绝不会是白色）——
      const g = ctx.createLinearGradient(0, -hs, w * 0.6, 0);
      g.addColorStop(0.00, '#5E5A56');
      g.addColorStop(0.55, '#4A4643');
      g.addColorStop(1.00, '#373331');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#2B2725';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      const edges = 7;
      for (let i = 0; i <= edges; i++) {                       // 顶边：轻微崩口
        const xx = (i / edges) * w;
        const yy = -hs + Math.sin(i * 1.9 + s.seed) * 2.4;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      for (let i = edges; i >= 0; i--) {                       // 底边（切口）：极不平整
        const xx = (i / edges) * w;
        const yy = -2 + Math.sin(i * 2.7 + s.seed * 1.7) * 2.6;
        ctx.lineTo(xx, yy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 岩石纹理：几条顺柱向的细裂纹（比底色略深，不画长直线）
      ctx.strokeStyle = 'rgba(34, 30, 28, 0.5)';
      ctx.lineWidth = 0.9;
      for (let c = 0; c < 3; c++) {
        const cx0 = w * (0.18 + 0.28 * c) + Math.sin(s.seed + c) * 4;
        ctx.beginPath();
        ctx.moveTo(cx0, -hs * 0.92);
        for (let seg = 1; seg <= 4; seg++) {
          ctx.lineTo(cx0 + Math.sin(s.seed * 1.3 + c * 2.1 + seg * 1.6) * 2.6,
                     -hs * 0.92 + (hs * 0.86) * (seg / 4));
        }
        ctx.stroke();
      }
      // 撞击端（左侧）暗红灼烧痕：由左向右快速衰减
      const hg = ctx.createLinearGradient(0, 0, w * 0.5, 0);
      hg.addColorStop(0.00, 'rgba(150, 46, 20, 0.62)');
      hg.addColorStop(0.42, 'rgba(150, 46, 20, 0.18)');
      hg.addColorStop(1.00, 'rgba(150, 46, 20, 0)');
      ctx.fillStyle = hg;
      ctx.fillRect(0, -hs, w * 0.5, hs);
      // 左侧边缘微弱高光（体现石头的厚度）
      ctx.strokeStyle = 'rgba(146, 140, 132, 0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(1, -hs * 0.94);
      ctx.lineTo(1, -4);
      ctx.stroke();
      // 切口端面：仍在燃烧的熔融亮线（沿不平整切口走）
      const flick = 0.74 + 0.26 * Math.sin(frameCount * 0.5 + s.seed);
      ctx.strokeStyle = 'rgba(255, 122, 53,' + (0.92 * flick).toFixed(3) + ')';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      for (let i = 0; i <= edges; i++) {
        const xx = (i / edges) * w;
        const yy = -2 + Math.sin(i * 2.7 + s.seed * 1.7) * 2.6;
        if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 238, 210,' + (0.8 * flick).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
      // —— 管口矩形：随断裂半截一起倒塌，全程保留（旧版倒塌时直接跳过 → 撞击瞬间管口凭空丢失）——
      // 位置 = 板体顶端（即撞击瞬间原管口所在位置，零跳变），尺寸与正常管口完全一致：
      // 左右各外扩 capOver，内部整块填满岩石色，两端肩部同样铺满，绝无漏白 / 填充不全。
      const mcapH = Math.min(24, Math.max(10, hs));
      const mcapW = w + 12;
      ctx.fillStyle = '#4A4643';
      ctx.fillRect(-6, -hs, mcapW, mcapH);
      // 管口表面纵向明暗，让矩形读作「管口板」而不是普通裂缝
      const mcapG = ctx.createLinearGradient(0, -hs, 0, -hs + mcapH);
      mcapG.addColorStop(0.00, 'rgba(150, 144, 136, 0.36)');
      mcapG.addColorStop(0.55, 'rgba(96, 92, 88, 0.10)');
      mcapG.addColorStop(1.00, 'rgba(34, 30, 28, 0.24)');
      ctx.fillStyle = mcapG;
      ctx.fillRect(-6, -hs, mcapW, mcapH);
      ctx.strokeStyle = '#2B2725';
      ctx.lineWidth = 2;
      ctx.strokeRect(-5, -hs + 1, mcapW - 2, mcapH - 2);
      ctx.restore();
    }
  }

  /** 雷+草：紫色四叶雷印（雷元素电光 + 草结印，四片叶脉）
   *  —— 贴图化：光晕/四片贝塞尔草叶/雷核/电弧环一次性烘成两张静态贴图，
   *     逐帧只剩「旋转 + drawImage + 一个 globalAlpha」，不再走任何路径计算。 */
  let sealBodySpr = null, sealArcSpr = null;
  function buildCruiseSealSprites() {
    if (sealBodySpr) return;
    const SS = 3, BOX = 96, S = BOX * SS, C = S / 2;
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
    // ① 印体：外层电光晕 + 四片草叶（填空+描边）+ 中心雷核
    const a = mk(), g = a.getContext('2d');
    g.translate(C, C); g.scale(SS, SS);
    const halo = g.createRadialGradient(0, 0, 2, 0, 0, 34);
    halo.addColorStop(0.00, 'rgba(186,104,200,0.40)');
    halo.addColorStop(1.00, 'rgba(156,39,176,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(0, 0, 34, 0, Math.PI * 2); g.fill();
    for (let k = 0; k < 4; k++) {
      g.save();
      g.rotate(k * Math.PI / 2 + 0.2);
      g.beginPath();
      g.moveTo(0, 0);
      g.bezierCurveTo(6, -8, 15, -10, 18, -3);
      g.bezierCurveTo(20, 3, 11, 8, 0, 0);
      g.closePath();
      g.fillStyle = 'rgba(186,104,200,0.16)';
      g.fill();
      g.strokeStyle = 'rgba(156,39,176,0.96)';
      g.lineWidth = 1.8;
      g.stroke();
      g.restore();
    }
    g.fillStyle = '#7B1FA2';
    g.beginPath(); g.arc(0, 0, 3.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(240,220,255,1)';
    g.beginPath(); g.arc(0, 0, 1.5, 0, Math.PI * 2); g.fill();
    sealBodySpr = a;
    // ② 电弧环：角度按固定间隔排布 → 整环旋转即可复现原来的「滋滋乱跳」
    const b = mk(), h = b.getContext('2d');
    h.translate(C, C); h.scale(SS, SS);
    h.strokeStyle = 'rgba(224,176,255,0.80)';
    h.lineWidth = 1.2;
    h.beginPath();
    for (let i = 0; i <= 10; i++) {
      const aa = i * 0.63;
      const rr = 20 + (i % 2 ? 3.4 : -2.2);
      const px = Math.cos(aa) * rr, py = Math.sin(aa) * rr;
      if (i === 0) h.moveTo(px, py); else h.lineTo(px, py);
    }
    h.stroke();
    sealArcSpr = b;
  }
  function drawCruiseSeals() {
    if (!cruiseSeals.length) return;
    buildCruiseSealSprites();
    for (const s of cruiseSeals) {
      if (s.taken) continue;
      const fa = s.fade == null ? 1 : Math.max(0, s.fade);
      if (fa <= 0.02) continue;
      const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.16 + s.ph);
      ctx.save();
      ctx.globalAlpha = fa * (0.68 + 0.32 * pulse);   // 保留原本的呼吸明暗
      ctx.translate(s.x, s.y);
      ctx.save();
      ctx.rotate(frameCount * 0.018 + s.ph);
      ctx.drawImage(sealBodySpr, -48, -48, 96, 96);
      ctx.restore();
      ctx.rotate(frameCount * 0.06);
      ctx.drawImage(sealArcSpr, -48, -48, 96, 96);
      ctx.restore();
    }
  }

  /** 火+风：高温热浪扭曲波纹（横向正弦气浪，制造焦躁感） */
  function drawHeatHaze() {
    if (envHeatA <= 0.015) return;
    const gy = CFG.H - CFG.GROUND_H;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 9; i++) {
      const y0 = 70 + i * ((gy - 90) / 9);
      ctx.globalAlpha = envHeatA * (0.17 + 0.07 * Math.sin(frameCount * 0.09 + i * 1.7));
      ctx.strokeStyle = 'rgba(255, 214, 186, 0.95)';
      ctx.beginPath();
      for (let x = -20; x <= CFG.W + 20; x += 26) {
        const yy = y0
          + Math.sin(x * 0.017 + frameCount * 0.10 + i * 1.3) * 6.2
          + Math.sin(x * 0.043 - frameCount * 0.07 + i * 2.2) * 2.9;
        if (x === -20) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * 火+风：真正的高温空气扭曲 —— 按横向条带对已绘制画面做正弦位移采样，
   * 形成肉眼可见的「热浪折射」波纹（不是简单描线）。
   * 仅在热浪强度 > 0.02 时执行；条带数量固定，开销可控。
   */
  let heatBuf = null;   // 离屏快照缓冲：热浪扭曲只从这张静帧取样，避免「边画边读自身」
  function applyHeatDistort() {
    if (envHeatA <= 0.02) return;
    const W = cv.width, H = cv.height;
    if (!W || !H) return;
    if (!heatBuf) heatBuf = document.createElement('canvas');
    if (heatBuf.width !== W || heatBuf.height !== H) { heatBuf.width = W; heatBuf.height = H; }
    const hb = heatBuf.getContext('2d');
    hb.setTransform(1, 0, 0, 1, 0, 0);
    hb.globalCompositeOperation = 'copy';
    hb.drawImage(cv, 0, 0);              // 一次快照，之后所有条带都从 heatBuf 取样
    hb.globalCompositeOperation = 'source-over';
    const bandH = Math.max(4, Math.round(6 * viewScale));   // 条带更细 → 折射轮廓平滑无缝，避免阶梯感
    const t = frameCount;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let y = 0; y < H; y += bandH) {
      const u = y / H;
      const depth = 0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, u * 1.12));   // 中段折射最强
      const amp = envHeatA * 4.6 * depth * viewScale;
      const dx = (Math.sin(y * 0.017 + t * 0.13) + 0.55 * Math.sin(y * 0.041 - t * 0.09 + 1.7)) * amp;
      if (Math.abs(dx) < 0.35) continue;
      const bh = Math.min(bandH + 1, H - y);
      ctx.drawImage(heatBuf, 0, y, W, bh, dx, y, W, bh);
    }
    ctx.restore();
  }

  /**
   * 风+水：厚实白云 / 翻滚蒸汽的软边贴图（预渲染一次，避免逐帧生成上百个渐变）
   * 多叶瓣叠加 + 柔和气化边缘，绝无硬朗线条。
   */
  let fogSpriteWhite = null, fogSpriteGrey = null;
  function makeFogSprite(inner, mid, outer) {
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g2 = c.getContext('2d');
    const lobes = [
      [0.50, 0.54, 0.40], [0.29, 0.47, 0.26], [0.71, 0.48, 0.27],
      [0.37, 0.68, 0.24], [0.65, 0.67, 0.23], [0.50, 0.35, 0.23],
      [0.20, 0.62, 0.18], [0.80, 0.62, 0.18]
    ];
    for (const lb of lobes) {
      const grd = g2.createRadialGradient(lb[0] * S, lb[1] * S, 0, lb[0] * S, lb[1] * S, lb[2] * S);
      grd.addColorStop(0.00, inner);
      grd.addColorStop(0.55, mid);
      grd.addColorStop(1.00, outer);
      g2.fillStyle = grd;
      g2.beginPath();
      g2.arc(lb[0] * S, lb[1] * S, lb[2] * S, 0, Math.PI * 2);
      g2.fill();
    }
    return c;
  }
  function getFogSprites() {
    if (!fogSpriteWhite) {
      fogSpriteWhite = makeFogSprite('rgba(255,255,255,0.96)', 'rgba(253,254,255,0.56)', 'rgba(251,252,255,0)');
      fogSpriteGrey = makeFogSprite('rgba(228,231,238,0.78)', 'rgba(232,235,241,0.42)', 'rgba(236,239,245,0)');
    }
    return fogSpriteWhite;
  }

  /** 风+水迷雾视距：该 X 处的物体是否已被浓雾彻底吞没。
      与柱子的 fogA 判定共用同一套距离规则（> 1.2 个缝隙宽 = 完全不可见），
      确保金币 / 元素球与柱子同步消失，绝不允许「柱子没了、金币还飘着」。 */
  function fogHidesX(x) {
    if (!reaction || reaction.id !== 'fog' || fogAmp <= 0.02) return false;
    return Math.abs(x - bird.x) / CFG.PIPE_GAP > 1.2;
  }

  /** 风+水：由四周涌向小鸟的厚实白云团（软边气化 + 缓慢向内翻滚 + 呼吸闪烁） */
  function drawFogOverlay() {
    const A = Math.min(1, fogAmp);
    if (!fogParts.length && A <= 0.01) return;
    const sprite = getFogSprites();
    const T = frameCount;
    const gy = CFG.H - CFG.GROUND_H;
    ctx.save();

    function puff(x, y, r, a, ph, rot) {
      if (a <= 0.004 || r <= 2) return;
      const br = 0.90 + 0.10 * Math.sin(T * 0.016 + ph);      // 呼吸：透明度与体积同步微幅起伏
      const rr = r * br;
      ctx.save();
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      // 底部极淡浅灰阴影 → 体积厚重感
      ctx.globalAlpha = Math.min(1, a * 0.62);
      ctx.drawImage(fogSpriteGrey, -rr * 0.62 + rr * 0.05, -rr * 0.50 + rr * 0.07, rr * 1.24, rr * 1.0);
      // 主体白雾
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(sprite, -rr * 0.62, -rr * 0.50, rr * 1.24, rr * 1.0);
      ctx.restore();
    }

    // ① 屏幕四周常驻厚云带：一团团内边缘缓慢翻滚、向内推进
    for (let i = 0; i < 7; i++) {
      const ph = i * 1.71;
      const fx = ((i + 0.5) / 7) * CFG.W;
      puff(fx + Math.sin(T * 0.005 + ph) * 34,
           -30 + Math.sin(T * 0.009 + ph) * 16, 226, A * 0.97, ph, Math.sin(T * 0.004 + ph) * 0.25);
      puff(fx + Math.sin(T * 0.006 + ph + 2) * 34,
           gy + 30 + Math.sin(T * 0.010 + ph) * 14, 210, A * 0.95, ph + 3, Math.sin(T * 0.005 + ph) * 0.25);
    }
    for (let i = 0; i < 5; i++) {
      const ph = i * 2.31 + 0.9;
      const fy = ((i + 0.5) / 5) * gy;
      puff(-26 + Math.sin(T * 0.008 + ph) * 18, fy + Math.sin(T * 0.006 + ph) * 30,
           218, A * 0.96, ph, Math.sin(T * 0.004 + ph) * 0.3);
      puff(CFG.W + 30 + Math.sin(T * 0.007 + ph) * 18, fy + Math.sin(T * 0.009 + ph) * 30,
           232, A * 0.98, ph + 1, Math.sin(T * 0.004 + ph) * 0.3);
    }

    // ② 右侧白墙：贴边叠加一列巨型浓云 + 纵向渐变，并整体向左蔓延 → 把右侧来柱吞进雾里
    if (A > 0.02) {
      const wallL = CFG.W - 380;                              // 白墙向内（向左）蔓延的起点
      const wallG = ctx.createLinearGradient(wallL, 0, CFG.W + 40, 0);
      wallG.addColorStop(0.00, 'rgba(252, 253, 255, 0)');
      wallG.addColorStop(0.34, 'rgba(252, 253, 255,' + (0.20 * A).toFixed(3) + ')');
      wallG.addColorStop(0.62, 'rgba(252, 253, 255,' + (0.62 * A).toFixed(3) + ')');
      wallG.addColorStop(1.00, 'rgba(252, 253, 255,' + (0.96 * A).toFixed(3) + ')');
      ctx.globalAlpha = 1;
      ctx.fillStyle = wallG;
      ctx.fillRect(wallL, 0, CFG.W - wallL + 40, CFG.H);
      for (let i = 0; i < 6; i++) {
        const ph = i * 1.37 + 0.4;
        const fy = ((i + 0.5) / 6) * gy;
        puff(CFG.W + 52 + Math.sin(T * 0.008 + ph) * 12, fy + Math.sin(T * 0.007 + ph) * 24,
             272, A * 0.99, ph, Math.sin(T * 0.004 + ph) * 0.3);
        // 向左蔓延的中段浓云：位置随呼吸轻微进出，形成"蒸汽一路压过来"的推进感
        puff(CFG.W - 150 + Math.sin(T * 0.006 + ph + 1.3) * 26, fy + Math.sin(T * 0.009 + ph) * 26,
             214, A * 0.86, ph + 2, Math.sin(T * 0.005 + ph) * 0.3);
        puff(CFG.W - 268 + Math.sin(T * 0.007 + ph + 2.1) * 24, fy + Math.sin(T * 0.008 + ph) * 30,
             178, A * 0.60, ph + 4, Math.sin(T * 0.005 + ph) * 0.3);
      }
    }

    // ② 向内翻滚的雾团（越靠近屏幕中央越稀薄，形成"浓雾涌来"的层次）
    for (const f of fogParts) {
      const a = Math.max(0, Math.min(1, f.a)) * Math.min(1, f.t / 55) * 0.92;
      const rr = f.r * (1.10 + 0.22 * (1 - f.t / Math.max(1, f.max)));
      puff(f.x, f.y, rr, a, f.ph || 0, (f.rot || 0) + T * 0.0016);
    }
    ctx.restore();
  }

  /* ============================================================
   * 全屏滤镜更新（唯一入口，逐帧只写 CSS opacity）
   *   逐条等价于原 Canvas 绘制：
   *   · 冰霜边缘：#fxFrost（四边线性渐变，颜色 = 0.56/0.30 基准，呼吸感留在 opacity 里）
   *   · 异空间：  #fxVoid（0.46 暗幕）+ #fxVoidVig（0.46×0.55 圆形暗角）
   *   · 电磁：    #fxEm（0.21 纯色）+ #fxEmVig（0.52 径向，颜色自带 0.9 alpha）
   *   · 冰雷：    #fxNetlag（0.16）+ #fxNetlagEdge（A）+ #fxNetlagLine（A）
   *   · 闪光：    #flashWhite / #flashPurple / #flashGold / #flashRed
   * ============================================================ */
  function updateFxOverlays() {
    // ① 霜冻（含 iceBorderA 的平滑渐入渐出，逐帧推进，与原实现完全一致）
    const wantHeavy = (!!reaction && reaction.id === 'icecrack') || iceWaterTrailT > 0;
    const target = wantHeavy ? 1 : (iceT > 0 ? 0.52 : 0);
    iceBorderA += (target - iceBorderA) * 0.06;
    if (iceBorderA < 0.004 && target === 0) iceBorderA = 0;
    if (fxLayout.frostDeep !== wantHeavy) {
      fxLayout.frostDeep = wantHeavy;
      fxEdge4(fxEls.frost, wantHeavy ? '78,150,208' : '190,227,248', (wantHeavy ? 108 : 72) * cssPerUnit);
    }
    fxSet('frost', fxEls.frost,
      iceBorderA * ((wantHeavy ? 0.56 : 0.30) + 0.06 * Math.sin(frameCount / 12)));

    // ② 雷+岩异空间
    let voidA = 0;
    if (reaction && reaction.id === 'void') {
      const fade = Math.min(1, Math.min(reaction.t, 60) / 60);
      voidA = fade * (0.46 + 0.05 * Math.sin(frameCount / 10));
    }
    fxSet('voidEdge', fxEls.voidEdge, voidA);
    fxSet('voidVig', fxEls.voidVig, voidA * 0.55);

    // ③ 风+雷电磁
    const emA = envEmA > 0.012 ? envEmA : 0;
    fxSet('em', fxEls.em, emA * 0.21);
    fxSet('emVig', fxEls.emVig, emA * 0.52);

    // ④ 冰+雷 迟滞滤镜
    const lagA = envLagA > 0.012 ? envLagA : 0;
    fxSet('netlag', fxEls.netlag, lagA * 0.16);
    fxSet('netlagEdge', fxEls.netlagEdge, lagA);
    fxSet('netlagLine', fxEls.netlagLine, lagA);

    // ⑤ 全屏闪光（白闪 / 紫闪 / 金闪 / 受击红屏）
