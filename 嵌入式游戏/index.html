          r.gf = Math.max(0, Math.min(1, (elapsed - GROW_BASE) / GROW));
        } else {
          /* —— 滑行段 5.5s：速度按正弦缓动（起滑柔和 → 中段加速 → 到站减速），总位移不变 —— */
          if (r.phase !== 'ride') { r.phase = 'ride'; r.spd = computeRideSpeed(); }
          const u = Math.max(0, Math.min(1, (elapsed - GEN_END) / CFG.REACT_RIDE_RIDE));
          const ef = (0.86 + 0.20 * Math.sin(Math.PI * u)) / 0.9873;   // 均值归一化：起滑/到站轻缓、中段顺滑，总距离不变
          const wx = r.spd * ef;
          grassShift += wx;                                // 额外位移同步喂 spawnTimer（管道时间轴恒定）
          for (const p of pipes) p.x -= wx;
          for (const c of coins) c.x -= wx;
          for (const o of orbs) o.x -= wx;
          for (const gn of grassNodes) gn.x -= wx;
          for (const s of pipeDebris) s.x -= wx;
          for (const d of windTrail) d.x -= wx;
          for (const t of thunderTrail) t.x -= wx;
          for (const f of fireTrail) f.x -= wx;
          rideShift += wx + base;                          // 轨道起伏按世界坐标取值，绝不随屏幕漂移
          // 小鸟被轨道吸附：Y 完全由轨道函数接管（无视重力与点击跳跃），俯仰角沿轨道切线
          bird.vy = 0;
          const yNow = rideYAt(bird.x);
          const slope = Math.atan2(rideYAt(bird.x + 28) - yNow, 28);
          bird.rot += (Math.max(-0.55, Math.min(0.55, slope * 0.8)) - bird.rot) * 0.25;
          bird.y = yNow - 12;                              // 站立高度：脚底贴住桥/冰道顶面
          // 冰道专属：小鸟身后持续喷洒冰雪粒子
          if (r.id === 'slide') {
            for (let k = 0; k < 3; k++) {
              slideSnow.push({ x: bird.x - 8 + Math.random() * 14, y: bird.y + (Math.random() - 0.5) * 22,
                               vx: -2 - Math.random() * 2.5, vy: (Math.random() - 0.5) * 1.6,
                               t: 34 + Math.random() * 18, max: 52 });
            }
          }
          for (const p of pipes) {                         // 跨柱计数（仅统计）
            if (!p.reactCounted && p.x + CFG.PIPE_W < bird.x) { p.reactCounted = true; r.crossed++; }
          }
          if (elapsed >= GEN_END + CFG.REACT_RIDE_RIDE) beginRideExit();
        }
      } else if (isRideId) {
        /* —— 退场段 1s：轨道淡出 + 粒子飘散，此时玩家操作与重力已恢复 —— */
        r.t--;
        rideShift += CFG.PIPE_SPEED * speedMul;            // 世界继续左移：回拉锚点必须同速跟随，绝不脱节
        if (r.t <= 0) endReaction();
      } else if (r.id === 'gold') {
        // 风+草暴富流：7 秒 —— 金币全程「先悬停 1 秒 → 缓慢可见地飞向小鸟」，分数逐帧平滑累计 800
        r.t--;
        addReactionScore(r);
        for (const c of coins) if ((c.hold || 0) === 0) c.magnet = true;
        // 持续生成：屏幕上方不断涌出新金币（先悬停 1 秒再起飞），保证 7 秒吸金过程饱满
        if (r.t % 8 === 0) {
          for (let k = 0; k < 2; k++) {
            spawnCoin(110 + Math.random() * (CFG.W - 240),
                      16 + Math.random() * 130,
                      false, CFG.REACT_GOLD_HOLD, undefined, true);
          }
        }
        if (r.t <= 0) endReaction();
      } else if (r.id === 'melt') {
        /* —— 火+冰：7 秒穿透 —— 逐帧记录小鸟躯体在柱体局部坐标中的真实飞行轨迹，
           生成一条紧贴躯体、宽 1.5 倍鸟身、带弧度与不规则水滴边缘的永久贯穿通道 —— */
        r.t--;
        const hitR = CFG.BIRD_R * 1.5;
        for (const p of pipes) {
          if (p.x < bird.x + hitR && p.x + CFG.PIPE_W > bird.x - hitR) {
            p.meltY = bird.y;
            // 【音效】首次穿透这根柱子：清脆「铁球淬火滋滋声」（每根柱子一次，120ms 防抖）
            if (!p.meltSfxOn) { p.meltSfxOn = true; playSoundThrottled('melt', 0.12); }
            p.meltP = Math.min(1, (p.meltP || 0) + 1 / 60);      // 1 秒平滑渐入
            if (!p.meltTrack) p.meltTrack = [];
            // 柱体局部坐标：管道自身坐标系里记录小鸟穿过时的位置（管道左移不影响已融化的洞）
            const lx = bird.x - p.x, ly = bird.y;
            const last = p.meltTrack[p.meltTrack.length - 1];
            // 宽度 = 小鸟本体 1.5 倍；每个采样点半径轻微随机 → 边缘呈不规则水滴/气化弧形
            const rr = CFG.BIRD_R * 1.5 * (0.9 + Math.random() * 0.2);
            if (!last || Math.hypot(lx - last.x, ly - last.y) > 2.4) {
              p.meltTrack.push({ x: lx, y: ly, r: rr, seed: Math.random() * 6.283 });
              if (p.meltTrack.length > 60) p.meltTrack.shift();
            } else {
              last.x = lx; last.y = ly;                          // 密集刷新，通道紧贴当前躯体
            }

            // 【蒸汽大幅增强】每帧 5 颗向四周喷发的大团白汽，体现高温瞬间气化
            for (let s2 = 0; s2 < 5; s2++) {
              const life = 52 + Math.random() * 30;
              const ang = Math.random() * Math.PI * 2;
              const sp = 0.5 + Math.random() * 1.5;
              const mS = takeObj('meltSteam');
              mS.x = bird.x + Math.cos(ang) * CFG.BIRD_R * 1.15;
              mS.y = bird.y + Math.sin(ang) * CFG.BIRD_R * 1.15;
              mS.r = 9 + Math.random() * 13;
              mS.vy = -0.8 - Math.random() * 1.1;
              mS.vx = Math.cos(ang) * sp;
              mS.t = life; mS.max = life;
              meltSteam.push(mS);
            }
            while (meltSteam.length > 240) recycleObj('meltSteam', meltSteam.shift());
          }
        }
        for (const m of meltSteam) {
          m.t--;
          m.x += (m.vx || 0) - CFG.PIPE_SPEED * speedMul;
          m.y += (m.vy || -0.8);
          m.vx = (m.vx || 0) * 0.97;                            // 喷发后迅速减速，向外扩散而非飞走
        }
        meltSteam = sweepPool(meltSteam, 'meltSteam');
        if (r.t <= 0) endReaction();
      } else if (r.id === 'char') {
        /* —— 火+草：9 秒烧焦碳化（50% 加速）——
           单柱正常 1.0 秒三段式（三段按 36:21:21 等比压缩为 60 帧）：
             0.0~0.467s（0~28 帧）  火焰沿藤蔓螺旋由缝隙向两端蔓延，柱体不变色
             0.467~0.733s（28~44 帧）柱体跟随藤蔓轨迹由缝隙向外焦黑（斑驳暗灰/深褐）
             0.733~1.0s（44~60 帧）焦黑部位由缝隙向两端灰化消散，火焰随之逗留熄灭
           特殊位置（缝隙中 / 空地右半区极近右柱）触发瞬间即点燃，30 帧（0.5 秒）极速烧完。
           【动态靠近判定】不预锁定任何柱子：每帧只点燃「唯一一组」正落在
           小鸟左侧空地感应带里的柱子，鸟往前飞 → 从左到右依次点燃。 */
        r.t--;
        // 【铁律八】草附着：整段反应期间柱子必须始终挂着藤蔓环境表现
        envVineT = Math.max(envVineT, envHold(r.t));
        envVineA = Math.max(envVineA, 0.02);
        charIgniteNear();                                   // 逐帧动态靠近判定（每帧最多点燃 1 组）
        stepCharBurns(speedMul);                            // 推进所有已点燃柱子的三段式动画（1.0s / 0.5s）
        if (r.t <= 0) endReaction();
      } else if (r.id === 'icecrack') {
        /* —— 水+冰：极寒真实碎裂 ——
           单组柱子的「加深 → 裂痕 → 碎冰」动画在 stepPipeFx() 内逐组推进，
           这样触发时还在屏幕右缘外的柱子可以在进场那一帧才开始播，互不干扰。 */
        r.t--;
        // 【铁律八】冰附着：结霜通道全程抬升，飞过第 6 根后 1 秒淡出
        envFrostT = Math.max(envFrostT, envHold(r.t));
        envFrostA = Math.max(envFrostA, 0.3);
        if (r.t <= 0) endReaction();
      } else if (r.id === 'erode') {
        /* —— 风+岩：真实侵蚀风化 —— 单组动画同样在 stepPipeFx() 内独立推进（支持延迟入场） */
        r.t--;
        if (r.t <= 0) endReaction();
      } else if (r.id === 'overload') {
        /* —— 火+雷：狂暴过载 5 秒 —— 100% 加速、全程无敌、重力随机反转、2 次雷突进 —— */
        r.t--;
        bird.invincible = Math.max(bird.invincible, 2);
        // 突进：前后各 2.5 秒区间内各随机 1 次（r.t 从 300 递减，两次天然间隔 ≥ 2.5s）
        if (!r.dashAt) r.dashAt = [232 + Math.floor(Math.random() * 56), 52 + Math.floor(Math.random() * 56)];
        while (r.dashAt.length && r.t <= r.dashAt[0]) {
          r.dashAt.shift();
          overloadSmash();
          r.dashT = 16;                                      // 突进冲刺演出 0.27 秒（真实位移感）
        }
        if (r.dashT > 0) r.dashT--;
        // 重力反转：单次最多 0.5 秒（30 帧），5 秒内总时长最多 1.5 秒（90 帧），随机分散
        if (r.gravOnT > 0) {
          r.gravOnT--;
          if (r.gravOnT === 0) { gravDir = 1; r.gravCool = 40 + Math.floor(Math.random() * 40); }
        } else if (r.gravLeft > 0) {
          if (r.gravCool > 0) r.gravCool--;
          else {
            const dur = Math.min(CFG.REACT_OVERLOAD_GRAV_MAX, r.gravLeft, 16 + Math.floor(Math.random() * 15));
            r.gravOnT = dur;
            r.gravLeft -= dur;
            gravDir = -1;
          }
        }
        // 红色火焰 + 紫色闪电混合的细长曲线拖尾（平滑正弦扰动 → 自然曲率）
        for (let e = 0; e < 2; e++) {
          const wob = Math.sin(frameCount * 0.14 + e * 1.1) * 3.4 + Math.sin(frameCount * 0.047 + 0.5) * 2.1;
          const fO = takeObj('fireTrail');
          fO.x = bird.x - 14 - e * 2.4 + Math.sin(frameCount * 0.07 + e) * 2.0;
          fO.y = bird.y + wob;
          fO.t = CFG.FIRE_TRAIL_MAX; fO.max = CFG.FIRE_TRAIL_MAX;
          fO.r = 2.2 + Math.random() * 2.2;
          fO.vy = -0.28 - Math.random() * 0.45;
          fO.seed = frameCount * 0.9 + e;
          fO.pale = false; fO.big = false;      // 池复用时必须显式清空形态标记
          fireTrail.push(fO);
        }
        while (fireTrail.length > 80) shiftPool(fireTrail, 'fireTrail');
        if (frameCount % 2 === 0) {
          const wobP = Math.sin(frameCount * 0.13 + 2.2) * 4.2;
          thunderTrail.push({ x: bird.x - 18 - Math.sin(frameCount * 0.06 + 0.6) * 3.0,
                              y: bird.y + wobP + Math.sin(frameCount * 0.045) * 1.4,
                              t: 20, max: 20, seed: frameCount * 0.7 });
          if (thunderTrail.length > 70) thunderTrail.shift();
        }
        if (r.t <= 0) {
          gravDir = 1;
          bird.invincible = Math.max(bird.invincible, 60);  // 结束后额外 1 秒无敌
          endReaction();
        }
      } else if (r.id === 'lag') {
        /* —— 风+冰：迟滞防抖 6 秒（首尾各 1 秒无敌已在计时器段处理）—— */
        r.t--;
        if (r.t <= 0) endReaction();
      } else if (r.id === 'mud') {
        /* —— 水+岩：泥潭 5 秒（护盾 20 秒已在触发时赋予）—— */
        r.t--;
        if (r.t <= 0) endReaction();
      } else if (r.id === 'magma') {
        /* —— 火+岩：0.5s 变身 → 8s 岩浆球贴地滚动 → 2s 变回 + 2s 无敌 —— */
        r.t--;
        const gy = CFG.H - CFG.GROUND_H;
        const formEnd = CFG.REACT_MAGMA_TIME - CFG.REACT_MAGMA_FORM;   // 600
        if (r.t > formEnd) {
          // 变身段：平滑下沉贴地、体型渐变为球
          r.formP = Math.min(1, r.formP + 1 / CFG.REACT_MAGMA_FORM);
          const ty = gy - CFG.REACT_MAGMA_R;
          bird.y += (ty - bird.y) * 0.26;
          bird.vy = 0;
          bird.rot += (0 - bird.rot) * 0.3;
        } else if (r.t > CFG.REACT_MAGMA_BALL_END) {
          r.ball = true;
          r.grounded = false;
          magmaSmash();                                        // 撞柱 → 横向裂痕 + 上半截右倒
          // 贴地滚动 → 地面红色岩浆流 + 向后溅出的小水滴/火星
          if (frameCount % 3 === 0) {
            magmaPuddles.push({ x: bird.x - 6 - Math.random() * 12, r: 7 + Math.random() * 7, t: 26, max: 26 });
          }
          // 永久腐蚀痕：按行驶距离（约 20px）铺一段，暗红与黄色交织，绝不消散
          r.scarAcc = (r.scarAcc || 0) + CFG.PIPE_SPEED * speedMul;
          while (r.scarAcc >= 20) {
            r.scarAcc -= 20;
            magmaScars.push({ x: bird.x - 4 + (Math.random() - 0.5) * 12,
                              r: 9 + Math.random() * 6, seed: Math.random() * 100 });
          }
          for (let k = 0; k < 2; k++) {
            magmaDrops.push({ x: bird.x - 5 - Math.random() * 12, y: gy - 2 - Math.random() * 5,
                              vx: -1.1 - Math.random() * 2.4, vy: -1.5 - Math.random() * 2.3,
                              r: 1.1 + Math.random() * 1.5,
                              t: 20 + Math.floor(Math.random() * 10), max: 30 });
          }
        } else {
          // 最后 0.5 秒：变回普通小鸟（不含无敌，无敌在反应完全结束后额外附加）
          if (!r.reverted) {
            r.reverted = true;
            r.ball = false;
            bird.y = Math.min(bird.y, gy - CFG.BIRD_R - 8);
            bird.vy = -5.5;
          }
        }
        if (r.t <= 0) {
          // 【火+岩】反应物理 9 秒结束 → 额外附加 1.5 秒无敌（不计入 9 秒内）
          bird.invincible = Math.max(bird.invincible, CFG.REACT_MAGMA_INV);
          endReaction();
        }
      } else if (r.id === 'cruise') {
        /* —— 雷+草：雷电四叶印直线突袭 ——
           ① 起手滞留 0.5 秒：世界极慢推进，小鸟几乎锁在原点蓄力，期间 7 个雷印已在 7 个连续空地就位；
           ② 直线突进：以 300% 速度（3× 常规）从一个雷印笔直飞向下一个雷印（线性、绝无弧线）；
           ③ 到达后全停悬停 0.4 秒，之后直奔下一个，共 7 次；
           ④ 每到达一个雷印：立刻 +5 金币，并视作穿过一根柱子（触发穿管得分与判定）。 */
        r.t--;
        if (r.phase === 'dwell') {
          // 滞留：世界极慢，小鸟锁在原点（仅机身缓缓摆正，绝不自由落体）
          shiftWorld(CFG.REACT_CRUISE_DWELL);
          bird.vy = 0;
          bird.rot += (0 - bird.rot) * 0.2;
          if (--r.dwellT <= 0) {
            r.phase = 'dash';
            r.seg = 0;
            r.segTarget = null;
            cruiseTiltA = 0;
            playSoundThrottled('cruise', 0.08);              // 第一次冲向雷印：与 dash 起点同帧
          }
        } else if (r.phase === 'hover') {
          // 悬停 0.2 秒：小鸟锁死在雷印高度，但背景/柱子以略慢于常规的速度继续左滑
          shiftWorld(CFG.REACT_CRUISE_HOLD_SLIDE);
          r.holdT--;
          bird.vy = 0;
          bird.rot += (0 - bird.rot) * 0.3;
          cruiseTiltA += (0 - cruiseTiltA) * 0.2;
          if (r.holdT <= 0) {
            if (r.finishing) { endReaction(); r.phase = 'done'; }   // 第 7 印的悬停完整结束后才解除反应
            else { r.phase = 'dash'; r.segTarget = null; playSoundThrottled('cruise', 0.08); }   // 每次再冲向下一雷印：同帧发声
          }
        } else if (r.phase === 'dash') {
          // 突进期：把世界整体以 600% 速度向左推进（管道/印记/金币严格同步）
          shiftWorld(CFG.REACT_CRUISE_SPEED);
          const target = cruiseSeals.find(s => !s.taken);
          if (target) {
            if (r.segTarget !== target) {
              r.segTarget = target;
              r.segFromY = bird.y;
              r.segFromX = Math.max(target.x, bird.x + 1);
            }
            // 直线突进：Y 随「目标印记与小鸟水平距离」线性推进（绝不用 smoothstep，绝不出现弧线）
            const span = Math.max(1, r.segFromX - bird.x);
            const u = Math.max(0, Math.min(1, 1 - (target.x - bird.x) / span));
            bird.y = r.segFromY + (target.y - r.segFromY) * u;
            bird.vy = 0;
            bird.rot += (Math.max(-0.7, Math.min(0.7, Math.atan2(target.y - r.segFromY, span))) - bird.rot) * 0.34;
            // 突进期间画面小幅倾斜，悬停阶段回正
            const tiltTarget = (target.y >= r.segFromY ? 1 : -1) * 0.09;
            cruiseTiltA += (tiltTarget - cruiseTiltA) * 0.2;
            // 伴随破坏：击碎两雷印之间（空地位置）的柱子
            smashCruisePipes();
            if (target.x <= bird.x + 12) {                     // 抵达下一个雷印
              target.taken = true;
              bird.y = target.y;
              r.crossed++;
              // 奖励：立刻 +5 金币 + 视作穿过一根柱子（穿管得分与判定）
              // 静音金币：雷印奖励绝不触发常规金币「叮」声，让位给雷+草突刺音效
              for (let k = 0; k < 5; k++) collectCoin(false, true);
              score += Math.round(CFG.PIPE_SCORE * multiplier);
              r.holdT = CFG.REACT_CRUISE_HOLD;                 // 0.2 秒悬停
              r.tiltFrom = cruiseTiltA;
              r.phase = 'hover';
              for (let k = 0; k < (IS_MOBILE ? 8 : 12); k++) {  // 紫色电火花爆散（移动端减量）
                const a = Math.random() * 6.283;
                thunderTrail.push({ x: target.x + Math.cos(a) * 8, y: target.y + Math.sin(a) * 8,
                                    t: 18, max: 18, seed: Math.random() * 100, spark: true });
              }
              if (thunderTrail.length > (IS_MOBILE ? 140 : 240)) thunderTrail.splice(0, thunderTrail.length - (IS_MOBILE ? 140 : 240));
              // 静音金币：奖励已由上面的 collectCoin 发放，这里不再额外播放常规金币音
              // 第 7 印：必须把这最后一次悬停也完整播完才解除反应（绝不中途掉落）
              if (r.crossed >= CFG.REACT_CRUISE_SEALS) r.finishing = true;
            }
          } else if (r.crossed >= CFG.REACT_CRUISE_SEALS) {
            endReaction();
          }
        }
        // 身后紫色「流星长条」：仅在突进期铺开
        if (r.phase === 'dash') {
          if (r.streakY == null) r.streakY = bird.y;
          r.streakY += (bird.y - r.streakY) * 0.16;           // 高度平滑跟随（低通滤波）
          thunderTrail.push({ x: bird.x - 14, y: r.streakY, t: 72, max: 72, seed: 0 });
          if (thunderTrail.length > (IS_MOBILE ? 140 : 240)) thunderTrail.splice(0, thunderTrail.length - (IS_MOBILE ? 140 : 240));
        }
        // 兜底超时（正常路径下永远由「7 印 + 末次悬停」主动结束）
        if (reaction && r.phase !== 'done' && r.t <= 0) endReaction();
      } else if (r.id === 'turb') {
        /* —— 火+风：气流紊乱 5.6 秒（重力每 0.7 秒横跳 ±50%，跳跃高度 ±20%，火拖尾，最多扣 1 次生命）—— */
        r.t--;
        if (r.t <= 0) endReaction();
      } else if (r.id === 'fog') {
        /* —— 风+水：迷雾 9 秒（四周白雾涌向小鸟，三档视距）—— */
        r.t--;
        const fadeK = Math.min(1, (CFG.REACT_FOG_TIME - r.t) / 60, r.t / 60);
        fogAmp += (fadeK - fogAmp) * 0.08;                     // 1 秒平滑渐入渐出
        const gyF = CFG.H - CFG.GROUND_H;
        if (fogParts.length < (IS_MOBILE ? 34 : 62)) {
          const edge = Math.floor(Math.random() * 4);
          let fx0, fy0;
          if (edge === 0) { fx0 = Math.random() * CFG.W; fy0 = -20; }
          else if (edge === 1) { fx0 = Math.random() * CFG.W; fy0 = gyF + 20; }
          else if (edge === 2) { fx0 = -20; fy0 = Math.random() * gyF; }
          else { fx0 = CFG.W + 20; fy0 = Math.random() * gyF; }
          const dx = bird.x - fx0, dy = bird.y - fy0, dl = Math.max(1, Math.hypot(dx, dy));
          fogParts.push({ x: fx0, y: fy0, r: 44 + Math.random() * 56,
                          vx: dx / dl * (0.75 + Math.random() * 0.7),
                          vy: dy / dl * (0.75 + Math.random() * 0.7),
                          t: 110 + Math.random() * 50, max: 160, a: 0,
                          ph: Math.random() * 6.283, rot: Math.random() * 6.283 });
        }
        for (const f of fogParts) {
          f.t--;
          f.x += f.vx - CFG.PIPE_SPEED * speedMul * 0.5;
          f.y += f.vy;
          f.a = Math.min(1, f.a + 0.05);
        }
        fogParts = fogParts.filter(f => f.t > 0);
        // 视距规则（按小鸟与柱心的水平距离，单位 = 一个缝隙宽度 PIPE_GAP）：
        //   < 0.5 缝隙 → 稍微清晰：柱子只蒙一层薄雾，玩家仍能判断管口位置
        //   0.5 ~ 1.2 缝隙 → 轮廓渐糊：仍能看见模糊轮廓（fogA 最高 0.90，不会提前整根消失）
        //   > 1.2 缝隙 → 完全不可见：白雾彻底吞没，柱身、管口一律不绘制
        for (const p of pipes) {
          const pcx = p.x + CFG.PIPE_W * 0.5;
          const dGap = Math.abs(pcx - bird.x) / CFG.PIPE_GAP;
          let tv;
          if (dGap < 0.5) tv = 0.10;
          else if (dGap <= 1.2) tv = 0.10 + ((dGap - 0.5) / 0.7) * (0.90 - 0.10);
          else tv = 1.0;
          if (p.fogA === undefined) p.fogA = 0;
          p.fogA += (tv - p.fogA) * 0.08;
        }
        if (r.t <= 0) endReaction();
      } else if (r.id === 'emfield') {
        /* —— 风+雷：电磁紊乱 6 秒（重力反转 + 深紫滤镜 + 闪电劈落）—— */
        r.t--;
        gravDir = -1;                                          // 全程保持反向
        if (emBoltCd > 0) emBoltCd--;
        else {
          emBoltCd = 22 + Math.floor(Math.random() * 26);
          const bx0 = Math.random() * CFG.W;
          const by0 = Math.random() * (CFG.H - CFG.GROUND_H) * 0.35;
          const bolt = makeBolt(bx0, by0, bx0 + (Math.random() - 0.5) * 120, by0 + 200 + Math.random() * 180,
                                8 + Math.floor(Math.random() * 4), 40);
          emBolts.push({ pts: bolt.pts, branches: bolt.branches, t: 22, max: 22 });
        }
        for (const b of emBolts) b.t--;
        emBolts = emBolts.filter(b => b.t > 0);
        // 雷+风：反应期间常驻紫色粗壮拖尾（前端最粗、尾部收细）
        if (frameCount % 2 === 0) {
          thunderTrail.push({ x: bird.x - 18 - Math.sin(frameCount * 0.08 + 0.4) * 3.2,
                              y: bird.y + Math.sin(frameCount * 0.13) * 4.8 + Math.sin(frameCount * 0.05) * 2.6,
                              t: 22, max: 22, seed: frameCount * 0.7 });
          if (thunderTrail.length > 90) thunderTrail.shift();
        }
        if (r.t <= 0) { gravDir = 1; endReaction(); }
      } else if (r.id === 'shock') {
        /* —— 水+雷：漏电麻痹 5 秒（Y 轴振幅 10px 高频抽搐 + 点击 0.1 秒延迟 + 带电闪烁）—— */
        r.t--;
        const echo = Math.min(1, (CFG.REACT_SHOCK_TIME - r.t) / 60, r.t / 60);
        shockOff = Math.sin(frameCount * 1.9) * CFG.REACT_SHOCK_AMP * echo;
        // 延迟队列：到点才真正施加点击
        for (const q of r.queue) {
          q.d--;
          if (q.d <= 0) { bird.vy = CFG.JUMP_V * gravDir; q.done = true; playSound('jump'); }
        }
        r.queue = r.queue.filter(q => !q.done);
        if (r.t <= 0) { shockOff = 0; endReaction(); }
      } else if (r.id === 'netlag') {
        /* —— 冰+雷：10.5 秒网络延迟
         *    绝对时间点 2.5s / 5s / 7.5s / 10s 各强制回退一次，共 4 轮；
         *    每次瞬时回退到 1.0 秒前的位置（144px），结束在第 10 秒后 0.5 秒（不落在结束无敌帧）。 */
        r.t--;
        const el = CFG.REACT_NETLAG_TIME - r.t;                   // 已过帧数
        if (r.rounds < 4 && el >= CFG.REACT_NETLAG_STEP * (r.rounds + 1)) {
          r.rounds++;
          shiftWorld(-CFG.REACT_NETLAG_DIST);                    // 强制回退 1.0 秒前（世界整体右移，不回收）
          // 【音效】冰+雷：回退触发的同一帧播放一次网络卡顿 / 电视干扰声（每次回退都响，防叠音）
          playSoundThrottled('netlagRollback', 0.08);
          for (let k = 0; k < 6; k++) {                          // 回退瞬间的淡蓝残影
            netlagGhosts.push({ x: bird.x + (Math.random() - 0.5) * 30,
                                y: bird.y + (Math.random() - 0.5) * 20,
                                rot: bird.rot, t: 20, max: 20 });
          }
          // 【冰+雷加强】回退期间不再无敌：撞柱子正常扣血，受击不强制弹回安全位置（受击无敌由 applyDamage 给）
        }
        // 冰+雷：全程常驻紫色粗壮拖尾（铺满全程，不提前清空）
        if (frameCount % 2 === 0) {
          thunderTrail.push({ x: bird.x - 18 - Math.sin(frameCount * 0.07 + 1.1) * 3.2,
                              y: bird.y + Math.sin(frameCount * 0.1) * 4.2 + Math.sin(frameCount * 0.043 + 0.9) * 2.6,
                              t: 22, max: 22, seed: frameCount * 0.7 });
          if (thunderTrail.length > 90) thunderTrail.shift();
        }
        if (r.t <= 0) endReaction();
      } else if (r.id === 'quake') {
        /* —— 冰+岩：极寒震荡 10 秒（柱身上下震动 = 缝隙 50% 即 ±25%，底座死死固定；冰霜 + 浅岩双重特效）—— */
        r.t--;
        quakeSeedT++;
        const fadeQ = Math.min(1, (CFG.REACT_QUAKE_TIME - r.t) / 60, r.t / 60);
        for (const p of pipes) {
          if (p.quakeAmp === undefined) {
            p.quakePh = Math.random() * 6.283;
            p.quakeAmp = CFG.REACT_QUAKE_MIN + Math.random() * (CFG.REACT_QUAKE_MAX - CFG.REACT_QUAKE_MIN);
            p.quakeY = 0;
          }
          const amp = CFG.PIPE_GAP * p.quakeAmp * fadeQ;
          const ty = Math.sin(quakeSeedT * 0.09 + p.quakePh) * amp;
          p.quakeY += (ty - (p.quakeY || 0)) * 0.25;
        }
        if (r.t <= 0) { for (const p of pipes) p.quakeFade = 1; endReaction(); }
      } else if (r.id === 'press') {
        /* —— 草+岩：泰山压顶 5 秒（重力 +100%）—— */
        r.t--;
        if (r.t <= 0) endReaction();
      }
    }
    // 反应结束后的余韵粒子 / 柱子特效淡出（铁律：所有特效 1 秒渐隐，绝不瞬间消失）
    // 水+冰：淡蓝冰水结合拖尾，AI 计算飞到第 6 根的时间，飞过即消失
    if (iceWaterTrailT > 0) {
      iceWaterTrailT--;
      const iS = takeObj('iceTrail');
      iS.x = bird.x - CFG.BIRD_R * 1.9;
      iS.y = bird.y + (Math.random() - 0.5) * 16;
      iS.r = 5 + Math.random() * 7;
      iS.t = 34; iS.max = 34;
      iceTrail.push(iS);
      if (iceTrail.length > 64) shiftPool(iceTrail, 'iceTrail');
    }
    for (const s of iceTrail) { s.t--; s.x -= CFG.PIPE_SPEED * speedMul; }
    iceTrail = sweepPool(iceTrail, 'iceTrail');
    if (!reaction || reaction.id !== 'melt') {
      for (const m of meltSteam) {
        m.t--;
        m.x += (m.vx || 0) - CFG.PIPE_SPEED * speedMul;
        m.y += (m.vy || -0.8);
      }
      meltSteam = sweepPool(meltSteam, 'meltSteam');
    }
    // 火+草：反应结束后，最后一组柱子仍要把 1.5 秒烧完（碳灰粒子同步推进）
    if (!reaction || reaction.id !== 'char') stepCharBurns(speedMul);
    for (const p of pipes) {
      // 风+岩：侵蚀缺口与固定深灰绿岩石外观永久保留（绝不做颜色淡出 / 闪烁）
      if (p.erodeFade > 0) p.erodeFade--;
      // 火+冰：融化洞 + 白色融化拖尾【永久保留】在柱子上，直到柱子飞出屏幕（绝不淡出）
    }
    // 冰道雪花粒子寿命推进
    for (const s of slideSnow) { s.x += s.vx; s.y += s.vy; s.t--; }
    slideSnow = slideSnow.filter(s => s.t > 0);
    // 滑道退场粒子：绿色叶片 / 冰晶碎屑向四周飘散，随世界左移并受轻微重力
    for (const p of rideBurst) {
      p.x += p.vx - CFG.PIPE_SPEED;
      p.y += p.vy;
      p.vy += 0.05;
      p.rot += p.vr;
      p.t--;
    }
    rideBurst = rideBurst.filter(p => p.t > 0);
    // 火：淡红火色拖尾逐帧推进 —— 点火期间持续在小鸟身后拖出新点，带随机扰动种子
    // 火+冰（轨迹融化）：同样保持火拖尾
    const meltTrailOn = !!reaction && reaction.id === 'melt';
    // 火+草（9 秒烧焦期）：整段反应期间小鸟身后常驻同款火焰拖尾（高速燃烧冲刺）
    const charTrailOn = !!reaction && reaction.id === 'char';
    // 火+岩（岩浆球）/ 火+风（气流紊乱）：同款火焰拖尾全程常驻
    const magmaTrailOn = !!reaction && (reaction.id === 'magma' || reaction.id === 'turb');
    if (fireSpeedT > 0 || fireDecelT > 0 || meltTrailOn || charTrailOn || magmaTrailOn) {
      const bigTrail = !!reaction && reaction.id === 'magma';
      const turbTrail = !!reaction && reaction.id === 'turb';
      // 移动端火+风：强制降低粒子发射密度（同屏粒子总数硬性 ≤ 30）
      const emit = (IS_MOBILE && turbTrail) ? 1
                 : ((charTrailOn || magmaTrailOn) ? 3 : 2);   // 火+草/火+岩/火+风喷射更密，强化冲刺燃烧感
      for (let e = 0; e < emit; e++) {
        // 全部扰动改为平滑正弦：中心线连续可导 → 拖尾绝不出现「一节一节」的抖动
        const wobY = Math.sin(frameCount * 0.15 + e * 1.15) * 3.1 + Math.sin(frameCount * 0.05 + 0.8) * 2.2;
        const wobX = Math.sin(frameCount * 0.09 + e * 0.9) * (bigTrail ? 4.0 : 2.2);
        const fP = takeObj('fireTrail');
        fP.x = bird.x - 13 - e * 2.6 - (bigTrail ? 6 : 2) + wobX;
        fP.y = bird.y + wobY;
        fP.t = CFG.FIRE_TRAIL_MAX; fP.max = CFG.FIRE_TRAIL_MAX;
        fP.r = 2.2 + Math.random() * (bigTrail ? 3.6 : 2.0);
        fP.vy = -0.28 - Math.random() * 0.45;
        fP.seed = Math.random() * 100;
        fP.pale = meltTrailOn; fP.big = bigTrail;
        fireTrail.push(fP);
      }
      // 同屏粒子上限：移动端火+风强制 ≤ 30，其余平台按反应类型放宽
      let trailCap = (IS_MOBILE && turbTrail) ? 30 : (bigTrail ? 140 : (charTrailOn ? 120 : 90));
      if (IS_MOBILE) trailCap = Math.min(trailCap, 48);   // 移动端统一压到 48：保留观感，填充率大幅下降
      while (fireTrail.length > trailCap) shiftPool(fireTrail, 'fireTrail');
    }
    for (const f of fireTrail) {
      f.t--;
      f.x -= CFG.PIPE_SPEED * speedMul;
      f.y += (f.vy || 0);                 // 余烬缓慢上浮
      f.vy = (f.vy || 0) * 0.985;         // 上浮逐渐减速，尾部自然停滞虚化
    }
    fireTrail = sweepPool(fireTrail, 'fireTrail');
    // 火+岩：地面岩浆流 + 小水滴拖尾推进（独立生命周期，反应结束后自然消散）
    for (const d of magmaDrops) {
      d.x += d.vx - CFG.PIPE_SPEED * speedMul;
      d.y += d.vy;
      d.vy += 0.15;
      d.t--;
    }
    magmaDrops = magmaDrops.filter(d => d.t > 0);
    for (const q of magmaPuddles) {
      q.x -= CFG.PIPE_SPEED * speedMul;
      q.t--;
    }
    magmaPuddles = magmaPuddles.filter(q => q.t > 0);
    // 火+岩：永久岩浆痕随世界左移（不衰减、不消失，仅离屏回收）
    for (const s of magmaScars) s.x -= CFG.PIPE_SPEED * speedMul;
    magmaScars = magmaScars.filter(s => s.x > -70);
    // 火+水：蒸汽拖尾随世界左移并按时淡出（透明度按 t/max 线性衰减，尾部归零）
    for (const s of steamTrail) { s.t--; s.x -= CFG.PIPE_SPEED * speedMul; }
    steamTrail = sweepPool(steamTrail, 'steamTrail');
    if (reactionLockT > 0) reactionLockT--;

    // 重力基础系数（下方常规物理仅在风穹顶未接管时生效）
    let g = CFG.GRAVITY * gravDir;                        // 火+雷：重力随机反转
    if (windT > 0) g *= CFG.WIND_GRAV_MUL;
    if (rockT > 0) g *= 1.3;
    // 火+风：每 0.7 秒在「变轻 -50% / 变重 +50%」之间高频横跳
    if (reaction && reaction.id === 'turb') {
      const heavy = turbHeavyNow();
      g *= heavy ? CFG.REACT_TURB_HEAVY : CFG.REACT_TURB_LIGHT;
    }
    if (reaction && reaction.id === 'press') g *= CFG.REACT_PRESS_GRAV;   // 草+岩：重力 +100%

    // 0.7) 风穹顶「坐标引导」检测：小鸟判定框进入穹顶带或柱壁侧边感应区，
    //      锁定该管道缝隙正中心的 Y 坐标为目标（X 永不干预）。该几何同时就是
    //      绝对免死判定（下方碰撞块复用）。
    let windGuide = null;
    if (windT > 0 && !grassDash) {
      for (const p of pipes) {
        const tgt = windGuideTarget(p);
        if (tgt) { windGuide = tgt; break; }
      }
    }

    // 1) 物理：重力 + 位移（风 = 重力 -20%，岩 = 重力 +30%）
    //    优先级：草冲刺（无视重力直线飞向节点）> 风穹顶 Y 引导 > 常规物理。
    if (reaction && reaction.id === 'cruise') {
      // 雷+草：全程由反应剧本直接驱动 Y / vy（滞留、直线突进、悬停），完全跳过重力/点击物理
    } else if (reaction && reaction.id === 'magma' && reaction.ball) {
      // 火+岩：岩浆球贴地滚动（极低弹跳、空中不可连跳、滚动自转）
      const gyM = CFG.H - CFG.GROUND_H;
      bird.vy += g;
      bird.vy = Math.max(-CFG.MAX_FALL, Math.min(CFG.MAX_FALL, bird.vy));
      bird.y += bird.vy;
      const floorM = gyM - CFG.REACT_MAGMA_R;
      if (bird.y >= floorM) {
        bird.y = floorM;
        bird.vy = 0;
        reaction.grounded = true;
        reaction.jumped = false;                            // 落地后重置：下一次点地才允许那一次极低弹跳
      } else {
        reaction.grounded = false;
      }
      if (bird.y < CFG.REACT_MAGMA_R + 4) {                 // 顶部软钳制
        bird.y = CFG.REACT_MAGMA_R + 4;
        if (bird.vy < 0) bird.vy = 0;
      }
      bird.rot += 0.16;                                     // 滚动自转
    } else if (grassDash) {
      const n = grassDash;
      grassDashT++;                                        // 冲刺计时（超时保护用）
      if (n.taken || n.x < -20) {
        grassDash = null;                                  // 目标丢失：取消本次冲刺（草模式保留，可改追其它节点）
        grassDashT = 0;
        bird.vy = -2;                                      // 温和恢复重力跳跃
      } else if (grassDashT > 120) {
        grassDash = null;                                  // 冲刺超时保护：2 秒未碰到节点 → 强制解除冲刺
        bird.vy = -2;                                      // 温和恢复，绝不锁死操作（草模式保留，可再点击）
      } else {
        const dx = n.x - bird.x, dy = n.y - bird.y;
        const dist = Math.hypot(dx, dy);
        if (dist <= Math.max(CFG.GRASS_ABSORB, CFG.GRASS_DASH_SPD)) {
          n.taken = true;                                  // 吸收判定：距离 < 20px
          grassDash = null;
          grassDashT = 0;
          grassEaten++;
          absorbBlockT = Math.max(absorbBlockT, CFG.GRASS_ABSORB_BLOCK);  // 飞到节点后 1 秒落地缓冲内禁吃任何新元素/盲盒（防连招误吃死锁）
          if (grassEaten >= 3) endGrass(true);             // 5 秒内吃完 3 个：瞬间解锁 + 2 秒无敌 + 1 秒吸收阻断
          else bird.vy = -2;                               // 清除冲刺惯性，温和上飘
        } else {
          // 冲刺表现（X 锁定）：小鸟 X 恒定锁定在安全区，绝不向右平移；
          // 前进分量转为「世界额外左移」——管道/金币/元素球/节点加速涌来体现冲刺感
          bird.y += dy / dist * CFG.GRASS_DASH_SPD;        // 垂直分量由小鸟执行（无视重力）
          bird.vy = 0;
          bird.invincible = Math.max(bird.invincible, 2);  // 冲刺途中免撞管道
          bird.y = Math.max(CFG.BIRD_R,
                            Math.min(CFG.H - CFG.GROUND_H - CFG.BIRD_R, bird.y));
          const wx = Math.max(0, dx / dist * CFG.GRASS_DASH_SPD);   // 世界额外左移量（恒向前）
          grassShift += wx;                                // 关键：额外位移同步喂给 spawnTimer（管道时间轴恒定）
          for (const p of pipes) p.x -= wx;
          for (const c of coins) c.x -= wx;
          for (const o of orbs) o.x -= wx;
          for (const gn of grassNodes) gn.x -= wx;
          for (const s of pipeDebris) s.x -= wx;
          for (const d of windTrail) d.x -= wx;
          for (const t of thunderTrail) t.x -= wx;
          for (const f of fireTrail) f.x -= wx;
        }
      }
    } else if (reactRide) {
      // 水草/冰草自动飞行：Y 已由反应剧本接管（0.6 节），此处完全跳过重力/点击物理
    } else if (windGuide) {
      bird.vy = 0;                                             // 引导期间限制垂直速度（关闭重力影响）
      const gy = (windGuide.y - bird.y) * CFG.WIND_GUIDE_K;    // Y：线性插值锁向缝隙正中心
      bird.y += Math.max(-CFG.WIND_GUIDE_MAX, Math.min(CFG.WIND_GUIDE_MAX, gy));
      // 进入感应区瞬间激发半圆波纹（冷却防刷屏）
      if (windRipCd <= 0) {
        const dd = Math.hypot(windGuide.x - bird.x, windGuide.y - bird.y) || 1;
        windRipples.push({ x: bird.x, y: bird.y,
                           nx: (windGuide.x - bird.x) / dd, ny: (windGuide.y - bird.y) / dd,
                           t: 22, max: 22 });
        windRipCd = 12;
      }
    } else {
      if (reaction && reaction.id === 'lag' && lagHoldOn && lagHoldT >= CFG.REACT_LAG_HOLD) {
        bird.vy = -3.2;                                    // 风+冰：按住超过 0.1 秒 → 匀速上升
      } else {
        bird.vy += g;
        bird.vy = Math.max(-CFG.MAX_FALL, Math.min(CFG.MAX_FALL, bird.vy));
      }
      bird.y += bird.vy;
    }

    // 根据垂直速度调整俯仰角：上升时抬头，下落时低头（引导期间 vy=0 → 姿态平稳回正）
    // 滑道滑行期间姿态已由轨道切线接管，此处不得用 vy=0 把它覆盖回水平
    if (!reactRide && !(reaction && reaction.id === 'cruise') &&
        !(reaction && reaction.id === 'magma' && reaction.ball)) {
      const targetRot = Math.max(-0.45, Math.min(1.4, bird.vy / 12));
      bird.rot += (targetRot - bird.rot) * 0.15;
    }
    bird.wing += 0.28;

    // 1.5) 风元素气流拖尾：小鸟背后每 2 帧生成一枚白色气团（随世界左移、渐隐）
    if (windT > 0 && frameCount % 2 === 0) {
      windTrail.push({
        x: bird.x - 14 - Math.random() * 8,
        y: bird.y + (Math.random() - 0.5) * 10,
        r: 2.5 + Math.random() * 2,
        t: 26, max: 26
      });
    }

    // 2) 无敌计时 + 受击红身计时
    if (bird.invincible > 0) bird.invincible--;
    if (hurtRedT > 0) hurtRedT--;
    if (absorbBlockT > 0) absorbBlockT--;   // 元素吸收屏蔽计时（草节点后 2s / 雷突进后 1.5s）

    // 3) 连击计时：5 秒（300 帧）内没吃到金币，倍率重置为 1.0
    if (comboTimer > 0) {
      comboTimer--;
      if (comboTimer === 0) { combo = 0; multiplier = 1.0; AudioManager.resetCoinPitch(); }
    }

    // 4) 管道移动与碰撞
    for (const p of pipes) p.x -= CFG.PIPE_SPEED * speedMul;

    // 4.0) 【水+冰 / 风+岩】延迟入场判定 + 逐组特效推进（只作用于原本就在左移的管道，
    //      绝不额外生成新柱子；尚未进视野的组等进场那一帧才开始播）
    stepFxQueue();
    stepPipeFx();

    // 4.05) 彩虹柱子穿越判定：柱体覆盖小鸟的瞬间即授予元素（反应中 / 禁吸收期会自动顺延重试）
    for (const p of pipes) {
      if (!p.rainbow || p.rainbowGiven) continue;
      if (p.x <= bird.x + CFG.BIRD_R && p.x + CFG.PIPE_W >= bird.x - CFG.BIRD_R) rainbowGrant(p);
    }

    // 4.1) 穿管计分：安全越过一组柱子 → +10 × 当前倍率（每组只结算一次）
    // 吸金类反应（火+水 / 雷+岩 / 风+草）期间由平滑累加器独占计分，穿管不再加分，
    // 确保整段反应总得分严格等于 450 / 600 / 800（「得分上限」不被穿管分冲高）
    for (const p of pipes) {
      if (!p.passed && p.x + CFG.PIPE_W < bird.x) {
        p.passed = true;
        if (!smoothScoreReaction()) score += Math.round(CFG.PIPE_SCORE * multiplier);
        // 彩虹柱子：穿过必定获得「与当前元素不同」的元素附着 → 必定触发反应
        if (p.rainbow && !p.rainbowGiven) rainbowGrant(p);
      }
    }

    // 4.2) 风元素穹顶：物理推力已彻底移除（旧版法线推力/速度吸收会把小鸟随管道向左拖出屏幕）。
    //      现方案 = 坐标引导（物理段 0.7）+ 绝对免死拦截（下方碰撞块），二者共用同一感应几何。

    const hitR = CFG.BIRD_R * CFG.HIT_SCALE;
    // 绝对无敌：无视柱子、天花板与地面；相对无敌：无视柱子但保留天花板与地面判定
    const absInv = !!reaction && !!ABS_INV[reaction.id];
    const relInv = !!reaction && !!REL_INV[reaction.id];
    if (bird.invincible === 0 && !absInv && !relInv) {
      for (const p of pipes) {
        // 火+草：正在燃烧的柱子已被点燃碳化 → 绝对无碰撞体积（否则 1.5 秒烧完前就撞上扣血）
        // 雷+草：直线突进击碎的柱子 / 水+冰：冻碎消失的柱子 → 同样无碰撞体积
        if (p.charOn || p.cruiseGone || p.icGone) continue;
        // 水平方向重叠？
        if (bird.x + hitR > p.x && bird.x - hitR < p.x + CFG.PIPE_W) {
          // 竖直方向撞到上管道或下管道？（风+岩风化：侵蚀部分无碰撞，缝隙实际扩大 60%）
          const eInset = p.erodeCut || 0;
          // 冰+岩极寒震荡：管道整体上下震动 → 判定必须与画面位移严格同步
          const qOff = p.quakeY || 0;
          // 火+岩：柱子被切断后，下管顶边抬到裂痕处（上半截已倒塌，不再阻挡）
          let gapBottom = p.topH + CFG.PIPE_GAP + eInset;
          if (p.magmaCut) gapBottom = Math.max(gapBottom, p.magmaCutY || gapBottom);
          gapBottom += qOff;
          const topEdge = p.topH - eInset + qOff;
          if (bird.y - hitR < topEdge || bird.y + hitR > gapBottom) {
            // 火+冰永久融化洞：洞的判定比小鸟本体大 1.5 倍，洞内绝对安全
            if (meltScarSafe(p)) continue;
            // 风元素：判定框与穹顶带/柱壁侧边感应区重叠 → 绝对免死（最高优先级），
            // 位置已由坐标引导接管，此处只负责拦截一切扣血判定
            if (windT > 0 && windGuideTarget(p)) continue;
            if (applyDamage()) return;   // 扣血 / 可能触发游戏结束
            break;                       // 本帧只结算一次伤害
          }
        }
      }
    }

    // 移除移出屏幕的管道
    pipes = pipes.filter(p => p.x + CFG.PIPE_W > -20);

    // 5) 金币移动与拾取（magnet = 磁吸金币：自动加速飞向小鸟，叠满连击倍率）
    const worldV = CFG.PIPE_SPEED * speedMul;   // 本帧世界左移速度（管道与普通金币共用）
    for (const c of coins) {
      c.phase += 0.12;
      // 【Bug 修复】金币一律固定在世界坐标系：每帧都必须随世界左移（含悬浮/轨道/延迟金币），
      // 绝不允许「钉在屏幕上」或「跟着小鸟同速移动」—— 否则玩家永远追不上、永远吃不到。
      c.x -= worldV;
      if (c.restY != null) {
        // 悬浮金币：从上方落下并静止悬浮，绝不自动吸附（必须玩家自己操控小鸟去撞）
        c.magnet = false;
        if (c.y < c.restY) c.y = Math.min(c.restY, c.y + c.vy);
        continue;
      }
      if (c.hold > 0) {
        // 延迟磁铁：悬浮期间不吸附，但依然随世界左移；倒计时归零瞬间转为磁吸
        c.hold--;
        if (c.hold === 0) c.magnet = true;
        continue;
      }
      if (c.trackCoin) c.y = rideYAt(c.x) - 22;            // 轨道金币：每帧严格回贴到轨迹上方（不磁吸、不离开滑道）
      if (c.magnet) {
        // 【吸金追踪修复·铁律】磁吸金币以「屏幕坐标」实时直追小鸟当前位置：
        // 先抵消本帧世界左移，再叠加吸附位移 —— 否则金币会被世界拖着往左跑，
        // 在小鸟尾部越堆越多永远吃不到（雷+岩 / 风+草 的堆积 Bug 根因）。
        c.x += worldV;
        const mdx = bird.x - c.x, mdy = bird.y - c.y;
        const md = Math.hypot(mdx, mdy) || 1;
        const rid2 = reaction ? reaction.id : '';
        let sp, cap;
        if (rid2 === 'void') {
          // 雷+岩：判定范围 4 倍 + 远处快、近处稳，全程可见飞向小鸟的过程
          sp = 7 + md * 0.075; cap = 24;
          // 【收尾优化】最后 0.5 秒：极限提速，让残余金币在倒计时归零前被瞬间清空
          if (reaction.t <= 30) { sp = 34 + md * 0.4; cap = 96; }
        } else if (rid2 === 'gold') {
          // 风+草：平滑靠拢但不拉丝；近身仍保持基础速度，绝不因距离缩短而停滞
          sp = 3.6 + md * 0.05; cap = 16;
        } else {
          sp = 8 + md * 0.08; cap = 24;
        }
        // 【速度绝对压制】吸附速度必须严格大于世界左移速度（worldV），
        // 保证任何速度加成下（火+水 ×2 等）金币都能从尾部真正追上来
        sp = Math.min(cap, Math.max(sp, worldV + 3.4));
        c.x += mdx / md * sp;
        c.y += mdy / md * sp;
        // 贴身收尾：进入 12px 内直接贴到鸟身，避免在尾部抖动打转
        if (md < 12) { c.x = bird.x; c.y = bird.y; }
      }
    }
    coins = coins.filter(c => c.x > -40);

    // 草冲刺期间：金币免疫 —— 小鸟直接穿模飞过，不触发任何拾取判定（防打断冲刺）
    // 滑道演出期间：只吃「滑道正上方」的轨道金币，轨迹外的金币绝不入账（铁律二）
    const rideOnlyTrack = !!reaction && (reaction.id === 'vine' || reaction.id === 'slide')
      && reaction.phase !== 'exit' && reaction.phase !== 'pre';   // 先冰后草的「纯长藤蔓」阶段不吃轨道币
    if (!grassDash) {
      for (const c of coins) {
        if (rideOnlyTrack && !c.trackCoin) continue;
        const dx = c.x - bird.x;
        const dy = c.y - bird.y;
        // 【吸收判定放宽】磁吸金币只要触到小鸟「视觉边缘」立刻吸收（半径约 43px），
        // 普通金币维持原判定 —— 彻底杜绝金币堆在尾部吃不到
        const grab = c.magnet ? (c.r + CFG.BIRD_R * 2.4) : (c.r + CFG.BIRD_R);
        if (dx * dx + dy * dy < grab * grab) {
          c.x = -9999;                  // 标记为已吃掉（下面统一剔除）
          collectCoin(c.free);
        }
      }
    }
    coins = coins.filter(c => c.x > -40);

    // 5.5) 元素球移动与拾取（屏蔽期免疫：草冲刺期间 / 草落地缓冲 1s / 雷突进期间 /
    //      反应全程 / 反应后 1s 冷却 —— 元素球/盲盒直接穿模飞过，绝不触发 collectElement/openMystery）
    for (const o of orbs) o.x -= CFG.PIPE_SPEED * speedMul;
    if (!grassDash && absorbBlockT === 0 && !reaction && reactionLockT === 0) {
      for (const o of orbs) {
        const dx = o.x - bird.x;
        const dy = o.y - bird.y;
        if (dx * dx + dy * dy < (CFG.ORB_R + CFG.BIRD_R) * (CFG.ORB_R + CFG.BIRD_R)) {
          o.x = -9999;
          if (o.mystery) openMystery(); else collectElement(o.key, o.color);
        }
      }
    }
    orbs = orbs.filter(o => o.x > -40);

    // 5.9) 彩虹柱子计时：45 秒一轮；到点若正处于反应中 → 强制延后到反应完全结束之后
    stepRainbow();

    // 6) 定时生成新的管道组（任何元素期间都不停表，含雷突进与雷回正）
    //    时间轴恒定铁律：spawnTimer 按「世界实际左移的总距离」累积 —— 常规滚动 + 草冲刺 /
    //    雷回正倒流的世界额外位移（grassShift）都计入，任何元素期间管道生成频率绝不突变、绝无大空隙。
    spawnTimer += CFG.PIPE_SPEED * speedMul + grassShift;
    grassShift = 0;
    if (voidPipePauseT > 0) {
      voidPipePauseT--;                                    // 雷+岩异空间：前 6 秒管道生成完全停滞（清屏后保持空场）
      spawnTimer = 0;                                      // 停滞期间不累积距离，避免第 6 秒恢复瞬间一次喷出几十根管道
      if (voidPipePauseT === 0) spawnTimer = CFG.PIPE_SPACING;   // 第 6 秒一到：管道时间轴立刻满格，新管道随即飞入（第 8 秒异空间结束时画面已有管道）
    } else {
      while (spawnTimer >= CFG.PIPE_SPACING) {
        spawnTimer -= CFG.PIPE_SPACING;
        spawnPipe();
      }
    }

    // 7) 上下边界判定（绝对无敌类反应：无视天花板与地面，贴边不受伤；相对无敌类仍会受伤）
    //    飞出屏幕顶部（天花板虚线）：扣血
    if (bird.y - CFG.BIRD_R < ceilingBoundY()) {
      if (absInv || bird.invincible > 0) {
        bird.y = ceilingBoundY() + CFG.BIRD_R;   // 贴住顶部，不受伤
        if (bird.vy < 0) bird.vy = 0;
      } else {
        applyDamage();
        if (scene !== 'playing') return;
      }
    }
    //    掉到屏幕底部：扣血
    const groundY = CFG.H - CFG.GROUND_H;
    if (bird.y + CFG.BIRD_R > groundY) {
      if (absInv || bird.invincible > 0) {
        bird.y = groundY - CFG.BIRD_R;           // 贴住地面，不受伤
      } else {
        applyDamage();
        if (scene !== 'playing') return;
      }
    }

  }

  /* ============================================================
   * 6. 伤害 / 死亡 / 吃金币
   * ============================================================ */
  /**
   * 结算一次伤害。返回 true 表示本局已结束。
   * 规则：扣 1 点血 -> 连击清零 -> 获得 1.5 秒无敌 -> 本体变红 1 秒。
   * 【重构】受击后绝不强制回中：小鸟停留在当前受击位置，只保留无敌帧保护。
   */
  /* 火+风：当前是否处于「重力变重」相位（每 0.7 秒横跳一次） */
  function turbHeavyNow() {
    if (!reaction || reaction.id !== 'turb') return false;
    return Math.floor((CFG.REACT_TURB_TIME - reaction.t) / CFG.REACT_TURB_SWING) % 2 === 1;
  }
  function applyDamage() {
    if (scene !== 'playing') return false;
    if (bird.invincible > 0) return false;   // 无敌期间穿透所有障碍，不重复受伤

    // 岩石护盾：抵挡一次伤害 —— 护盾碎裂并触发 1.5 秒无敌，不扣血（同样不强制回中）
    if (shieldOn) {
      shieldOn = false;
      shieldT = 0;
      hitFlash = 12;
      hurtRedT = 60;
      shake = 10;
      bird.invincible = CFG.INVINCIBLE_FRAMES;   // 1.5 秒
      return false;
    }

    // 蓝心：护盾碎裂之后才轮到它 —— 抵挡一次伤害（不扣生命，不强制回中）
    if (blueHeartT > 0) {
      blueHeartT = 0;
      hitFlash = 12;
      hurtRedT = 60;
      shake = 10;
      bird.invincible = CFG.INVINCIBLE_FRAMES;
      return false;
    }

    // 反应期间伤害次数上限：火+风 / 水+雷 / 冰+雷 整段反应最多扣 2 次生命
    if (reaction && (reaction.id === 'turb' || reaction.id === 'shock' || reaction.id === 'netlag')) {
      if ((reaction.dmg || 0) >= CFG.REACT_DMG_LIMIT) {
        hitFlash = 12;
        hurtRedT = 60;
        shake = 10;
        bird.invincible = CFG.INVINCIBLE_FRAMES;
        return false;
      }
      reaction.dmg = (reaction.dmg || 0) + 1;
    }

    hp--;
    combo = 0;                                // 受伤时连击倍率瞬间清零
    multiplier = 1.0;
    comboTimer = 0;
    AudioManager.resetCoinPitch();            // 受伤断连：金币音高立即回到 600Hz 基础音
    // 【音效】卡通「噗/啪」受伤音：只在真正扣血时播放；0.15 秒冷却防同帧叠音，
    // 无敌帧 / 护盾 / 蓝心的提前 return 已天然保证「无敌期间不重复播放」。
    playSoundThrottled('hurt', 0.15);

    hitFlash = 12;                            // 红屏反馈
    hurtRedT = 60;                            // 本体变红 1 秒
    shake = 10;                               // 屏幕抖动反馈

    if (hp <= 0) {
      gameOver();
      return true;
    }

    // 受击保护：仅保留 1.5 秒无敌帧；绝对不再强制瞬移回屏幕中央
    bird.invincible = CFG.INVINCIBLE_FRAMES;
    return false;
  }

  /**
   * 吃到一枚金币：固定 +5 分（不吃倍率），倍率 +0.2（上限 x2.0）。
   * 5 秒内未再吃金币 → 倍率重置为 1.0（见 update 的 comboTimer 结算）。
   */
  function collectCoin(free, silent) {
    combo++;
    comboTimer = CFG.COMBO_FRAMES;                       // 重新计时 5 秒
    multiplier = Math.min(CFG.MAX_MULTI,
      Math.round((multiplier + CFG.COIN_MULTI_STEP) * 10) / 10);   // +0.2，避免浮点误差
    // 吸金类反应（火+水 / 雷+岩 / 风+草）的分数由「平滑累加器」统一发放：
    // 金币本身不再额外 +5；即便反应结束后才被吸入的残余金币（free）也绝不再加分，
    // 保证整段反应总得分严格等于 450 / 600 / 800，绝不会在结尾出现分数暴增
    if (!free && !smoothScoreReaction()) score += CFG.COIN_SCORE;  // 固定 +5，不受倍率影响
    // silent：特殊机制金币（岩浆球撞柱 / 雷+草雷印）只发奖励、不播常规「叮」声，把听感让给撞击/突刺音
    if (!silent) playSound('coin');                      // 金币音：倍率阶梯 + 50ms 冷却由 AudioManager 处理
  }

  /** 当前是否处于「分数由平滑累加器接管」的反应：
      吸金流（火+水 / 雷+岩 / 风+草）+ 滑道流（水+草 / 冰+草 的生成段与滑行段，固定 300 分） */
  function smoothScoreReaction() {
    if (!reaction) return false;
    const id = reaction.id;
    if (id === 'steam' || id === 'void' || id === 'gold') return true;
    if (id === 'vine' || id === 'slide') {
      return reaction.phase === 'grow' || reaction.phase === 'ride';
    }
    return false;
  }

  /**
   * 反应内平滑分数累加器：把 scoreTarget 均摊到整段反应的每一帧，逐帧发放。
   * 绝不依赖金币数量结算，也绝不在反应结束瞬间一次性补分（最后一帧余额 < 2 分，肉眼不可见）。
   */
  function addReactionScore(r) {
    if (!r || !r.scoreTarget || !r.scoreTotal) return;
    r.scoreAcc += r.scoreTarget / r.scoreTotal;
    const whole = Math.floor(r.scoreAcc);
    if (whole > 0) {
      r.scoreAcc -= whole;
      r.scoreGiven += whole;
      score += whole;
    }
    // 收尾：仅补齐均摊产生的零头（≤2 分），绝不出现「最后突然 +600」
    if (r.t <= 0) {
      const rest = Math.max(0, r.scoreTarget - r.scoreGiven);
      if (rest > 0) { score += rest; r.scoreGiven += rest; }
    }
  }

  /**
   * 元素反应表（无序对）：身上附着 A 时又吃到不同元素 B → 立刻触发反应。
   * steam = 火+水（8s 隐身无敌吸金流）；void = 雷+岩（8s 异空间清屏吸金流）；
   * vine = 水+草（藤蔓轨迹跨 8 柱）；slide = 冰+草（冰霜滑梯跨 8 柱）；gold = 风+草（瞬间暴富）。
   */
  const REACTIONS = {
    '火+水': 'steam', '水+火': 'steam',
    '雷+岩': 'void',  '岩+雷': 'void',
    '水+草': 'vine',  '草+水': 'vine',
    '冰+草': 'slide', '草+冰': 'slide',
    '风+草': 'gold',  '草+风': 'gold',
    '火+冰': 'melt',  '冰+火': 'melt',
    '火+草': 'char',  '草+火': 'char',
    '水+冰': 'icecrack', '冰+水': 'icecrack',
    '风+岩': 'erode', '岩+风': 'erode',
    '火+雷': 'overload', '雷+火': 'overload',
    '风+冰': 'lag',   '冰+风': 'lag',
    '水+岩': 'mud',   '岩+水': 'mud',
    '火+岩': 'magma', '岩+火': 'magma',
    '雷+草': 'cruise', '草+雷': 'cruise',
    '火+风': 'turb',  '风+火': 'turb',
    '风+水': 'fog',   '水+风': 'fog',
    '风+雷': 'emfield', '雷+风': 'emfield',
    '水+雷': 'shock', '雷+水': 'shock',
    '冰+雷': 'netlag', '雷+冰': 'netlag',
    '冰+岩': 'quake', '岩+冰': 'quake',
    '草+岩': 'press', '岩+草': 'press'
  };

  /**
   * 吃到元素球：记录类型并触发对应效果（元素附着统一 12 秒，UI 倒计时）。
   * 火 = 5 秒无敌（前 3 秒全局加速 50%，后 2 秒平滑衰减回正常）；风 = 7 秒减重力 -20% + 管口气流罩；
   * 岩 = 4 秒重力 +30%（负面）+ 1 层岩石护盾（10 秒）；水 = 立刻回 1 血；
   * 冰 = 7 秒全局减速 30%（霜冻滤镜，管道变浅蓝）；雷 = 瞬闪跨越最近 2 根管道（一次性）。
   * —— 元素反应优先：附着期内吃到不同元素且组合在反应表中 → 触发反应（清空双元素、进入反应锁定） ——
   */
  function collectElement(key, color) {
    const cur = element.type;
    if (cur && cur !== key && element.t > 0 && !reaction && reactionLockT === 0) {
      const rid = REACTIONS[cur + '+' + key];
      if (rid) { triggerReaction(rid, cur); return; }
    }
    element.type = key;
    element.color = color;
    element.t = CFG.ELEMENT_DURATION;                    // 全元素附着统一 12 秒
    element.dur = element.t;                             // 记录总时长，供 UI 倒计时条按比例绘制
    applyElementEffect(key);
  }

  /** 生成一枚金币（magnet=true 时磁吸；hold>0 时先悬浮 hold 帧再磁吸；restY 指定从天而降的落点） */
  function spawnCoin(x, y, magnet, hold, restY, free) {
    // 满屏磁吸金币并发封顶 220：资源爆发期允许极高密度，但不无限膨胀（避免卡顿）
    if (magnet) {
      let n = 0;
      for (const c of coins) if (c.magnet) n++;
      if (n >= 220) return;
    }
    coins.push({
      x, y, r: CFG.COIN_R, phase: Math.random() * Math.PI * 2,
      magnet: !!magnet,
      hold: hold || 0,
      restY: restY === undefined ? null : restY,
      vy: 2.6 + Math.random() * 2.4,
      free: !!free,          // 反应专用金币：吸入时不加分（总分由平滑累加器严格封顶）
    });
  }

  /**
   * 元素反应触发入口：立刻清空两种附着元素（UI 倒计时归零 + 物理效果计时清零），
   * 赋予 1 秒后摇绝对无敌帧，执行反应效果；反应全程锁定（reaction 非空期间禁止吸收/再触发）。
   */
  function triggerReaction(rid, first) {
    // ① 清空附着 UI 与全部单元素物理效果计时器
    element.type = null;
    element.t = 0;
    element.dur = 1;
    fireSpeedT = 0; fireDecelT = 0;
    windT = 0; iceT = 0; rockT = 0; waterGlowT = 0;
    shieldOn = false; shieldT = 0;
    if (grassT > 0 || grassDash || grassNodes.length > 0) {
      grassT = 0; grassNodes = []; grassDash = null; grassDashT = 0; grassFlyT = -1;
    }
    // 【铁律一】柱子环境特效走独立「持久通道」：envFrost* / envVine* 绝不清空，
    // 反应只会把它们的剩余时长与不透明度往上叠（叠加而非替换），因此冰霜 + 藤蔓 + 新滑道可三层共存
    if (envFrostT > 0) envFrostT = Math.max(envFrostT, envHold(90));
    if (envVineT > 0) envVineT = Math.max(envVineT, envHold(90));
    if (envRockT > 0) envRockT = Math.max(envRockT, envHold(90));
    // 记录「上一次反应」分类：彩虹柱子防连败补偿（四 / 五类 → 负面概率压到 10%）
    lastReactionClass = REACTION_CLASS[rid] || 0;
    // ② 后摇无敌：1 秒绝对无敌帧（各反应的专属无敌在此基础上取大）
    bird.invincible = Math.max(bird.invincible, CFG.REACT_INV);

    const groundY = CFG.H - CFG.GROUND_H;
    if (rid === 'steam') {                                 // —— 火+水：8 秒隐身无敌吸金流 ——
      reaction = { id: 'steam', t: CFG.REACT_STEAM_TIME, total: CFG.REACT_STEAM_TIME, crossed: 0,
                   scoreTarget: CFG.REACT_STEAM_SCORE, scoreTotal: CFG.REACT_STEAM_TIME,
                   scoreGiven: 0, scoreAcc: 0 };
      bird.invincible = Math.max(bird.invincible, CFG.REACT_STEAM_TIME);
      // 场上已有的金币也先悬停 1 秒，与后续新生成金币统一节奏（绝不立刻起飞）
      // 并标记 free：全程吸入不加分，分数只由平滑累加器发放（严格封顶 450）
      for (const c of coins) { c.magnet = false; c.hold = Math.max(c.hold || 0, CFG.REACT_GOLD_HOLD); c.free = true; }
      waterReactGain();                                    // 水元素参与反应 → 回血 / 生成蓝心
      playSound(rid);
    } else if (rid === 'void') {                           // —— 雷+岩：异空间清屏流 ——
      reaction = { id: 'void', t: CFG.REACT_VOID_TIME, total: CFG.REACT_VOID_TIME, crossed: 0,
                   coinDelay: 30,
                   scoreTarget: CFG.REACT_VOID_SCORE, scoreTotal: CFG.REACT_VOID_TIME,
                   scoreGiven: 0, scoreAcc: 0 };
      bird.invincible = Math.max(bird.invincible, CFG.REACT_VOID_TIME);
      // 场上金币全部转为吸入金币（free：不加分，分数由累加器严格封顶 600）
      for (const c of coins) { c.free = true; }
      voidPipePauseT = CFG.REACT_VOID_PIPE_PAUSE;           // 前 6 秒完全停止生新管道（第 6 秒恢复，第 8 秒管道刚好飞入）
      purpleFlash = 14;                                    // 全屏紫光闪烁
      // 当前屏幕视野内所有管道瞬间碎裂消失
      for (const p of pipes) {
        if (p.x < CFG.W + 40 && p.x + CFG.PIPE_W > -20) {
          const gb = p.topH + CFG.PIPE_GAP;
          for (let k = 0; k < 4; k++) {
            pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W, Math.random() * p.topH));
            pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W, gb + Math.random() * Math.max(10, groundY - gb)));
          }
          p.passed = true;                                 // 已碎管道不再计分
        }
      }
      pipes = pipes.filter(p => !(p.x < CFG.W + 40 && p.x + CFG.PIPE_W > -20));
      // 真空阻断：异空间内绝对禁止生成/留存任何元素球与盲盒（前 6 秒纯净收益只有金币）；
      // 第 6 秒管道恢复生成时，元素掉落随管道同步恢复（见 update 管道计时器分支）
      orbs = [];
      // 【Bug 修复】金币绝不随小鸟移动：前 0.5 秒不生成（coinDelay=30），归零后由 update 调用
      // voidFillCoins() 一次性铺满世界坐标；此后每 0.4 秒 voidRefillCoins() 在右缘补新币。
      playSound(rid);
    } else if (rid === 'vine' || rid === 'slide') {        // —— 水+草藤蔓桥 / 冰+草冰道：沿底部柱顶跨 8 柱 ——
      // 【时间轴拆分】生成阶段 0.6 秒（36 帧）→ 滑行阶段单独 5.5 秒（330 帧）→ 退场 1 秒。
      // “先冰后草”用 pre 前奏先长 0.3 秒柱上藤蔓，再花 0.3 秒铺满滑道；两者合计仍是 0.6 秒。
      // 关键：触发瞬间就把 8 根柱子的轨道锚点全部登记好，保证藤蔓一伸出去就有柱子可攀、
      // 小鸟立刻被滑道接住，绝不出现“轨道还没搭好 → 突然减速/停滞”的错觉。
      const preMode = rid === 'slide' && first === '冰';
      // 滑行得分固定 300：整段反应按帧平滑累加（金币本身不再 +5）
      const scoreSeed = { scoreTarget: 300, scoreTotal: CFG.REACT_RIDE_TOTAL, scoreGiven: 0, scoreAcc: 0 };
      reaction = preMode
        ? { id: 'slide', t: CFG.REACT_RIDE_TOTAL, total: CFG.REACT_RIDE_TOTAL,
            phase: 'pre', pre: CFG.REACT_RIDE_PRE, preT: CFG.REACT_RIDE_PRE,
            growBase: CFG.REACT_RIDE_PRE,
            growDur: Math.max(1, CFG.REACT_RIDE_GROW - CFG.REACT_RIDE_PRE),
            crossed: 0, spd: 0, gf: 0, ...scoreSeed }
        : { id: rid, t: CFG.REACT_RIDE_TOTAL, total: CFG.REACT_RIDE_TOTAL, phase: 'grow',
            growBase: 0, growDur: CFG.REACT_RIDE_GROW, crossed: 0, spd: 0, gf: 0, ...scoreSeed };
      ridePath = [];
      rideShift = 0;
      // 【铁律一】藤蔓/冰霜环境通道不清空，只把时长顶到覆盖整段演出（叠加，不替换）
      // pre 前奏期间只长藤蔓，冰霜留到铺桥那一刻再挂（见 update 的 pre → grow 切换）
      if (envVineT > 0 || rid === 'vine' || preMode) {
        envVineT = Math.max(envVineT, envHold(CFG.REACT_RIDE_TOTAL + CFG.REACT_RIDE_EXIT));
        envVineA = Math.max(envVineA, 0.02);
        envVineGrowP = Math.max(envVineGrowP, preMode ? 0.02 : 0.35);
      }
      if (!preMode && (envFrostT > 0 || rid === 'slide')) {
        envFrostT = Math.max(envFrostT, envHold(CFG.REACT_RIDE_TOTAL + CFG.REACT_RIDE_EXIT));
        envFrostA = Math.max(envFrostA, 0.02);
      }
      for (const p of pipes) if (p.x + CFG.PIPE_W < bird.x) p.reactCounted = true;   // 已飞过的柱子不计入「跨越 8 柱」
      // 起始点判定：正处在缝隙中的那组柱子直接算第 1 根；否则从触发位置往右数的第一根开始
      let ordered = pipes.slice().sort((a, b) => a.x - b.x);
      // 兜底：前方一根柱子都没有（极端情况，如开发面板直接触发）→ 立刻在右侧补 3 根等距柱子，
      // 保证藤桥一定有底部柱顶可以延伸，绝不出现「无轨道可骑」的空反应
      if (ordered.findIndex(p => p.x + CFG.PIPE_W > bird.x - 4) < 0) {
        for (let k2 = 0; k2 < 3; k2++) spawnPipe(bird.x + 320 + k2 * CFG.PIPE_SPACING);
        ordered = pipes.slice().sort((a, b) => a.x - b.x);
      }
      let i0 = ordered.findIndex(p => p.x + CFG.PIPE_W > bird.x - 4);
      if (i0 < 0) i0 = ordered.length;
      const ahead = ordered.slice(i0, i0 + CFG.REACT_CROSS_PIPES);
      // 空地回拉：触发点附近没有任何柱子 → 先在脚下登记一个固定锚点；
      // 渲染时首段藤蔓会从「前方第 1 根柱子」向左侧小鸟脚下反向蔓延，把脚接上桥
      const nearPipe = pipes.some(p => bird.x > p.x - 10 && bird.x < p.x + CFG.PIPE_W + 10);
      if (!nearPipe) {
        ridePath.push({ x: bird.x - 4, y: bird.y + 12, lead: true });
        reaction.lead = true;
        reaction.leadX = bird.x - 4;
        reaction.leadY = bird.y + 12;
      }
      // 轨道只从「底部柱子顶端表面」长出：每根柱子登记左右两条边（顶面平坦），上柱绝不参与
      for (const p of ahead) {
        if (ridePath.some(a => a.p === p)) continue;          // 兜底 spawnPipe 已登记的柱子不重复推入
        addRideAnchor(p);
      }
      reaction.spd = computeRideSpeed();                      // 初速（滑行段开始时会按实际距离精算一次）
      if (!preMode) layTrackCoins(rideStartX(), rideEndX());  // 沿途金币：紧贴轨迹上方等距铺满整条滑道
      if (rid === 'vine') waterReactGain();                   // 水+草：水元素参与反应 → 回血 / 生成蓝心
      playSound(rid);
    } else if (rid === 'gold') {                           // —— 风+草：7 秒延迟磁铁暴富流 ——
      reaction = { id: 'gold', t: CFG.REACT_GOLD_TIME, total: CFG.REACT_GOLD_TIME, crossed: 0,
                   scoreTarget: CFG.REACT_GOLD_SCORE, scoreTotal: CFG.REACT_GOLD_TIME,
                   scoreGiven: 0, scoreAcc: 0 };
      // 开局：全屏铺满极高密度金币（间距 62px + 随机抖动），全部先原地悬停 1 秒
      // free：全程吸入不加分，分数只由平滑累加器发放（严格封顶 800）
      for (const c of coins) c.free = true;
      // 金币 Y 轴：覆盖「高空 → 草地」全范围，并严格保证约 1/5 向下蔓延到天花板虚线之下。
      // 磁吸追踪没有距离上限（金币物理以世界坐标直追小鸟），虚线下的金币同样必被吸附。
      const goldDashY = ceilingBoundY();
      const goldYTop = 46;
      const goldYBot = CFG.H - CFG.GROUND_H - 22;
      const goldCols = [];
      for (let gx = 34; gx < CFG.W - 16; gx += 62) goldCols.push(gx);
      const goldRows = [];
      for (let gy = goldYTop; gy < goldYBot; gy += 62) goldRows.push(gy);
      const goldTotal = goldCols.length * goldRows.length;
      const goldBelow = goldDashY > 0 ? Math.round(goldTotal * 0.2) : 0;   // 约 1/5 下探到虚线之下
      let goldSeen = 0, goldPlacedBelow = 0;
      for (let ci = 0; ci < goldCols.length; ci++) {
        for (let ri = 0; ri < goldRows.length; ri++) {
          let gy2 = goldRows[ri];
          const leftBelow = goldBelow - goldPlacedBelow;
          // 按剩余额度把约 20% 的金币均匀下探到虚线下方（剩余格数越少、概率自动升高）
          if (leftBelow > 0 && Math.random() < leftBelow / Math.max(1, goldTotal - goldSeen)) {
            // 虚线下方：从虚线留白 36px 起一直铺到草地上方，全部落在游玩区内、可被磁铁正常吸附
            gy2 = goldDashY + 36 + Math.random() * Math.max(1, goldYBot - goldDashY - 36);
            goldPlacedBelow++;
          } else {
            gy2 += (Math.random() - 0.5) * 34;      // 高处与其余区域：保留原随机抖动（扩大 Y 轴范围）
          }
          goldSeen++;
          spawnCoin(goldCols[ci] + (Math.random() - 0.5) * 34, gy2,
                    false, CFG.REACT_GOLD_HOLD, undefined, true);
        }
      }
      goldFlash = 12;                                      // 全屏金光闪烁
      // 草附着：先风后草也必须保留「藤蔓攀爬柱子」的动画 —— 所有柱子从此刻起重新向上爬满
      envVineT = Math.max(envVineT, envHold(CFG.REACT_GOLD_TIME));
      envVineA = Math.max(envVineA, 0.02);
      for (const p of pipes) p.vineClimbT = frameCount;
      playSound(rid);
    } else if (rid === 'melt') {                           // —— 火+冰：10 秒穿透融化（30% 加速）——
      reaction = { id: 'melt', t: CFG.REACT_MELT_TIME, crossed: 0 };
      // 【铁律八】冰元素参与的瞬间，柱子必须立刻挂上结霜环境表现（持久通道只抬升不清空）
      envFrostT = Math.max(envFrostT, envHold(CFG.REACT_MELT_TIME));
      envFrostA = Math.max(envFrostA, 0.02);
      // 轨迹融化通道：每根柱子独立记录小鸟穿透时的真实运动轨迹，永久残留到飞出屏幕
      for (const p of pipes) { p.meltP = 0; p.meltY = 0; p.meltTrack = []; p.meltSfxOn = false; }
      // 【音效】火+冰 A：触发瞬间只播放独立的瞬间音，绝不与穿柱「滋滋」共用节点
      playSound('meltFlash');
    } else if (rid === 'char') {                           // —— 火+草：9 秒烧焦碳化（50% 加速）——
      // 【动态靠近判定】不再预锁定任何柱子：9 秒内每帧都重新扫描 pipes，
      // 谁落进「小鸟左侧空地」感应带，谁才被点燃（见 update 的 char 分支）。
      reaction = { id: 'char', t: CFG.REACT_CHAR_TIME, crossed: 0 };
      // 【铁律八】草附着：9 秒内柱子上必须始终挂着藤蔓环境表现
      envVineT = Math.max(envVineT, envHold(CFG.REACT_CHAR_TIME));
      envVineA = Math.max(envVineA, 0.02);
      envVineGrowP = Math.max(envVineGrowP, 1);
      // 每次触发前彻底重置所有柱子的烧焦状态：
      // 否则上一轮残留的 charT 会让柱子在触发瞬间直接整根焦黑（时间轴必须从 0 秒重新开始）
      for (const p of pipes) { p.charOn = false; p.charT = 0; }
      // 【特殊位置·极速销毁 0.5 秒】触发瞬间先判定：缝隙中 / 空地右半区贴近右柱
      charIgniteSpecial();
      orbs.length = 0;                                     // 触发瞬间清空全屏元素球（反应全程暂停生成，见 orbsMuted）
      playSound(rid);
    } else if (rid === 'icecrack') {                       // —— 水+冰：极寒真实碎裂 ——
      // 只锁定「原本就已经存在」的前方 6 组柱子：视野内的立刻冰裂，
      // 尚未进视野的等它们从右缘进场的瞬间再爆（绝不额外生成一根新柱子）
      lockSixAhead('ice');
      // UI 倒计时 = 从小鸟触发反应起，到实际飞过第 6 根柱子的动态总时间（绝非动画时长）
      const durIce = framesToSixth();
      reaction = { id: 'icecrack', t: durIce,
                   total: durIce, crossed: 0 };
      iceWaterTrailT = durIce;                             // 拖尾：飞过第 6 组即消失
      // 【铁律八】冰附着：结霜环境表现必须全程挂着
      envFrostT = Math.max(envFrostT, envHold(durIce));
      envFrostA = Math.max(envFrostA, 0.3);
      iceTrail = [];
      orbs.length = 0;                                     // 触发瞬间清空全屏元素球（反应全程暂停生成，见 orbsMuted）
      waterReactGain();
      playSound(rid);
    } else if (rid === 'erode') {                          // —— 风+岩：真实侵蚀风化 ——
      // 同上：只作用于已在游戏中左移的 6 组管道；未进视野的组进场瞬间再风化
      erodeApplyN = 0; erodeSixth = null; petrifyOn = true;  // 全屏石化保持期开始
      lockSixAhead('erode');
      const dur = framesToSixth();                         // 动态倒计时：飞到第 6 组管道的时间
      reaction = { id: 'erode', t: dur, total: dur, crossed: 0 };
      // 岩附着：基础环境灰化全程挂着（延迟入场的组也要覆盖到，给足余量）
      envRockT = Math.max(envRockT, envHold(dur));
      envRockA = Math.max(envRockA, 0.02);
      playSound(rid);
    } else if (rid === 'overload') {                       // —— 火+雷：狂暴过载 5 秒 ——
      // 突进：前后各 2.5 秒区间内随机 1 次（共 2 次），两次之间必有间隔
      reaction = {
        id: 'overload', t: CFG.REACT_OVERLOAD_TIME, crossed: 0,
        dashAt: [232 + Math.floor(Math.random() * 56), 52 + Math.floor(Math.random() * 56)],
        dashT: 0,
        gravLeft: CFG.REACT_OVERLOAD_GRAV_TOTAL,             // 5 秒内重力颠倒总时长上限 1.5 秒
        gravOnT: 0, gravCool: 60
      };
      bird.invincible = Math.max(bird.invincible, CFG.REACT_OVERLOAD_TIME + 60);   // 结束后第 6 秒内仍无敌
      gravDir = 1;
      purpleFlash = 10;
      // 【音效】火+雷：触发/特效开始播放一次（突进阶段再播放一次，见 overloadSmash）
      playSoundThrottled('overload', 0.3);
    } else if (rid === 'lag') {                            // —— 风+冰：迟滞防抖 ——
      reaction = { id: 'lag', t: CFG.REACT_LAG_TIME, crossed: 0 };
      lagHoldT = 0;
      lagLastTapT = -999;
      // 【修复·先风后冰】冰是第二个元素，iceT 在触发瞬间被清零，来不及走「冰附着 → 结霜」通道；
      // 这里显式挂上冰霜环境通道（反应全程 + 1 秒淡出），保证先风后冰时柱子同样正常冰冻。
      envFrostT = Math.max(envFrostT, envHold(CFG.REACT_LAG_TIME + 60));
      envFrostA = Math.max(envFrostA, 0.02);
      // 【音效】整段反应持续期间循环播放寒风呼啸，结束立即停止（见 endReaction）
      AudioManager.startLagLoop();
    } else if (rid === 'mud') {                            // —— 水+岩：泥潭与护盾 ——
      reaction = { id: 'mud', t: CFG.REACT_MUD_TIME, crossed: 0 };
      shieldOn = true;
      shieldT = CFG.MUD_SHIELD_TIME;                       // 立刻获得 20 秒强力护盾
      mudJumpCount = 0;
      waterReactGain();                                    // 水元素参与 → 必定回血 / 满血生成蓝心
      playSound(rid);
    } else if (rid === 'magma') {                          // —— 火+岩：岩浆球形态 ——
      // 时间轴：0.5s 变身（贴地）→ 8s 球体滚动 → 2s 变回 + 无敌
      reaction = { id: 'magma', t: CFG.REACT_MAGMA_TIME, total: CFG.REACT_MAGMA_TIME, crossed: 0,
                   formP: 0, ball: false, grounded: false, reverted: false, jumped: false };
      magmaSlabs = [];
      // 岩环境通道：岩浆球滚过的柱子会被灼断，灰化表现随反应挂上
      if (envRockT > 0) envRockT = Math.max(envRockT, envHold(90));
      if (envRockA < 0.02) envRockA = 0.02;
      playSound(rid);
    } else if (rid === 'cruise') {                         // —— 雷+草：雷电四叶印直线突袭 ——
      reaction = { id: 'cruise', t: CFG.REACT_CRUISE_TIME, total: CFG.REACT_CRUISE_TIME, crossed: 0,
                   phase: 'dwell', dwellT: CFG.REACT_CRUISE_PRE, holdT: 0, finishing: false,
                   seg: 0, segTarget: null, segFromY: bird.y, streakY: bird.y, tiltFrom: 0 };
      spawnCruiseSeals();                                 // 7 个雷印严格落在 7 个连续「空地」正中
      // 巡航全程绝对无敌（自动飞行绝不会撞死）
      bird.invincible = Math.max(bird.invincible, CFG.REACT_CRUISE_TIME + 60);
      // 草环境通道：柱上藤蔓随巡航挂上
      envVineT = Math.max(envVineT, envHold(CFG.REACT_CRUISE_TIME));
      envVineA = Math.max(envVineA, 0.02);
      envVineGrowP = Math.max(envVineGrowP, 1);
      // 【音效】雷+草：不在触发瞬间发声；每次冲向雷印（dash 起点）同步播放突刺音
    } else if (rid === 'turb') {                           // —— 火+风：气流紊乱 ——
      reaction = { id: 'turb', t: CFG.REACT_TURB_TIME, total: CFG.REACT_TURB_TIME, crossed: 0, dmg: 0 };
      playSound(rid);
    } else if (rid === 'fog') {                            // —— 风+水：迷雾 ——
      reaction = { id: 'fog', t: CFG.REACT_FOG_TIME, total: CFG.REACT_FOG_TIME, crossed: 0 };
      fogParts = [];
      fogAmp = 0;
      for (const p of pipes) { p.fogA = 0; p.fogLvl = 0; }
      waterReactGain();                                    // 水元素参与 → 必定回血 / 满血生成蓝心
      playSound(rid);
    } else if (rid === 'emfield') {                        // —— 风+雷：电磁紊乱（重力反转）——
      reaction = { id: 'emfield', t: CFG.REACT_EMF_TIME, total: CFG.REACT_EMF_TIME, crossed: 0 };
      emBolts = [];
      emBoltCd = 10;
      gravDir = -1;                                        // 点击 = 向下飞，重力 = 向上
      purpleFlash = 10;
      playSound(rid);
    } else if (rid === 'shock') {                          // —— 水+雷：漏电麻痹 ——
      reaction = { id: 'shock', t: CFG.REACT_SHOCK_TIME, total: CFG.REACT_SHOCK_TIME,
                   crossed: 0, queue: [], dmg: 0 };
      shockOff = 0;
      // 【水+雷优化】触发时可回血 / 生成蓝心；反应期间最多扣 2 次血（见 applyDamage）
      waterReactGain();
      playSound(rid);
    } else if (rid === 'netlag') {                         // —— 冰+雷：网络延迟 ——
      reaction = { id: 'netlag', t: CFG.REACT_NETLAG_TIME, total: CFG.REACT_NETLAG_TIME,
                   crossed: 0, next: 0, rollT: 0, rollDone: 0,
                   ghostCd: 0, rounds: 0 };
      netlagGhosts = [];
      // 【铁律】柱子保持原本颜色：绝不挂冰霜/岩石通道，只做全屏淡紫滤镜 + 紫色光晕边框
      // 例外：先雷后冰（雷附着期吃到冰）→ 柱子必须呈现「雷冰复合特效」，且冰霜铺满整个 10 秒反应期，不提前清空
      if (first === '雷') {
        envFrostT = Math.max(envFrostT, envHold(CFG.REACT_NETLAG_TIME));
        envFrostA = Math.max(envFrostA, 0.02);
      }
      playSound(rid);
    } else if (rid === 'quake') {                          // —— 冰+岩：极寒震荡 ——
      reaction = { id: 'quake', t: CFG.REACT_QUAKE_TIME, total: CFG.REACT_QUAKE_TIME, crossed: 0 };
      // 冰霜 + 岩石灰化双层环境表现全程挂着
      envFrostT = Math.max(envFrostT, envHold(CFG.REACT_QUAKE_TIME));
      envFrostA = Math.max(envFrostA, 0.02);
      envRockT = Math.max(envRockT, envHold(CFG.REACT_QUAKE_TIME));
      envRockA = Math.max(envRockA, 0.02);
      for (const p of pipes) {
        p.quakePh = Math.random() * 6.283;
        p.quakeAmp = CFG.REACT_QUAKE_MIN + Math.random() * (CFG.REACT_QUAKE_MAX - CFG.REACT_QUAKE_MIN);
        p.quakeY = 0;
      }
      quakeSeedT = 0;
      // 【音效】冰+岩：整个反应持续期间循环播放地动轰鸣（不在此处播一次性音）
      AudioManager.startQuakeLoop();
    } else if (rid === 'press') {                          // —— 草+岩：泰山压顶 ——
      reaction = { id: 'press', t: CFG.REACT_PRESS_TIME, total: CFG.REACT_PRESS_TIME, crossed: 0 };
      envVineT = Math.max(envVineT, envHold(CFG.REACT_PRESS_TIME));
      envVineA = Math.max(envVineA, 0.02);
      envVineGrowP = Math.max(envVineGrowP, 1);
      envRockT = Math.max(envRockT, envHold(CFG.REACT_PRESS_TIME));
      envRockA = Math.max(envRockA, 0.02);
      playSound(rid);
    }

    // Part 1 · 三：视野内彩虹柱的形态褪去与反应联动（同步叠加特效；本反应全程封锁元素球）
    fadeRainbowPipes(rid);

    // 反应横幅：屏幕中上方居中显示（缩放弹出 → 停留 → 淡出），不遮挡中央视野
    if (reaction) reactBanner = { id: reaction.id, t: 0 };
  }

  /** 滑行轨道锚点的实时 X 坐标（管道锚点跟随管道左移，固定锚点自带 x） */
  /** 轨道锚点实时 X：管道锚点跟随管道左移；e=0 左端、e=1 右端（底部柱子顶面的两条边） */
  function anchorX(a) {
    if (a.p) return a.p.x + (a.e ? CFG.PIPE_W : 0);
    // 空地回拉锚点：与管道同速随世界左移（否则会变成钉死在屏幕上的一点，被后面追上来的管道穿过）
    return a.lead ? a.x - rideShift : a.x;
  }

  /** 登记一根柱子的底部柱顶（左右两条边）为轨道锚点；按 X 插入排序，
   *  保证预铺在屏幕外的柱子与随后从右缘生成的柱子不会出现顺序错乱（否则轨道会折角/断段） */
  function addRideAnchor(pipe) {
    const y = pipe.topH + CFG.PIPE_GAP;
    ridePath.push({ p: pipe, e: 0, y: y });
    ridePath.push({ p: pipe, e: 1, y: y });
    ridePath.sort((a, b) => anchorX(a) - anchorX(b));
    return y;
  }

  /** 已登记进轨道的柱子数量（每根柱子 2 个锚点，严格封顶 8 根） */
  function ridePipeCount() {
    const seen = new Set();
    for (const a of ridePath) if (a.p) seen.add(a.p);
    return seen.size;
  }

  /** 轨道起点 X：触发位置（若触发在缝隙中，从脚下那根柱子的左缘开始） */
  function rideStartX() {
    if (ridePath.length === 0) return bird.x;
    const first = ridePath[0];
    const x = anchorX(first);
    return Math.min(x, bird.x);
  }

  /** 轨道终点 X：第 8 根柱子的右缘，绝不允许再往右延伸 */
  function rideEndX() {
    return ridePath.length ? anchorX(ridePath[ridePath.length - 1]) : bird.x;
  }

  /** 沿轨道等距铺金币（只铺轨迹上方，标记 trackCoin 保证只吃滑道金币） */
  function layTrackCoins(x0, x1) {
    const from = Math.max(x0, bird.x + 55);
    if (!(x1 > from)) return;
    for (let cx = from + CFG.REACT_RIDE_COIN_GAP; cx <= x1; cx += CFG.REACT_RIDE_COIN_GAP) {
      spawnCoin(cx, rideYAt(cx) - 22, false);
      coins[coins.length - 1].trackCoin = true;
    }
  }

  /** 4.5 秒滑行段的额外左移速度：按「抵达第 8 根柱子右缘」的实际距离反推（不足 8 根时按生成时序估算） */
  function computeRideSpeed() {
    const nP = ridePipeCount();
    const k = Math.max(0, CFG.REACT_CROSS_PIPES - nP);
    const lastPass = ridePath.length ? Math.max(0, rideEndX() - bird.x) : 0;
    const spawnGap = k > 0 ? Math.max(0, CFG.PIPE_SPACING * k - spawnTimer) : 0;
    const futurePass = k > 0 ? Math.max(0, CFG.W + CFG.PIPE_W - bird.x) : 0;
    const dist = k > 0
      ? Math.max(300, spawnGap + futurePass + 60)               // 第 8 根尚未生成：按 spawnTimer 推算它从右缘生成并越过小鸟的距离
      : Math.max(300, lastPass + 60);                          // 8 根已全部存在：直接量到最后那根右缘
    return Math.max(0, dist / CFG.REACT_RIDE_RIDE - CFG.PIPE_SPEED);
  }

  /** 抵达第 8 根柱子瞬间：恢复操作 + 1.5 秒绝对无敌，并把滑道交给 1 秒退场演出 */
  function beginRideExit() {
    const r = reaction;
    if (!r) return;
    r.phase = 'exit';
    r.t = CFG.REACT_RIDE_EXIT;
    bird.invincible = Math.max(bird.invincible, CFG.REACT_END_INV);
    bird.vy = -1;                                            // 轻微上飘，平稳交接给正常重力
    coins = coins.filter(c => !c.trackCoin);                 // 滑道金币到此为止，不再留在半空
    // 退场粒子：藤桥 = 绿色叶片向四周飘散；冰道 = 冰晶/雪花碎屑
    const kind = r.id === 'slide' ? 'ice' : 'leaf';
    const x0 = Math.max(-40, rideStartX()), x1 = Math.min(CFG.W + 40, rideEndX());
    for (let x = x0; x <= x1; x += 26) {
      for (let k2 = 0; k2 < 2; k2++) {
        const y = rideYAt(x) + 10;
        rideBurst.push({
          x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 14,
          vx: (Math.random() - 0.5) * 3.4, vy: -1.5 - Math.random() * 2.6,
          rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.3,
          t: 40 + Math.random() * 20, max: 60, kind: kind
        });
      }
    }
  }

  /**
   * 滑行轨道高度函数：相邻锚点之间用 smoothstep（三次 Hermite，零切线）平滑过渡，
   * 每个锚点两侧斜率都为 0 → 全程 C1 连续，圆润顺滑、绝无折角；
   * 同一根柱子的左右两锚点等高，因此轨道严格平贴底部柱子顶端表面。
   * 渲染与小鸟吸附共用同一函数（所见即所骑）。
   */
  function rideYAt(x) {
    const n = ridePath.length;
    if (n === 0) return bird.y;
    const yAt = i => ridePath[i].y;
    let y;
    if (n === 1 || x <= anchorX(ridePath[0])) {
      y = yAt(0);
    } else if (x >= anchorX(ridePath[n - 1])) {
      y = yAt(n - 1);
    } else {
      y = yAt(n - 1);
      for (let i = 0; i < n - 1; i++) {
        const x1 = anchorX(ridePath[i]), x2 = anchorX(ridePath[i + 1]);
        if (x < x1 || x > x2) continue;
        const t = (x - x1) / Math.max(1, x2 - x1);
        const s = t * t * (3 - 2 * t);                   // smoothstep：两端切线为 0
        y = yAt(i) + (yAt(i + 1) - yAt(i)) * s;
        break;
      }
    }
    return y + Math.sin((x + rideShift) * 0.022) * 2;    // 极轻微起伏（±2px），主体完全由平滑曲线决定
  }

  /** 反应效果完全结束 → 额外 1 秒冷却后才能重新吸收新元素 */
  function endReaction() {
    const rid = reaction && reaction.id;
    reaction = null;
    // 【音效】反应结束：循环类音效立即停止并释放（风+冰寒风等），绝不残留
    AudioManager.stopLoops();
    reactionLockT = CFG.REACT_LOCK;
    coins = coins.filter(c => !c.trackCoin && c.restY == null);   // 清理滑行轨道金币与异空间悬停金币
    // 吸金类反应（火+水 / 雷+岩 / 风+草）收尾：场上残余金币全部转为「不计分」，
    // 防止反应刚结束时一次性吸走大批金币导致分数突然暴增（总得分严格封顶 450 / 600 / 800）
    if (rid === 'steam' || rid === 'void' || rid === 'gold') {
      for (const c of coins) c.free = true;
    }
    ridePath = [];
    gravDir = 1;
    lagHoldT = 0;
    lagHoldOn = false;
    mudJumpCount = 0;
    // 柱子自身的风化是逐组独立推进的（含延迟入场的组），这里绝不批量淡出；
    // 每组的灰绿色调由 stepPipeFx 在本组动画播完后自行进入 1 秒淡出。
    // 【铁律九】反应结束：柱子上残留的环境特效（结霜 / 藤蔓 / 灰化）必须在 1 秒内缓慢淡出，
    // 恢复成正常柱子；若玩家身上仍附着该元素，update 的优先级同步块会立刻把它重新抬起。
    // 【冰霜提前消失修复】冰附着仍有效时绝不收缩冰霜时长，严格等 12 秒附着结束才允许淡出。
    if (!(element.type === '冰' && element.t > 0)) envFrostT = Math.min(envFrostT, 60);
    envVineT = Math.min(envVineT, 60);
    // 风+岩：全局石化必须坚持到小鸟飞过第 6 组才统一消散，反应倒计时结束不得提前掐断
    if (!petrifyOn) envRockT = Math.min(envRockT, 60);
    // —— Round D 收尾：残留状态一律 1 秒内平滑淡出，绝不瞬间消失 ——
    if (rid === 'emfield') gravDir = 1;                   // 电磁紊乱结束：重力方向恢复
    for (const s of cruiseSeals) s.fade = 1;              // 印记进入 1 秒渐隐（由 update 统一推进）
    cruiseGapQueue = [];                                  // 雷+草结束：丢弃未消费的预生成缝隙
    cruiseTiltA = 0;                                      // 【倾斜 Bug 修复】反应结束立刻清零倾角，画面永远回归水平垂直
    // 火+岩倒塌板体 / 冰+雷残影：留在场上按各自寿命自然坠落与渐隐（绝不瞬间清空）
    // 迷雾雾团 / 电磁闪电保留在场上，由 update 的收尾通道在 1 秒内自然收敛
    for (const p of pipes) p.fogLvl = -1;
    if (rid === 'quake') for (const p of pipes) p.quakeFade = 1;   // 震动幅度进入 1 秒淡出

    // —— 全局保护机制：反应结束 → 1.5 秒无敌 + 结束后 1 秒内无法吸收新元素 ——
    bird.invincible = Math.max(bird.invincible, CFG.REACT_END_INV);
    absorbBlockT = Math.max(absorbBlockT, 60);

    // —— 彩虹柱子延迟刷新（Part 1 · 一.2 / 一.3 / 一.6）——
    // 到点时正处于「无法吸收元素」的状态（反应 / 雷突进 / 草穿梭 …）→ 本次彩虹柱无效；
    // 或者本次反应让视野内的彩虹柱褪色 / 变形 → 同样视为这次刷新被消耗。
    // 两种情况都必须等反应彻底结束后，先让「第一根普通缓冲柱」完整生成并飞过小鸟，
    // 在生成第二根柱子时才允许再次刷新彩虹柱（绝不在反应后摇阶段生成）。
    if (rainbowPending || rainbowLostByReaction) {
      rainbowPending = false;
      rainbowLostByReaction = false;
      rainbowWaitFxPipe = null;
      rainbowNext = false;
      rainbowCd = 0;                   // 缓冲柱飞过后立即可刷
      rainbowNeedBuffer = true;        // 打开缓冲规则
      rainbowBufferPipe = null;        // 由下一根生成的普通柱登记为缓冲柱
      // 【封锁铁律】反应结束不解锁：继续封锁元素球 / 盲盒，直到新彩虹柱真正生成
      rainbowOrbLock = true;
    }
    rbMuteRid = null;                  // 规则⑤：反应结束 → 解除元素球静音
  }

  /* ==================== Round D：世界整体位移 / 火+岩 岩浆球 ==================== */

  /** 世界整体水平位移（dx > 0 = 左移）：管道、金币、元素球与全部粒子同步随动 */
  function shiftWorld(dx) {
    if (!dx) return;
    for (const p of pipes) p.x -= dx;
    for (const c of coins) c.x -= dx;
    for (const o of orbs) o.x -= dx;
    for (const n of grassNodes) n.x -= dx;
    for (const s of pipeDebris) s.x -= dx;
    for (const s of windTrail) s.x -= dx;
    for (const s of thunderTrail) s.x -= dx;
    for (const s of windRipples) s.x -= dx;
    for (const s of fireTrail) s.x -= dx;
    for (const s of iceTrail) s.x -= dx;
    for (const s of steamTrail) s.x -= dx;
    for (const s of meltSteam) s.x -= dx;
    for (const s of charDust) s.x -= dx;
    for (const s of slideSnow) s.x -= dx;
    for (const s of rideBurst) s.x -= dx;
    for (const s of magmaSlabs) s.pivotX -= dx;
    for (const d of magmaDrops) d.x -= dx;
    for (const q of magmaPuddles) q.x -= dx;
    for (const s of magmaScars) s.x -= dx;
    for (const s of cruiseSeals) s.x -= dx;
    for (const s of fogParts) s.x -= dx;
    for (const s of netlagGhosts) s.x -= dx;
    for (const b of emBolts) for (const pt of b.pts) pt.x -= dx;
    grassShift += dx;                                  // 位移同步喂给 spawnTimer，管道时间轴恒定
  }

  /** 雷+草：直线突进途中，击碎位于两雷印之间（空地位置）的柱子。
   *  触发时机严格同步视觉：击碎半径 = 小鸟实际碰撞箱（BIRD_R × HIT_SCALE ≈ 12px），
   *  只有当柱子边缘真正进入小鸟身体（"撞上"的那一帧）才炸裂，绝不提前碎裂。
   *  管道宽 72px，即使 1000% 速度（24px/帧）重叠窗口仍有 96px（≥4 帧），不会漏判。 */
  function smashCruisePipes() {
    const groundY = CFG.H - CFG.GROUND_H;
    const R = CFG.BIRD_R * CFG.HIT_SCALE;
    for (const p of pipes) {
      if (p.cruiseGone || p.charGone || p.icGone) continue;
      if (p.x > bird.x + R || p.x + CFG.PIPE_W < bird.x - R) continue;
      p.cruiseGone = true;
      p.passed = true;
      const gb = p.topH + CFG.PIPE_GAP + (p.erodeCut || 0);
      for (let k = 0; k < 8; k++) {
        pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W, Math.random() * p.topH, 'char'));
        pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W,
                                  gb + Math.random() * Math.max(10, groundY - gb), 'char'));
      }
      for (let k = 0; k < 10; k++) {                 // 紫色电火花爆散
        const a = Math.random() * 6.283;
        thunderTrail.push({ x: p.x + CFG.PIPE_W / 2 + Math.cos(a) * 16,
                            y: bird.y + Math.sin(a) * 16,
                            t: 20, max: 20, seed: Math.random() * 100, spark: true });
      }
      shake = Math.max(shake, 6);
      playSound('rock');
    }
  }

  /**
   * 火+岩：岩浆球撞上柱子 ——
   * 在岩浆球水平位置切出一道横向裂痕，裂痕以上的半截柱子整体脱离成板体，向右快速倒塌。
   * 柱子被切开后缺口永久保留（本次撞击后该柱不再参与碰撞）。
   */
  function cutMagmaPipe(p) {
    const groundY = CFG.H - CFG.GROUND_H;
    const gapBottom = p.topH + CFG.PIPE_GAP + (p.erodeCut || 0);
    if (gapBottom >= groundY - 10) return;
    // 切口尽量贴近地面 → 留在地上的残桩更低矮（低矮残骸，切口由 pathBot 画出崩边）
    const cutY = Math.max(gapBottom + 3, Math.min(groundY - 16, Math.max(gapBottom + 10, bird.y + 9)));
    p.magmaCut = true;
    p.magmaCutY = cutY;
    p.magmaCutFade = 1;
    // 上半截板体：以裂痕左端为轴，向右倒塌（先绕切口旋转，再随进度落地）
    magmaSlabs.push({
      pivotX: p.x, cutY: cutY, w: CFG.PIPE_W,
      h: Math.max(10, cutY - gapBottom), ang: 0, angV: 0.05, seed: Math.random() * 100
    });
    // 切口处的深灰岩石碎屑（撞击点附近带暗红熔痕）
    for (let i = 0; i < 18; i++) {
      const sh = makeRockShard(p.x + Math.random() * CFG.PIPE_W, cutY + (Math.random() - 0.5) * 6, i < 6);
      sh.vx = -0.4 + Math.random() * 2.6;
      sh.vy = -1.2 - Math.random() * 2.4;
      sh.t = sh.max = 24 + Math.floor(Math.random() * 14);
      pipeDebris.push(sh);
    }
    shake = Math.max(shake, 8);
    // 【音效】火+岩：岩浆球撞碎柱子的同一帧播放倒塌粉碎声（多根同帧触发时防叠音）
    playSoundThrottled('collapse', 0.08);
    // 金币奖励：每撞碎一根柱子给予 5 枚金币的分数与连击，但绝不播放常规金币「叮」声
    // （静音金币：完全让位给撞击音效 rock）
    for (let k = 0; k < 5; k++) collectCoin(false, true);
  }

  /** 火+岩：每帧扫描与岩浆球水平重叠的柱子（球在贴地滚动，撞到即切） */
  function magmaSmash() {
    const R = CFG.REACT_MAGMA_R;
    for (const p of pipes) {
      if (p.magmaCut || p.charGone || p.icGone) continue;
      if (p.x > bird.x + R * 0.9 || p.x + CFG.PIPE_W < bird.x - R * 0.9) continue;
      cutMagmaPipe(p);
    }
  }

  /** 火+岩：倒塌板体推进 → 砸到地面碎成 150 片不规则岩石碎块，随后消失 */
  function stepMagmaSlabs() {
    if (!magmaSlabs.length) return;
    const groundY = CFG.H - CFG.GROUND_H;
    const wx = CFG.PIPE_SPEED * speedMulNow;   // 与全局世界滚动同步（speedMul 是 update 内的局部变量）
    for (const s of magmaSlabs) {
      s.pivotX -= wx;
      if (s.landed) continue;
      s.angV += 0.008;
      s.ang += s.angV;
      if (s.ang >= Math.PI / 2) {
        s.ang = Math.PI / 2;
        s.landed = true;
        // 砸地 → 150 片不规则多边形岩石碎块（有长有短），撞击端约三成带岩浆暗红
        const n = CFG.REACT_MAGMA_SHARDS;
        for (let i = 0; i < n; i++) {
          const u = Math.random();
          const sh = makeRockShard(s.pivotX + u * s.h * 0.98,
                                   groundY - 3 - Math.random() * 30,
                                   u < 0.34);
          sh.vx = 0.5 + Math.random() * 3.4;
          sh.vy = -1.0 - Math.random() * 3.6;
          sh.t = sh.max = 30 + Math.floor(Math.random() * 16);
          pipeDebris.push(sh);
        }
        for (let i = 0; i < 10; i++) {                   // 地面积起的尘埃
          pipeDebris.push({
            x: s.pivotX + Math.random() * s.h, y: groundY - 1, tone: 'dust',
            vx: 0.4 + Math.random() * 2.2, vy: -0.2 - Math.random() * 0.8,
            g: 0.01, size: 0.7 + Math.random() * 1.1, len: 2 + Math.random() * 3,
            rot: 0.18, vr: 0, t: 36, max: 36
          });
        }
        s.dead = true;
        shake = Math.max(shake, 10);
      }
    }
    magmaSlabs = magmaSlabs.filter(s => !s.dead);
  }

  /**
   * 元素效果的唯一执行入口：由 collectElement 挂载流程调用（普通元素球与盲盒统一走该流程）。
   */
  function applyElementEffect(key) {
    switch (key) {
      case '火':
        bird.invincible = Math.max(bird.invincible, CFG.FIRE_INV_TIME);
        fireSpeedT = CFG.FIRE_SPEED_TIME;
        fireDecelT = 0;                      // 重新爆发：打断进行中的降速段
        playSound('fire');
        break;
      case '风':
        windT = CFG.WIND_TIME;
        playSound('wind');
        break;
      case '岩':
        rockT = CFG.ROCK_TIME;
        shieldOn = true;
        shieldT = CFG.SHIELD_TIME;
        envRockT = Math.max(envRockT, envHold(CFG.ROCK_TIME));   // 【铁律八】柱子灰化走持久通道
        envRockA = Math.max(envRockA, 0.02);
        playSound('rock');
        break;
      case '水':
        // 【修复】单独吃水同样回血（未满血 +1，满血生成蓝心），并点亮 1 秒深蓝水滴光泽
        waterReactGain();
        playSoundThrottled('water', 0.12);   // 清亮水滴声：每次拾取一次，短冷却防叠音
        break;
      case '冰':
        iceT = CFG.ICE_TIME;
        // 【铁律一】柱子冰霜走持久通道：附着即点亮，只增不减，任何反应都不清空
        envFrostT = Math.max(envFrostT, envHold(CFG.ICE_TIME));
        envFrostA = Math.max(envFrostA, 0.02);
        playSoundThrottled('ice', 0.28);     // 0.5 秒结冰声：短冷却防叠音，每次拾取都听得到
        break;
      case '雷':
        playSound('thunder');
        thunderStrike();                                 // 一次性触发：瞬闪跨越 + 白闪 + 碎管
        break;
      case '草':
        playSound('grass');
        // 【铁律一】柱子藤蔓走持久通道：附着即点亮，只增不减，任何反应都不清空
        envVineT = Math.max(envVineT, envHold(CFG.GRASS_TIME));
        envVineA = Math.max(envVineA, 0.02);
        startGrass();                                    // 接力状态机：只在下一处空地生成第 1 个印记
        break;
    }
  }

  /** 盲盒拾取：随机赋予 1 种单元素，与普通元素球走完全相同的 collectElement 挂载流程
      （状态栏图标 + 附着倒计时 + 小鸟贴身荧光全部同步；仅单元素，无任何双元素反应）。
      抽取约束（盲盒抽出的具体元素同样遵守防重复铁律）：
      ① 已附着元素时，绝不抽出相同元素 → 保证必定触发元素反应；
      ② 先剔除 recentlySpawnedElements 封锁期（3 空地 + 2 缝隙）内的全部元素；
      ③ 抽完立即把结果推回黑名单，后续空地 / 缝隙位置同样封锁它。 */
  function openMystery() {
    const banned = new Set();
    const attached = (element.type && element.t > 0) ? element.type : null;
    if (attached) banned.add(attached);
    if (lastOrbKey) banned.add(lastOrbKey);
    if (guidePool.length > 0) banned.add(guidePool[guidePool.length - 1]);   // 新手池下一个（pop 取尾）
    const blocked = blockedElementKeys('any');                              // 封锁期元素一律剔除
    let pool = ELEMENTS.filter(e => !banned.has(e.key) && !blocked[e.key]);
