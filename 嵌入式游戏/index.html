    if (!pool.length) pool = ELEMENTS.filter(e => !blocked[e.key]);
    if (!pool.length) pool = ELEMENTS.filter(e => !banned.has(e.key));
    if (!pool.length) pool = ELEMENTS;
    const el = pool[Math.floor(Math.random() * pool.length)];
    pushRecentElement(el.key);                    // 盲盒抽出的元素同样入黑名单
    lastOrbKey = el.key;
    collectElement(el.key, el.color);                    // UI 附着条与荧光特效和普通元素完全一致
  }

  /* ============================================================
   * 4.5 AudioManager：纯 Web Audio API 实时合成音效系统（零外部音频文件）
   *  - 全部声音由 Oscillator / 噪声缓冲 + BiquadFilter + Gain 包络现场合成；
   *  - 每个声部在最后一个 source 的 onended 触发时立刻 disconnect 全部节点，
   *    并清空 buffer 引用（另有 setTimeout 兜底），AudioNode 绝不累积 → 无内存泄漏；
   *  - 四路电压总线：Master / Jump / Coin / Reaction，7 种元素附着音走 Master；
   *  - 音量配置写入 localStorage（键 feixiang_audio_cfg_v1），刷新后自动恢复。
   * ============================================================ */
  const AudioManager = (function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    const STORE_KEY = 'feixiang_audio_cfg_v1';
    const DEFAULTS = { master: 60, jump: 60, coin: 70, reaction: 75, muted: false };
    const KEYS = ['master', 'jump', 'coin', 'reaction'];

    let ctx = null;
    let master = null, busJump = null, busCoin = null, busReaction = null;
    let noiseBuf = null;                          // 白 / 粉红 / 布朗噪声缓冲（生成一次，反复复用）
    const active = new Set();                    // 正在发声的声部
    const stats = { created: 0, disposed: 0, peak: 0, lastType: '', lastDur: 0, lastJumpCutoff: 0 };
    let coinLast = -1;                           // 金币音 50ms 冷却（音频时钟）
    const lastAt = Object.create(null);          // 事件类音效防抖时间表（iceShard / charBurn / melt…）
    let pausedFlag = false;                      // 暂停标记：暂停期间绝不创建任何发声节点
    let loopVoice = null;                        // 常驻循环声部（风+冰寒风），同一时刻最多 1 条
    let quakeVoice = null;                       // 常驻循环声部（冰+岩地动轰鸣），同一时刻最多 1 条
    let rollbackVoice = null;                    // 冰+雷回退干扰声（一次性，生命周期事件可立即释放）

    const cfg = { master: DEFAULTS.master, jump: DEFAULTS.jump, coin: DEFAULTS.coin,
                  reaction: DEFAULTS.reaction, muted: DEFAULTS.muted };
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---------- 配置持久化 ---------- */
    function loadCfg() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return;
        const o = JSON.parse(raw);
        for (const k of KEYS) {
          if (typeof o[k] === 'number' && isFinite(o[k])) cfg[k] = clamp(Math.round(o[k]), 0, 100);
        }
        if (typeof o.muted === 'boolean') cfg.muted = o.muted;
      } catch (e) { /* 隐私模式 / 存储被禁用：使用默认配置 */ }
    }
    function saveCfg() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* 忽略 */ }
    }

    /* ---------- 噪声缓冲：白 / 粉红（Paul Kellet）/ 布朗 ---------- */
    function buildNoise() {
      const sr = ctx.sampleRate;
      const len = Math.max(1024, Math.floor(sr * 2.4));
      const mk = (kind) => {
        const buf = ctx.createBuffer(1, len, sr);
        const d = buf.getChannelData(0);
        if (kind === 'white') {
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        } else if (kind === 'pink') {
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < len; i++) {
            const w = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + w * 0.0555179;
            b1 = 0.99332 * b1 + w * 0.0750759;
            b2 = 0.96900 * b2 + w * 0.1538520;
            b3 = 0.86650 * b3 + w * 0.3104856;
            b4 = 0.55000 * b4 + w * 0.5329522;
            b5 = -0.7616 * b5 - w * 0.0168980;
            d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
            b6 = w * 0.115926;
          }
        } else {                                   // 布朗噪声：随机游走积分 + 泄漏
          let last = 0;
          for (let i = 0; i < len; i++) {
            last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
            d[i] = clamp(last * 3.5, -1, 1);
          }
        }
        return buf;
      };
      noiseBuf = { white: mk('white'), pink: mk('pink'), brown: mk('brown') };
    }

    /* ---------- 上下文与总线 ---------- */
    function setBus(node, v, instant) {
      if (!node) return;
      const p = node.gain;
      if (instant) p.setValueAtTime(v, ctx.currentTime);
      else p.setTargetAtTime(v, ctx.currentTime, 0.015);
    }
    function applyVolumes(instant) {
      if (!ctx) return;
      setBus(master, cfg.muted ? 0 : cfg.master / 100, instant);
      setBus(busJump, cfg.jump / 100, instant);
      setBus(busCoin, cfg.coin / 100, instant);
      setBus(busReaction, cfg.reaction / 100, instant);
    }
    function ensureCtx() {
      if (!AC) return null;
      if (!ctx) {
        try { ctx = new AC(); } catch (e) { ctx = null; return null; }
        master = ctx.createGain();
        busJump = ctx.createGain();
        busCoin = ctx.createGain();
        busReaction = ctx.createGain();
        busJump.connect(master);
        busCoin.connect(master);
        busReaction.connect(master);
        master.connect(ctx.destination);
        applyVolumes(true);
        buildNoise();
      }
      if (ctx.state === 'suspended' && !pausedFlag) { try { ctx.resume(); } catch (e) { /* 忽略 */ } }
      return ctx;
    }
    function busOf(name) {
      return name === 'jump' ? busJump : name === 'coin' ? busCoin :
             name === 'reaction' ? busReaction : master;
    }

    /* ---------- 声部：统一登记节点，播放完毕一次性拆除 ---------- */
    function makeVoice(bus, dur) {
      ensureCtx();
      if (!ctx) return null;
      const out = ctx.createGain();
      out.gain.value = 1;
      out.connect(busOf(bus));
      const v = {
        out, t: ctx.currentTime, dur, nodes: [out], sources: [],
        maxStop: -Infinity, tailExtra: 0, dead: false, timer: 0,
        gainVal(g0) {
          const g = ctx.createGain();
          g.gain.value = g0 === undefined ? 1 : g0;
          v.nodes.push(g);
          return g;
        },
        bq(type, f0, q) {
          const f = ctx.createBiquadFilter();
          f.type = type;
          if (f0 != null) f.frequency.value = f0;
          if (q != null) f.Q.value = q;
          v.nodes.push(f);
          return f;
        },
        osc(type, f0) {
          const o = ctx.createOscillator();
          o.type = type;
          o.frequency.value = f0;
          v.nodes.push(o);
          return o;
        },
        noise(kind) {
          const s = ctx.createBufferSource();
          s.buffer = noiseBuf[kind] || noiseBuf.white;
          s.loop = true;
          v.nodes.push(s);
          return s;
        },
        play(src, at, stopAt) {
          const st = Math.max(at, v.t);
          const sp = Math.max(stopAt, st + 0.001);
          v.sources.push(src);
          if (sp > v.maxStop) v.maxStop = sp;
          src.start(st);
          src.stop(sp);
        },
        commit() {
          if (!v.sources.length) { v.dispose(); return; }
          let left = v.sources.length;
          for (const s of v.sources) s.onended = () => { if (--left <= 0) v.dispose(); };
          const secs = Math.max(0.1, v.maxStop + v.tailExtra - v.t) + 0.5;
          // 看门狗：暂停期间音频时钟冻结，计时器顺延到恢复后再释放，绝不把正在播放的尾音直接砍掉
          const watchdog = () => {
            if (v.dead) return;
            if (pausedFlag) { v.timer = setTimeout(watchdog, 300); return; }
            v.dispose();
          };
          v.timer = setTimeout(watchdog, Math.ceil(secs * 1000));
          active.add(v);
          stats.created++;
          stats.lastDur = dur;
          if (active.size > stats.peak) stats.peak = active.size;
        },
        dispose() {
          if (v.dead) return;
          v.dead = true;
          if (v.timer) { clearTimeout(v.timer); v.timer = 0; }
          for (const n of v.nodes) { try { n.disconnect(); } catch (e) { /* 已断开 */ } }
          for (const s of v.sources) { try { s.buffer = null; } catch (e) { /* 忽略 */ } }
          v.nodes.length = 0;
          v.sources.length = 0;
          active.delete(v);
          stats.disposed++;
        }
      };
      return v;
    }

    /** 线性包络：0 → peak（attack）→ 保持 hold → 0（release），返回结束时刻 */
    function env(v, g, attack, release, peak, hold) {
      const t0 = v.t;
      const a = Math.max(0.002, attack);
      const r = Math.max(0.005, release);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(peak, t0 + a);
      const h = t0 + a + Math.max(0, hold || 0);
      g.gain.setValueAtTime(peak, h);
      g.gain.linearRampToValueAtTime(0.0001, h + r);
      return h + r;
    }
    function sweep(param, from, to, t0, dur) {
      param.setValueAtTime(Math.max(1, from), t0);
      param.exponentialRampToValueAtTime(Math.max(1, to), t0 + Math.max(0.001, dur));
    }

    /* ---------- 第二部分：基础动作音效 ---------- */
    /** 跳跃：极短白噪声（0.05s）、音量极小；低通截止 / 增益 / 播放速率全部随机浮动，绝无机械重复感 */
    function sfxJump() {
      const v = makeVoice('jump', 0.05);
      if (!v) return;
      const t = v.t;
      const cutoff = 620 + Math.random() * 420;          // 620~1040Hz 随机
      stats.lastJumpCutoff = cutoff;
      const s = v.noise('white');
      s.playbackRate.value = 0.85 + Math.random() * 0.3; // 噪声色随机化
      const lp = v.bq('lowpass', cutoff, 0.65 + Math.random() * 0.45);
      const g = v.gainVal(0);
      s.connect(lp); lp.connect(g); g.connect(v.out);
      env(v, g, 0.008, 0.032, 0.028 + Math.random() * 0.022, 0);
      v.play(s, t, t + 0.05);
      v.commit();
    }
    /** 金币：正弦波；基础 600Hz，倍率每 +0.2 → +100Hz；达到最高倍率（x2.0）时
     *  从 3 个高频音阶中随机抽取一个（并避免连续重复），防止听觉疲劳。
     *  断连 / 受伤由 resetCoinPitch() 立刻复位。 */
    function coinStep() {
      return Math.round((clamp(typeof multiplier === 'number' ? multiplier : 1, 1, 2) - 1) / 0.2);
    }
    const COIN_MAX_TONES = [1120, 1280, 1440];           // x2.0 的三档高频音阶
    let lastMaxTone = -1;
    function coinFreq() {
      const st = coinStep();
      if (st >= 5) {                                     // x2.0：三选一随机
        let i = Math.floor(Math.random() * COIN_MAX_TONES.length);
        if (i === lastMaxTone) i = (i + 1 + Math.floor(Math.random() * 2)) % COIN_MAX_TONES.length;
        lastMaxTone = i;
        return COIN_MAX_TONES[i];
      }
      return 600 + st * 100;                             // 600 / 700 / 800 / 900 / 1000
    }
    function sfxCoin() {
      ensureCtx();
      if (!ctx) return;
      if (coinLast >= 0 && ctx.currentTime - coinLast < 0.05) return;   // 50ms 冷却
      const v = makeVoice('coin', 0.11);
      if (!v) return;
      coinLast = v.t;
      const t = v.t;
      const o = v.osc('sine', coinFreq());
      const g = v.gainVal(0);
      o.connect(g); g.connect(v.out);
      env(v, g, 0.01, 0.1, 0.26, 0);
      v.play(o, t, t + 0.11);
      v.commit();
    }

    /** 受伤：卡通「噗 / 啪」—— 低频正弦快速下滑的「咚」+ 极短带通噪声「嚓」，
     *  总时长约 0.2 秒，软、短、不刺耳；由 applyDamage 以 0.15s 冷却调用，绝无叠音。 */
    function sfxHurt() {
      const DUR = 0.2;
      const v = makeVoice('jump', DUR);
      if (!v) return;
      const t = v.t;
      // 低频「咚」：160–190Hz 随机起始 → 快速下滑到 75–90Hz（约 0.17 秒）
      const f0 = 160 + Math.random() * 30;
      const f1 = 75 + Math.random() * 15;
      const o = v.osc('sine', f0);
      sweep(o.frequency, f0, f1, t, 0.17);
      const og = v.gainVal(0);
      o.connect(og); og.connect(v.out);
      env(v, og, 0.006, 0.055, 0.27, 0.105);          // 0.006 + 0.105 + 0.055 ≈ 0.166s
      // 中高频「嚓」：白噪声 → 800–1500Hz 带通，约 0.07 秒快速衰减
      const n = v.noise('white');
      const bp = v.bq('bandpass', 800 + Math.random() * 700, 1.2);
      const ng = v.gainVal(0);
      n.connect(bp); bp.connect(ng); ng.connect(v.out);
      env(v, ng, 0.003, 0.045, 0.08, 0.008);
      v.play(o, t, t + 0.185);
      v.play(n, t, t + 0.085);
      v.commit();
    }

    /* ---------- 第三部分：七种单元素附着音效 ---------- */
    /** 风：粉红噪声 → 带通 600Hz Q1.0，持续 6 秒极轻呼呼声 */
    function sfxWind() {
      const v = makeVoice('element', 6.0);
      if (!v) return;
      const t = v.t;
      const s = v.noise('pink');
      const bp = v.bq('bandpass', 600, 1.0);
      const g = v.gainVal(0);
      s.connect(bp); bp.connect(g); g.connect(v.out);
      env(v, g, 0.8, 1.0, 0.05, 4.2);          // 0.8 + 4.2 + 1.0 = 6s
      v.play(s, t, t + 6.0);
      v.commit();
    }
    /** 火：持续的「物品燃烧声」—— 低频布朗噪声火体 + 火星白噪声爆裂，4 秒覆盖火 buff 全程 */
    function sfxFire() {
      const DUR = 4.0;
      const v = makeVoice('element', DUR);
      if (!v) return;
      const t = v.t;
      // 底层：布朗噪声 → 低通 380Hz，稳定低沉的燃烧呼呼声
      const b = v.noise('brown');
      const lp = v.bq('lowpass', 380, 0.9);
      const bg = v.gainVal(0);
      b.connect(lp); lp.connect(bg); bg.connect(v.out);
      env(v, bg, 0.18, 0.55, 0.16, DUR - 0.73);
      // 中层：白噪声 → 带通 2400Hz，细微火焰嘶声
      const w = v.noise('white');
      const bp = v.bq('bandpass', 2400, 0.7);
      const wg = v.gainVal(0);
      w.connect(bp); bp.connect(wg); wg.connect(v.out);
      env(v, wg, 0.3, 0.6, 0.03, DUR - 0.9);
      // 火星：随机时刻的极短高频白噪爆裂
      for (let i = 0; i < 9; i++) {
        const st = t + 0.12 + Math.random() * (DUR - 0.4);
        const sp = v.noise('white');
        const hp = v.bq('highpass', 3200, 0.8);
        const sg = v.gainVal(0);
        sp.connect(hp); hp.connect(sg); sg.connect(v.out);
        sg.gain.setValueAtTime(0.0001, st);
        sg.gain.linearRampToValueAtTime(0.03 + Math.random() * 0.04, st + 0.004);
        sg.gain.linearRampToValueAtTime(0.0001, st + 0.018 + Math.random() * 0.03);
        v.play(sp, st, st + 0.06);
      }
      v.play(b, t, t + DUR);
      v.play(w, t, t + DUR);
      v.commit();
    }
    /** 水（单吃）：清亮「水滴 + 细流」——0.3 秒
     *  水滴：高中频正弦快速下滑带轻微余韵；细流：带通噪声柔和起伏。
     *  整体清亮、不浑浊，与受伤「噗啪」/ 冰结晶音彻底区分。 */
    function sfxWater() {
      const DUR = 0.3;
      const v = makeVoice('element', DUR);
      if (!v) return;
      const t = v.t;
      // 水滴本体：1400Hz 左右快速下滑（清亮，不闷）
      const f0 = 1250 + Math.random() * 250;
      const o = v.osc('sine', f0);
      sweep(o.frequency, f0, 480, t, 0.10);
      const og = v.gainVal(0);
      o.connect(og); og.connect(v.out);
      env(v, og, 0.004, 0.16, 0.24, 0.012);
      // 第二滴更轻的回响（错开 60ms，形成「滴—嗒」的清亮余韵）
      const o2 = v.osc('sine', 900 + Math.random() * 180);
      sweep(o2.frequency, 900, 420, t + 0.06, 0.07);
      const og2 = v.gainVal(0);
      o2.connect(og2); og2.connect(v.out);
      env(v, og2, 0.003, 0.10, 0.07, 0.004);
      // 细流：白噪 → 带通 900Hz，0.22 秒柔和起伏（无低频浑浊）
      const n = v.noise('white');
      const bp = v.bq('bandpass', 900, 1.1);
      const lfo = v.osc('sine', 9);
      const lg = v.gainVal(220);
      lfo.connect(lg); lg.connect(bp.frequency);
      const hp = v.bq('highpass', 520, 0.7);
      const ng = v.gainVal(0);
      n.connect(bp); bp.connect(hp); hp.connect(ng); ng.connect(v.out);
      env(v, ng, 0.012, 0.09, 0.07, 0.10);
      v.play(o, t, t + 0.19);
      v.play(o2, t + 0.06, t + 0.18);
      v.play(n, t, t + 0.24);
      v.play(lfo, t, t + 0.24);
      v.commit();
    }
    /** 岩：正弦 80Hz + 布朗噪声 → 低通 150Hz，A 0.02 / R 0.3 */
    function sfxRock() {
      const v = makeVoice('element', 0.32);
      if (!v) return;
      const t = v.t;
      const o = v.osc('sine', 80);
      const n = v.noise('brown');
      const mo = v.gainVal(0.45), mn = v.gainVal(0.55);
      const lp = v.bq('lowpass', 150, 0.9);
      const g = v.gainVal(0);
      o.connect(mo); mo.connect(lp);
      n.connect(mn); mn.connect(lp);
      lp.connect(g); g.connect(v.out);
      env(v, g, 0.02, 0.3, 0.5, 0);
      v.play(o, t, t + 0.32);
      v.play(n, t, t + 0.32);
      v.commit();
    }
    /** 结冰共用合成器（冰单吃 / 水+冰冻结共用）：
     *  - 起音：快速、短促的高频冰晶「咔/叮」（三角波快速下滑 + 低通削刺）
     *  - 中段：带通噪声细碎霜冻蔓延「嚓嚓/嘶」，22Hz 微幅颗粒起伏，音量略低于起音
     *  - 低频：很轻的冻结冲击，给「冻住」的重量感，但不闷
     *  - 尾音：在 dur 时刻干净收住，无长混响
     *  每次播放音高轻微随机，避免重复听腻。 */
    function buildFreeze(v, t, dur, level) {
      const mul = level == null ? 1 : level;
      const pitch = 2600 + Math.random() * 500;          // 高频音高轻微随机
      // —— 起音：冰晶「叮」，快速下滑 ——
      const o = v.osc('triangle', pitch);
      sweep(o.frequency, pitch, pitch * 0.78, t, 0.12);
      const lp = v.bq('lowpass', 5600, 0.7);
      const og = v.gainVal(0);
      o.connect(og); og.connect(lp); lp.connect(v.out);
      env(v, og, 0.003, 0.12, 0.16 * mul, 0.02);
      // —— 起音颗粒：三枚极短冰晶「咔」 ——
      for (let i = 0; i < 3; i++) {
        const st = t + i * 0.024 + Math.random() * 0.01;
        const n = v.noise('white');
        const bp = v.bq('bandpass', 2600 + Math.random() * 1400, 2.8);
        const ng = v.gainVal(0);
        n.connect(bp); bp.connect(ng); ng.connect(v.out);
        ng.gain.setValueAtTime(0.0001, st);
        ng.gain.linearRampToValueAtTime((0.08 + Math.random() * 0.03) * mul, st + 0.002);
        ng.gain.linearRampToValueAtTime(0.0001, st + 0.04);
        v.play(n, st, st + 0.06);
      }
      // —— 中段：霜冻蔓延（带通噪声 + 22Hz 微幅颗粒起伏） ——
      const frost = v.noise('white');
      const bp = v.bq('bandpass', 2200, 0.9);
      sweep(bp.frequency, 2400, 2000, t, dur);
      const fg = v.gainVal(0);

    function buildGrassRustle(v, t, dur, weak, gainMul) {

      bp.frequency.linearRampToValueAtTime(weak ? 2600 : 1800, t + dur * 0.45);
      bp.frequency.linearRampToValueAtTime(weak ? 1300 : 900, t + dur);

          Math.max(0, dur - 0.10 - dur * 0.35));

      env(v, bg, 0.12, dur * 0.3, (weak ? 0.018 : 0.04) * mul,
          Math.max(0, dur - 0.12 - dur * 0.3));

      v.play(lfo, t, t + dur);

    /** 循环声部统一释放：短淡出 → stop 全节点 → 销毁（绝不残留）。
     *  暂停中音频时钟冻结，任何淡出排程都要等恢复后才执行、会与新起的循环重叠；
     *  此时直接释放节点（上下文已挂起，不会产生可闻爆音），恢复后按当前状态重新起播。 */
    function releaseLoopVoice(v, fade) {
      if (!v) return;
      const f = Math.max(0.01, fade == null ? 0.1 : fade);
      if (!ctx || pausedFlag) {
        for (const s of v.sources) { try { s.stop(); } catch (e) { /* 已停止 */ } }
        v.dispose();
        return;
      }
      const t = ctx.currentTime;
      try {
        v.out.gain.cancelScheduledValues(t);
        v.out.gain.setValueAtTime(v.out.gain.value, t);
        v.out.gain.linearRampToValueAtTime(0.0001, t + f);
      } catch (e) { /* 忽略 */ }
      for (const s of v.sources) { try { s.stop(t + f + 0.02); } catch (e) { /* 已停止 */ } }
      if (v.timer) { clearTimeout(v.timer); v.timer = 0; }
      v.timer = setTimeout(() => v.dispose(), Math.ceil((f + 0.2) * 1000));

      const bp = v.bq('bandpass', 900, 2.2);
      for (let at = 0; at < DUR - 0.05; at += 0.04) {
        bp.frequency.setValueAtTime(500 + Math.random() * 1100, t + at);
      }
      const mg = v.gainVal(0);
      m.connect(bp); bp.connect(mg); mg.connect(v.out);
      env(v, mg, 0.04, DUR * 0.4, 0.13, Math.max(0, DUR - 0.04 - DUR * 0.4));
      v.play(m, t, t + DUR);
      // —— 高层：火星爆裂细节 ——
      for (let i = 0; i < 10; i++) {
        const st = t + 0.1 + Math.random() * (DUR - 0.4);
        const s = v.noise('white');
        const hp = v.bq('highpass', 4200, 0.9);
        const sg = v.gainVal(0);
        s.connect(hp); hp.connect(sg); sg.connect(v.out);
        sg.gain.setValueAtTime(0.0001, st);
        sg.gain.linearRampToValueAtTime(0.02 + Math.random() * 0.04, st + 0.003);
        sg.gain.linearRampToValueAtTime(0.0001, st + 0.025);
        v.play(s, st, st + 0.035);
      }
      // —— 空间回荡：反馈延迟（湿声送回总线，尾部自然衰减）——
      const d = ctx.createDelay(1.0);
      d.delayTime.value = 0.19;
      const fb = ctx.createGain(); fb.gain.value = 0.3;
      const wet = ctx.createGain(); wet.gain.value = 0.22;
      d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(v.out);
      v.nodes.push(d, fb, wet);
      bg.connect(d); mg.connect(d);
      v.tailExtra = 0.6;
      v.commit();
    }
    /** 20. 水+雷 雷滞身僵：高频方波 + 不规则断续音量调制（极度麻痹的电流「滋滋」抽搐），高通切低频 */
    function sfxShock() {
      const DUR = 0.6;
      const v = makeVoice('reaction', DUR);
      if (!v) return;
      const t = v.t;
      const o = v.osc('square', 2800);
      const hp = v.bq('highpass', 1200, 0.8);
      const g = v.gainVal(0);
      o.connect(hp); hp.connect(g); g.connect(v.out);
      // 随机通断：不规则的电流抽搐（绝无规则节拍感）
      g.gain.setValueAtTime(0.0001, t);
      let at = 0;
      while (at < DUR - 0.02) {
        const on = Math.random() < 0.72;
        g.gain.setValueAtTime(on ? 0.16 + Math.random() * 0.08 : 0.0001, t + at);
        at += 0.018 + Math.random() * 0.032;
      }
      g.gain.setValueAtTime(0.0001, t + DUR);
      // 高频白噪电流嘶声
      const n = v.noise('white');
      const hp2 = v.bq('highpass', 3000, 1.0);
      const ng = v.gainVal(0);
      n.connect(hp2); hp2.connect(ng); ng.connect(v.out);
      env(v, ng, 0.01, DUR * 0.5, 0.05, Math.max(0, DUR - 0.01 - DUR * 0.5));
      v.play(o, t, t + DUR);
      v.play(n, t, t + DUR);
      v.commit();
    }
    /** 21. 雷+冰 溯回之厄：方波 + 白噪声，Gain 突变断音模拟卡带故障，0.4s */
    function sfxNetlag() {
      const v = makeVoice('reaction', 0.4);
      if (!v) return;
      const t = v.t;
      const o = v.osc('square', 1600);
      const n = v.noise('white');
      const mo = v.gainVal(0.8), mn = v.gainVal(0.5);
      const g = v.gainVal(0);
      o.connect(mo); mo.connect(g);
      n.connect(mn); mn.connect(g);
      g.connect(v.out);
      g.gain.setValueAtTime(0.0001, t);
      let at = 0;
      while (at < 0.38) {
        g.gain.setValueAtTime(Math.random() < 0.62 ? 0.26 : 0.0001, t + at);
        at += 0.025 + Math.random() * 0.045;
      }
      g.gain.setValueAtTime(0.0001, t + 0.4);
      v.play(o, t, t + 0.4);
      v.play(n, t, t + 0.4);
      v.commit();
    }
    /** 22. 冰+雷「溯回之厄」：每一次强制回退瞬间 —— 网络卡顿 / 电视雪花干扰（0.2 秒，一次回退一响）
     *  短促电流「哔/滋」起音 + 极短「沙/啦」噪声断续颗粒 + 快速收尾；
     *  不循环、不拖尾、不刺耳、不爆音，绝不盖过倒退反馈。 */
    function sfxRollback() {
      const DUR = 0.2;
      const v = makeVoice('reaction', DUR);
      if (!v) return;
      const t = v.t;
      // 电流「哔」：两组极短高频方波快速下滑，低通削掉刺耳谐波
      for (let i = 0; i < 2; i++) {
        const st = t + i * 0.032;
        const f = 1800 + Math.random() * 700;
        const o = v.osc('square', f);
        sweep(o.frequency, f, f * 0.72, st, 0.03);
        const lp = v.bq('lowpass', 4000, 0.8);
        const og = v.gainVal(0);
        o.connect(og); og.connect(lp); lp.connect(v.out);
        og.gain.setValueAtTime(0.0001, st);
        og.gain.linearRampToValueAtTime(0.10, st + 0.002);
        og.gain.linearRampToValueAtTime(0.0001, st + 0.026);
        v.play(o, st, st + 0.035);
      }
      // 干扰「沙/啦」：白噪 → 高通 + 带通，断续颗粒后快速衰减
      const n = v.noise('white');
      const hp = v.bq('highpass', 700, 0.7);
      const bp = v.bq('bandpass', 2600, 0.8);
      const g = v.gainVal(0);
      n.connect(hp); hp.connect(bp); bp.connect(g); g.connect(v.out);
      let at = 0;
      while (at < 0.15) {
        g.gain.setValueAtTime(Math.random() < 0.7 ? 0.14 : 0.0001, t + at);
        at += 0.02 + Math.random() * 0.03;
      }
      g.gain.setValueAtTime(0.0001, t + 0.17);
      // 电视雪花底噪：极轻布朗噪声，给一点机身厚度（不闷、不拖）
      const b = v.noise('brown');
      const bl = v.bq('lowpass', 320, 0.9);
      const bg = v.gainVal(0);
      b.connect(bl); bl.connect(bg); bg.connect(v.out);
      env(v, bg, 0.004, 0.12, 0.05, 0.01);
      v.play(n, t, t + 0.18);
      v.play(b, t, t + 0.18);
      v.commit();
      rollbackVoice = v;                 // 记录当前回退声部：重开 / 切难度 / 死亡时可立即停止并释放
    }

    /* ---------- 音效路由表（类型 → 合成函数 + 所属总线） ---------- */
    const SFX = {
      jump: [sfxJump, 'jump'], flap: [sfxJump, 'jump'], coin: [sfxCoin, 'coin'],
      hurt: [sfxHurt, 'jump'],
      wind: [sfxWind, 'element'], fire: [sfxFire, 'element'], water: [sfxWater, 'element'],
      rock: [sfxRock, 'element'], ice: [sfxIce, 'element'], thunder: [sfxThunder, 'element'],
      grass: [sfxGrass, 'element'],
      steam: [sfxSteam, 'reaction'], void: [sfxVoid, 'reaction'], vine: [sfxVine, 'reaction'],
      slide: [sfxSlide, 'reaction'], gold: [sfxGold, 'reaction'],
      meltFlash: [sfxMeltFlash, 'reaction'], melt: [sfxMelt, 'reaction'],
      collapse: [sfxCollapse, 'reaction'],
      char: [sfxChar, 'reaction'], charBurn: [sfxCharBurn, 'reaction'],
      icecrack: [sfxIcecrack, 'reaction'], iceShard: [sfxIceShard, 'reaction'],
      erode: [sfxErode, 'reaction'], overload: [sfxOverload, 'reaction'],
      lag: [sfxLag, 'reaction'], mud: [sfxMud, 'reaction'], magma: [sfxMagma, 'reaction'],
      cruise: [sfxCruise, 'reaction'], turb: [sfxTurb, 'reaction'], fog: [sfxFog, 'reaction'],
      emfield: [sfxEmfield, 'reaction'], shock: [sfxShock, 'reaction'],
      netlag: [sfxNetlag, 'reaction'], netlagRollback: [sfxRollback, 'reaction'],
      quake: [sfxQuake, 'reaction'], press: [sfxPress, 'reaction']
    };

    /* ---------- 对外接口 ---------- */
    function play(type) {
      if (cfg.muted || pausedFlag) return;                     // 静音 / 暂停：不创建任何节点
      const e = SFX[type];
      if (!e) return;
      const bus = e[1];
      if (cfg.master <= 0) return;
      if (bus === 'jump' && cfg.jump <= 0) return;
      if (bus === 'coin' && cfg.coin <= 0) return;
      if (bus === 'reaction' && cfg.reaction <= 0) return;
      if (!ensureCtx()) return;
      stats.lastType = type;
      e[0]();
    }
    /** 防抖播放：事件类音效（叠柱碎裂 / 逐柱点燃 / 淬火）在 minGap 秒内最多触发一次，
     *  既保证每个事件都有声音，又避免同帧多根柱子叠成爆音、拖垮移动端。 */
    function playThrottled(type, minGap) {
      if (cfg.muted || pausedFlag) return;
      if (!SFX[type]) return;
      if (!ensureCtx()) return;
      const now = ctx.currentTime;
      const gap = Math.max(0, minGap || 0);
      if (lastAt[type] != null && now - lastAt[type] < gap) return;
      lastAt[type] = now;
      play(type);
    }
    function setVolume(key, val) {
      if (KEYS.indexOf(key) < 0) return;
      const n = Math.round(Number(val));
      if (!isFinite(n)) return;
      cfg[key] = clamp(n, 0, 100);
      saveCfg();
      applyVolumes(false);
    }
    function setMuted(flag) {
      cfg.muted = !!flag;
      saveCfg();
      applyVolumes(false);
    }

    loadCfg();

    return {
      play,
      playThrottled,
      unlock() { ensureCtx(); },
      pause: pauseAudio,
      resume: resumeAudio,
      startLagLoop,
      stopLagLoop,
      startQuakeLoop,
      stopQuakeLoop,
      stopLoops,
      setVolume,
      setMuted,
      toggleMute() { setMuted(!cfg.muted); return cfg.muted; },
      getConfig() { return { master: cfg.master, jump: cfg.jump, coin: cfg.coin,
                             reaction: cfg.reaction, muted: cfg.muted }; },
      resetCoinPitch() { coinLast = -1; lastMaxTone = -1; },
      coinFreq,
      getStats() {
        return { created: stats.created, disposed: stats.disposed, active: active.size,
                 peak: stats.peak, lastType: stats.lastType, lastDur: stats.lastDur,
                 lastJumpCutoff: stats.lastJumpCutoff,
                 ctxState: ctx ? ctx.state : 'none' };
      },
      _keys: Object.keys(SFX)
    };
  })();

  /** 解锁音频：必须在用户手势（点击/按键）内调用一次，之后方可出声 */
  function unlockAudio() { AudioManager.unlock(); }
  /** 统一音效入口：元素附着 / 21 种反应 / 跳跃 / 金币全部交给 AudioManager 实时合成 */
  function playSound(type) { AudioManager.play(type); }
  /** 事件类音效入口：同类型在 gap 秒内只响一次（柱碎 / 逐柱点燃 / 淬火 防抖） */
  function playSoundThrottled(type, gap) { AudioManager.playThrottled(type, gap); }

  /**
   * 草元素启动：吃到草瞬间，在接下来 3 个连续「空地」一次性生成 3 个四叶印。
   * 术语：「空地」= 上一组柱子与下一组柱子之间的横向空旷区；
   *       「缝隙」= 同一组柱子中上下两根柱子之间的缺口（严禁生成印记）。
   * 印记 X 一律在小鸟前方至少 300px 开外的空地中点（绝不贴脸、绝不进缝隙），
   * Y 在屏幕安全高度内随机；3 个印记在吃到草的瞬间一次性生成（总数 3）。
   */
  function startGrass() {
    grassT = CFG.GRASS_TIME;
    grassNodes = [];
    grassDash = null;
    grassDashT = 0;
    grassEaten = 0;
    grassFlyT = -1;                                      // 尚未起飞：5 秒倒计时未启动
    spawnGrassNodes();                                   // 一次性生成 3 个（接下来 3 个连续空地）
    if (grassNodes.length === 0) endGrass();             // 极端情况无空地可放：立即恢复，绝不锁死
  }

  /**
   * 一次性生成 3 个四叶印：取小鸟前方「3 个连续空地」（相邻两组柱子之间）的正中点。
   * 空地序列由现有管道 + 按生成节奏向右虚拟延伸组成（相对间距恒定 350，未来管道
   * 落位与虚拟位置严格一致）；第 1 个节点距小鸟 ≥300px，绝不贴脸、绝不进「缝隙」。
   * 节点随世界同步左移，X 永远保持在两管正中（与左右管壁净距 ≈139px，永不卡管体）。
   * Y 在屏幕安全高度内随机。
   */
  function spawnGrassNodes() {
    const yMin = ceilingBoundY() + CFG.BIRD_R + 60;                    // 绝不生成在天花板上方
    const yMax = CFG.H - CFG.GROUND_H - CFG.BIRD_R - 60;               // 绝不生成在草地内部
    const MIN_AHEAD = 300;                               // 第 1 个节点必须在小鸟前方 300px 开外
    const xs = pipes.map(p => p.x).sort((a, b) => a - b);
    if (xs.length === 0) xs.push(CFG.W);
    while (xs[xs.length - 1] < CFG.W + CFG.PIPE_SPACING * 3) {   // 向右虚拟补足连续空地
      xs.push(xs[xs.length - 1] + CFG.PIPE_SPACING);
    }
    const mids = [];
    for (let i = 0; i + 1 < xs.length && mids.length < 3; i++) {
      const mid = (xs[i] + CFG.PIPE_W + xs[i + 1]) / 2;    // 空地正中：左管右缘 ~ 右管左缘
      if (mid >= bird.x + MIN_AHEAD) mids.push(mid);
    }
    for (const mx of mids) {
      let ny = yMin + Math.random() * (yMax - yMin);
      for (let tries = 0; tries < 12; tries++) {           // 防重叠铁律：四叶印绝对禁止与元素球/盲盒重叠生成
        const clash = orbs.some(o => Math.abs(o.x - mx) < 70 && Math.abs(o.y - ny) < 70);
        if (!clash) break;
        ny = yMin + Math.random() * (yMax - yMin);         // 冲突则重随 Y（X 锁定空地正中不动）
      }
      grassNodes.push({ x: mx, y: ny, phase: Math.random() * Math.PI * 2, taken: false });
    }
  }

  /**
   * 雷+草：一次性生成 7 个紫色雷系四叶印 —— 坐标硬性规则：
   *   X = 两组管道之间「空地」的精准中线：(左管右缘 + 右管左缘) / 2（与左右管壁净距恒为 139px）；
   *   Y = 右侧那组管道「缝隙」的精准中心：topH + (PIPE_GAP + erodeCut) / 2。
   * 因此雷印（以及小鸟的直线飞行轨迹）绝对不可能落在任何柱子实体范围内。
   * 反应期间世界由 shiftWorld 驱动且位移会喂给 spawnTimer，新管道仍按 350 晶格从右缘生成，
   * 故对右侧尚未生成的「虚拟晶格管」预生成缝隙高度并登记到 cruiseGapQueue，
   * spawnPipe() 按生成顺序逐一消费，保证实际管子的缝隙中心与雷印 Y 严格重合。
   */
  function rollPipeTopH() {
    const minTop = ceilingBoundY() + CFG.PIPE_MARGIN;
    const maxTop = CFG.H - CFG.GROUND_H - CFG.PIPE_MARGIN - CFG.PIPE_GAP;
    return minTop + Math.random() * (maxTop - minTop);
  }

  function spawnCruiseSeals() {
    cruiseSeals = [];
    cruiseGapQueue = [];
    const MIN_AHEAD = 300;                               // 第 1 个雷印必须在小鸟前方 300px 开外
    const COUNT = CFG.REACT_CRUISE_SEALS;
    const SP = CFG.PIPE_SPACING;

    // 1) 真实管道按 x 排序（间距恒为 350 的晶格），并建 x → pipe 查询
    const real = pipes.slice().sort((a, b) => a.x - b.x);
    const byX = new Map();
    for (const p of real) byX.set(Math.round(p.x), p);

    // 2) 向右虚拟延伸晶格节点（未来按正常节奏生成的管子必落在这些节点上）
    const anchorX = real.length ? real[real.length - 1].x : CFG.W;
    const nodes = real.map(p => Math.round(p.x));
    const presets = new Map();                           // 虚拟节点 x → 预生成缝隙高度 topH
    let vx = anchorX + SP;
    while (vx < CFG.W + SP * (COUNT + 3)) {
      nodes.push(Math.round(vx));
      presets.set(Math.round(vx), rollPipeTopH());
      vx += SP;
    }
    nodes.sort((a, b) => a - b);

    // 3) 依次取小鸟前方连续 7 个空地；X=空地中线，Y=右侧管子缝隙中心
    let lastVirtualOrdinal = -1;
    const virtualNodeXs = [...presets.keys()].sort((a, b) => a - b);
    for (let i = 0; i + 1 < nodes.length && cruiseSeals.length < COUNT; i++) {
      const leftX = nodes[i], rightX = nodes[i + 1];
      const mid = (leftX + CFG.PIPE_W + rightX) / 2;     // 空地精准中线
      if (mid < bird.x + MIN_AHEAD) continue;

      let topH, cut = 0;
      const rightPipe = byX.get(Math.round(rightX));
      if (rightPipe) {
        topH = rightPipe.topH;                           // 右侧是已存在的真实管 → 读真实缝隙
        cut = rightPipe.erodeCut || 0;
      } else {
        topH = presets.get(Math.round(rightX));          // 右侧是未来晶格管 → 取预生成缝隙
        if (topH === undefined) topH = rollPipeTopH();
        const ord = virtualNodeXs.indexOf(Math.round(rightX));
        if (ord > lastVirtualOrdinal) lastVirtualOrdinal = ord;
      }
      const cy = topH + (CFG.PIPE_GAP + cut) / 2;        // 缝隙精准中心
      cruiseSeals.push({ x: mid, y: cy, taken: false, ph: Math.random() * 6.283 });
    }

    // 4) 登记「从最近一根未来管起、到最后一枚雷印右侧管为止」的预生成缝隙队列
    //    spawnPipe 严格按生成顺序 FIFO 消费（多余的前段预生成只相当于把随机提前，无副作用）
    for (let k = 0; k <= lastVirtualOrdinal; k++) cruiseGapQueue.push(presets.get(virtualNodeXs[k]));
  }

  /** 草元素结束：立刻解除操作锁死，清空一切残留节点，恢复重力与点击跳跃（vy 重置防惯性出屏）。
      落地缓冲：钩锁状态结束（吃完 3 个正常结束 / 5 秒强制解锁）瞬间赋予 0.5 秒绝对无敌帧，
      防止落地瞬间撞管子；UI 附着条不归零——12 秒附着计时独立走完（与物理锁死严格分离）。 */
  function endGrass(allDone) {
    grassT = 0;
    grassNodes = [];
    grassDash = null;
    grassDashT = 0;
    grassFlyT = -1;                                      // 5 秒计时一并复位
    if (allDone) {
      // 【铁律六】3 个四叶印全部飞完：额外 2 秒绝对无敌 + 1 秒不可吸收元素状态
      bird.invincible = Math.max(bird.invincible, CFG.GRASS_END_INV);
      absorbBlockT = Math.max(absorbBlockT, CFG.GRASS_END_BLOCK);
    } else {
      bird.invincible = Math.max(bird.invincible, 30);   // 0.5 秒落地绝对无敌缓冲（高频闪烁）
    }
    bird.vy = -2;                                        // 温和上飘，绝不因惯性飞出屏幕
  }

  /** 风元素扁平穹顶几何：上/下管口穹顶的水平跨度与管口面位置（判定与绘制共用） */
  function windBandGeom(p) {
    return {
      x0: p.x - CFG.WIND_DOME_EXT,                         // 比管口左右各宽出延伸量
      x1: p.x + CFG.PIPE_W + CFG.WIND_DOME_EXT,
      top: p.topH,                                         // 上管口面（穹顶向下凸 v）
      bot: p.topH + CFG.PIPE_GAP                           // 下管口面（穹顶向上凸 ^）
    };
  }

  /**
   * 风穹顶「危险感应区」判定 + 引导目标（免死与坐标引导共用同一几何）：
   * 小鸟判定框与「靠缝隙 1/3 隐形判定框」实际接触 → 返回引导目标（缝隙正中心），否则 null。
   *   判定高度铁律：垂直触发范围严格限制在每根管子【靠近缝隙侧的 1/3 高度】以内
   *   （上管 = 底部 1/3，下管 = 顶部 1/3）；柱体中下部绝对不触发任何引导/免死，
   *   撞到下半截柱子正常扣血。视觉白色穹顶保持原样罩在管口（渲染未改）。
   *   区A 穹顶带：横向 = 管口左侧延伸 + 感应 至 管体右缘（严格截断，不含右侧）；
   *   纵向 = 严格钳制在 1/3 判定框内；
   *   区B 柱壁侧边带：仅保留贴管道左壁 15px（玩家还未飞过的一侧）；纵向 = 仅与 1/3 判定框重叠才生效。
   *   右侧截断铁律：小鸟一旦飞过管体右缘（bird.x - hitR > p.x + PIPE_W），
   *   立刻彻底失去一切吸附/推力/免死，可自由上下跳跃或下坠，绝不被气流罩拉回。
   */
  /** 火+冰：轨迹融化通道免伤判定 —— 洞的物理判定半径 = 小鸟本体 1.5 倍，洞内绝对安全 */
  function meltScarSafe(p) {
    if (!p.meltTrack || p.meltTrack.length === 0) return false;
    const lx = bird.x - p.x;                       // 小鸟在柱体局部坐标系里的位置
    for (const s of p.meltTrack) {
      const dx = lx - s.x, dy = bird.y - s.y;
      const rr = s.r * 0.92;                       // 略收 8%，边缘不产生「擦边也免死」的虚胖判定
      if (dx * dx + dy * dy < rr * rr) return true;
    }
    return false;
  }

  function windGuideTarget(p) {
    const hitR = CFG.BIRD_R * CFG.HIT_SCALE;
    const m = CFG.WIND_SENSE;                                   // 15px 提前感应带（仅横向与管口面保留）
    const rQ = Math.round((CFG.WIND_DOME_EXT + m) / 4);         // 右侧判定缩减为原范围(70px)的 1/4 ≈ 18px 极小防撞保护
    // —— 右侧截断：飞过管体右缘超过 1/4 保护带 → 彻底不判定（立刻摆脱吸附）——
    if (bird.x - hitR > p.x + CFG.PIPE_W + rQ) return null;
    const top = p.topH;
    const bot = p.topH + CFG.PIPE_GAP;
    const cx = p.x + CFG.PIPE_W / 2;                            // 缝隙正中心 X
    const cy = (top + bot) / 2;                                 // 缝隙正中心 Y
    // —— 「靠缝隙 1/3」隐形判定框（严格 33% 管高）——
    const hTop = top;                                           // 上管可见高度（y ∈ [0, top]）
    const hBot = CFG.H - CFG.GROUND_H - bot;                    // 下管可见高度（y ∈ [bot, 地面]）
    const top3rdY0 = top - hTop / 3;                            // 上管保护框：仅 [top - hTop/3, top]
    const bot3rdY1 = bot + hBot / 3;                            // 下管保护框：仅 [bot, bot + hBot/3]
    // —— 区A：穹顶带（横向 = 管口左侧延伸 至 右缘 + 1/4 保护带截断；纵向严格限制在 1/3 判定框 + 管口面）——
    const ax0 = p.x - CFG.WIND_DOME_EXT - m;
    const ax1 = p.x + CFG.PIPE_W + rQ;                          // 右缘仅保留 1/4 极小防撞保护
    if (bird.x + hitR > ax0 && bird.x - hitR < ax1) {
      const nearTop = bird.y + hitR > top3rdY0 && bird.y - hitR < top + m;   // 上管 1/3 框（含管口面）
      const nearBot = bird.y + hitR > bot - m && bird.y - hitR < bot3rdY1;   // 下管 1/3 框（含管口面）
      if (nearTop || nearBot) return { x: cx, y: cy };
    }
    // —— 区B：柱壁侧边感应带（左壁 15px 强判定 + 右壁 1/4 弱保护，纵向严格与 1/3 判定框重叠）——
    const byWallL = bird.x + hitR > p.x - m && bird.x - hitR < p.x + m;
    const byWallR = bird.x + hitR > p.x + CFG.PIPE_W - m && bird.x - hitR < p.x + CFG.PIPE_W + rQ;
    if (byWallL || byWallR) {
      const inTop3rd = bird.y + hitR > top3rdY0 && bird.y - hitR < top;      // 上管底部 1/3 段
      const inBot3rd = bird.y + hitR > bot && bird.y - hitR < bot3rdY1;      // 下管顶部 1/3 段
      if (inTop3rd || inBot3rd) return { x: cx, y: cy };
    }
    return null;
  }

  /** 生成一块管道碎片（碎裂粒子）：小矩形，带随机速度 / 旋转，受重力坠落 */
  function makeShard(x, y, kind) {
    return {
      x, y, kind: kind || 'pipe',
      w: 4 + Math.random() * 7,
      h: 4 + Math.random() * 7,
      vx: (Math.random() - 0.3) * 2.4,
      vy: -2.5 + Math.random() * 3.5,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      t: 42, max: 42
    };
  }

  /** 火+岩：不规则多边形岩石碎块（5~7 顶点、长宽比随机 → 有长有短，绝不为单一矩形）
   *  hot = true 时是撞击点附近被岩浆灼烧的碎块（深灰底 + 暗红熔痕） */
  function makeRockShard(x, y, hot) {
    const n = 5 + Math.floor(Math.random() * 3);
    const base = 2.6 + Math.random() * 7.2;
    const stretch = 0.42 + Math.random() * 1.95;        // 有细长的、也有块状的
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.95;
      const rr = base * (0.5 + Math.random() * 0.85);
      pts.push([Math.cos(a) * rr * stretch, Math.sin(a) * rr]);
    }
    return {
      x, y, kind: 'magma', rock: true, hot: !!hot, pts,
      w: base * 2, h: base * 2,
      vx: -0.2 + Math.random() * 3.2,
      vy: -1.4 - Math.random() * 3.2,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.34,
      shade: 0.74 + Math.random() * 0.44,               // 每块石头明暗略有差异
      t: 40, max: 40
    };
  }

  /* ============ 水+冰：极细玻璃渣崩碎 ============
     铁律：碎片必须是「柱子原本的矩形」被真实切分出来的 —— 每片都是矩形内的多边形，
     拼起来仍是原来的矩形；单片只有 8~10px，像玻璃渣一样成片崩落，绝不再掉大块。 */

  /** 把矩形切成 n 片极细碎渣：共享顶点的抖动网格（O(n)，500 片也不会卡） */
  function glassShards(rw, rh, n, sd) {
    const h = s => { const v = Math.sin(s * 127.1 + sd * 311.7) * 43758.5453; return v - Math.floor(v); };
    const cols = Math.max(2, Math.min(14, Math.round(Math.sqrt(n * rw / Math.max(1, rh)))));
    const rows = Math.max(2, Math.ceil(n / cols));
    const cw = rw / cols, ch = rh / rows;
    // 网格顶点：内部点双向抖动，边界点只沿边界抖动 → 整根柱子的外形仍是原矩形
    const gx = [], gy = [];
    for (let r = 0; r <= rows; r++) {
      for (let c = 0; c <= cols; c++) {
        const i = r * (cols + 1) + c;
        const jx = (h(r * 3.1 + c * 7.7 + 1) - 0.5) * cw * 0.86;
        const jy = (h(r * 5.3 + c * 2.9 + 17) - 0.5) * ch * 0.86;
        const x = c * cw + (c === 0 || c === cols ? 0 : jx);
        const y = r * ch + (r === 0 || r === rows ? 0 : jy);
        gx[i] = Math.max(0, Math.min(rw, x));
        gy[i] = Math.max(0, Math.min(rh, y));
      }
    }
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const a = r * (cols + 1) + c, b = a + 1, d = a + cols + 2, e = a + cols + 1;
        const poly = [[gx[a], gy[a]], [gx[b], gy[b]], [gx[d], gy[d]], [gx[e], gy[e]]];
        let cx = 0, cy = 0;
        for (const q of poly) { cx += q[0]; cy += q[1]; }
        cx /= 4; cy /= 4;
        cells.push({ cx, cy, pts: poly.map(q => [q[0] - cx, q[1] - cy]) });
      }
    }
    return cells;
  }

  /** 水+冰：整根柱子严格按原矩形切成 500 片极细玻璃渣（微小碎片沿裂纹成片崩落） */
  function shatterIcePipe(p) {
    const groundY = CFG.H - CFG.GROUND_H;
    const gb = p.topH + CFG.PIPE_GAP;
    const hTop = Math.max(0, p.topH);
    const hBot = Math.max(0, groundY - gb);
    const total = hTop + hBot;
    if (total < 24) return;
    // 【音效】柱子碎掉动画的同一帧播放「玻璃碎裂」；
    // 0.06s 防抖只合并同帧批量碎裂（触发瞬间全屏柱子同时碎），后续逐根入场的柱子间距远大于该值，绝不会被吞掉。
    playSoundThrottled('iceShard', 0.06);
    const SHARDS = 500;                                    // 每根柱子固定崩成 500 片
    let nTop = hTop > 24 ? Math.max(12, Math.round(SHARDS * hTop / total)) : 0;
    let nBot = hBot > 24 ? Math.max(12, SHARDS - nTop) : 0;
    if (!nTop) nBot = SHARDS;
    const sd = p.seed || 0;
    const cellsT = nTop ? glassShards(CFG.PIPE_W, hTop, nTop, sd) : [];
    const cellsB = nBot ? glassShards(CFG.PIPE_W, hBot, nBot, sd + 3.7) : [];
    const pushCell = (c, oy) => {
      const outx = (c.cx / CFG.PIPE_W - 0.5) * 1.7;       // 向柱体两侧崩开
      // —— 最终定案：约 3/4 的碎片原地化为粉尘状消散（不坠落、只收缩变淡）——
      if (Math.random() < 0.75) {
        const dlife = 30 + Math.random() * 26;
        pipeDebris.push({
          x: p.x + c.cx, y: oy + c.cy, kind: 'ice', shard: true, dust: true,
          pts: c.pts,
          vx: outx * 0.32 + (Math.random() - 0.5) * 0.5,
          vy: -0.32 + Math.random() * 0.66,
          g: -0.004,
          rot: 0, vr: (Math.random() - 0.5) * 0.032,
          t: dlife, max: dlife
        });
        return;
      }
      // —— 其余 1/4 正常崩落坠地 ——
      const life = 144 + Math.random() * 20;               // 碎裂动画总时长再 +0.5 秒（总计约 2.4~2.7s，崩得更充分）
      // 独立速度：向右飞散 + 向下坠落，完全脱离柱子的世界左移速度与销毁判定
      pipeDebris.push({
        x: p.x + c.cx, y: oy + c.cy, kind: 'ice', shard: true,
        pts: c.pts,
        vx: 0.55 + outx + (Math.random() - 0.5) * 1.5,
        vy: -1.5 + Math.random() * 3.8,
        g: 0.17,
        rot: 0, vr: (Math.random() - 0.5) * 0.09,
        t: life, max: life
      });
    };
    for (const c of cellsT) pushCell(c, 0);
    for (const c of cellsB) pushCell(c, gb);
    // 崩碎瞬间的冰晶粉尘：细碎、向四周飞散后迅速淡出（与碎片同步"化为冰晶"）
    for (let i = 0; i < 96; i++) {
      const up = Math.random() < 0.5;
      const life = 26 + Math.random() * 26;
      pipeDebris.push({
        x: p.x + Math.random() * CFG.PIPE_W,
        y: up ? Math.random() * hTop : gb + Math.random() * hBot,
        kind: 'ice', crystal: true, r: 0.8 + Math.random() * 1.6,
        vx: (Math.random() - 0.5) * 3.6, vy: -1.6 + Math.random() * 3.2, g: 0.10,
        rot: 0, vr: 0, t: life, max: life
      });
    }
  }

  /** 【Bug1】雷+岩铺币：一次性在屏幕绝对世界坐标铺满金币（不吸附、不跟随小鸟） */
  function voidFillCoins() {
    const groundY = CFG.H - CFG.GROUND_H;
    for (let gx = 30; gx < CFG.W - 8; gx += 58) {
      for (let gy = 38; gy < groundY - 24; gy += 58) {
        spawnCoin(gx + (Math.random() - 0.5) * 22, gy + (Math.random() - 0.5) * 22, false, 0, undefined, true);
      }
    }
  }

  /** 【Bug1】雷+岩续币：右缘持续补入世界坐标金币，随背景左移（绝不磁吸） */
  function voidRefillCoins() {
    const groundY = CFG.H - CFG.GROUND_H;
    for (let gy = 38; gy < groundY - 24; gy += 58) {
      spawnCoin(CFG.W + 12 + Math.random() * 10, gy + (Math.random() - 0.5) * 18, false, 0, undefined, true);
    }
  }

  /** 动态倒计时：预估小鸟飞到前方第 6 根柱子所需帧数（水+冰 / 风+岩 / 火+雷演出时长） */
  function framesToSixth() {
    const ahead = pipes.filter(p => p.x + CFG.PIPE_W > bird.x - 4).sort((a, b) => a.x - b.x);
    let x6;
    if (ahead.length >= 6) x6 = ahead[5].x + CFG.PIPE_W;
    else {
      const lastX = ahead.length ? ahead[ahead.length - 1].x + CFG.PIPE_W : bird.x;
      x6 = lastX + (6 - ahead.length) * CFG.PIPE_SPACING;
    }
    const dist = Math.max(0, x6 - bird.x);
    const spd = Math.max(0.6, CFG.PIPE_SPEED * speedMulNow);
    return Math.max(150, Math.min(480, Math.round(dist / spd)));
  }

  /**
   * 【水+冰 / 风+岩】锁定小鸟前方「原本就已经存在」的 6 组管道（一组 = 上柱 + 缝隙 + 下柱）。
   * 铁律：绝不补生成、绝不重排、绝不压缩间距 —— 特效对象只能是游戏中本来就在左移的管道；
   * 特效播完该位置就是空的。已在视野内的组立刻施加特效；
   * 尚未进入视野的组数记入 fxQueue，等它们从右缘进场的瞬间再施加（见 stepFxQueue）。
   */
  function lockSixAhead(kind) {
    const N = CFG.REACT_SIX_PIPES;
    const ahead = pipes.filter(p => p.x + CFG.PIPE_W > bird.x - 4).sort((a, b) => a.x - b.x);
    const now = ahead.slice(0, N);
    for (const p of now) applyPipeFx(p, kind);
    fxQueue[kind] = Math.max(0, N - now.length);
    return now;
  }

  /** 对单组管道挂上冰裂 / 风化特效；每组的动画进度独立计时（p.iceT / p.erodeT），互不影响 */
  function applyPipeFx(p, kind) {
    if (kind === 'ice') {
      if (p.iceApplied) return;
      p.iceApplied = true; p.iceT = 0; p.iceDeep = 0; p.iceGone = false;
    } else {
      if (p.erodeOn) return;
      const shapes = ['M', 'V', 'C'];
      p.erodeOn = true; p.erodeT = 0; p.erodeP = 0;
      p.erodeFade = 0; p.erodeCut = 0;
      p.erodeType = shapes[Math.floor(Math.random() * shapes.length)];   // W / V / M 随机蚀形
      // 记录第 6 组（最后一组）：它被小鸟飞过的瞬间，就是全屏石化统一消散的时刻
      erodeApplyN++;
      if (erodeApplyN === CFG.REACT_SIX_PIPES) { p.erodeIsSixth = true; erodeSixth = p; }
    }
  }

  /** 延迟触发：待生效的组数里，谁刚从右缘进入视野，就立刻在进场那一帧施加特效；第 7 组及以后永不受影响 */
  function stepFxQueue() {
    for (const kind of ['ice', 'erode']) {
      if (fxQueue[kind] <= 0) continue;
      for (const p of pipes) {
        if (fxQueue[kind] <= 0) break;
        if (p.x + CFG.PIPE_W <= bird.x - 4) continue;                  // 已被小鸟飞过的跳过
        if (p.x >= CFG.W) continue;                                    // 还没进入视野：不提前施加
        if (kind === 'ice' ? p.iceApplied : p.erodeOn) continue;
        applyPipeFx(p, kind);
        // 【音效】水+冰：新柱子从右缘进场的同一帧=冻结动画开始 → 同步播放冻结「咔嚓叮」
        if (kind === 'ice') playSoundThrottled('icecrack', 0.08);
        fxQueue[kind]--;
      }
    }
  }

  /** 逐帧推进每一组管道的冰裂 / 风化动画（与反应倒计时解耦，延迟入场的组也能完整播完） */
  function stepPipeFx() {
    const shatterAt = Math.round(CFG.REACT_ICECRACK_TIME / 2);          // 冰裂：1 秒裂纹蔓延后整根崩碎
    const dying = [];
    for (const p of pipes) {
      // 彩虹褪色通道：与反应特效同帧推进（褪色完成自动降级为普通柱，不再提供元素）
      stepRainbowFade(p);
      // —— 水+冰：0.5 秒颜色平滑加深 → 白裂纹蔓延 → 沿裂纹把整根柱子切成 500 片极细玻璃渣 ——
      if (p.iceApplied && !p.iceGone) {
        p.iceT = (p.iceT || 0) + 1;
        p.iceDeep = Math.min(1, p.iceT / 30);
        // 【Bug 修复】柱子离小鸟极近时，绝不能等它移出屏幕后才判定碎裂：
        // 柱体一旦完全越过小鸟（或即将被屏幕剔除），立刻在鸟身旁边当场崩碎，
        // 保证 500 片碎片始终出现在小鸟附近、完整播完。
        const passedBird = p.x + CFG.PIPE_W < bird.x - 18;
        const edgeGuard = p.x + CFG.PIPE_W < 36;
        if (p.iceT >= shatterAt || passedBird || edgeGuard) {
          shatterIcePipe(p);
          p.iceGone = true;
          p.iceApplied = false;
          p.passed = true;
          dying.push(p);
        }
      }
      // —— 风+岩：前 0.5 秒端部变淡 → 后 2 秒侵蚀向两端扩大（缝隙实际增大 60%，永久保留缺口）——
      if (p.erodeOn && !p.erodeFade) {
        p.erodeT = (p.erodeT || 0) + 1;
        p.erodeP = Math.min(1, p.erodeT / 120);
        p.erodeCut = CFG.PIPE_GAP * CFG.REACT_ERODE_EXPAND * p.erodeP;
        // 风化沙尘：极细颗粒 / 微碎屑，顺风向左下飘散（每帧 3 粒，不做大石块）
        if (p.erodeP > 0.02 && p.x > -40 && p.x < CFG.W + 40) {
          const gb3 = p.topH + CFG.PIPE_GAP;
          for (let k = 0; k < 3; k++) {
            const up = Math.random() < 0.5;
            const life = 26 + Math.random() * 24;
            const px = p.x + Math.random() * CFG.PIPE_W;
            const py = up ? p.topH - Math.random() * Math.max(6, p.erodeCut)
                          : gb3 + Math.random() * Math.max(6, p.erodeCut);
            if (Math.random() < 0.32) {
              // 微小碎屑：随风翻滚的细片
              pipeDebris.push({
                x: px, y: py, tone: 'flake',
                vx: -2.4 - Math.random() * 3.2, vy: 0.2 + Math.random() * 1.1,
                g: 0.010, size: 0.9 + Math.random() * 1.7,
                rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.34,
                life, t: life, max: life
              });
            } else {
              // 极细沙尘：短划线，沿风向倾斜
              pipeDebris.push({
                x: px, y: py, tone: 'dust',
                vx: -2.2 - Math.random() * 3.6, vy: 0.25 + Math.random() * 1.2,
                g: 0.012, size: 0.55 + Math.random() * 1.05,
                len: 1.2 + Math.random() * 3.4,
                rot: 2.86, vr: 0, life, t: life, max: life
              });
            }
          }
        }
        // 本组动画播完 → 1 秒缓慢淡出灰绿色调（缺口本身永久保留）
        if (p.erodeT >= CFG.REACT_ERODE_TIME) p.erodeFade = 60;
      }
    }
    if (dying.length) pipes = pipes.filter(p => dying.indexOf(p) === -1);

    // —— 全局石化状态机 ——
    // 未飞过第 6 组之前：全屏正常管道保持「吸收岩元素」的石化外观；
    // 飞过第 6 组之后：所有残留灰化在 1 秒内统一淡出（envRockT 交给倒计时通道处理）。
    if (petrifyOn) {
      const sixthGone = erodeSixth
        ? (pipes.indexOf(erodeSixth) === -1 || erodeSixth.x + CFG.PIPE_W < bird.x)
        : false;
      const noMore = !erodeSixth && fxQueue.erode <= 0 && (!reaction || reaction.id !== 'erode');
      if (sixthGone || noMore) {
        petrifyOn = false;
        if (envRockT > 60) envRockT = 60;                  // 1 秒统一淡出
      } else if (envRockT < 240) {
        envRockT = 240;                                    // 一直挂着，保证石化不提前褪去
      }
    }

    // 性能保护：分级限流 —— 沙尘 / 冰晶等装饰粒子单独设上限（超出丢弃最老的），
    // 冰柱碎裂的玻璃渣（shard）独立保留 6 根柱子的完整配额，绝不因为总量超限被整体删掉。
    const MAX_DUST = 720, MAX_SHARDS = 3400;
    let shardN = 0, dustN = 0;
    for (const s of pipeDebris) { if (s.shard) shardN++; else dustN++; }
    if (dustN > MAX_DUST || shardN > MAX_SHARDS) {
      let dropDust = Math.max(0, dustN - MAX_DUST);
      let dropShard = Math.max(0, shardN - MAX_SHARDS);
      const keep = [];
      for (const s of pipeDebris) {
        if (s.shard) { if (dropShard > 0) { dropShard--; continue; } }
        else if (dropDust > 0) { dropDust--; continue; }
        keep.push(s);
      }
      pipeDebris = keep;
    }
  }

  /** 【水元素铁律】只要触发含水收益（单吃水 或 任一含水反应）：未满血必回 1 血，满血则生成/续期蓝心 */
  function waterReactGain() {
    if (hp < CFG.MAX_HP) hp++;
    else blueHeartT = CFG.BLUE_HEART_TIME;
    waterGlowT = Math.max(waterGlowT, 60);
  }

  /**
   * 火+雷：雷突进 —— 完全套用「雷元素单吃」的物理位移逻辑：
   * 小鸟本体以极快速度真实向前冲刺（跨越并穿透最近的 2 组管道），落点对准下一组缝隙中线；
   * 伴随雷击碎柱，视觉全部收在小鸟身上（红色火焰拖尾 + 紫色闪电拖尾），不再生成贯穿屏幕的电弧折线。
   */
  function overloadSmash() {
    const startX = bird.x, startY = bird.y;

    // 落点：与 thunderStrike 完全一致 —— 越过管口后再留 42px 安全余量，且落点必须留在屏幕内
    const ahead = pipes.filter(p => p.x + CFG.PIPE_W > bird.x).sort((a, b) => a.x - b.x);
    const crossed = [];
    let targetX = bird.x;
    for (let i = 0; i < 2 && i < ahead.length; i++) {
      const cand = ahead[i].x + CFG.PIPE_W + 42;
      if (cand > CFG.W - 70) break;
      targetX = cand;
      crossed.push(ahead[i]);
    }

    if (crossed.length > 0) {
      // 落点高度：对准下一组未跨越管道的缝隙中线；没有则夹在屏幕中部安全带
      const next = ahead[crossed.length];
      if (next) bird.y = next.topH + CFG.PIPE_GAP / 2;
      else bird.y = Math.max(ceilingBoundY() + CFG.BIRD_R + 24, Math.min(CFG.H * 0.55, bird.y));
      bird.x = targetX;
      bird.vy = 0;
      bird.rot = -0.2;                                    // 微微抬头，衔接瞬移后的飞行姿态

      // 雷击碎柱：被穿透的每组管道上下两段各炸出 7 块焦黑碎片
      const groundY = CFG.H - CFG.GROUND_H;
      for (const p of crossed) {
        const gb = p.topH + CFG.PIPE_GAP;
        for (let k = 0; k < 7; k++) {
          pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W, Math.random() * p.topH, 'char'));
          pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W,
                                    gb + Math.random() * Math.max(10, groundY - gb), 'char'));
        }
        p.passed = true;
      }
      pipes = pipes.filter(p => crossed.indexOf(p) === -1);
      // 【音效】火+雷：与本次突进粉碎柱子的删除判定同帧播放倒塌粉碎声
      playSoundThrottled('collapse', 0.08);
    } else if (bird.x < CFG.W - 120) {
      // 前方没有可穿透的管道（管道被打空 / 已到屏幕右缘）：突进也必须产生真实位移，
      // 绝不出现「只炸柱子、小鸟不动」的情况 —— 强制向前冲刺一段固定物理距离。
      bird.x = Math.min(CFG.W - 70, bird.x + 320);
      bird.vy = 0;
      bird.rot = -0.2;
    }

    // 冲刺残影：沿小鸟真实位移轨迹撒一串「红火 + 紫电」，全部贴在小鸟路径上
    if (Math.abs(bird.x - startX) > 1) {
      for (let i = 0; i <= 9; i++) {
        const k = i / 9;
        const px = startX + (bird.x - startX) * k;
        const py = startY + (bird.y - startY) * k;
        const fD = takeObj('fireTrail');
        fD.x = px;
        fD.y = py + (Math.random() - 0.5) * 8;
        fD.t = CFG.FIRE_TRAIL_MAX; fD.max = CFG.FIRE_TRAIL_MAX;
        fD.r = 2.2 + Math.random() * 3;
        fD.vy = -0.2 - Math.random() * 0.45;
        fD.seed = Math.random() * 100;
        fD.pale = false; fD.big = false;
        fireTrail.push(fD);
        thunderTrail.push({ x: px, y: py + (Math.random() - 0.5) * 10,
                            t: 24, max: 24, seed: Math.random() * 100 });
      }
      while (fireTrail.length > 90) shiftPool(fireTrail, 'fireTrail');
      while (thunderTrail.length > 90) thunderTrail.shift();
    }

    // 突进时间轴：与雷单吃完全一致（瞬移瞬间 1 秒绝对无敌 + 0.5 秒高速位移窗口 + 平滑回正）
    bird.invincible = Math.max(bird.invincible, CFG.THUNDER_LAND_INV);
    thunderReturnT = 0;                                   // 清掉上一次回正，避免二次突进被拽回原位
    thunderDashT = CFG.THUNDER_INV;
    absorbBlockT = Math.max(absorbBlockT, CFG.THUNDER_INV);
    thunderFlash = 10;
    shake = 12;
    // 【音效】火+雷的突进阶段：再次播放雷声+爆炸，与本次突进动作同帧（0.3s 防抖防叠音）
    playSoundThrottled('overload', 0.3);
  }

  /**
   * 雷元素「瞬闪破障」（一次性触发，不持续）：
   * 小鸟化作一道紫红色闪电，瞬间跨越屏幕上最近的 2 根管道。
   * - 单次突进立刻 +25 分（基础分，不乘连击倍率，不再按穿透管道数重复累加）；
   * - 瞬移瞬间立刻附加 1 秒绝对无敌，突进结束后再补足 1 秒（恰好覆盖平滑回正全程），防止卡死；
   * - 全屏白闪 + 紫红闪电残影，被跨越的管道瞬间碎裂消失；
   * - 落点自动对准下一根未跨越管道的缝隙中线，并保证不出屏，坐标绝对安全；
   * - 突进结束后小鸟在 1 秒内 smoothstep 平滑滑回左侧初始 X（期间可自由跳跃）。
   */
  function thunderStrike() {
    const startX = bird.x, startY = bird.y;

    // 小鸟前方的管道（从近到远），最多跨 2 根，且落点必须留在屏幕内
    const ahead = pipes.filter(p => p.x + CFG.PIPE_W > bird.x).sort((a, b) => a.x - b.x);
    const crossed = [];
    let targetX = bird.x;
    for (let i = 0; i < 2 && i < ahead.length; i++) {
      const cand = ahead[i].x + CFG.PIPE_W + 42;          // 越过管口后再留 42px 安全余量
      if (cand > CFG.W - 70) break;                       // 落点会出屏 → 这根不跨
      targetX = cand;
      crossed.push(ahead[i]);
    }

    if (crossed.length > 0) {
      // 落点高度：对准下一根未跨越管道的缝隙中线；没有则夹在屏幕中部安全带
      const next = ahead[crossed.length];
      if (next) bird.y = next.topH + CFG.PIPE_GAP / 2;
      else bird.y = Math.max(ceilingBoundY() + CFG.BIRD_R + 24, Math.min(CFG.H * 0.55, bird.y));
      bird.x = targetX;
      bird.vy = 0;
      bird.rot = -0.2;                                    // 微微抬头，衔接瞬移后的飞行姿态

      // 得分：单次突进固定 +25 分（修复原按 crossed.length 累乘导致的加分异常）
      score += CFG.THUNDER_SCORE;

      // 紫红色闪电残影：从起点到落点画 2 条带随机锯齿的电弧
      for (let n = 0; n < 2; n++) {
        const pts = [];
        const segs = 6;
        for (let i = 0; i <= segs; i++) {
          const k = i / segs;
          pts.push({
            x: startX + (bird.x - startX) * k,
            y: startY + (bird.y - startY) * k +
               ((i === 0 || i === segs) ? 0 : (Math.random() - 0.5) * 44)
          });
        }
        thunderBolts.push({ pts, t: 20, max: 20 });
      }

      // 被跨越的管道碎裂消失：上下两段各炸出 8 块碎片
      const groundY = CFG.H - CFG.GROUND_H;
      for (const p of crossed) {
        const gapBottom = p.topH + CFG.PIPE_GAP;
        for (let i = 0; i < 8; i++) {
          pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W, Math.random() * p.topH));
          pipeDebris.push(makeShard(p.x + Math.random() * CFG.PIPE_W,
                                    gapBottom + Math.random() * (groundY - gapBottom)));
        }
      }
      pipes = pipes.filter(p => crossed.indexOf(p) === -1);
    }

    // 无论跨了几根：瞬移瞬间立刻附加 1 秒绝对无敌，
    // 加全屏白闪；突进窗口结束时启动「平滑回正」：1 秒 X 插值滑回左侧 + 再补 2 秒无敌
    bird.invincible = Math.max(bird.invincible, CFG.THUNDER_LAND_INV);
    thunderDashT = CFG.THUNDER_INV;
    absorbBlockT = Math.max(absorbBlockT, CFG.THUNDER_INV);   // 突进途中（0.5s 高速位移）同样禁吃元素，防误吸
    thunderFlash = 8;
  }

  /** 生命值归零，进入结束场景 */
  function gameOver() {
    scene = 'over';
    overTimer = 30;             // 0.5 秒内不允许立即重开，避免误触
    shake = 14;
    AudioManager.stopLoops();   // 死亡结算：立即停止并释放循环音效
    if (score > maxScore) maxScore = score;
  }

  /* ============================================================
   * 7. 输入控制
   * ============================================================ */
  function onFlap() {
    if (paused) return;                      // 暂停中：画布点击/触摸不产生任何升力、不重开
    unlockAudio();                           // 用户手势解锁音频（浏览器策略要求）
    if (scene === 'ready') {
      scene = 'playing';
      bird.vy = CFG.JUMP_V;      // 起飞时给一次向上的力
      bird.wing = 0;
      playSound('jump');         // 跳跃音效：白噪声极短气流声

      // 视野较宽时，如果管道只从最右侧生成，开局会有很长一段空屏。
      // 这里先在画面中段补 3 根管道，间距与后续生成的节奏完全对齐，前后无缝衔接。
      // 屏幕很窄（例如竖屏）时这些位置会挤到小鸟跟前，所以加一道距离判断跳过。
      for (let i = 0; i < 3; i++) {
        const x = CFG.W - CFG.PIPE_SPACING * (3 - i);
        if (x > CFG.BIRD_X + 300) spawnPipe(x);
      }
      spawnTimer = CFG.PIPE_SPACING - CFG.PIPE_SPEED;
      return;
    }
    if (scene === 'playing') {
      if (reaction && reaction.id === 'cruise') return;   // 雷+草：起手滞留 / 突进 / 悬停全程不接受操作
      if (reaction && (reaction.id === 'vine' || reaction.id === 'slide') &&
          reaction.phase !== 'exit' && reaction.phase !== 'pre') return;   // 滑行段跳跃无效（退场段/先冰后草前奏已恢复操作）
      // 火+岩岩浆球：只能在地面点一次、「跳不起来」的极低弹跳，空中绝不可连跳
      if (reaction && reaction.id === 'magma' && reaction.ball) {
        if (!reaction.grounded || reaction.jumped) return;
        reaction.jumped = true;
        bird.vy = CFG.REACT_MAGMA_JUMP;
        bird.wing = 0;
        playSound('jump');
        return;
      }
      // 水+雷漏电麻痹：点击操作延迟 0.14~0.18 秒动态随机（抽风手感；先入队列，到期才真正施加）
      if (reaction && reaction.id === 'shock') {
        const dmin = CFG.REACT_SHOCK_DELAY_MIN, dmax = CFG.REACT_SHOCK_DELAY_MAX;
        reaction.queue.push({ d: dmin + Math.random() * (dmax - dmin) });
        bird.wing = 0;
        return;
      }
      if (grassT > 0) {
        // 草元素：点击 = 冲刺向最近的前方四叶印（吃到草瞬间已一次性生成 3 个）；
        // 【铁律】冲刺一旦开始 → 强制锁定飞行轨迹：期间任何点击都不打断、不重选目标，
        // 必须完整飞到节点后才恢复操作（防锁死由 2 秒超时保护负责，与点击无关）。
        bird.wing = 0;
        if (grassDash) return;
        let best = null;                                   // 索敌：锁定最近的前方节点
        for (const nn of grassNodes) {
          if (nn.taken || nn.x < bird.x + 40) continue;
          if (!best || nn.x < best.x) best = nn;
        }
        if (best) {
          grassDash = best;
          grassDashT = 0;
          // 【铁律六】每次起飞立刻获得 1.5 秒绝对无敌（只取最大值，不可叠加刷新）
          bird.invincible = Math.max(bird.invincible, CFG.GRASS_DASH_INV);
          if (grassFlyT < 0) grassFlyT = 0;                // 首次起飞 → 启动 5 秒强制解锁倒计时
        }
        return;
      }
      // 风+冰：0.1 秒防抖 —— 按下不立刻给升力，必须按住超过 0.1 秒（物理段）才开始上升
      if (reaction && reaction.id === 'lag') {
        if (frameCount - lagLastTapT < CFG.REACT_LAG_DEBOUNCE) return;
        lagLastTapT = frameCount;
        lagHoldOn = true;
        lagHoldT = 0;
        bird.wing = 0;
        return;
      }
      // 水+岩泥潭：每次点击跳跃高度递减 15%，最低保底为正常的 40%
      if (reaction && reaction.id === 'mud') {
        const v = CFG.JUMP_V * Math.max(0.40, 1 - 0.15 * mudJumpCount);
        mudJumpCount++;
        bird.vy = v * gravDir;
        bird.wing = 0;
        playSound('jump');
        return;
      }
      // 火+风：重力变轻时跳跃高度 +20%，重力变重时跳跃高度 -20%
      if (reaction && reaction.id === 'turb') {
        bird.vy = CFG.JUMP_V * gravDir * (turbHeavyNow() ? 0.8 : 1.2);
        bird.wing = 0;
        playSound('jump');
        return;
      }
      bird.vy = CFG.JUMP_V * gravDir;      // 点击/触屏 = 向上跳跃（重力反转时方向随之翻转）
      bird.wing = 0;
      playSound('jump');
      return;
    }
    if (scene === 'over' && overTimer <= 0) {
      resetGame();
      scene = 'playing';
      bird.vy = CFG.JUMP_V;
      playSound('jump');
    }
  }

  /* 风+冰（迟滞防抖）：松手立刻结束「长按匀速上升」，避免持续悬浮 */
  function releaseHold() { lagHoldOn = false; lagHoldT = 0; }

  // 输入长按修复：flapHeld 记录「本次按下是否已经消耗过」，
  // 键盘自动重复 / 鼠标按住 / 手指按住都不会再提供第二次升力，必须松开再按。
  let flapHeld = false;

  cv.addEventListener('mousedown', function (e) {
    e.preventDefault();
    if (flapHeld) return;
    flapHeld = true;
    onFlap();
  });
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (flapHeld) return;
    flapHeld = true;
    onFlap();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
      e.preventDefault();        // 阻止空格滚动页面
      if (e.repeat) return;      // 【长按修复】自动重复的 keydown 绝不产生额外升力
      if (flapHeld) return;
      flapHeld = true;
      onFlap();
    }
  });

  function releaseKey() {
    flapHeld = false;
    releaseHold();
  }
  cv.addEventListener('mouseup', releaseKey);
  cv.addEventListener('mouseleave', releaseKey);
  cv.addEventListener('touchend', releaseKey, { passive: true });
  cv.addEventListener('touchcancel', releaseKey, { passive: true });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') releaseKey();
  });
  window.addEventListener('blur', releaseKey);

  /* ============================================================
   * 8. 绘制相关小工具
   * ============================================================ */
  /** 画一个红心（cx, cy 为中心，s 为半径基准） */
  function heartPath(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.85);
    ctx.bezierCurveTo(cx - s * 1.15, cy - s * 0.15, cx - s * 0.62, cy - s * 1.05, cx, cy - s * 0.4);
    ctx.bezierCurveTo(cx + s * 0.62, cy - s * 1.05, cx + s * 1.15, cy - s * 0.15, cx, cy + s * 0.85);
    // 线稿风格不需要 closePath 也能画出轮廓，但为了填充还是加上
    ctx.closePath();
  }

  /** 绘制背景天空 */
  function drawBackground() {
    // 1. 天空渐变 + 纸质噪点：直接贴预渲染缓存（每帧只一次 drawImage）
    if (bgCacheDirty || !bgCache) buildBgCache();
    if (bgCache) {
      ctx.drawImage(bgCache, 0, 0, CFG.W, CFG.H);
    } else {
      // 兜底：缓存尚未就绪（例如首帧尺寸为 0）时退化为即时填充
      const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
      g.addColorStop(0, '#f0f7f9');
      g.addColorStop(1, '#e6eff3');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }

    // 2. 手绘风云朵
    ctx.lineJoin = 'round';
    for (const c of clouds) {
      const s = c.s;
      ctx.save();
      ctx.translate(c.x, c.y);
      
      // 风+雷：电磁紊乱 —— 白云整体转为乌云（深紫灰），并保持柔和体积
      const emK = Math.max(0, Math.min(1, envEmA));
      const cr = Math.round(255 - 118 * emK);
      const cg = Math.round(255 - 116 * emK);
      const cb = Math.round(255 - 104 * emK);
      ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',0.85)';
      ctx.strokeStyle = emK > 0.02
        ? 'rgba(' + Math.round(150 - 46 * emK) + ',' + Math.round(156 - 50 * emK) + ',' + Math.round(172 - 44 * emK) + ',0.5)'
        : 'rgba(200, 210, 220, 0.4)';
      ctx.lineWidth = 2;
      
      function drawCloudPart(ox, oy, rw, rh) {
        ctx.beginPath();
        ctx.ellipse(ox, oy, rw, rh, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      
      drawCloudPart(0, 0, 35 * s, 20 * s);
      drawCloudPart(28 * s, 5 * s, 25 * s, 16 * s);
      drawCloudPart(-28 * s, 6 * s, 24 * s, 15 * s);
      drawCloudPart(10 * s, -10 * s, 28 * s, 18 * s);
      
      ctx.restore();
    }
  }

  /**
   * 竖屏天花板边界：在屏幕顶部留 6% 安全距离处，画一条横贯屏幕的极细虚线，
   * 作为物理判定边界的视觉标记。画在管道之后，让上方悬挂柱子的顶端被虚线切断。
   */
  function drawCeilingBorder() {
    if (!portraitMode) return;
    const y = ceilingBoundY();
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 132, 144, 0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(CFG.W, y);
    ctx.stroke();
    ctx.restore();
  }

  /**
   * 附着期环境特效的淡入淡出系数（1 秒 = 60 帧，铁律一）：
   * 生效起始 60 帧线性淡入、结束前 60 帧线性淡出，绝不突兀。
   */
  function attachFade(remain, total) {
    if (remain <= 0 || total <= 0) return 0;
    const fadeIn = Math.min(1, (total - remain) / 60);
    const fadeOut = Math.min(1, remain / 60);
    return Math.max(0, Math.min(fadeIn, fadeOut));
  }

  /** 冰裂纹：分段收尖描边（细 → 极细 → 尾端收尖），彻底替代「一条均匀长直线」的旧画法 */
  function strokeTaperedCrack(pts, w0, alpha0) {
    if (!pts || pts.length < 2) return;
    const n = pts.length - 1;
    for (let i = 0; i < n; i++) {
      const k = i / n;
      ctx.globalAlpha = alpha0 * (1 - 0.72 * k);              // 越往尾端越淡
      ctx.lineWidth = Math.max(0.22, w0 * (1 - 0.88 * k));    // 越往尾端越细（收尖）
      ctx.beginPath();
      ctx.moveTo(pts[i][0], pts[i][1]);
      ctx.lineTo(pts[i + 1][0], pts[i + 1][1]);
      ctx.stroke();
    }
  }

  /**
   * 冰：绘制一条「自然生长」的冰裂纹。
   * 主枝方向逐段累加偏折（drift），因此呈现柔和曲率而非长直线；线宽 / 透明度沿枝干持续衰减
   * 到尾端收尖；再从主干随机节点长出 2~4 条同样带转折、同样收尖的子分叉。
   */
  function drawIceCrack(rx, ry, rw, rh, h, i, startX, startY, len, segs, w0, alpha0, branchN) {
    let ang = Math.PI / 2 + (h(i * 11 + 1) - 0.5) * 0.9;      // 总体向下，初始略带偏斜
    let px = startX, py = startY;
    const step = len / segs;
    const pts = [[px, py]];
    for (let s2 = 1; s2 <= segs; s2++) {
      ang += (h(i * 17 + s2) - 0.5) * 0.85;                   // 每段轻微转向 → 平滑转折，不抽搐
      px += Math.cos(ang) * step + (h(i * 41 + s2) - 0.5) * rw * 0.14;
      py += Math.sin(ang) * step;
      px = Math.max(rx + 2.5, Math.min(rx + rw - 2.5, px));
      py = Math.min(ry + rh - 1, py);
      pts.push([px, py]);
    }
    strokeTaperedCrack(pts, w0, alpha0);
    // 子分叉：从主干随机节点伸出，与主干呈 26°~55°，自身再带 1~2 次转折
    for (let b = 0; b < branchN; b++) {
      const pi = 1 + Math.floor(h(i * 29 + b * 5) * Math.max(1, pts.length - 2));
      const p0 = pts[Math.min(pts.length - 1, pi)];
      const p1 = pts[Math.min(pts.length - 1, pi + 1)];
      const trunkAng = (p1 === p0) ? Math.PI / 2
        : Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      let bang = trunkAng + (b % 2 === 0 ? -1 : 1) * (0.45 + h(i * 31 + b) * 0.5);
      let bx = p0[0], by = p0[1];
      const blen = 6 + h(i * 37 + b) * 12;
      const bsegs = 2 + (b % 2);
      const bpts = [[bx, by]];
      for (let s3 = 1; s3 <= bsegs; s3++) {
        bang += (h(i * 43 + b * 7 + s3) - 0.5) * 0.7;          // 分叉自身转折
        bx += Math.cos(bang) * (blen / bsegs);
        by += Math.sin(bang) * (blen / bsegs);
        bx = Math.max(rx + 2, Math.min(rx + rw - 2, bx));
        by = Math.min(ry + rh - 1, by);
        bpts.push([bx, by]);
      }
      strokeTaperedCrack(bpts, w0 * 0.62, alpha0 * 0.85);
    }
  }

  /** 冰：整段管道（柱身 + 管口肩部）的「蓝白胶质冰冻层」——
      ① 唯一的竖直线性渐变一次性铺满「柱身 + 管口矩形」：同一水平线上颜色恒定，
         → 管口与柱身之间绝不存在任何色块 / 明暗断层（水+冰、冰+雷 共用同一通道）；
      ② 白色冰裂纹（多转折、尾端收尖、种子驱动、随管道稳定移动）；
      ③ 只描「外轮廓」（侧壁 + 管口外沿 + 肩部台阶），内部接缝一律不描边。 */
  function drawFrostSeg(rx, ry, rw, rh, seed, a, capOver, capH, capTop, deep) {
    if (rh < 4 || a <= 0.002) return;
    // deep：0 = 冰元素单吃（柱壁结霜 + 浅冰蓝冻底色）
    //       1 = 水+冰（冰+岩）反应期在冻底色基础上整体加深后的柱体底色
    const dp = Math.max(0, Math.min(1, deep || 0));
    // t：0 = 冰单吃专属视觉，1 = 反应期视觉（dp ≥ 0.25 起与原反应期逐像素一致）
    const t = Math.min(1, dp / 0.25);
    const co = capOver > 0 ? capOver : 0;
    const ch = co > 0 ? Math.min(capH, rh * 0.5) : 0;
    const capY = capTop ? ry : (ry + rh - ch);
    const y0 = ry, y1 = ry + rh;
    // 加深 = 把冻底色向「深冰蓝」线性插值，所有部位（柱身 / 管口 / 肩部）同一套色值
    const D = 0.58 * dp;
    const mix = (c0, c1) => Math.round(c0 + (c1 - c0) * D);
    const L = (single, react) => Math.round(single + (react - single) * t);
    const e0 = L(240, mix(242, 86)) + ', ' + L(248, mix(250, 148)) + ', ' + L(253, mix(255, 196));   // 两端
    const e1 = L(182, mix(180, 86)) + ', ' + L(219, mix(217, 148)) + ', ' + L(241, mix(243, 196));   // 中段
    const e2 = L(238, mix(240, 86)) + ', ' + L(247, mix(249, 148)) + ', ' + L(253, mix(255, 196));   // 两端
    const a0 = 0.96 + (Math.min(1, 0.95 + 0.05 * dp) - 0.96) * t;
    const a1 = 0.94 + (Math.min(1, 0.93 + 0.05 * dp) - 0.94) * t;
    // 管口额外加深的权重：冰单吃（含冰+岩）为 1；水+冰反应期已有「中间深两边浅」软阴影接管 → 0
    const fkCap = 1 - t;
    ctx.save();
    ctx.beginPath();
    ctx.rect(rx, ry, rw, rh);
    if (co > 0) ctx.rect(rx - co, capY, rw + co * 2, ch + 1);
    ctx.clip();
    // ① 单一竖直渐变（绝对 Y 坐标）：柱身与管口肩部共用同一个渐变，跨接缝颜色连续
    const g = ctx.createLinearGradient(0, ry, 0, ry + rh);
    g.addColorStop(0.00, 'rgba(' + e0 + ', ' + a0 + ')');
    g.addColorStop(0.50, 'rgba(' + e1 + ', ' + a1 + ')');
    g.addColorStop(1.00, 'rgba(' + e2 + ', ' + a0 + ')');
    ctx.globalAlpha = a;
    ctx.fillStyle = g;
    ctx.fillRect(rx - co - 1, ry - 2, rw + co * 2 + 2, rh + 4);
    // ①c 管口矩形略微加深：竖直渐变由肩部 0 → 嘴口最深的均匀过渡，横向完全一致（无硬边色块）
    if (co > 0 && fkCap > 0.01) {
      const mY = capTop ? y0 : y1;              // 嘴口端
      const sY = capTop ? (capY + ch) : capY;   // 肩部（与柱身交界）
      const gc = ctx.createLinearGradient(0, sY, 0, mY);
      gc.addColorStop(0.00, 'rgba(118, 180, 226, 0)');
      gc.addColorStop(0.38, 'rgba(118, 180, 226, ' + (0.28 * fkCap) + ')');
      gc.addColorStop(1.00, 'rgba(118, 180, 226, ' + (0.42 * fkCap) + ')');
      ctx.globalAlpha = a;
      ctx.fillStyle = gc;
      ctx.fillRect(rx - co, Math.min(sY, mY), rw + co * 2, Math.abs(mY - sY));
    }
    // ①b 柱壁白色结霜（冰元素单吃专属：两侧白霜带 + 管口端沿厚霜 + 霜粒；反应期按 1-t 淡出）
    const fk = 1 - t;
    if (fk > 0.01) {
      const fw = Math.min(22, rw * 0.55);
      ctx.globalAlpha = a * fk;
      const gL = ctx.createLinearGradient(rx, 0, rx + fw, 0);
      gL.addColorStop(0.00, 'rgba(255, 255, 255, 0.78)');
      gL.addColorStop(0.32, 'rgba(238, 250, 255, 0.34)');
      gL.addColorStop(1.00, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gL;
      ctx.fillRect(rx - co, ry - 2, fw + co, rh + 4);
      const gR = ctx.createLinearGradient(rx + rw, 0, rx + rw - fw, 0);
      gR.addColorStop(0.00, 'rgba(255, 255, 255, 0.78)');
      gR.addColorStop(0.32, 'rgba(238, 250, 255, 0.34)');
      gR.addColorStop(1.00, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gR;
      ctx.fillRect(rx + rw - fw, ry - 2, fw + co, rh + 4);
      // 管口端沿：霜层堆积更厚
      const fh = 6;
      const fy = capTop ? y0 : (y1 - fh);
      const gC = ctx.createLinearGradient(0, capTop ? fy : y1, 0, capTop ? fy + fh : y1 - fh);
      gC.addColorStop(0.00, 'rgba(255, 255, 255, 0.42)');
      gC.addColorStop(1.00, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gC;
      ctx.fillRect(rx - co, fy, rw + co * 2, fh);
      // 霜粒（确定性散点，紧贴柱壁，随柱子平移不闪烁）
      const fh2 = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
      ctx.fillStyle = '#FFFFFF';
      const fn = Math.max(6, Math.round(rh / 18));
      for (let i = 0; i < fn; i++) {
        const right = fh2(i * 2 + 0.5) >= 0.5;
        const off = 1.5 + fh2(i * 2 + 1) * fw * 0.55;
        const px = right ? rx + rw - off : rx + off;
        const py = ry + rh * fh2(i * 3 + 2);
        ctx.globalAlpha = a * fk * (0.20 + 0.28 * fh2(i * 5 + 3));
        ctx.beginPath();
        ctx.arc(px, py, 0.9 + fh2(i * 7 + 4) * 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // ② 冰裂纹（水+冰反应期裂纹更密：deep 越大追加越多条）
    const h = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
    const cracks = 2 + Math.floor((Math.sin(seed * 12.7) * 0.5 + 0.5) * 2) + Math.round(dp * 6);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // 柱身主裂纹只允许长在柱身内（管口带单独绘制舒展裂纹）→ 管口里绝不会堆积碎纹
    ctx.save();
    if (co > 0 && ch > 1) {
      ctx.beginPath();
      if (capTop) ctx.rect(rx, capY + ch, rw, Math.max(0, y1 - capY - ch));
      else ctx.rect(rx, ry, rw, Math.max(0, capY - ry));
      ctx.clip();
    }
    for (let i = 0; i < cracks; i++) {
      const sx = rx + rw * (0.22 + 0.56 * h(i * 3 + 1));
      const sy = ry + rh * h(i * 3 + 2) * 0.26;
      const len = rh * (0.45 + 0.35 * h(i * 3 + 3));
      const segs = 7 + Math.floor(h(i * 5) * 4);
      drawIceCrack(rx, ry, rw, rh, h, i, sx, sy, len, segs,
                   1.9 - i * 0.25, a * 0.9, 3 + (i % 2));
    }
    ctx.restore();
    // ②b 管口裂纹：只 1~2 条横向舒展的长裂纹（轻微起伏 + 收尖），各带一条短分叉
    //     —— 与柱身主干裂纹同源（strokeTaperedCrack），干净、不密集
    if (co > 0 && ch > 7) {
      const cw = rw + co * 2;
      const cx0 = rx - co, cy0 = capY;
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx0, cy0, cw, ch);
      ctx.clip();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const capN = h(seed * 5.3) > 0.5 ? 2 : 1;
      for (let i = 0; i < capN; i++) {
        const xA = cx0 + cw * (0.10 + 0.12 * h(i * 7 + 1));
        const xB = cx0 + cw * (0.80 + 0.10 * h(i * 7 + 4));
        const ccy = cy0 + ch * (0.28 + 0.44 * h(i * 7 + 2));
        const amp = ch * (0.14 + 0.10 * h(i * 7 + 3));
        const segs = 6;
        const pts = [];
        for (let s2 = 0; s2 <= segs; s2++) {
          const u = s2 / segs;
          const wob = Math.sin(u * Math.PI * 1.6 + h(i * 11) * 2.2) * amp * Math.sin(Math.PI * u);
          pts.push([
            Math.max(cx0 + 1, Math.min(cx0 + cw - 1, xA + (xB - xA) * u)),
            Math.max(cy0 + 1.5, Math.min(cy0 + ch - 1.5, ccy + wob))
          ]);
        }
        strokeTaperedCrack(pts, 1.7 - i * 0.4, a * 0.9);
        // 主次分叉：从主干 1/3 处伸出一条短枝（同样逐段收尖）
        const b0 = pts[2];
        let bang = Math.atan2(pts[3][1] - b0[1], pts[3][0] - b0[0]) + (i % 2 === 0 ? -0.85 : 0.85);
        const bl = ch * (0.34 + 0.20 * h(i * 17));
        const bp = [b0];
        let bx = b0[0], by = b0[1];
        for (let s3 = 1; s3 <= 2; s3++) {
          bang += (h(i * 19 + s3) - 0.5) * 0.35;
          bx += Math.cos(bang) * bl * 0.5;
          by += Math.sin(bang) * bl * 0.5;
          bp.push([
            Math.max(cx0 + 1, Math.min(cx0 + cw - 1, bx)),
            Math.max(cy0 + 1.5, Math.min(cy0 + ch - 1.5, by))
          ]);
        }
        strokeTaperedCrack(bp, 0.9, a * 0.7);
      }
      ctx.restore();
    }
    // ③ 只描外轮廓（侧壁 / 肩部台阶 / 管口外沿），绝不描柱身与管口之间的内部接缝
    const OW = 2.2;   // 柱身竖线 / 管口白框 唯一共用线宽
    ctx.globalAlpha = a * 0.62;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = OW;
    ctx.beginPath();
    if (co > 0) {
      const wall = (xBody, xCap) => {
        if (capTop) {
          ctx.moveTo(xCap, y0);
          ctx.lineTo(xCap, capY + ch);
          ctx.lineTo(xBody, capY + ch);
          ctx.lineTo(xBody, y1);
        } else {
          ctx.moveTo(xBody, y0);
          ctx.lineTo(xBody, capY);
          ctx.lineTo(xCap, capY);
          ctx.lineTo(xCap, capY + ch);
        }
      };
      wall(rx + 1.1, rx - co + 1.1);
      wall(rx + rw - 1.1, rx + rw + co - 1.1);
      ctx.moveTo(rx - co + 1.1, capTop ? y0 : y1);
      ctx.lineTo(rx + rw + co - 1.1, capTop ? y0 : y1);
    } else {
      ctx.moveTo(rx + 1.1, y0); ctx.lineTo(rx + 1.1, y1);
      ctx.moveTo(rx + rw - 1.1, y0); ctx.lineTo(rx + rw - 1.1, y1);
    }
    ctx.stroke();
    // ③b 管口白框：沿管口矩形外圈整整包一圈白色（冰单吃 / 水+冰 / 冰+岩 共用）
    //     线宽与柱身左右两侧竖线完全一致（共用 OW），只在内侧内缩半线宽防止被裁剪切半
    if (co > 0 && ch > 7) {
      const lw = OW, ins = lw * 0.5;
      ctx.globalAlpha = Math.min(1, a * 0.9);
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.rect(rx - co + ins, capY + ins, rw + co * 2 - ins * 2, ch - ins * 2);
      ctx.stroke();
    }
    // ④ 反光点（克制：只在柱身内部，低透明度，绝不形成独立亮块）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    for (let i = 0; i < 2; i++) {
      const hx = rx + rw * (0.28 + 0.44 * ((Math.sin(seed * 7 + i * 2.3) * 0.5 + 0.5)));
      const hy = ry + rh * (0.22 + 0.56 * ((Math.sin(seed * 13 + i * 4.1) * 0.5 + 0.5)));
      ctx.globalAlpha = a * (0.32 + 0.16 * i);
      ctx.beginPath();
      ctx.arc(hx, hy, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /** 水+冰：沿柱子原有白霜裂纹继续向外蔓延的白色裂纹网（长度 / 分叉随 k 增长） */
  function drawIceSpread(rx, ry, rw, rh, seed, k) {
    if (rh < 20 || k <= 0) return;
    const h = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
    ctx.save();
    ctx.beginPath();
    ctx.rect(rx, ry, rw, rh);
    ctx.clip();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const cracks = 2 + Math.floor((Math.sin(seed * 12.7) * 0.5 + 0.5) * 2) + Math.round(k * 6);
    for (let i = 0; i < cracks; i++) {
      const sx = rx + rw * (0.22 + 0.56 * h(i * 3 + 1));
      const sy = ry + rh * h(i * 3 + 2) * 0.25;
      const len = rh * (0.45 + 0.35 * h(i * 3 + 3)) * Math.min(1, 0.35 + k * 1.5);
      const segs = 7 + Math.floor(h(i * 5) * 4);              // 转折点多 → 柔和曲率，绝非长直线
      ctx.strokeStyle = 'rgba(255, 255, 255,' + (0.55 + 0.42 * k).toFixed(3) + ')';
      drawIceCrack(rx, ry, rw, rh, h, i, sx, sy, len, segs,
                   Math.max(0.7, 1.1 + 1.3 * k - i * 0.2), 1, 2 + Math.floor(k * 3));
    }
    ctx.restore();
  }

  /** 管口矩形「中间深、两边浅」软阴影贴图（预渲染缓存，逐帧只 drawImage）。
      · 横向：中心最深 → 两侧完全透明：连续线性渐变，肩部 / 柱身交界处绝无色块边界；
      · 纵向：朝柱身一侧逐行（1px）透明度插值淡出：与柱身衔接处绝无横向接缝断层。
      edgeAtTop = true 表示「深的一侧在上端」（下管口，缝隙朝上）。 */
  const capShadeCache = new Map();
  function capShadeSprite(w, h, rgb, edgeAtTop) {
    const W = Math.max(1, Math.ceil(w)), H = Math.max(1, Math.ceil(h));
    const key = W + '|' + H + '|' + rgb + '|' + (edgeAtTop ? 1 : 0);
    const hit = capShadeCache.get(key);
    if (hit) return hit;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g2 = cv.getContext('2d');
    const grad = g2.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0.00, 'rgba(' + rgb + ', 0)');
    grad.addColorStop(0.22, 'rgba(' + rgb + ', 0.60)');
    grad.addColorStop(0.50, 'rgba(' + rgb + ', 1)');
    grad.addColorStop(0.78, 'rgba(' + rgb + ', 0.60)');
    grad.addColorStop(1.00, 'rgba(' + rgb + ', 0)');
    g2.fillStyle = grad;
    for (let y = 0; y < H; y++) {
      const u = edgeAtTop ? 1 - y / Math.max(1, H - 1) : y / Math.max(1, H - 1);
      g2.globalAlpha = Math.pow(u, 1.15);        // 逐行线性收敛 → 与柱身无缝
      g2.fillRect(0, y, W, 1);
    }
    capShadeCache.set(key, cv);
    return cv;
  }

  /** 火+草：藤蔓螺旋轨迹上「距柱子远端 u 处」的横向坐标
   *  —— 与 drawVineColumn 的节点伪随机完全同源，火焰 / 火星才能严格贴着螺旋推进 */
  function charTrackX(x, rw, seed, u) {
    const h = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
    const cx0 = x + rw / 2;
    const rxBase = rw / 2 + 3.5;
    const drift = uu => Math.sin(uu * 0.045 + seed) * rw * 0.07;
    let i = 0, u0 = 0, u1 = 26 + h(1) * 18;
    while (u > u1 && i < 240) { i++; u0 = u1; u1 += 26 + h(i * 3 + 1) * 18; }
    const q = Math.max(0, Math.min(1, (u - u0) / Math.max(1, u1 - u0)));
    const r0 = rxBase * (0.85 + h(i * 5 + 2) * 0.3);
    const sgn = (i % 2 === 0) ? 1 : -1;
    return cx0 + drift(u) + Math.cos(Math.PI * q) * r0 * sgn;
  }

  /** 火+草：按总时长等比切出三段（正常 78 帧 → 36/21/21；极速 30 帧 → 14/8/8） */
  function charSegments(dur) {
    const v1 = Math.max(1, Math.round(dur * CFG.REACT_CHAR_VINE / CFG.REACT_CHAR_BURN));
    const v2 = Math.max(1, Math.round(dur * CFG.REACT_CHAR_BODY / CFG.REACT_CHAR_BURN));
    return { v1: v1, v2: v2, v3: Math.max(1, dur - v1 - v2) };
  }

  /** 火+草：点燃单根柱子（dur = 60 正常 1.0 秒 / 30 极速 0.5 秒），逐柱独立时间轴 */
  function charIgnite(p, dur) {
    const seg = charSegments(dur);
    p.charOn = true; p.charT = 0;
    p.charDur = dur; p.charV1 = seg.v1; p.charV2 = seg.v2; p.charV3 = seg.v3;
    // 【音效】柱子燃烧时同步专属烈火焚毁声（120ms 防抖，避免同帧多柱叠成爆音）
    playSoundThrottled('charBurn', 0.12);
  }

  /** 火+草：特殊位置判定 —— 0.5 秒极速销毁
   *  1) 反应触发时小鸟正处在某根柱子的「缝隙」横向范围内（bird.x ∈ [p.x, p.x+PIPE_W]）
   *     → 该柱上下两段立刻点燃并焦化消散，30 帧内完成；
   *  2) 否则看小鸟所在空地：以空地中点为界，bird.x 落在右半区（极近右侧第一根）
   *     → 右侧第一根柱子立刻点燃，同样 30 帧烧完。
