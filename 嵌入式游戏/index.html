    fxSet('white', fxEls.white, thunderFlash > 0 ? thunderFlash / 8 * 0.85 : 0);
    fxSet('purple', fxEls.purple, purpleFlash > 0 ? purpleFlash / 14 * 0.75 : 0);
    fxSet('gold', fxEls.gold, goldFlash > 0 ? goldFlash / 12 * 0.7 : 0);
    fxSet('red', fxEls.red, hitFlash > 0 ? 0.3 * hitFlash / 12 : 0);
  }

  /** 风+雷 / 冰+雷 的旧 Canvas 实现已整体迁移至 CSS 覆盖层 */
  function drawEmOverlay() { /* moved to CSS layer */ }
  function drawNetlagOverlay() { /* moved to CSS layer */ }

  /* ============================================================
   * 劈落式发光闪电（风+雷 / 雷+岩 共用）
   * 主干自上而下、末端收束；带自然分叉；三层描边（柔光 / 中层 / 高亮核心）
   * ============================================================ */
  function makeBolt(x0, y0, x1, y1, segs, spread, rnd) {
    const rand = rnd || Math.random;
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.max(1, Math.hypot(dx, dy));
    const nx = -dy / len, ny = dx / len;                 // 主干法线方向
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      const j = (i === 0 || i === segs) ? 0 : (rand() - 0.5) * spread * (1 - u * 0.35);
      pts.push({ x: x0 + dx * u + nx * j, y: y0 + dy * u + ny * j });
    }
    const branches = [];
    const nb = 2 + Math.floor(rand() * 3);
    for (let b = 0; b < nb; b++) {
      const si = 1 + Math.floor(rand() * Math.max(1, segs - 2));
      const base = pts[si];
      const dir = rand() < 0.5 ? -1 : 1;
      const bl = len * (0.16 + rand() * 0.22);
      const bp = [{ x: base.x, y: base.y }];
      let cx = base.x, cy = base.y;
      const steps = 3 + Math.floor(rand() * 3);
      for (let k = 0; k < steps; k++) {
        cx += nx * dir * (bl / steps) * (0.55 + rand() * 0.9) + (rand() - 0.5) * spread * 0.45;
        cy += (dy / len) * (bl / steps) * (0.75 + rand() * 0.6);
        bp.push({ x: cx, y: cy });
      }
      branches.push(bp);
    }
    return { pts: pts, branches: branches };
  }

  /** 由固定种子生成稳定闪电（同一时间窗内形态不变，避免逐帧抽搐） */
  function boltFromSeed(seed, x0, y0, x1, y1, segs, spread) {
    let s = (Math.floor(seed) * 1103515245 + 12345) & 0x7fffffff;
    const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    return makeBolt(x0, y0, x1, y1, segs, spread, rnd);
  }

  function drawBoltShape(bolt, alpha, coreColor, glowColor, widthScale) {
    if (alpha <= 0.004) return;
    const ws = widthScale || 1;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    const trace = () => {
      ctx.beginPath();
      for (let i = 0; i < bolt.pts.length; i++) {
        const q = bolt.pts[i];
        if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      }
      for (const bp of bolt.branches) {
        ctx.moveTo(bp[0].x, bp[0].y);
        for (let i = 1; i < bp.length; i++) ctx.lineTo(bp[i].x, bp[i].y);
      }
    };
    // ① 外层柔光
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 26;
    trace();
    ctx.globalAlpha = Math.min(1, alpha * 0.30);
    ctx.strokeStyle = glowColor;
    ctx.lineWidth = 11 * ws;
    ctx.stroke();
    // ② 中层电光
    trace();
    ctx.globalAlpha = Math.min(1, alpha * 0.72);
    ctx.lineWidth = 3.6 * ws;
    ctx.stroke();
    // ③ 高亮核心
    trace();
    ctx.shadowBlur = 12;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.strokeStyle = coreColor;
    ctx.lineWidth = 1.6 * ws;
    ctx.stroke();
    ctx.restore();
  }

  /** 风+雷：劈落的发光闪电（紫色电光，逐帧渐隐） */
  function drawEmBolts() {
    if (!emBolts.length) return;
    for (const b of emBolts) {
      const a = b.t / b.max;
      drawBoltShape(b, a * 0.95, 'rgba(250, 240, 255, 1)', 'rgba(168, 92, 255, 1)', 1.1);
    }
  }

  /** 水+雷：紧贴小鸟的带电荧光圈（高频锯齿闪烁，区别于普通无敌闪烁） */
  function drawShockRing() {
    if (envShockA <= 0.015) return;
    const jag = (Math.floor(frameCount / 2) % 2 === 0) ? 1 : 0.32;
    const R = CFG.BIRD_R + 7;
    const by = bird.y + shockOff;            // 荧光圈跟随抽搐位移，始终紧贴本体
    ctx.save();
    ctx.globalAlpha = envShockA * jag;
    ctx.strokeStyle = '#7FEFFF';
    ctx.shadowColor = '#00E5FF';
    ctx.shadowBlur = 13;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 26; i++) {
      const aa = i / 26 * Math.PI * 2;
      const rr = R + (i % 2 ? 3.0 : -1.8) + Math.sin(frameCount * 0.9 + i * 1.7) * 1.1;
      const px = bird.x + Math.cos(aa) * rr;
      const py = by + Math.sin(aa) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    // 外侧稀疏电弧短划
    ctx.globalAlpha = envShockA * jag * 0.55;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const aa = frameCount * 0.11 + i * 1.57;
      ctx.beginPath();
      ctx.moveTo(bird.x + Math.cos(aa) * (R + 4), by + Math.sin(aa) * (R + 4));
      ctx.lineTo(bird.x + Math.cos(aa + 0.22) * (R + 11), by + Math.sin(aa + 0.22) * (R + 11));
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 冰+雷：平滑倒退期间的淡蓝残影 */
  function drawNetlagGhosts() {
    if (!netlagGhosts.length) return;
    for (const g of netlagGhosts) {
      const a = g.t / g.max;
      ctx.save();
      ctx.globalAlpha = a * 0.30;
      ctx.translate(g.x, g.y);
      ctx.rotate(g.rot);
      ctx.fillStyle = '#DCEEFF';
      ctx.strokeStyle = 'rgba(0, 191, 255, 0.75)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(16.5, -3.8);
      ctx.bezierCurveTo(13, -9.5, 7, -11.5, 1, -10.5);
      ctx.bezierCurveTo(-6, -9.3, -12, -6.5, -17, -2.5);
      ctx.bezierCurveTo(-14, 0.5, -13, 3.5, -14.5, 6.5);
      ctx.bezierCurveTo(-8, 8.8, -2, 9.6, 4, 8.2);
      ctx.bezierCurveTo(10, 6.8, 14.5, 3.5, 16.5, -0.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 尾羽
      ctx.beginPath();
      ctx.moveTo(-14.5, -1.5); ctx.lineTo(-25.5, -4.6);
      ctx.moveTo(-15, 1.8);    ctx.lineTo(-26, 0.8);
      ctx.moveTo(-14.2, 4.8);  ctx.lineTo(-24.5, 6);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBird() {
    // 火+岩：触发瞬间即空中变为岩浆球（变身 0.5s + 滚动 8s 全程球体，最后 0.5s 变回普通小鸟）
    if (reaction && reaction.id === 'magma' && !reaction.reverted) { drawMagmaBall(); return; }
    // 受击无敌闪烁反馈（核心机制保留）
    if (bird.invincible > 0) {
      // 无敌剩余 ≤1 秒（60 帧）时闪烁频率加快约 2.5 倍，提示无敌即将结束
      const step = bird.invincible <= 60 ? 2 : 5;
      ctx.globalAlpha = (Math.floor(bird.invincible / step) % 2 === 0) ? 0.3 : 0.8;
    }
    // 火+水反应「极速气化」：本体变淡 + 最后 2 秒高频闪烁提醒
    const steamOn = !!reaction && reaction.id === 'steam';
    if (steamOn) {
      if (reaction.t <= 120) {
        ctx.globalAlpha = Math.floor(frameCount / 2) % 2 === 0 ? 0.16 : 0.58;
      } else {
        ctx.globalAlpha = 0.42 + 0.08 * Math.sin(frameCount * 0.15);
      }
    }
    // 受击反馈：本体变红，持续 1 秒（hurtRedT 在 update 中逐帧递减）
    const hurtOn = hurtRedT > 0;
    // 火+冰（轨迹融化）：本体内部保持纯白，仅外圈由 reactionGlow 提供淡红荧光
    const bodyFill = steamOn ? 'rgba(255, 255, 255, 0.62)'
                             : (hurtOn ? '#ff5a5a' : '#FFFFFF');
    const bodyStroke = hurtOn ? '#b63030' : '#555555';

    // 火+雷（狂暴突进）：突进瞬间的真实位移冲刺感 + 横向拉伸
    const overOn = !!reaction && reaction.id === 'overload';
    const dashK = (overOn && reaction.dashT > 0)
      ? Math.sin((16 - reaction.dashT) / 16 * Math.PI)
      : 0;

    ctx.save();
    ctx.translate(bird.x + 26 * dashK, bird.y + shockOff);   // 平移到小鸟的物理中心（水+雷抽搐叠加视觉偏移）
    ctx.rotate(bird.rot);            // 俯仰角：根据垂直速度抬头/低头，轻盈如雨燕
    if (steamOn) ctx.scale(1.5, 1.5);   // 气化形态：体积放大 1.5 倍
    if (dashK > 0.001) ctx.scale(1 + 0.35 * dashK, 1 - 0.12 * dashK);  // 冲刺拉伸

    const glow = birdGlow();         // 元素「紧贴身体」荧光（严格绑定物理生效期，结束即 null）
    if (glow) drawBirdGlow(glow);    // 霓虹描边先画在小鸟底层，本体随后覆盖、保持清晰

    // 细线风格：柔和深灰、圆头笔触（受击 1 秒内整体转为红身红描边）
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = bodyStroke;
    ctx.fillStyle = bodyFill;

    // 1. 尾羽（三根极简细直线，长短有序的窄扇形，与身体延长线方向一致）
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-14.5, -1.5);
    ctx.lineTo(-25.5, -4.6);
    ctx.moveTo(-15, 1.8);
    ctx.lineTo(-26, 0.8);
    ctx.moveTo(-14.2, 4.8);
    ctx.lineTo(-24.5, 6);
    ctx.stroke();

    // 2. 嘴（极其小巧尖锐的细长三角形，先画让根部被身体轮廓自然收住）
    ctx.beginPath();
    ctx.moveTo(16, -3.5);
    ctx.lineTo(25.5, -1.2);
    ctx.lineTo(16, 0.8);
    ctx.closePath();
    ctx.fillStyle = '#444444';
    ctx.fill();

    // 3. 身体（一条流畅的细长弧线：头顶顺滑过渡、腹部收紧，流线型不圆胖）
    ctx.lineWidth = 2;
    ctx.fillStyle = bodyFill;    // 嘴把填充样式改成了深灰，这里重置回本体色
    ctx.beginPath();
    ctx.moveTo(16.5, -3.8);
    ctx.bezierCurveTo(13, -9.5, 7, -11.5, 1, -10.5);    // 头顶顺滑
    ctx.bezierCurveTo(-6, -9.3, -12, -6.5, -17, -2.5);  // 背部收窄到尾根
    ctx.bezierCurveTo(-14, 0.5, -13, 3.5, -14.5, 6.5);  // 尾根下缘
    ctx.bezierCurveTo(-8, 8.8, -2, 9.6, 4, 8.2);        // 收紧的腹线
    ctx.bezierCurveTo(10, 6.8, 14.5, 3.5, 16.5, -0.5);  // 喉部过渡到嘴根
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 4. 翅膀（细长锐利的折线形，绕肩部关节扇动：下扑回到贴身位，上扬约 22°）
    //    bird.wing 相位由 update() 驱动：待机缓慢摆动、飞行中约 2.7Hz 连续扇动
    ctx.save();
    ctx.translate(7.5, -3.2);                        // 肩部（翅根）为旋转轴
    ctx.rotate(0.19 + 0.19 * Math.sin(bird.wing));   // 扇动角：0 ~ 0.38 rad
    ctx.beginPath();
    ctx.moveTo(0, 0);                                // 以下坐标均相对肩部
    ctx.lineTo(-17.5, 10);                           // 翅尖贴着腹线
    ctx.lineTo(-20.3, 6.4);                          // 后缘折点
    ctx.lineTo(-21.3, 2.7);                          // 收回尾根上方
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // 5. 眼睛（一个极小的黑点）
    ctx.beginPath();
    ctx.arc(11.5, -5.8, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    ctx.restore();

    // 岩石护盾：环绕小鸟的灰色圆环，可抵挡一次伤害（最后 2 秒闪 3 下预警）
    if (shieldOn) {
      let ringA = 0.9, ringW = 2.5;
      if (shieldT > 0 && shieldT <= 120) {
        const phase = Math.floor((120 - shieldT) / 40) % 2;   // 2 秒内 3 次闪烁
        ringA = phase === 0 ? 0.95 : 0.18;
        ringW = phase === 0 ? 3.4 : 1.6;
      }
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, CFG.BIRD_R + 8, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(120, 120, 120,' + ringA.toFixed(2) + ')';
      ctx.lineWidth = ringW;
      ctx.stroke();
    }

    // 重置透明度，防止影响后续绘制
    ctx.globalAlpha = 1.0;
  }

  /**
   * 无敌提示：彩色天使光环
   *  - 位置：固定悬浮在小鸟头顶正上方 10px，死跟本体平移，绝不自转；
   *  - 尺寸：直径严格 = 小鸟身体宽度的一半（本体本地宽度 33.5px → 半径 = 宽度 / 4）；
   *  - 形态：透视感镂空扁平椭圆环，横向彩虹渐变（彩虹柱同源中饱和配色、柔和过渡）；
   *  - 动态：无敌最后 1 秒（≤60 帧）进入每 2 帧一次的高频透明度闪烁。
   */
  function drawAngelHalo() {
    if (bird.invincible <= 0) return;
    // 火+岩岩浆球形态：本体不是小鸟，光环不绘制
    if (reaction && reaction.id === 'magma' && !reaction.reverted) return;
    const steamOn = !!reaction && reaction.id === 'steam';
    const overOn = !!reaction && reaction.id === 'overload';
    const dashK = (overOn && reaction.dashT > 0)
      ? Math.sin((16 - reaction.dashT) / 16 * Math.PI) : 0;
    const scX = (steamOn ? 1.5 : 1) * (1 + 0.35 * dashK);
    const scY = (steamOn ? 1.5 : 1) * (1 - 0.12 * dashK);
    // 与 drawBird 的 translate → rotate → scale 完全一致的坐标变换
    const ang = bird.rot, cs = Math.cos(ang), sn = Math.sin(ang);
    const tx = bird.x + 26 * dashK;
    const ty = bird.y + shockOff;
    const hx = tx - (-11.5) * scY * sn;       // 头顶本地坐标 (0, -11.5) → 世界 X
    const hy = ty + (-11.5) * scY * cs;       // 头顶本地坐标 (0, -11.5) → 世界 Y
    const bodyW = 33.5 * scX;                 // 本体宽度（本地 x ∈ [-17, 16.5]）
    const rx = bodyW / 4;                     // 直径 = 身体宽度的一半 → 半径 = 宽度 / 4
    const ry = rx * 0.42;                     // 扁平椭圆 → 透视感
    const cx = hx;
    const cy = hy - 10;                       // 头顶再往上 10px
    let alpha = 1;
    if (bird.invincible <= 60) {
      alpha = Math.floor(frameCount / 2) % 2 === 0 ? 0.18 : 1;   // 最后 1 秒高频闪烁
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    // 彩虹渐变固定为屏幕横向（不随小鸟俯仰旋转），中饱和柔和过渡
    const gr = ctx.createLinearGradient(-rx, 0, rx, 0);
    gr.addColorStop(0.00, '#ff8a7a');
    gr.addColorStop(0.22, '#ffc07a');
    gr.addColorStop(0.42, '#ffe882');
    gr.addColorStop(0.62, '#8fe39a');
    gr.addColorStop(0.82, '#8fc4ff');
    gr.addColorStop(1.00, '#c3a8ff');
    ctx.strokeStyle = gr;
    ctx.lineWidth = Math.max(1.6, rx * 0.30);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    // 内圈细高光：强化「镂空环」的轻盈透视感
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = Math.max(0.8, rx * 0.09);
    ctx.beginPath();
    ctx.ellipse(0, -ry * 0.10, rx * 0.72, ry * 0.52, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  /**
   * 绘制 HUD：生命红心（左上）、得分（右上）、连击倍率（中上方）
   * 保持极简，不放任何多余的图标或状态面板。
   */
  function drawHUD() {
    // 竖屏：生命红心 / 得分 / 倍率 全部下移到「天花板虚线」正下方（实际游玩区顶部），
    // 并为下移后的顶部状态栏（放大 15%）让出最上面一行；虚线以上的留白带完整让给 Dev 面板。
    // 横屏维持贴顶布局。
    const dashY = ceilingBoundY();
    const belowDash = portraitMode;
    // 【竖屏顶端对齐】生命 / 中间状态栏 / 得分 三者共用同一条顶部基准线（天花板虚线下方 8px）。
    // 中间状态栏已收窄，横向不再挤占两侧空间 → 三者顶端完美处于同一水平直线，绝无被迫下移。
    const topLine = belowDash ? dashY + 8 : UI.y + 14;
    // 得分：竖屏 34px / 横屏 26px，右对齐与左侧血条对称
    const scoreFont = portraitMode ? 'bold 34px "Microsoft YaHei", sans-serif'
                                   : 'bold 26px "Microsoft YaHei", sans-serif';
    // 红心体量：手机竖屏整体放大 20%，画面更醒目
    const hpScale = portraitMode ? 1.2 : 1;
    const hpR = 11 * hpScale;
    const hpGap = 34 * hpScale;
    // 红心圆心：heartPath 顶部贝塞尔曲线最高点 ≈ cy - 0.62*s（描边再外扩 0.9px）
    // → 反推圆心，让「红心画出来的最顶端」精确落在基准线上
    const heartCy = belowDash ? topLine + hpR * 0.62 + 0.9 : topLine;
    // 倍率 / 倒计时条：竖屏排在得分字形下方（不再与顶部三块抢同一条线）
    const multiY = belowDash ? topLine + 47 : topLine + 30;
    const barY = belowDash ? topLine + 66 : topLine + 46;

    // ---- 红心（左侧）----
    for (let i = 0; i < CFG.MAX_HP; i++) {
      const cx = UI.x + 13 * hpScale + i * hpGap;
      const cy = heartCy;
      heartPath(cx, cy, hpR);
      if (i < hp) {
        ctx.fillStyle = '#ffb3c1'; // 手绘粉红填充
        ctx.fill();
        ctx.strokeStyle = '#555555';
      } else {
        ctx.fillStyle = 'transparent';
        ctx.strokeStyle = 'rgba(85, 85, 85, 0.2)'; // 失去的生命：极浅边框
      }
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // ---- 蓝心（水元素反应专属奖励，存 15 秒，最多 1 颗；最后 3 秒闪烁预警）----
    if (blueHeartT > 0) {
      const bx = UI.x + 13 * hpScale + CFG.MAX_HP * hpGap + 10;
      let ba = 1;
      if (blueHeartT <= 180) ba = 0.28 + 0.72 * Math.abs(Math.sin(frameCount * 0.32));
      ctx.save();
      ctx.globalAlpha = ba;
      heartPath(bx, heartCy, hpR);
      ctx.fillStyle = '#9BD7FF';
      ctx.fill();
      ctx.strokeStyle = '#2E86C1';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
    }

    // ---- 得分（右侧）----
    ctx.textAlign = 'right';
    ctx.font = scoreFont;
    ctx.fillStyle = '#555555';
    if (belowDash) {
      // 竖屏：用字形实际顶端做绝对对齐（alphabetic 基线 + 实测 ascent → 数字顶端 = 基准线）
      ctx.textBaseline = 'alphabetic';
      let asc = 0;
      try { asc = ctx.measureText(String(score)).actualBoundingBoxAscent || 0; } catch (e) { asc = 0; }
      if (!(asc > 0)) asc = 34 * 0.76;
      ctx.fillText(String(score), CFG.W - UI.x, topLine + asc);
    } else {
      ctx.textBaseline = 'middle';
      ctx.fillText(String(score), CFG.W - UI.x, topLine);
    }

    // ---- 连击倍率（右侧、得分下方；满级 x2.0 变金色；久未吃金币闪烁预警）----
    const fullMulti = multiplier >= CFG.MAX_MULTI - 0.001;
    const warn = comboTimer > 0 && comboTimer < CFG.COMBO_FRAMES - 180;   // 超 3 秒未吃金币
    let multiAlpha = 1;
    if (warn) multiAlpha = 0.35 + 0.65 * Math.abs(Math.sin(frameCount * 0.12));
    ctx.save();
    ctx.globalAlpha = multiAlpha;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = 'italic bold 22px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = fullMulti ? '#FFC107' : '#ffd23f';                   // 满级 x2.0：金色
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 1;
    const mText = 'x' + multiplier.toFixed(1);
    ctx.strokeText(mText, CFG.W - UI.x, multiY);
    ctx.fillText(mText, CFG.W - UI.x, multiY);

    // 极简倒计时条（5 秒耗尽 → 倍率重置）
    if (comboTimer > 0 && multiplier > 1) {
      const w = 64;
      const ratio = comboTimer / CFG.COMBO_FRAMES;
      ctx.fillStyle = 'rgba(85, 85, 85, 0.12)';
      ctx.fillRect(CFG.W - UI.x - w, barY, w, 3);
      ctx.fillStyle = fullMulti ? '#FFC107' : '#ffd23f';
      ctx.fillRect(CFG.W - UI.x - w, barY, w * ratio, 3);
    }
    ctx.restore();

    // ---- 顶部状态栏：单元素附着 / 元素反应，统一走 1 秒淡入淡出 ----
    drawTopHud();
  }

  /** 单元素附着效果描述（显示在顶部状态栏下方） */
  const ELEMENT_EFFECT = {
    '风': '重力减弱，气流保护。',
    '火': '无敌加速。',
    '水': '恢复生命。',
    '冰': '全局减速。',
    '雷': '向前突进。',
    '岩': '获得护盾。',
    '草': '生成节点，点击飞向。'
  };

  /** 全部元素反应的展示信息：双元素 + 真实物理总时长（帧）+ 反应名称与效果描述 */
  const REACTION_META = {
    steam: { a: '火', b: '水', name: '雾隐蒸腾', desc: '隐身无敌，吸附金币。', total: function () { return CFG.REACT_STEAM_TIME; } },
    void:  { a: '雷', b: '岩', name: '雷渊异境', desc: '遁入幻境', total: function () { return CFG.REACT_VOID_TIME; } },
    vine:  { a: '水', b: '草', name: '藤网交织', desc: '生成滑道。', total: function () { return CFG.REACT_RIDE_GROW + CFG.REACT_RIDE_RIDE; } },
    slide: { a: '冰', b: '草', name: '霜轨滑行', desc: '生成冰道。', total: function () { return CFG.REACT_RIDE_GROW + CFG.REACT_RIDE_RIDE; } },
    gold:  { a: '风', b: '草', name: '风卷残云', desc: '自动吸附金币。', total: function () { return CFG.REACT_GOLD_TIME; } },
    melt:  { a: '火', b: '冰', name: '霜炎融痕', desc: '可无视碰撞穿过冰柱。', total: function () { return CFG.REACT_MELT_TIME; } },
    char:  { a: '火', b: '草', name: '焚骨成灰', desc: '焚毁前方柱子。', total: function () { return CFG.REACT_CHAR_TIME; } },
    icecrack: { a: '水', b: '冰', name: '冽冬碎骨', desc: '柱子被冻碎。', total: function () { return CFG.REACT_ICECRACK_TIME; } },
    erode: { a: '风', b: '岩', name: '风蚀残岩', desc: '柱子被侵蚀，缝隙增大。', total: function () { return CFG.REACT_ERODE_TIME; } },
    overload: { a: '火', b: '雷', name: '雷火交鸣', desc: '极速无敌，突进粉碎柱子。', total: function () { return CFG.REACT_OVERLOAD_TIME; } },
    lag:   { a: '风', b: '冰', name: '凛冬迟滞', desc: '长按起飞，全局减速。', total: function () { return CFG.REACT_LAG_TIME; } },
    mud:   { a: '水', b: '岩', name: '泥沼陷落', desc: '跳跃高度递减。', total: function () { return CFG.REACT_MUD_TIME; } },
    // —— 第三批反应（Round D）——
    magma: { a: '火', b: '岩', name: '熔岩陨坠', desc: '化身岩浆球，撞碎柱子。', total: function () { return CFG.REACT_MAGMA_TIME; } },
    cruise: { a: '雷', b: '草', name: '紫电突袭', desc: '连续穿梭雷印。', total: function () { return CFG.REACT_CRUISE_TIME; } },
    turb:  { a: '火', b: '风', name: '热浪肆虐', desc: '重力极轻极重乱跳。', total: function () { return CFG.REACT_TURB_TIME; } },
    fog:   { a: '风', b: '水', name: '云遮雾绕', desc: '浓雾遮蔽视野。', total: function () { return CFG.REACT_FOG_TIME; } },
    emfield: { a: '风', b: '雷', name: '倒悬之厄', desc: '重力反转往下飞。', total: function () { return CFG.REACT_EMF_TIME; } },
    shock: { a: '水', b: '雷', name: '雷滞身僵', desc: '高频抽搐，操作延迟。', total: function () { return CFG.REACT_SHOCK_TIME; } },
    netlag: { a: '冰', b: '雷', name: '溯回之厄', desc: '强制倒退。', total: function () { return CFG.REACT_NETLAG_TIME; } },
    quake: { a: '冰', b: '岩', name: '寒渊地动', desc: '柱子上下震动。', total: function () { return CFG.REACT_QUAKE_TIME; } },
    press: { a: '草', b: '岩', name: '千岩坠缚', desc: '重力翻倍。', total: function () { return CFG.REACT_PRESS_TIME; } }
  };

  /** 反应状态栏数据：与反应物理计时严格同源（进度条时间动态绑定该反应的实际情况时长） */
  function reactionBarState() {
    if (!reaction) return null;
    const meta = REACTION_META[reaction.id];
    if (!meta) return null;
    if (reaction.phase === 'exit') return null;                       // 终点后 1 秒化作粒子：不再显示
    // 动态时长反应（极寒冰裂 / 先冰后草）以反应实例自身的 total 为准
    const total = reaction.total || meta.total();
    return { meta: meta, total: total, remain: Math.max(0, Math.min(total, reaction.t)) };
  }

  /* ============================================================
   * 顶部状态栏淡入淡出：出现 / 消失 / 内容切换一律 1 秒（60 帧）Lerp
   * ============================================================ */
  const HUD_FADE_FRAMES = 60;
  const hudFx = { key: null, view: null, a: 0, out: null, outA: 0 };

  /** 组装当前应显示的状态栏内容：反应优先，其次单元素；都没有则 null */
  function hudDesiredView() {
    const rb = reactionBarState();
    if (rb) {
      const m = rb.meta;
      return {
        key: 'r:' + reaction.id,
        a: m.a, b: m.b,
        label: m.name,
        desc: m.desc,
        ratio: rb.remain / rb.total,
        colA: ICON_COLORS[m.a] || '#555555',
        colB: ICON_COLORS[m.b] || '#555555',
        secs: rb.remain / 60
      };
    }
    if (element.type !== null) {
      const t = element.type;
      return {
        key: 'e:' + t,
        a: t, b: null,
        label: t,
        desc: ELEMENT_EFFECT[t] || '',
        ratio: element.t / (element.dur || CFG.ELEMENT_DURATION),
        colA: ICON_COLORS[t] || '#555555',
        colB: ICON_COLORS[t] || '#555555',
        secs: element.t / 60
      };
    }
    return null;
  }

  /** 每帧推进淡入淡出：内容切换 → 旧内容淡出、新内容淡入；内容清空 → 整体淡出 */
  function updateHudFx() {
    const dv = hudDesiredView();
    const dk = dv ? dv.key : null;
    const step = 1 / HUD_FADE_FRAMES;
    if (dk !== hudFx.key) {
      if (hudFx.view) { hudFx.out = hudFx.view; hudFx.outA = hudFx.a; }
      hudFx.view = dv;
      hudFx.key = dk;
      hudFx.a = 0;
    } else if (dv) {
      hudFx.view = dv;                    // 同一内容：实时刷新进度与倒计时
    }
    if (hudFx.out) {
      hudFx.outA -= step;
      if (hudFx.outA <= 0) { hudFx.out = null; hudFx.outA = 0; }
    }
    if (hudFx.view) hudFx.a = Math.min(1, hudFx.a + step);
  }

  /** 顶部状态栏绘制：先画正在淡出的旧内容，再画当前内容（同一 1 秒内完成交叉淡化） */
  function drawTopHud() {
    if (hudFx.out) drawTopStatusBar(hudFx.out, hudFx.outA);
    if (hudFx.view) drawTopStatusBar(hudFx.view, hudFx.a);
  }

  /**
   * 全局统一顶部状态栏（单元素附着 / 双元素反应共用同一套版式）：
   *  · 水平居中；移动端（竖屏）整体放大 15%，并强制挂在【天花板虚线】正下方；
   *  · 框内：元素图标 + 名称（反应时替换为反应名称）；
   *  · 框下：悬浮显示对应的效果描述；
   *  · 进度条高度 4.5px（随 S 等比放大）；数字倒计时统一放在长条的右下角；
   *  · 整条状态栏的可见度由调用方传入 alpha（1 秒 Lerp 淡入淡出）。
   */
  function drawTopStatusBar(o, alpha) {
    const A = Math.max(0, Math.min(1, alpha === undefined ? 1 : alpha));
    if (A <= 0.002) return;
    // 竖屏：整条状态栏在原有尺寸上整体放大 15%（框体 / 图标 / 字号 / 进度条同比例），
    // 并从屏幕顶端强制下移到【天花板虚线】正下方（虚线下方 8px 处）。
    // 该位置永远压在上管道身上：上管道最矮也有 PIPE_MARGIN(70) 高，状态栏只占 [dashY+8, dashY+59]，
    // 绝不会遮住任何可通行的缝隙；横屏维持原尺寸、贴顶显示。
    const S = portraitMode ? 1.15 : 1;
    // 竖屏略微收窄：344→320（约 7%），只腾出横向空间，不做激进缩短；横屏保持原宽
    const boxW = Math.round((portraitMode ? 320 : 344) * S), boxH = Math.round(44 * S);
    const bx = Math.round((CFG.W - boxW) / 2);            // 水平居中
    const dashY = ceilingBoundY();
    const belowDash = portraitMode;
    const by = belowDash ? dashY + 8 : 14;
    const cy = by + boxH / 2;

    const roundBar = function (x, y, w, h) {
      const r = h / 2;
      const ww = Math.max(w, h);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + ww - r, y);
      ctx.arc(x + ww - r, y + r, r, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(x + r, y + h);
      ctx.arc(x + r, y + r, r, Math.PI / 2, -Math.PI / 2);
      ctx.closePath();
    };

    ctx.save();
    ctx.globalAlpha = A;
    // 圆角长条底卡
    roundBar(bx, by, boxW, boxH);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.84)';
    ctx.fill();
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 左侧元素图标：双元素 → 两枚并排；单元素 → 一枚
    if (o.b) {
      drawElementIcon(o.a, bx + Math.round(22 * S), cy, 22 * S);
      drawElementIcon(o.b, bx + Math.round(45 * S), cy, 22 * S);
    } else {
      drawElementIcon(o.a, bx + Math.round(24 * S), cy, 26 * S);
    }

    // 名称（单元素 → 元素名；反应 → 反应名称）
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + Math.round(17 * S) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#555555';
    ctx.fillText(o.label, bx + Math.round(62 * S), cy + 1);

    // 细进度条：高度 4.5px（随 S 等比放大）；竖屏随框体同步收窄（104→84），腾出倒计时数字空间
    const pbH = 4.5 * S, pbW = Math.round((portraitMode ? 84 : 104) * S);
    const pbX = bx + boxW - Math.round((12 + 58) * S) - pbW;
    const pbY = cy - pbH / 2 + 1;
    roundBar(pbX, pbY, pbW, pbH);
    ctx.fillStyle = 'rgba(85, 85, 85, 0.15)';
    ctx.fill();
    ctx.save();
    const ratio = Math.max(0, Math.min(1, o.ratio));
    roundBar(pbX, pbY, Math.max(pbH, pbW * ratio), pbH);
    ctx.clip();
    const g = ctx.createLinearGradient(pbX, 0, pbX + pbW, 0);
    g.addColorStop(0, o.colA);
    g.addColorStop(0.55, o.colB);
    g.addColorStop(1, o.colA);
    ctx.globalAlpha = A * 0.82;
    ctx.fillStyle = g;
    ctx.fillRect(pbX, pbY, pbW, pbH);
    ctx.restore();

    // 倒计时数字：整条长条的右下角
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold ' + Math.round(13 * S) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#555555';
    ctx.fillText(o.secs.toFixed(1) + 's', bx + boxW - Math.round(12 * S), by + boxH - Math.round(5 * S));

    // 框下悬浮：效果描述（描白边保证任何背景上都清晰、不遮挡主画面；末尾句号去除）
    if (o.desc) {
      const d2 = (o.desc || '').replace(/[。.]+$/, '');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.round(16 * S) + 'px "Microsoft YaHei", sans-serif';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(252, 250, 242, 0.92)';
      ctx.lineWidth = 5;
      ctx.strokeText(d2, CFG.W / 2, by + boxH + Math.round(24 * S));
      ctx.fillStyle = '#4A4A4A';
      ctx.fillText(d2, CFG.W / 2, by + boxH + Math.round(24 * S));
    }

    ctx.restore();
  }

  /**
   * 反应横幅：屏幕中上方（1/4 处）居中放大显示反应名，
   * 动画 = 缩放弹出 18 帧 → 停留 66 帧 → 淡出 42 帧，不遮挡中央视野。
   * UI 框下方的常驻效果描述（drawTopStatusBar）保持不变。
   */
  function drawReactionBanner() {
    if (!reactBanner || !reactBanner.id) return;
    const meta = REACTION_META[reactBanner.id];
    if (!meta) return;
    const pop = CFG.REACT_BANNER_POP, hold = CFG.REACT_BANNER_HOLD, fade = CFG.REACT_BANNER_FADE;
    const total = pop + hold + fade;
    const t = reactBanner.t || 0;
    if (t < 0 || t >= total) return;
    let s = 1, a = 1;
    if (t < pop) {
      const u = t / pop;                                   // 缩放弹出（三次缓出）
      s = 0.62 + 0.38 * (1 - Math.pow(1 - u, 3));
      a = Math.min(1, u * 1.8);
    } else if (t < pop + hold) {
      const u = (t - pop) / hold;                          // 停留：极轻微呼吸
      s = 1 + 0.015 * Math.sin(u * Math.PI);
    } else {
      const u = (t - pop - hold) / fade;                   // 淡出 + 略微放大
      s = 1 + 0.06 * u;
      a = 1 - u;
    }
    const cx = CFG.W / 2;
    // 竖屏：横幅整体下移到天花板虚线下方更靠下的位置（游玩区内），
    // 与虚线下方的生命 / 得分 / 倍率那一排保持充足间距，不重叠、不挤压
    const cy = portraitMode ? ceilingBoundY() + 200 : CFG.H * 0.25;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';       // 反应名字：手机端整体放大 20%（30 → 36）
    ctx.strokeStyle = 'rgba(252, 250, 242, 0.94)';
    ctx.lineWidth = 6;
    ctx.strokeText(meta.name, 0, 0);
    ctx.fillStyle = '#4A4A4A';
    ctx.fillText(meta.name, 0, 0);
    // 名称下方：显示该反应的具体效果描述（去掉末尾句号），不再显示元素组合。
    // 字号同步放大 20%（22 → 26），但仍严格小于反应名字的 36px，保持清晰的视觉层级。
    const desc = (meta.desc || '').replace(/[。.]+$/, '');
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(252, 250, 242, 0.9)';
    ctx.strokeText(desc, 0, 48);
    ctx.fillStyle = 'rgba(85, 85, 85, 0.92)';
    ctx.fillText(desc, 0, 48);
    ctx.restore();
  }

  /** 待机遮罩 */
  function drawReadyOverlay() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const oy = portraitMode ? ceilingBoundY() + 70 : 0;   // 竖屏：标题整体下移到虚线之下，始终在游玩区内
    ctx.font = 'bold 44px "Microsoft YaHei", sans-serif';
    ctx.strokeStyle = '#fcfaf2';
    ctx.lineWidth = 6;
    ctx.strokeText('飞翔的小鸟', CFG.W / 2, oy + 200);
    ctx.fillStyle = '#555555';
    ctx.fillText('飞翔的小鸟', CFG.W / 2, oy + 200);

    ctx.font = '20px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(85, 85, 85, 0.7)';
    ctx.fillText('点击屏幕 / 按空格 起飞', CFG.W / 2, oy + 260);

    // 玩法说明
    const lines = [
      '❤ 线稿风格：3 点生命，撞管道 / 落地 / 飞出顶部 各扣 1 点',
      '受击后获得无敌保护并弹回安全高度',
      '金币 +5 分并叠加 x0.2 倍率（上限 x2.0），安全穿管 +10 × 倍率'
    ];
    ctx.font = '15px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(85, 85, 85, 0.6)';
    lines.forEach(function (t, i) {
      ctx.fillText(t, CFG.W / 2, oy + 520 + i * 26);
    });
  }

  /** 结束遮罩 */
  function drawOverOverlay() {
    ctx.fillStyle = 'rgba(252, 250, 242, 0.7)'; // 浅米色半透明遮罩
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const oy = portraitMode ? ceilingBoundY() + 90 : 0;   // 竖屏：结束信息下移到虚线之下
    ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#555555';
    ctx.fillText('游戏结束', CFG.W / 2, oy + 250);

    ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ff8c26';
    ctx.fillText('本局得分  ' + score, CFG.W / 2, oy + 320);

    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(85, 85, 85, 0.8)';
    ctx.fillText('最高分  ' + maxScore, CFG.W / 2, oy + 356);

    if (overTimer <= 0) {
      const alpha = 0.5 + 0.5 * Math.sin(frameCount / 12);
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#555555';
      ctx.fillText('点击屏幕 / 按空格 重新开始', CFG.W / 2, oy + 460);
      ctx.globalAlpha = 1;
    }
  }

  /* ============================================================
   * 9. 渲染主流程
   * ============================================================ */
  /** 【移动端雷+草地面倾斜根治】每帧强制复位画布矩阵：清空旋转角度、重新应用基础缩放 */
  function resetBaseTransform() {
    ctx.setTransform(viewScale, 0, 0, viewScale, viewOffX, viewOffY);
  }

  function render() {
    // ① 兜底防黑边：先用物理像素把整块画布铺成纸张底色。
    //    即便逻辑世界与画布缓冲之间有 ±1px 的取整误差，露出来的也是背景色。
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#f0f4f7';
    ctx.fillRect(0, 0, cv.width, cv.height);

    // ② 切换到逻辑坐标系（每帧强制复位：清空上一帧可能残留的旋转/缩放）
    resetBaseTransform();

    // 雷+草：画面绝对水平 —— 严禁任何旋转/视角倾斜（保留 save 与帧尾 restore 配平）
    cruiseTiltA = 0;
    ctx.save();

    // 屏幕抖动（受击反馈）
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    drawVoidSky();                           // 雷+岩：全屏高浓度深紫异空间天空（金币保持清晰）
    for (const p of pipes) drawPipe(p);
    drawCeilingBorder();                     // 竖屏：顶部天花板虚线（画在管道之上，切断悬挂柱顶端）
    drawMagmaSlabs();                        // 火+岩：被切断的上半截柱子（画在地面之前，地下部分被地面覆盖）
    drawWindArcs();                          // 风元素气流罩：管口白色圆弧括号
    drawWindRipples();                       // 气流墙波纹画在管道之上
    drawPipeDebris();                        // 被雷击碎的管道碎片
    drawMeltSteam();                         // 火+冰：柱子融化冒出的白色水汽
    drawCharDust();                          // 火+草：碳化后的黑色粉末
    // 滑道生长段：轨道金币随「双向蔓延」逐步显形（已被藤蔓覆盖的位置才出现金币）
    const rideGrow = !!reaction && (reaction.id === 'vine' || reaction.id === 'slide') && reaction.phase === 'grow';
    const rgP = rideGrow ? (reaction.gf || 0) : 1;
    const rgX0 = rideGrow ? rideStartX() : 0;
    const rgSpan = rideGrow ? Math.max(1, rideEndX() - rgX0) : 1;
    for (const c of coins) {
      if (fogHidesX(c.x)) continue;                      // 风+水：浓雾吞没区位的金币同样完全不可见
      if (c.trackCoin && rideGrow) {
        const u = Math.max(0, Math.min(1, (c.x - rgX0) / rgSpan));
        if (rgP < u * 0.34) continue;
      }
      drawCoin(c);
    }
    for (const o of orbs) {
      if (fogHidesX(o.x)) continue;                      // 风+水：浓雾吞没区位的元素球同样完全不可见
      const bob = Math.sin(frameCount * 0.06 + (o.phase || 0)) * 3;   // 符号本体轻微上下浮动
      if (o.mystery) drawMysteryOrb({ x: o.x, y: o.y + bob });
      else drawElementIcon(o.key, o.x, o.y + bob, 40);
    }
    drawGrassNodes();                        // 草元素四叶印节点（缝隙中心，随管道左移）
    drawCruiseSeals();                       // 雷+草：紫色四叶雷印（在管道之上）
    resetBaseTransform();                    // 【强制复位】画地面之前再清一次矩阵，地面永远水平
    drawGround();
    drawMagmaGround();                       // 火+岩：地面残留的红色岩浆流 + 飞溅小水滴
    drawWindTrail();                         // 气流拖尾画在小鸟身后
    drawThunderBolts();                      // 雷闪电残影
    drawGrassVine();                         // 草冲刺藤蔓连线
    drawThunderTrail();                      // 雷冲刺紫色残影（画在小鸟身后）
    drawFireTrail();                         // 火：纯红拖尾（紧贴小鸟身后）
    drawIceTrail();                          // 水+冰：淡蓝冰水拖尾
    drawRideTrack();                         // 水草藤蔓桥/冰草冰道（只从底部柱顶延伸，画在小鸟身后）
    drawSteam();                             // 火+水：白色翻滚蒸汽云 + 蒸汽拖尾（画在小鸟身下）
    drawHeatHaze();                          // 火+风：高温热浪扭曲波纹（轻量正弦光带，桌面/移动端一致）
    drawNetlagGhosts();                      // 冰+雷：平滑倒退期间的淡蓝残影（画在小鸟身后）
    drawBird();
    drawAngelHalo();                         // 无敌提示：彩色天使光环（死跟小鸟平移、不自转）
    drawShockRing();                         // 水+雷：紧贴小鸟的带电荧光圈（画在本体之上）
    drawElementExtras();                     // 风痕/雪花贴身粒子（荧光本体在 drawBird 内绘制）
    drawFogOverlay();                        // 风+水：由四周涌向小鸟的白色雾团
    drawEmBolts();                           // 风+雷：劈落的紫色闪电
    ctx.restore();
    ctx.restore();                           // 结束「雷+草画面倾斜」变换

    if (!IS_MOBILE) applyHeatDistort();      // 火+风：真实热浪折射（移动端强制关闭）

    // 全屏滤镜（CSS 覆盖层）：先推进 iceBorderA 等强度，再只写 opacity
    updateFxOverlays();

    // 冰裂纹折线仍画在世界画布（层级与原先一致：在滤镜 CSS 层之下）
    resetBaseTransform();
    drawFrostCracks();

    // ===== 第 3 层：HUD 独立画布（世界层之上、CSS 滤镜层之上）=====
    ctx = hudCtx;
    hudCtx.setTransform(1, 0, 0, 1, 0, 0);
    hudCtx.clearRect(0, 0, hudCv.width, hudCv.height);   // HUD 层每帧清空（保持透明）
    resetBaseTransform();
    drawHUD();
    drawReactionBanner();                    // 反应横幅：屏幕中上方（1/4 处）缩放弹出 → 停留 → 淡出
    if (scene === 'ready') drawReadyOverlay();
    if (scene === 'over') drawOverOverlay();
    ctx = worldCtx;                          // 切回世界层，保证下一帧从正确上下文开始
  }

  /* ============================================================
   * 10. 主循环
   *     固定步长（60 帧/秒）更新物理，渲染跟随浏览器刷新率，
   *     这样在高刷屏上速度也不会变快。
   * ============================================================ */
  const STEP = 1000 / 60;
  let lastTime = performance.now();
  let acc = 0;

  /** 暂停 / 恢复：update 完全冻结（物理 / 柱子生成 / 计分 / 元素与反应计时 / 特效计时），UI 仍可操作；
   *  音频上下文同步挂起 / 继续；恢复时重置时间基准，避免 delta 跳变导致小鸟瞬移或特效错位。 */
  function setPaused(v) {
    v = !!v;
    if (paused === v) return;
    paused = v;
    acc = 0;
    if (paused) {
      AudioManager.pause();
    } else {
      lastTime = performance.now();
      AudioManager.resume();
      // 恢复时若风+冰 / 冰+岩反应仍在进行，按当前状态重新起播对应循环（暂停期间可能切过难度被释放）
      if (reaction && reaction.id === 'lag') AudioManager.startLagLoop();
      if (reaction && reaction.id === 'quake') AudioManager.startQuakeLoop();
    }
    const btn = document.getElementById('pauseBtn');
    if (btn) {
      btn.textContent = paused ? '继续' : '暂停';
      btn.classList.toggle('on', paused);
    }
  }

  function loop(now) {
    let delta = now - lastTime;
    lastTime = now;
    if (delta > 120) delta = 120;      // 上限 clamp：切后台 / 卡顿回来最多补 7 帧，绝不瞬移
    if (paused) {                      // 暂停：跳过全部逻辑与计时，只重复渲染当前帧
      acc = 0;
      render();
      requestAnimationFrame(loop);
      return;
    }
    acc += delta;

    // Delta Time + 多子步：掉帧时补算逻辑帧，确保游戏速度不变慢；单帧最多 8 子步
    // 移动端限制追帧子步（4）：单帧逻辑开销封顶，避免「越卡越卡」的雪球式掉帧
    const MAX_STEPS = IS_MOBILE ? 4 : 8;
    let steps = 0;
    while (acc >= STEP && steps < MAX_STEPS) {
      update();
      acc -= STEP;
      steps++;
    }
    if (steps >= MAX_STEPS) acc = 0;   // 极端卡顿：丢弃积压，避免雪球式追帧

    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
   * 10.5 开发者测试面板（Dev Panel）：仅用于测试，可整段删除不影响游戏
   * ============================================================ */
  let devGod = false;          // 无敌开关：无限血量 + 全程无敌帧（每帧在 update 内续命）

  /** 清空身上所有元素/Debuff/反应状态，恢复干净初始手感（保留分数与场上管道） */
  function devClearState() {
    element.type = null; element.color = null; element.t = 0; element.dur = 1;
    fireSpeedT = 0; fireDecelT = 0; windT = 0; iceT = 0; rockT = 0; waterGlowT = 0;
    shieldOn = false; shieldT = 0;
    thunderDashT = 0; thunderReturnT = 0; thunderFlash = 0;
    grassT = 0; grassNodes = []; grassDash = null; grassDashT = 0; grassFlyT = -1;
    absorbBlockT = 0; reaction = null; reactionLockT = 0; ridePath = []; rideShift = 0; voidPipePauseT = 0; slideSnow = [];
    rideBurst = []; fireTrail = []; steamTrail = []; iceTrail = []; meltSteam = []; charDust = [];
    envFrostT = 0; envFrostA = 0; envVineT = 0; envVineA = 0; envVineGrowP = 0; envRockT = 0; envRockA = 0;
    iceBorderA = 0;
    envHeatA = 0; envEmA = 0; envShockA = 0; envLagA = 0;
    magmaSlabs = []; cruiseSeals = []; cruiseGapQueue = []; fogParts = []; fogAmp = 0; emBolts = []; emBoltCd = 0;
    shockOff = 0; netlagGhosts = []; quakeSeedT = 0;
    blueHeartT = 0; gravDir = 1; lagHoldT = 0; lagHoldOn = false; lagLastTapT = -999; mudJumpCount = 0;
    speedMulNow = 1;
    petrifyOn = false; erodeSixth = null; erodeApplyN = 0;
    fxQueue = { ice: 0, erode: 0 };
    for (const p of pipes) {
      p.charOn = false; p.charT = 0; p.charGone = false; p.icGone = false;
      p.erodeOn = false; p.erodeP = 0; p.erodeFade = 0;
      p.erodeIsSixth = false;
      p.iceApplied = false; p.iceT = 0; p.iceDeep = 0; p.iceGone = false;
      p.meltP = 0; p.meltY = 0; p.meltTrack = []; p.meltSfxOn = false;
      p.magmaCut = false; p.magmaCutY = 0; p.magmaCutFade = 0;
      p.fogA = 0; p.fogLvl = 0;
      p.quakeY = 0; p.quakeAmp = 0; p.quakeFade = 0;
    }
    purpleFlash = 0; goldFlash = 0; bird.invincible = 0; hitFlash = 0;
    // 彩虹柱子 / 反应横幅 / 雷+草画面倾斜：一并复位（彩虹重新计时 45 秒）
    rainbowCd = CFG.RAINBOW_CD; rainbowPending = false; rainbowNext = false;
    rainbowWaitPipe = null; rainbowWaitFxPipe = null;
    rainbowOrbLock = false; rainbowNeedBuffer = false; rainbowBufferPipe = null;
    rainbowLostByReaction = false; rbMuteRid = null;
    reactBanner = { id: null, t: 0 }; cruiseTiltA = 0;
    AudioManager.stopLoops();               // 开发调试清状态：循环音一并停止并释放
    for (const p of pipes) {
      p.cruiseGone = false; p.rainbow = false; p.rainbowGiven = false;
      p.rainbowA = 1; p.rainbowFading = false; p.rainbowFadeRate = 0; p.rainbowRemoved = false;
      p.rockGray = false;
    }
  }

  (function buildDevPanel() {
    const panel = document.getElementById('devPanel');
    const toggle = document.getElementById('devToggle');
    // Dev 开关定位：横屏维持「紧贴面板正上方」；竖屏由 placeDevPanel() 统一锁进虚线上方留白带
    function placeDevToggle() {
      if (!toggle) return;
      const bandCss = portraitMode ? Math.round(ceilingBoundY() * cssPerUnit) : 0;
      if (portraitMode && bandCss > 120) {
        // 竖屏：面板整体锁死在【天花板虚线】上方的留白带内（绝不遮挡虚线下的操作视野），
        // 内容超高时在带内滚动查看；开关贴在留白带最顶端。
        const th = toggle.offsetHeight || 24;
        const topPad = 4;
        const panelTop = topPad + th + 4;
        // 面板底部停在「天花板虚线」上沿（虚线以下全是游玩区，绝不遮挡；顶部状态栏已下移到虚线下方）
        const bandBottom = Math.round((ceilingBoundY() - 8) * cssPerUnit);
        const maxH = Math.max(56, bandBottom - panelTop - 6);
        panel.style.top = panelTop + 'px';
        panel.style.transform = 'none';
        panel.style.maxHeight = maxH + 'px';
        panel.style.height = maxH + 'px';      // 高度吃满留白带 → 两行元素 / 两行工具均分，按钮随行高放大
        panel.style.overflowY = 'auto';
        // 「一次性完整显示所有按键」（硬性要求）：先按标准排版实测按钮行高，
        // 行高过矮（极端矮带 / 窄屏）才切到超紧凑排版，保证 11 个按钮始终完整显示、无需滑动。
        panel.classList.remove('compact');
        const probeBtn = panel.querySelector('.devBtn');
        const probeH = probeBtn ? probeBtn.offsetHeight : 0;
        if (probeH > 0 && probeH < 24) panel.classList.add('compact');
        toggle.style.top = topPad + 'px';
        return;
      }
      // 横屏 / 兜底：恢复原来的「垂直居中 + 开关贴面板上方」布局
      panel.classList.remove('compact');       // 超紧凑排版只在竖屏生效，横屏恢复标准字号
      panel.style.top = '50%';
      panel.style.transform = 'translateY(-50%)';
      panel.style.maxHeight = '';
      panel.style.height = '';
      panel.style.overflowY = '';
      const ph = panel.offsetHeight;          // 面板 display:none 时为 0 → 保留上次位置
      const th = toggle.offsetHeight || 28;
      if (ph > 0) {
        toggle.style.top = Math.max(8, window.innerHeight / 2 - ph / 2 - th - 8) + 'px';
      }
    }
    // Dev 开关：一键显隐悬浮测试面板（默认展开，方便测试；点击后图标变灰提示已收起）
    if (toggle) {
      ['mousedown', 'touchstart', 'pointerdown', 'click'].forEach(ev =>
        toggle.addEventListener(ev, e => e.stopPropagation(), { passive: false }));
      toggle.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const hidden = panel.classList.toggle('hidden');
        toggle.classList.toggle('off', hidden);
        toggle.textContent = 'Dev';
        if (!hidden) requestAnimationFrame(placeDevToggle);   // 重新展开后按实测高度复位
      });
    }
    // 阻止面板上的一切鼠标/触摸事件冒泡到画布与 window（防误触小鸟跳跃）
    ['mousedown', 'touchstart', 'pointerdown', 'click'].forEach(ev =>
      panel.addEventListener(ev, e => e.stopPropagation(), { passive: false }));

    function mkBtn(text, color, onClick, parent) {
      const b = document.createElement('button');
      b.className = 'devBtn';
      b.textContent = text;
      if (color) b.style.borderColor = color;
      b.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); b.blur(); onClick(); });
      parent.appendChild(b);
      return b;
    }
    function ensurePlaying() {
      if (scene === 'over') resetGame();
      if (scene === 'ready') onFlap();      // 走完整开局流程：起飞 + 预铺管道（否则反应测试无管道可测）
      else if (scene !== 'playing') scene = 'playing';
    }   // 任意状态下按钮都可直接测试

    // —— 第一部分：7 种基础元素赋予（模拟吃到元素球，正常走 collectElement 挂载流程）——
    const elBox = document.getElementById('devElements');
    for (const el of ELEMENTS) {
      mkBtn(el.key, el.color, () => { ensurePlaying(); collectElement(el.key, el.color); }, elBox);
    }

    // —— 第二部分：一键组合触发反应（立刻清空当前状态并强制触发）——
    const reBox = document.getElementById('devReactions');
    const combos = [
      ['火+水', 'steam'], ['雷+岩', 'void'], ['水+草', 'vine'], ['冰+草', 'slide'], ['风+草', 'gold'],
      ['火+冰', 'melt'], ['火+草', 'char'], ['水+冰', 'icecrack'], ['风+岩', 'erode'],
      ['火+雷', 'overload'], ['风+冰', 'lag'], ['水+岩', 'mud'],
      ['冰+草·先冰', 'slide', '冰'],
      // —— Round D：2 个核心重做 + 7 个纯负面 Debuff ——
      ['火+岩', 'magma'], ['雷+草', 'cruise'],
      ['火+风', 'turb'], ['风+水', 'fog'], ['风+雷', 'emfield'],
      ['水+雷', 'shock'], ['冰+雷', 'netlag'], ['冰+岩', 'quake'], ['草+岩', 'press']
    ];
    for (const [label, rid, first] of combos) {
      mkBtn(label, null, () => { ensurePlaying(); devClearState(); triggerReaction(rid, first); }, reBox);
    }

    // —— 第三部分：资源与状态修改 ——
    const toolBox = document.getElementById('devTools');
    mkBtn('生成盲盒', null, () => {          // 立刻在小鸟正前方生成一个盲盒
      ensurePlaying();
      orbs.push({ x: bird.x + 180, y: Math.max(60, Math.min(CFG.H - CFG.GROUND_H - 60, bird.y)), key: '？', color: null, mystery: true });
    }, toolBox);
    mkBtn('招彩虹柱', null, () => {          // 标记模式：只置位，下一次正常生成管道时那一组替换为彩虹柱
      ensurePlaying();
      rainbowNext = true;
    }, toolBox);
    const godBtn = mkBtn('无敌：关', null, () => {
      devGod = !devGod;
      godBtn.textContent = devGod ? '无敌：开' : '无敌：关';
      godBtn.classList.toggle('on', devGod);
    }, toolBox);
    mkBtn('重置状态', null, () => { devClearState(); hp = CFG.MAX_HP; }, toolBox);

    // 首帧按实测面板高度把开关放到面板正上方，并在窗口尺寸变化时重新校正
    placeDevToggle();
    window.addEventListener('resize', placeDevToggle);
  })();

  /* ============================================================
   * 10.5 左上角音量设置面板（4 条滑杆 + 一键静音 + localStorage 持久化）
   * ============================================================ */
  (function initAudioPanel() {
    const btn = document.getElementById('audioBtn');
    const panel = document.getElementById('audioPanel');
    const muteBtn = document.getElementById('audioMute');
    if (!btn || !panel) return;
    const inputs = {
      master: document.getElementById('volMaster'),
      jump: document.getElementById('volJump'),
      coin: document.getElementById('volCoin'),
      reaction: document.getElementById('volReaction')
    };
    const labels = {
      master: document.getElementById('volMasterVal'),
      jump: document.getElementById('volJumpVal'),
      coin: document.getElementById('volCoinVal'),
      reaction: document.getElementById('volReactionVal')
    };

    function sync() {
      const c = AudioManager.getConfig();
      for (const k in inputs) {
        const el = inputs[k];
        if (!el) continue;
        el.value = c[k];
        if (labels[k]) labels[k].textContent = c[k];
      }
      if (muteBtn) {
        muteBtn.textContent = c.muted ? '取消静音' : '一键静音';
        muteBtn.classList.toggle('on', c.muted);
      }
      btn.classList.toggle('off', c.muted);
    }

    for (const k in inputs) {
      const el = inputs[k];
      if (!el) continue;
      el.addEventListener('input', () => {
        AudioManager.setVolume(k, parseInt(el.value, 10) || 0);
        if (labels[k]) labels[k].textContent = el.value;
        btn.classList.toggle('off', AudioManager.getConfig().muted);
      });
      el.addEventListener('change', sync);          // 松手后整体校准一次
    }

    if (muteBtn) {
      muteBtn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        AudioManager.toggleMute();
        sync();
        muteBtn.blur();
      });
    }

    // 暂停 / 继续：位于面板最上方，优先于所有设置项；鼠标点击与手机触摸都走 click
    const pauseBtn = document.getElementById('pauseBtn');
    if (pauseBtn) {
      pauseBtn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        setPaused(!paused);
        pauseBtn.blur();
      });
    }

    // 难度三档：点击立即生效（applyDifficulty 一次性写入全部基础派生值，不会出现半套参数）
    panel.querySelectorAll('.diffBtn').forEach(b => {
      b.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        setDifficulty(b.getAttribute('data-diff'));
        b.blur();
      });
    });

    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const hidden = panel.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', hidden ? 'false' : 'true');
      btn.blur();
      if (!hidden) sync();
    });

    // 图标 / 面板上的指针与键盘事件一律不冒泡：绝不误触小鸟跳跃、绝不触发空格跳跃
    ['mousedown', 'touchstart', 'pointerdown', 'click'].forEach(ev =>
      btn.addEventListener(ev, e => e.stopPropagation(), { passive: false }));
    ['mousedown', 'touchstart', 'pointerdown', 'click', 'keydown', 'keyup'].forEach(ev =>
      panel.addEventListener(ev, e => e.stopPropagation(), { passive: false }));

    // 点击面板以外区域 → 自动收起（不影响游戏其他交互）
    document.addEventListener('pointerdown', e => {
      if (panel.classList.contains('hidden')) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      panel.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
    }, { passive: true });

    sync();
  })();

  /* ============================================================
   * 11. 启动
   * ============================================================ */
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
