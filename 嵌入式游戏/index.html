   *  返回 true 表示命中特殊位置。 */
  function charIgniteSpecial() {
    const bx = bird.x;
    // —— 1) 缝隙中触发 ——
    for (const p of pipes) {
      if (p.charOn || p.charGone) continue;
      if (bx < p.x || bx > p.x + CFG.PIPE_W) continue;
      charIgnite(p, CFG.REACT_CHAR_FAST);
      return true;
    }
    // —— 2) 空地右半区触发：找右侧第一根 + 左侧柱右缘，比较空地中点 ——
    let right = null, leftEdge = null;
    for (const p of pipes) {
      if (p.charOn || p.charGone) continue;
      if (p.x + CFG.PIPE_W <= bx) {
        if (leftEdge === null || p.x + CFG.PIPE_W > leftEdge) leftEdge = p.x + CFG.PIPE_W;
        continue;
      }
      if (!right || p.x < right.x) right = p;
    }
    if (right) {
      // 没有左侧柱时按管距反推空地左缘
      const le = leftEdge === null ? right.x - (CFG.PIPE_SPACING - CFG.PIPE_W) : leftEdge;
      if (bx >= (le + right.x) / 2) { charIgnite(right, CFG.REACT_CHAR_FAST); return true; }
    }
    return false;
  }

  /** 火+草：【动态靠近判定 · 核心】
   *  每帧只在 pipes 里点燃「唯一一组」柱子 —— 条件是该组柱子的左边缘正好落在
   *  小鸟左侧的空地感应带内（0 < p.x - bird.x <= REACT_CHAR_RANGE）。
   *  感应带 268px < 管距 350px ⇒ 同一时刻最多只有一组能进入带内，
   *  绝不可能把右侧所有柱子一起点燃；鸟往前飞就从左到右依次进入空地、依次被点燃。 */
  function charIgniteNear() {
    let near = null;
    for (const p of pipes) {
      if (p.charOn || p.charGone) continue;
      const d = p.x - bird.x;
      if (d <= 0 || d > CFG.REACT_CHAR_RANGE) continue;   // 只认「鸟正前方那组空地里的柱子」
      if (!near || p.x < near.x) near = p;                // 多组同时进带时也只取最靠前一组
    }
    if (near) charIgnite(near, CFG.REACT_CHAR_BURN);      // 正常播放：1.0 秒
  }

  /** 火+草：推进所有已点燃柱子的三段式动画 + 火星 / 余烬 / 碳灰粒子
   *  —— 每根柱子读自己的 p.charDur / charV1 / charV2 / charV3：
   *     正常 60 帧（1.0 秒），特殊位置 30 帧（0.5 秒极速）。
   *  —— 与 reaction 生命周期解耦：9 秒到点后仍会把最后一组完整烧完。 */
  function stepCharBurns(speedMul) {
    const groundC = CFG.H - CFG.GROUND_H;
    for (const p of pipes) {
      if (!p.charOn || p.charGone) continue;
      p.charT++;
      const cT = p.charT;
      const V1 = p.charV1 || CFG.REACT_CHAR_VINE;
      const V2 = p.charV2 || CFG.REACT_CHAR_BODY;
      const V3 = p.charV3 || CFG.REACT_CHAR_ASH;
      const DUR = p.charDur || CFG.REACT_CHAR_BURN;
      const gapB = p.topH + CFG.PIPE_GAP;
      const hTopC = p.topH;
      const hBotC = Math.max(4, groundC - gapB);
      // —— 阶段一 / 二：燃烧前沿沿螺旋推进，抛出贴着藤蔓轨迹的橙色火星 ——
      if (cT <= V1 + V2 && cT % 2 === 0) {
        const isTop = Math.random() < 0.5;
        const hh = isTop ? hTopC : hBotC;
        const prog = cT <= V1 ? (cT / V1) : ((cT - V1) / V2);
        const dist = hh * prog;                            // 燃烧前沿距缝隙端距离
        const fx = charTrackX(p.x, CFG.PIPE_W, p.seed || 0, hh - dist);
        const fy = isTop ? (hTopC - dist) : (gapB + dist);
        for (let k = 0; k < 3; k++) {
          const dH = takeObj('cdHot');
          dH.x = fx + (Math.random() - 0.5) * 10;
          dH.y = fy + (Math.random() - 0.5) * 10;
          dH.vx = (Math.random() - 0.5) * 1.2;
          dH.vy = -0.5 - Math.random() * 1.5;
          dH.g = -0.004;
          dH.r = 0.7 + Math.random() * 1.5;
          dH.t = 16 + Math.random() * 16; dH.max = 32;
          dH.hot = true;
          charDust.push(dH);
        }
      }
      // —— 已燃藤蔓的余烬：缓慢向外飘散、长时间不灭（火焰逗留，绝不瞬间熄灭）——
      if (cT <= V1 + V2 && cT % 3 === 0) {
        const isTop = Math.random() < 0.5;
        const hhE = isTop ? hTopC : hBotC;
        if (hhE > 24) {
          const progE = cT <= V1 ? (cT / V1) : ((cT - V1) / V2);
          const distE = hhE * progE * Math.random();       // 已燃区域内随机位置
          const ex = charTrackX(p.x, CFG.PIPE_W, p.seed || 0, hhE - distE);
          const ey = isTop ? (hTopC - distE) : (gapB + distE);
          const dE = takeObj('cdHot');
          dE.x = ex; dE.y = ey;
          dE.vx = (Math.random() < 0.5 ? -1 : 1) * (0.20 + Math.random() * 0.45);
          dE.vy = -0.12 - Math.random() * 0.42;
          dE.g = -0.002;
          dE.r = 0.45 + Math.random() * 0.85;
          dE.t = 30 + Math.random() * 26; dE.max = 56;
          dE.hot = true;
          charDust.push(dE);
        }
      }
      // —— 阶段三：灰化前沿两侧大量碳灰 + 浓密烟雾 + 块状碳末（由缝隙向两端推进）——
      if (cT > V1 + V2 && cT < DUR && cT % 2 === 0) {
        const ap = Math.min(1, (cT - V1 - V2) / V3);
        for (let s = 0; s < 2; s++) {
          const isTop = s === 0;
          const hh = isTop ? hTopC : hBotC;
          if (hh < 6) continue;
          const baseY = isTop ? (hTopC - hTopC * ap) : (gapB + hBotC * ap);
          for (let k = 0; k < 13; k++) {
            const up = Math.random() < 0.55;               // 上升烟雾为主 + 部分下坠碳灰
            const dA = takeObj('cdAsh');
            dA.x = p.x + Math.random() * CFG.PIPE_W;
            dA.y = baseY + (Math.random() - 0.5) * 46;
            dA.vx = (Math.random() - 0.5) * 1.8;
            dA.vy = up ? (-0.5 - Math.random() * 1.8) : (0.5 + Math.random() * 2.0);
            dA.g = up ? -0.004 : 0.030;
            dA.r = 0.6 + Math.random() * 2.2;
            dA.t = 42 + Math.random() * 42; dA.max = 84;
            dA.shade = Math.random();
            charDust.push(dA);
          }
          // 浓密烟团：大半径、低透明度、缓慢上浮扩散，负责"烟尘感"的主体
          for (let k = 0; k < 5; k++) {
            const dS = takeObj('cdSmoke');
            dS.x = p.x + Math.random() * CFG.PIPE_W;
            dS.y = baseY + (Math.random() - 0.5) * 54;
            dS.vx = (Math.random() - 0.5) * 1.1;
            dS.vy = -0.28 - Math.random() * 1.05;
            dS.g = -0.006;
            dS.r = 7 + Math.random() * 13;
            dS.t = 70 + Math.random() * 70; dS.max = 140;
            dS.shade = 0.10 + Math.random() * 0.30;
            dS.smoke = true;
            charDust.push(dS);
          }
          // 块状碳末：不规则黑色碎块，随烟雾一起向上翻滚飘散
          if (cT % 6 === 0) {
            const cnt = 1 + (Math.random() < 0.55 ? 1 : 0);
            for (let k = 0; k < cnt; k++) {
              const dC = takeObj('cdChunk');
              dC.x = p.x + 6 + Math.random() * (CFG.PIPE_W - 12);
              dC.y = baseY + (Math.random() - 0.5) * 50;
              dC.vx = (Math.random() - 0.5) * 1.5;
              dC.vy = -0.35 - Math.random() * 1.5;
              dC.g = -0.0028;
              dC.r = 1.4 + Math.random() * 2.0;            // 视觉半径
              dC.size = 2.2 + Math.random() * 3.6;         // 多边形基准尺寸
              dC.rot = Math.random() * Math.PI * 2;
              dC.vr = (Math.random() - 0.5) * 0.09;
              dC.n = 5 + ((Math.random() * 3) | 0);        // 多边形边数
              dC.jag = 0.45 + Math.random() * 0.55;        // 不规则程度
              dC.t = 76 + Math.random() * 74; dC.max = 150;
              dC.chunk = true;
              charDust.push(dC);
            }
          }
        }
      }
      if (cT >= DUR) {
        p.charGone = true; p.passed = true;
        // 【音效】火+草：柱子焚毁消失的同一帧播放倒塌粉碎声（逐柱触发，短冷却防叠音）
        playSoundThrottled('collapse', 0.08);
      }
    }
    pipes = pipes.filter(p => !p.charGone);
    for (const d of charDust) {
      d.t--;
      d.x += d.vx - CFG.PIPE_SPEED * speedMul;
      d.y += d.vy;
      if (d.g) d.vy += d.g;
      if (d.chunk) {
        d.rot += d.vr;
        d.vx *= 0.985;
        d.vy *= 0.988;
      }
    }
    // 就地压缩 + 按形态回收进各自对象池（禁止数组无限增长）
    let nAlive = 0;
    for (let i = 0; i < charDust.length; i++) {
      const d = charDust[i];
      if (d.t > 0) { charDust[nAlive++] = d; continue; }
      recycleObj(d.chunk ? 'cdChunk' : d.smoke ? 'cdSmoke' : d.hot ? 'cdHot' : 'cdAsh', d);
    }
    charDust.length = nAlive;
    while (charDust.length > 1400) {
      const d = charDust.shift();
      recycleObj(d.chunk ? 'cdChunk' : d.smoke ? 'cdSmoke' : d.hot ? 'cdHot' : 'cdAsh', d);
    }
  }

  /** 火+草：1.5 秒三段式烧焦碳化层
   *  · vineP 0→1（第 0~0.7s）：只有藤蔓沿螺旋轨迹由缝隙向两端着火，柱体保持纸白
   *  · bodyP 0→1（第 0.7~1.1s）：柱体本体跟随同一条螺旋轨迹焦黑（斑驳暗灰 / 深褐）
   *  · 全程只在柱体矩形内绘制 —— 柱子中间的缝隙绝对不允许变黑
   *  · ashP 0→1（第 1.1~1.5s）：火焰逗留层随灰化缓慢熄灭，不瞬间消失 */
  function drawCharBody(rx, ry, rw, rh, seed, vineP, bodyP, growUp, ashP) {
    if (rh < 8) return;
    if (vineP <= 0.001 && bodyP <= 0.001) return;
    const ashFade = Math.max(0, Math.min(1, ashP || 0));
    // 火焰逗留强度：燃烧中≈0.92；灰化阶段随消散缓慢降到 ≈0.20（余温），绝不瞬间熄灭
    const flameA = bodyP <= 0.001 ? 1 : (ashFade <= 0.001 ? 0.92 : 0.92 * (1 - 0.78 * ashFade));
    const h = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
    const vineLen = rh * Math.max(0, Math.min(1, vineP));   // 藤蔓已燃烧长度（距缝隙端）
    const burnLen = rh * Math.max(0, Math.min(1, bodyP));   // 柱体已焦黑长度（距缝隙端）
    const toY = u => growUp ? (ry + rh - u) : (ry + u);     // u = 距远端距离（u = rh 即缝隙端）
    const CAP_OVER = 6, CAP_H = 24;                         // 与 drawPipe 的管口板子尺寸一致
    ctx.save();
    ctx.beginPath();
    ctx.rect(rx - 12, ry, rw + 24, rh);                     // 留 12px：藤蔓勒柱的外凸 + 火焰带 / 火舌外舔
    if (burnLen > 0.5) {                                    // 管口板子比柱体宽的 6px 也要烧到
      const capY0 = growUp ? ry : (ry + rh - CAP_H);
      ctx.rect(rx - CAP_OVER, capY0, CAP_OVER, CAP_H);
      ctx.rect(rx + rw, capY0, CAP_OVER, CAP_H);
    }
    ctx.clip();

    // ① 柱体焦黑（第二阶段才出现）：烟熏底色沿螺旋轨迹由缝隙向外扩散
    if (burnLen > 0.5) {
      const gy = toY(rh), gy2 = toY(rh - burnLen);
      const gg = ctx.createLinearGradient(0, gy, 0, gy2);
      gg.addColorStop(0.00, 'rgba(30, 25, 22, 0.86)');
      gg.addColorStop(0.42, 'rgba(52, 42, 36, 0.80)');
      gg.addColorStop(0.78, 'rgba(78, 68, 60, 0.56)');
      gg.addColorStop(1.00, 'rgba(96, 90, 82, 0)');
      ctx.fillStyle = gg;
      ctx.fillRect(rx, Math.min(gy, gy2), rw, Math.abs(gy2 - gy) + 1);
      // 管口板子 6px 加宽部分同步焦黑（缝隙侧不留白色窄边）
      const capY0 = growUp ? ry : (ry + rh - CAP_H);
      ctx.fillStyle = 'rgba(38, 31, 26,' + (0.86 * Math.min(1, burnLen / 12)).toFixed(3) + ')';
      ctx.fillRect(rx - CAP_OVER, capY0, CAP_OVER, CAP_H);
      ctx.fillRect(rx + rw, capY0, CAP_OVER, CAP_H);

      // ② 斑驳焦炭：深浅不一的暗灰 / 深褐 / 灰白烬斑（绝不是整体死黑）
      const rampW = Math.max(26, rh * 0.28);
      const n = 30 + Math.floor(rh / 8);
      for (let i = 0; i < n; i++) {
        const d = h(i * 7 + 3) * rh;                   // 距缝隙端距离
        if (d > burnLen) continue;
        const k = Math.min(1, (burnLen - d) / rampW);  // 每个位置 0→1 平滑变黑
        if (k <= 0.02) continue;
        const yy = toY(rh - d);
        const rad = 1.8 + h(i * 13 + 7) * 6.2;
        const xx = Math.min(rx + rw - rad, Math.max(rx + rad, rx + 2 + h(i * 11 + 5) * (rw - 4)));
        ctx.globalAlpha = k * (0.20 + 0.46 * h(i * 17 + 9));
        const t3 = h(i * 19 + 11);
        ctx.fillStyle = t3 < 0.26 ? '#17140F' : (t3 < 0.52 ? '#2E251F' : (t3 < 0.78 ? '#54463B' : '#8A7A6A'));
        ctx.beginPath();
        ctx.ellipse(xx, yy, rad, rad * 0.70, h(i * 23 + 13) * 3, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ③ 藤蔓层：第一阶段沿螺旋由缝隙向两端烧穿；第二阶段整根藤蔓已碳化
    const vineBurned = bodyP > 0.001 ? rh : vineLen;
    const cx0 = rx + rw / 2;
    const rxBase = rw / 2 + 3.5;
    const drift = u => Math.sin(u * 0.045 + seed) * rw * 0.07;
    const nodes = [];
    for (let i = 0, u = 0; u <= rh + 40; i++) {
      nodes.push(u);
      u += 26 + h(i * 3 + 1) * 18;
    }
    for (let i = 0; i < nodes.length - 1; i++) {
      const u0 = nodes[i], u1 = Math.min(nodes[i + 1], rh);
      if (u0 >= rh) break;
      const midU = (u0 + u1) / 2;
      const dist = rh - midU;                        // 距缝隙端距离
      const avail = Math.max(vineBurned, burnLen);
      if (dist > avail) continue;
      const k = Math.min(1, (avail - dist) / 22 + 0.25);
      const r0 = rxBase * (0.85 + h(i * 5 + 2) * 0.3);
      const sgn = (i % 2 === 0) ? 1 : -1;
      const isFrontCoil = (i % 2 === 0);
      const steps = Math.max(3, Math.ceil((u1 - u0) / 4));
      const pts = [];                                // 记录本段轨迹点，供后面的火舌贴合使用
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let q = 0; q <= steps; q++) {
        const uu = u0 + (u1 - u0) * (q / steps);
        const xx = cx0 + drift(uu) + Math.cos(Math.PI * q / steps) * r0 * sgn;
        const yy = toY(uu);
        pts.push(xx, yy);
        if (q === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      const stage1 = bodyP <= 0.001;
      const headK = stage1 ? Math.max(0, 1 - Math.abs(avail - dist) / 34) : 0;
      // 阶段一·外焰晕：燃烧中的藤蔓外面先铺一层淡橙红光晕（在藤蔓下层，负责「在烧」的氛围）
      if (stage1) {
        ctx.globalAlpha = Math.min(0.55, (0.18 + 0.30 * headK) * (isFrontCoil ? 1 : 0.72));
        ctx.strokeStyle = headK > 0.35 ? 'rgba(255, 148, 96, 1)' : 'rgba(196, 96, 74, 1)';
        ctx.lineWidth = (isFrontCoil ? 13.0 : 10.0) + headK * 3.0;
        ctx.stroke();
      }
      // 深褐碳化藤蔓本体：与灰黑柱体保持微小色差 → 能清楚看出藤蔓轮廓
      ctx.globalAlpha = Math.min(1, k * (isFrontCoil ? 0.96 : 0.62));
      ctx.strokeStyle = isFrontCoil ? '#2A1F19' : '#201812';
      ctx.lineWidth = stage1 ? (isFrontCoil ? 5.0 : 3.6) : (isFrontCoil ? 6.2 : 4.4);
      ctx.stroke();
      if (stage1) {
        // 阶段一·炽亮芯线：炭化藤蔓中间透出淡橙光（火头最亮）
        ctx.globalAlpha = Math.min(0.72, 0.34 + 0.34 * headK);
        ctx.strokeStyle = headK > 0.35 ? 'rgba(255, 226, 174, 1)' : 'rgba(255, 176, 112, 1)';
        ctx.lineWidth = isFrontCoil ? 2.0 : 1.4;
        ctx.stroke();
      } else {
        // 藤蔓脊线高光（暖褐），强化「藤蔓缠绕」的轮廓识别
        ctx.globalAlpha = Math.min(1, k * (isFrontCoil ? 0.55 : 0.32));
        ctx.strokeStyle = '#6B5340';
        ctx.lineWidth = isFrontCoil ? 2.0 : 1.4;
        ctx.stroke();
      }
      // —— 火焰带（核心视觉）：沿藤蔓走向拉长的半透明淡红 / 橙黄 / 淡黄三层描边 ——
      // 绘制在藤蔓之上：外两层半透明包住藤蔓（橙红外包裹感），内层只留细亮芯，
      // 绝不是一团团的实心光球；越靠近火头越亮，越靠旧区域越淡但不熄灭。
      if (flameA > 0.008) {
        const behind = Math.max(0, avail - dist);                    // 落后火头多远
        const linger = Math.max(0.50, 1 - behind / Math.max(70, rh * 1.1));
        const fl = 0.70 + 0.30 * Math.sin(frameCount * 0.36 + i * 2.3 + seed * 1.7);
        const wa = flameA * linger * (isFrontCoil ? 1 : 0.70);
        const gx0 = pts[0], gy0 = pts[1];
        const gx1 = pts[pts.length - 2], gy1 = pts[pts.length - 1];
        // 段内 alpha 起伏（火焰条纹）：避免整根藤蔓变成一条均匀发光的灯管
        const streak = (r, g2, b2, cap, amp) => {
          const gr = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
          for (let s2 = 0; s2 <= 6; s2++) {
            const tt = s2 / 6;
            const jit = 0.34 + 0.66 * h(i * 53 + s2 * 7 + 11);
            const fk = 0.68 + 0.32 * Math.sin(frameCount * 0.52 + s2 * 2.1 + i * 1.3);
            gr.addColorStop(tt, 'rgba(' + r + ',' + g2 + ',' + b2 + ',' +
                            Math.min(cap, amp * jit * fk).toFixed(3) + ')');
          }
          return gr;
        };
        ctx.globalAlpha = 1;
        ctx.strokeStyle = streak(255, 110, 84, 0.55, wa * 0.78);    // 淡红外焰（包裹层）
        ctx.lineWidth = (isFrontCoil ? 15.5 : 12.5) + 3.4 * fl;
        ctx.stroke();
        ctx.strokeStyle = streak(255, 170, 96, 0.62, wa * 0.80);    // 橙黄中层（透到藤蔓上）
        ctx.lineWidth = (isFrontCoil ? 9.5 : 7.8) + 2.2 * fl;
        ctx.stroke();
        ctx.strokeStyle = streak(255, 222, 158, 0.78, wa * 0.88);   // 淡黄内焰（细亮芯）
        ctx.lineWidth = (isFrontCoil ? 2.8 : 2.2) + 0.7 * fl;
        ctx.stroke();
      }
      // —— 火舌：贴着本段藤蔓向外侧舔出的细长舌状火焰（拉长多边形，不是圆球）——
      // 必须放在本段所有 stroke 之后：独立 beginPath，绝不破坏藤蔓路径。
      if (flameA > 0.03 && pts.length >= 8) {
        const behindT = Math.max(0, avail - dist);
        const lingerT = Math.max(0.40, 1 - behindT / Math.max(60, rh * 0.9));
        const segN = pts.length / 2;
        for (let t = 0; t < 3; t++) {
          if (h(i * 29 + t * 11 + 3) < 0.12) continue;      // 少量段落不出舌，避免规律感
          const qi = Math.max(1, Math.min(segN - 1,
                     Math.round((0.18 + 0.30 * t + 0.14 * h(i * 37 + t * 5)) * (segN - 1))));
          const bx = pts[qi * 2], by = pts[qi * 2 + 1];
          const px2 = pts[(qi - 1) * 2], py2 = pts[(qi - 1) * 2 + 1];
          let ttx = bx - px2, tty = by - py2;
          const tl = Math.hypot(ttx, tty) || 1;
          ttx /= tl; tty /= tl;                             // 沿藤蔓切线
          const nx = sgn;                                   // 朝柱体外侧
          const fl2 = 0.5 + 0.5 * Math.sin(frameCount * 0.42 + t * 2.6 + i * 1.7 + seed * 1.9);
          const len = (8.5 + 11.0 * fl2) * (isFrontCoil ? 1 : 0.72);
          const wid = 2.0 + 1.8 * h(i * 43 + t * 17);
          const sway = Math.sin(frameCount * 0.33 + t * 3.4 + i * 2.1) * 3.2;
          // 舌身：向柱体外侧张开，同时顺着火势向上（-y）弯曲 → 火舌而不是线段
          const midX = bx + nx * len * 0.62 + ttx * len * 0.25 + sway * 0.6;
          const midY = by + tty * len * 0.30 - len * 0.28;
          const tipX = bx + nx * len * 0.42 + ttx * len * 0.72 + sway;
          const tipY = by + tty * len * 0.62 - len * 0.72 - fl2 * 2.0;
          const aT = flameA * lingerT * (isFrontCoil ? 0.92 : 0.62) * (0.55 + 0.45 * fl2);
          const drawTongue = (k, r2, g3, b3) => {          // 外层红焰 + 内层黄焰
            const ddx = bx + (tipX - bx) * k, ddy = by + (tipY - by) * k;
            const lg2 = ctx.createLinearGradient(bx, by, ddx, ddy);
            lg2.addColorStop(0.00, 'rgba(' + r2 + ',' + g3 + ',' + b3 + ',' +
                              Math.min(0.86, aT * 1.00).toFixed(3) + ')');
            lg2.addColorStop(0.55, 'rgba(' + r2 + ',' + (g3 - 20) + ',' + (b3 - 30) + ',' +
                              Math.min(0.58, aT * 0.60).toFixed(3) + ')');
            lg2.addColorStop(1.00, 'rgba(' + (r2 - 20) + ',' + (g3 - 60) + ',' + Math.max(0, b3 - 60) + ',0)');
            const wx = wid * k, wy = wid * k;
            ctx.fillStyle = lg2;
            ctx.beginPath();
            ctx.moveTo(bx - ttx * wx, by - tty * wx);
            ctx.quadraticCurveTo(bx + (midX - bx) * k - ttx * wx * 0.4,
                                 by + (midY - by) * k,
                                 ddx, ddy);
            ctx.quadraticCurveTo(bx + (midX - bx) * k + ttx * wx * 0.9,
                                 by + (midY - by) * k,
                                 bx + ttx * wx, by + tty * wy);
            ctx.closePath();
            ctx.fill();
          };
          ctx.globalAlpha = 1;
          drawTongue(1.00, 255, 132, 84);                  // 外层：淡红橙火舌
          if (fl2 > 0.32) drawTongue(0.58, 255, 214, 150); // 内层：淡黄亮芯
        }
      }
    }
    ctx.globalAlpha = 1;

    // ④ 燃烧前沿：严格贴着螺旋轨迹的跳动火舌（沿用火焰带，不再画径向光球）
    const pNow = bodyP > 0.001 ? bodyP : vineP;
    if (pNow > 0.004 && pNow < 0.997) {
      const frontLen = bodyP > 0.001 ? Math.min(burnLen, rh) : Math.min(vineLen, rh);
      const u = rh - frontLen;
      const fx = charTrackX(rx, rw, seed, u);
      const fy = toY(u);
      const dirY = growUp ? 1 : -1;                  // 火苗朝未燃端舔舐
      const pulse = 0.72 + 0.28 * Math.sin(frameCount * 0.42 + seed * 2.1);
      for (let i = 0; i < 3; i++) {
        const sw = Math.sin(frameCount * 0.31 + i * 2.1 + seed) * 0.85;
        const len = 9 + 13 * Math.abs(Math.sin(frameCount * 0.27 + i * 1.7 + seed));
        const tipX = fx + Math.sin(sw) * len * 0.8;
        const tipY = fy + dirY * len;
        const lg = ctx.createLinearGradient(fx, fy, tipX, tipY);
        lg.addColorStop(0, 'rgba(255, 214, 148, ' + (0.62 * pulse).toFixed(3) + ')');
        lg.addColorStop(0.55, 'rgba(255, 142, 92, ' + (0.34 * pulse).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(240, 88, 60, 0)');
        ctx.strokeStyle = lg;
        ctx.lineWidth = (2.6 + i * 0.8) * pulse;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.quadraticCurveTo(fx + Math.sin(sw) * len * 0.32, fy + dirY * len * 0.6, tipX, tipY);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /** 草：有机麻绳藤蔓缠绕 —— 彻底抛弃等距弹簧：
      · 生长方向区分：上管从天花板【向下】蔓延，下管从地面【向上】攀爬（growUp）；
      · 不规则波动：每半圈螺距由种子伪随机在 26~44px 间抖动，弧半径 ±15% 起伏，
        主干中线叠加低频横向漂移 —— 绝不画成完美等距弹簧；
      · 前后遮挡：前半圈亮绿加粗（lineWidth 6），后半圈暗绿稍细（alpha 更低）；
      · 密集旁支：每个盘旋节点伸出 1~2 条细分支（lineWidth 2~3），末端挂水滴形小叶；
      · 生长动画：吃草后 1 秒内从生长端逐渐延展爬满整根柱子（grow 0→1），12 秒附着期全程保持；
      · 枯萎动画：倒计时最后 2 秒颜色渐变深褐 #5D4037，归零前 0.5 秒淡出（wither 0→1）。
      （视觉 only，绝不改变碰撞体积） */
  function drawVineColumn(rx, ry, rw, rh, seed, a, grow, wither, growUp, purpleFx) {
    if (rh < 30) return;
    const hLim = rh * Math.max(0, Math.min(1, grow));      // 生长高度上限
    if (hLim < 10) return;
    const lerpHex = (c1, c2, k) => {
      const p1 = parseInt(c1.slice(1), 16), p2 = parseInt(c2.slice(1), 16);
      const r = Math.round(((p1 >> 16) & 255) + (((p2 >> 16) & 255) - ((p1 >> 16) & 255)) * k);
      const g = Math.round(((p1 >> 8) & 255) + (((p2 >> 8) & 255) - ((p1 >> 8) & 255)) * k);
      const b = Math.round((p1 & 255) + ((p2 & 255) - (p1 & 255)) * k);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    };
    const frontC = lerpHex('#388E3C', '#5D4037', wither);   // 前绕：亮绿 → 深褐
    const backC = lerpHex('#1B5E20', '#3E2723', wither);     // 后绕：暗绿 → 暗褐
    const branchC = lerpHex('#2E7D32', '#4E342E', wither);   // 旁支：中绿 → 枯褐
    const leafC = lerpHex('#43A047', '#6D4C41', wither);     // 叶片：翠绿 → 枯褐
    const hash = s => { const v = Math.sin(s * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };

    const cx = rx + rw / 2;
    const rxBase = rw / 2 + 3.5;                             // 弧半径略出管壁 → 勒柱缠绕感
    const drift = u => Math.sin(u * 0.045 + seed) * rw * 0.07;   // 主干中线低频横向漂移
    // u = 距生长端的距离（0 = 生长起点：上管顶部 / 下管底部）
    const toY = u => growUp ? (ry + rh - u) : (ry + u);

    // —— 预生成盘旋节点：螺距伪随机抖动（26~44px），弧半径 ±15% 起伏 ——
    const nodes = [];
    for (let u = 0, i = 0; u <= hLim + 50; i++) {
      nodes.push(u);
      u += 26 + hash(i * 3 + 1) * 18;
    }

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // —— 主藤：逐半圈分段绘制（每段整体前绕或后绕，交替换色换粗细） ——
    for (let i = 0; i < nodes.length - 1; i++) {
      const u0 = nodes[i], u1 = Math.min(nodes[i + 1], hLim);
      if (u0 >= hLim) break;
      const front = (i % 2 === 0);                           // 交替前/后半圈
      const r0 = rxBase * (0.85 + hash(i * 5 + 2) * 0.3);    // 弧半径起伏
      const sgn = (i % 2 === 0) ? 1 : -1;                    // 交替左右极点
      ctx.beginPath();
      const steps = Math.max(3, Math.ceil((u1 - u0) / 4));
      for (let s = 0; s <= steps; s++) {
        const u = u0 + (u1 - u0) * (s / steps);
        const x = cx + drift(u) + Math.cos(Math.PI * s / steps) * r0 * sgn;
        if (s === 0) ctx.moveTo(x, toY(u)); else ctx.lineTo(x, toY(u));
      }
      // 雷+草：先铺一层略宽的淡紫色荧光 → 绿藤压在上面，边缘自然透出紫色魔化描边
      if (purpleFx > 0) {
        ctx.globalAlpha = a * (front ? 0.46 : 0.24) * purpleFx;
        ctx.strokeStyle = '#C77BFF';
        ctx.lineWidth = (front ? 6 : 4.2) + 2.8;
        ctx.stroke();
      }
      ctx.globalAlpha = a * (front ? 1 : 0.5);               // 后绕更暗更淡
      ctx.strokeStyle = front ? frontC : backC;
      ctx.lineWidth = front ? 6 : 4.2;                       // 后绕稍细 → 前后层次
      ctx.stroke();
    }
    // —— 密集旁支：每个盘旋节点伸出 1~2 条细枝（基部粗→末梢细两段渐细），末端卷须回钩 + 水滴小叶 ——
    const lerpP = (x1, y1, x2, y2, t) => [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
    for (let i = 1; i < nodes.length - 1; i++) {
      const u = nodes[i];
      if (u > hLim - 8) break;
      const sgn = (i % 2 === 0) ? 1 : -1;
      const bx = cx + drift(u) + sgn * rxBase * (0.85 + hash(i * 5 + 2) * 0.3);
      const by = toY(u);
      const nBr = 1 + Math.floor(hash(i * 7 + 3) * 2);       // 1~2 条分支
      for (let b = 0; b < nBr; b++) {
        const side = hash(i * 31 + b) < 0.75 ? sgn : -sgn;   // 25% 概率反向枝 → 打破左右对称
        const blen = 10 + hash(i * 11 + b * 3) * 11;         // 分支长度 10~21 长短不一
        const dirY = growUp ? -1 : 1;                        // 顺生长方向
        const droop = 0.25 + hash(i * 37 + b) * 0.5;         // 下垂/上扬幅度随机
        const sy = by + (hash(i * 29 + b) - 0.5) * 7;        // 起点沿主藤上下微移，不钉死在节点
        const ex = bx + side * blen * (0.5 + hash(i * 7 + b) * 0.3);
        const ey = sy + dirY * blen * droop;
        // 双控制点各带独立垂直抖动 → S 形不规则弯曲（拒绝对称弧）
        const c1x = bx + side * blen * 0.12;
        const c1y = sy + dirY * blen * 0.12 + (hash(i * 41 + b) - 0.5) * blen * 0.2;
        const c2x = bx + side * blen * 0.62;
        const c2y = sy + dirY * blen * droop * 0.6 + (hash(i * 43 + b) - 0.5) * blen * 0.2;
        // de Casteljau 二分：前半段基部粗（2.4~3.0）、后半段末梢细（1.4~1.9）→ 自然 taper
        const [q0x, q0y] = lerpP(bx, sy, c1x, c1y, 0.5);
        const [q1x, q1y] = lerpP(c1x, c1y, c2x, c2y, 0.5);
        const [q2x, q2y] = lerpP(c2x, c2y, ex, ey, 0.5);
        const [r0x, r0y] = lerpP(q0x, q0y, q1x, q1y, 0.5);
        const [r1x, r1y] = lerpP(q1x, q1y, q2x, q2y, 0.5);
        const [mx, my] = lerpP(r0x, r0y, r1x, r1y, 0.5);
        ctx.strokeStyle = branchC;
        ctx.globalAlpha = a * (0.85 - wither * 0.2);
        ctx.lineWidth = 2.4 + hash(i * 17 + b) * 0.6;        // 基部 2.4~3.0
        ctx.beginPath();
        ctx.moveTo(bx, sy);
        ctx.bezierCurveTo(q0x, q0y, r0x, r0y, mx, my);
        ctx.stroke();
        ctx.lineWidth = 1.4 + hash(i * 47 + b) * 0.5;        // 末梢 1.4~1.9
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.bezierCurveTo(r1x, r1y, q2x, q2y, ex, ey);
        // 末端卷须回钩：方向随机（不随大流朝一边）
        const curl = hash(i * 53 + b) < 0.5 ? -1 : 1;
        ctx.moveTo(ex, ey);
        ctx.quadraticCurveTo(ex + curl * 3.5, ey + dirY * 2, ex + curl * 1.5, ey + dirY * 4.5);
        ctx.stroke();
        // 水滴形小叶片：末梢 1 片（沿曲线切线方向）+ 45% 概率枝中再添 1 片小叶
        const drawLeaf = (lx, ly, tang, ll) => {
          const lw = ll * 0.45;
          ctx.save();
          ctx.translate(lx, ly);
          ctx.rotate(tang + Math.PI / 2);
          ctx.globalAlpha = a;
          ctx.fillStyle = leafC;
          ctx.beginPath();                                   // 水滴形：圆底尖顶
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-lw, -ll * 0.4, 0, -ll);
          ctx.quadraticCurveTo(lw, -ll * 0.4, 0, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };
        const tipTang = Math.atan2(ey - q2y, ex - q2x) + (hash(i * 59 + b) - 0.5) * 0.6;
        drawLeaf(ex, ey, tipTang, 6 + hash(i * 23 + b * 7) * 4);
        if (hash(i * 61 + b) < 0.45) {
          const midTang = Math.atan2(my - r0y, mx - r0x) + (hash(i * 67 + b) - 0.5) * 0.8;
          drawLeaf(mx, my, midTang, 4 + hash(i * 71 + b) * 2.5);
        }
      }
    }
    ctx.restore();
  }

  /** 绘制一根管道：米白纸感本体 + 蓝白胶质冰冻层 + 草藤蔓缠绕 + 四类反应柱体特效
   *  · 火+冰：轨迹触碰部分更白更透（1 秒 Lerp）
   *  · 火+草：藤蔓燃烧 → 变黑 → 完全碳化 → 黑色粉末消散（1.5 秒）
   *  · 水+冰：前 6 根颜色加深、裂纹变多
   *  · 风+岩：缝隙侧侵蚀扩散（视觉 2 秒，碰撞判定已即时生效） */
  /** 岩石自然裂纹：递归生长的分叉裂缝（主干 → 分叉 → 细枝，形似树枝/闪电）
   *  · 绝不贯穿柱身、绝无平行长直线：每条长度 ≤ 1/3 柱高，走向随机游走 + 弧线弯曲
   *  · 粗细渐变：主干起笔略粗，沿程收细，末端趋近尖细；分叉整体更细
   *  · 颜色 = ROCK_GRAIN（比底色略深的深灰），靠线宽+透明度融入石面，绝不用纯黑
   *  · 随机性：每根柱子按自身 seed 重新生成，位置与形态各不相同 */
  function drawRockCracks(rx, ry, rw, rh, sd, k, yBase) {
    if (rh < 18 || rw < 12) return;
    // 自建伪随机序列：同一根柱子每帧稳定，不同柱子形态完全不同
    let st = (Math.abs(Math.floor(sd * 7919)) + 977) % 233280;
    const rnd = () => { st = (st * 9301 + 49297) % 233280; return st / 233280; };
    const count = 2 + (rnd() < 0.5 ? 1 : 0);          // 每根 2~3 条
    const inner = 3;
    const clampX = v => Math.max(rx + inner, Math.min(rx + rw - inner, v));
    const clampY = v => Math.max(ry + inner, Math.min(ry + rh - inner, v));
    const A = 0.55 + 0.15 * k;                        // 主体透明度：始终是「石缝」而非黑线

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 递归生长：ang 为当前方向，len 为剩余长度，w0 为起笔线宽，depth 为分叉层级
    const grow = (x0, y0, ang, len, w0, depth) => {
      const steps = Math.max(5, Math.round(len / 3.6));
      let x = x0, y = y0, a = ang;
      // 每条裂纹独立的波形频率/相位：让走向不规则，避免出现笔直长线
      const fq = 2.6 + rnd() * 3.4;
      const ph = sd * 2.7 + rnd() * 6.283;
      const curve = (rnd() - 0.5) * 0.5;   // 整体弧度：让主干呈弧形弯曲，而非直线
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        // 方向随机游走 + 低频起伏 + 恒定弧度：自然弯曲的裂缝，而非折线锯齿
        a += (rnd() - 0.5) * 0.42 + Math.sin(t * fq + ph) * 0.16 + curve * (len / steps) / 10;
        const seg = len / steps;
        const nx = clampX(x + Math.cos(a) * seg);
        const ny = clampY(y + Math.sin(a) * seg);
        // 粗细渐变：起笔略粗 → 沿线收细 → 末端尖细
        const w = Math.max(0.18, w0 * (1 - t) * (1 - t) + 0.16);
        const al = A * (1 - 0.20 * depth) * (0.62 + 0.38 * (1 - t));
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny);
        // 外层：很淡的晕影，模拟裂缝边缘的阴影（让线条有石缝的凹陷感）
        ctx.lineWidth = w * 1.9;
        ctx.strokeStyle = 'rgba(' + ROCK_GRAIN + ',' + (al * 0.32).toFixed(3) + ')';
        ctx.stroke();
        // 内层：极细实心缝芯
        ctx.lineWidth = w;
        ctx.strokeStyle = 'rgba(' + ROCK_GRAIN + ',' + al.toFixed(3) + ')';
        ctx.stroke();
        // 分叉：角度随机 ±(29°~63°)，线宽按主干起笔宽度衰减（分叉始终更细，但可见）
        if (depth < 2 && i > 1 && i < steps - 1 && rnd() < (depth === 0 ? 0.13 : 0.07)) {
          const side = rnd() < 0.5 ? -1 : 1;
          grow(nx, ny, a + side * (0.5 + rnd() * 0.6),
               len * (0.30 + rnd() * 0.26), Math.max(0.34, w0 * 0.55), depth + 1);
        }
        x = nx; y = ny;
      }
    };

    for (let i = 0; i < count; i++) {
      // 起点随机落在柱面内部（yBase 让裂纹偏向该柱的破损端）
      const sx = rx + rw * (0.16 + 0.68 * rnd());
      const len = Math.min(rh * (0.13 + 0.16 * rnd()), rh * 0.30, 85);   // 紧凑短裂缝，绝不贯穿
      // 保证整条裂纹（含向下生长）不会顶到柱端被夹平
      const sy = Math.min(ry + rh * (yBase + 0.10 + 0.42 * rnd()),
                          ry + rh - inner - len * 0.92);
      const ang = Math.PI * 0.5 + (rnd() - 0.5) * 1.9;               // 大体向下，方向明显偏斜
      grow(sx, sy, ang, len, 0.95 + 0.30 * k, 0);
    }
    ctx.restore();
  }

  /** 岩石层理：只保留 1~2 道极淡、短促、断裂的横向层理
   *  （废弃原来贯穿柱身的纵向长直线，改由 drawRockCracks 负责裂纹表现） */
  function drawRockVeins(rx, ry, rw, rh, sd) {
    if (rh < 14) return;
    const h = s => { const v = Math.sin(s * 51.7 + sd * 133.9) * 43758.5453; return v - Math.floor(v); };
    ctx.save();
    ctx.lineCap = 'round';
    for (let v = 0; v < 2; v++) {
      const y = ry + rh * (0.24 + 0.52 * h(v * 13.9 + 6));
      const x0 = rx + rw * (0.08 + 0.20 * h(v * 17.1 + 1));
      const x1 = x0 + rw * (0.30 + 0.32 * h(v * 19.3 + 3));
      const slope = (h(v * 21.1 + 8) - 0.5) * 6;
      ctx.lineWidth = 0.6 + h(v * 29.3 + 3) * 0.5;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.quadraticCurveTo((x0 + x1) * 0.5, y + slope, x1, y + slope * 0.4);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 取（或按当前屏高重建）彩虹色环缓存画布：8 宽 × L 高的静态渐变条，
   *  整圈五色只画一次，逐帧渲染时直接 drawImage 平铺 —— 不再每帧 createLinearGradient。 */
  function rainbowStripFor(L) {
    if (rainbowStrip && rainbowStripL === L) return rainbowStrip;
    const c = document.createElement('canvas');
    c.width = 8;
    c.height = L;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, L);
    for (let i = 0; i <= RAINBOW_HUES.length; i++) {
      const col = RAINBOW_HUES[i % RAINBOW_HUES.length];
      gr.addColorStop(i / RAINBOW_HUES.length, 'hsl(' + col[0] + ', ' + col[1] + '%, ' + col[2] + '%)');
    }
    g.fillStyle = gr;
    g.fillRect(0, 0, 8, L);
    rainbowStrip = c;
    rainbowStripL = L;
    return c;
  }

  /** 彩虹柱子：彩铅涂色风 —— 中饱和五色（浅红 / 暖黄 / 草绿 / 天蓝 / 紫）竖直渐变缓慢流动；
   *  表面绝对干净：无排线、无噪点、无粗糙纹理；四周 #555555 细实线 strokeRect 描边。
   *  渐变改用「离屏色环缓存 + 竖向平铺」，视觉与逐帧渐变完全一致，仅去掉逐帧重建开销。 */
  function drawRainbowPipe(p, alpha, geo) {
    const a = (typeof alpha === 'number') ? Math.max(0, Math.min(1, alpha)) : 1;
    const groundY = CFG.H - CFG.GROUND_H;
    const g = geo || {};
    const topH = (typeof g.topH === 'number') ? g.topH : p.topH;
    const gapBottom = (typeof g.gapBottom === 'number') ? g.gapBottom : p.topH + CFG.PIPE_GAP;
    const seed = p.seed || 0;
    const x = p.x, w = CFG.PIPE_W;
    const capH = 24, capOver = 6;                  // 必须与普通管口板（drawPipe 的 capH/capOver）完全一致

    // 缓慢流光：一个完整五色环 ≈ 一屏高度，整条色环按该周期向下平移
    const L = Math.max(420, CFG.H);                          // 一个完整色环的长度（像素）
    const strip = rainbowStripFor(L);
    const off = (frameCount * L * 0.0008 + seed * 137) % L;   // 0.0008×L/帧 ≈ 21 秒流完一整圈

    // 用缓存色环平铺填充矩形：源图按需裁剪，严格不画出矩形边界
    const fillStrip = (rx, ry, rw, rh) => {
      if (rw <= 0 || rh <= 0) return;
      let y = ry, remain = rh;
      let sy = ((ry - off) % L + L) % L;      // ry 处对应的色环行
      while (remain > 0.5) {
        const h = Math.min(L - sy, remain);
        ctx.drawImage(strip, 0, sy, strip.width, h, rx, y, rw, h);
        y += h; remain -= h; sy = 0;
      }
    };
    // 柱身：只填充 + 只描左右两条竖边 —— 上下端严格止于管口矩形内沿，
    // 绝不与管口矩形发生任何重叠（旧版柱身的横边会画进管口矩形内部，正是「柱身穿模」的根源）
    const bodyBlock = (ry, rh) => {
      if (rh <= 0) return;
      fillStrip(x, ry, w, rh);
      ctx.strokeStyle = '#555555';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 1, ry + 1);
      ctx.lineTo(x + 1, ry + rh - 1);
      ctx.moveTo(x + w - 1, ry + 1);
      ctx.lineTo(x + w - 1, ry + rh - 1);
      ctx.stroke();
    };

    const topCapY = topH - capH;                   // 上管口矩形顶边（与普通管口板完全同位置）
    const botCapY = gapBottom - 1;                 // 下管口矩形顶边（普通管口板 fillRect 起点 = gapBottom - 1）
    ctx.save();
    ctx.globalAlpha = a;                           // 褪色通道：p.rainbowA 由 stepRainbowFade 每帧递减
    ctx.shadowBlur = 0;                            // 严禁发光/阴影：保持彩铅平涂的干净表面
    bodyBlock(-30, topCapY + 30);                  // 上柱：屏幕外 → 上管口上沿（零重叠）
    bodyBlock(gapBottom + capH, (groundY + 30) - (gapBottom + capH));   // 下柱：下管口下沿 → 草地内 30px
    // 管口板（左右各外扩 capOver）：完整矩形独立绘制 —— 内部整块填满彩虹色，
    // 填充高度 capH + 1（与普通管口板 fillRect 完全同尺寸，覆盖到抗锯齿边缘），
    // 深灰描边整体内缩 1px 完全落在矩形内部，左右肩部（两端）绝不会漏出底色
    const cap = (y) => {
      fillStrip(x - capOver, y, w + capOver * 2, capH + 1);
      ctx.strokeStyle = '#555555';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - capOver + 1, y + 1, w + capOver * 2 - 2, capH - 2);
    };
    cap(topCapY);
    cap(botCapY);
    ctx.restore();
  }
  function drawPipe(p) {
    if (p.charGone || p.icGone || p.cruiseGone) return;
    // 彩虹柱子不再早退：普通柱体始终完整绘制在下层，彩虹色作为「最上层覆盖层」在函数末尾叠加，
    // 这样冰霜 / 岩石 / 藤蔓 / 焦黑等反应特效天然与彩虹色共存 → 褪色时无需二次重绘即可同步呈现形态变化。
    const gapBottomBase = p.topH + CFG.PIPE_GAP;
    const groundY = CFG.H - CFG.GROUND_H;
    const seed = p.seed || 0;

    // 【铁律一】柱子环境特效 = 独立持久通道（envFrostA / envVineA）：
    // 只增不减、只叠加不清空 —— 任何反应触发都不会打断或重置它们，可与滑道三层共存且绝不闪烁
    const frostA = envFrostA;
    const vineA = envVineA;
    // 草藤蔓生长进度：
    //  · vineFull = 反应中途进场的新柱子 → 一进屏就长满（与柱子作为整体出现）
    //  · vineClimbT = 风+草触发帧 → 从 0 重新「爬」上去（先风后草也保留攀爬动画）
    //  · 其余走全局通道（1 秒爬满）
    let vineGrow = envVineGrowP;
    if (p.vineFull) vineGrow = 1;
    else if (typeof p.vineClimbT === 'number') {
      vineGrow = Math.max(0, Math.min(1, (frameCount - p.vineClimbT) / 60));
    }

    // —— 火+草：三段式（正常 1.0 秒：藤蔓燃 0~0.467s / 柱体焦黑 0.467~0.733s / 灰化 0.733~1.0s；
    //    特殊位置 0.5 秒极速版按同比例压缩）——
    const charOn = !!p.charOn;
    const charT = charOn ? (p.charT || 0) : 0;
    const charV1 = p.charV1 || CFG.REACT_CHAR_VINE;
    const charV2 = p.charV2 || CFG.REACT_CHAR_BODY;
    const charV3 = p.charV3 || CFG.REACT_CHAR_ASH;
    const charVineP = charOn ? Math.min(1, charT / charV1) : 0;
    const charBodyP = charOn ? Math.min(1, Math.max(0, charT - charV1) / charV2) : 0;
    const charAshP  = charOn ? Math.min(1, Math.max(0, charT - charV1 - charV2) / charV3) : 0;
    const charBurn = charVineP;  // 兼容：冰层 / 藤蔓让位判断

    // —— 风+岩：侵蚀风化（缺口永久保留）——
    // 颜色锁定：一旦被侵蚀，柱体固定为同一种深灰绿岩石色，全程不做任何 Lerp / 淡出 / 闪烁。
    const erodeP = p.erodeOn ? Math.min(1, p.erodeP || 0) : 0;
    const erodeCut = p.erodeOn && p.erodeCut ? p.erodeCut : 0;
    const erodeType = p.erodeType || 'V';

    // —— 水+冰：目标柱整体颜色在 0.5 秒内由逻辑层 Lerp 加深（iceDeep 0→1）——
    const iceDeep = typeof p.iceDeep === 'number' ? Math.min(1, p.iceDeep) : 0;

    const hTop = Math.max(0, p.topH - erodeCut);
    const hBot = Math.max(0, groundY - gapBottomBase - erodeCut);
    const gapBottom = gapBottomBase + erodeCut;
    const capH = 24;
    const capOver = 6;

    // —— 风化侵蚀轮廓（深度重构）——
    // 端面：M / V / C(斜切) 三种随机 + 双频斑驳锯齿；左右两侧：不规则凹凸缺损，彻底废弃笔直竖边。
    const nz = s => 0.5 + 0.5 * (Math.sin(s * 2.1) * 0.52 + Math.sin(s * 5.7 + 4.2) * 0.32 + Math.sin(s * 11.3 + 1.7) * 0.16);
    const amp = 4 + 15 * erodeP;                 // 端面起伏幅度（收敛：避免尖锐锯齿）
    const edgeAmp = 2.4 + 11.0 * erodeP;         // 侧边凹凸幅度
    const edgeMax = CFG.PIPE_W * 0.15;
    const N = 30;                                  // 端面采样：足够密，读作粗糙石面而非锯齿

    // 端面凸出度（1 = 伸向缝隙，0 = 被风蚀掉最深）
    const protProf = (t) => {
      if (erodeType === 'M') {                    // 中间与两端留棱，四分位被掏空
        const u = Math.abs(t - 0.5) * 2;
        return 0.12 + 0.88 * Math.abs(Math.cos(u * Math.PI));
      }
      if (erodeType === 'V') {                    // 中央一个 V 型深槽
        return Math.pow(Math.abs(t - 0.5) * 2, 1.18);
      }
      return 1 - t;                                // 斜切
    };

    // 侧边咬边：靠近缝隙端最严重；低频起伏 + 高频细颗粒，废弃生硬锯齿
    // 采样必须足够密（44 段），才能沿着平滑噪声走出一圈「粗糙颗粒」轮廓，
    // 否则采样过疏会在相邻两点间拉出细长的三角尖刺。
    const NE = 44;
    const bite = (side, t) => {
      if (erodeP < 0.02) return 0;
      const grow = 0.42 + 0.58 * Math.pow(t, 1.35);
      const n1 = nz(t * 8.5 + side * 31.7 + seed * 5.1);       // 低频：整体凹凸走向
      const n2 = nz(t * 21.3 + side * 13.3 + seed * 7.7);      // 高频：细小颗粒感
      let v = edgeAmp * grow * (0.72 * n1 + 0.28 * n2);
      if (nz(t * 27.3 + side * 71.1 + seed * 9.3) > 0.82) v += edgeAmp * 0.42 * grow;  // 偶发小缺口
      return Math.max(0, Math.min(edgeMax, v));
    };

    const buildEnd = (isTop) => {
      const tipY = isTop ? hTop : gapBottom;
      const off = isTop ? 0 : 53;
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const prot = erodeP > 0.02 ? protProf(t) : 0.5;
        // 粗糙颗粒感：两层平滑噪声（低频起伏 + 高频细碎），取代逐点随机造成的尖锐锯齿
        const g1 = nz(i * 1.35 + off + seed * 3.1) - 0.5;
        const g2 = nz(i * 3.9 + off * 0.7 + seed * 5.7) - 0.5;
        const gran = erodeP > 0.02 ? (1.1 + 4.6 * erodeP) * (g1 * 1.35 + g2 * 0.65) : 0;
        const y = isTop ? tipY + amp * (prot - 0.5) + gran
                        : tipY - amp * (prot - 0.5) - gran;
        pts.push({ x: p.x + (CFG.PIPE_W / N) * i, y });
      }
      return pts;
    };
    const topPts = buildEnd(true);
    const botPts = buildEnd(false);

    // 冰+岩：震动时把顶部 / 底部端点钳制在屏幕内，柱身震动但上下结构绝不留缺口
    const qOffNow = p.quakeY || 0;
    const pinTopY = qOffNow > 0 ? -qOffNow : 0;          // 柱体下移 → 向上延伸贴住屏幕顶（杜绝顶部黑块/空隙）
    const pinBotY = groundY + Math.max(0, -qOffNow);     // 柱体上移 → 向下补齐到地面（底座死死固定）
    function pathTop(noBegin) {
      if (!noBegin) ctx.beginPath();
      ctx.moveTo(p.x, pinTopY);
      ctx.lineTo(p.x + CFG.PIPE_W, pinTopY);            // 顶边贴住屏幕顶部
      const endY = topPts[N].y;
      for (let k = 1; k <= NE; k++) {                   // 右边缘：凹凸缺损
        const t = k / NE;
        ctx.lineTo(p.x + CFG.PIPE_W - bite(1, t), pinTopY + (endY - pinTopY) * t);
      }
      for (let i = N; i >= 0; i--) ctx.lineTo(topPts[i].x, topPts[i].y);
      for (let k = NE; k >= 1; k--) {                   // 左边缘：凹凸缺损
        const t = k / NE;
        ctx.lineTo(p.x + bite(0, t), pinTopY + (endY - pinTopY) * t);
      }
      ctx.closePath();
    }
    function pathBot(noBegin) {
      if (!noBegin) ctx.beginPath();
      ctx.moveTo(p.x, pinBotY);
      ctx.lineTo(p.x + CFG.PIPE_W, pinBotY);            // 底边贴住地面
      if (magmaCut) {
        // 火+岩：裂痕以上的半截已倒塌 → 下管只保留「低矮残桩」，顶边是极度不平整的断裂切口
        const endY = cutPts[N].y;
        for (let k = 1; k <= NE; k++) {
          const t = k / NE;
          ctx.lineTo(p.x + CFG.PIPE_W - bite(3, t), pinBotY + (endY - pinBotY) * t);
        }
        for (let i = N; i >= 0; i--) ctx.lineTo(cutPts[i].x, cutPts[i].y);
        for (let k = NE; k >= 1; k--) {
          const t = k / NE;
          ctx.lineTo(p.x + bite(2, t), pinBotY + (endY - pinBotY) * t);
        }
        ctx.closePath();
        return;
      }
      const endY = botPts[N].y;
      for (let k = 1; k <= NE; k++) {
        const t = k / NE;
        ctx.lineTo(p.x + CFG.PIPE_W - bite(3, t), pinBotY + (endY - pinBotY) * t);
      }
      for (let i = N; i >= 0; i--) ctx.lineTo(botPts[i].x, botPts[i].y);
      for (let k = NE; k >= 1; k--) {
        const t = k / NE;
        ctx.lineTo(p.x + bite(2, t), pinBotY + (endY - pinBotY) * t);
      }
      ctx.closePath();
    }

    // —— 本体配色：常态纸白；岩灰化 / 风化侵蚀统一为中灰岩石（同一色板，绝不黑白对比）——
    const bodyColor = p.erodeOn ? ROCK_BASE : 'rgb(252, 250, 242)';
    const bodyStroke = p.erodeOn ? ROCK_EDGE : (frostA > 0.5 ? '#FFFFFF' : '#555555');

    // 冰+岩：极寒震荡 —— 整根柱子上下震动（顶部 / 底部已由 pinTopY / pinBotY 钳制，无需再补矩形）
    const qy = p.quakeY || 0;
    // 冰+岩：复合强度（反应中 = 1；结束后随 quakeFade 在 1 秒内平滑退回）
    const quakeK = Math.max(0, Math.min(1,
      (reaction && reaction.id === 'quake') ? 1 : (p.quakeFade || 0)));
    // 风+水：迷雾视距 —— fogA 0 = 清晰 / 0.97 = 只剩一团白影 / 1 = 完全不可见（按水平距离分级）
    const fogA = Math.min(1, p.fogA || 0);
    // 白墙遮挡：fogA 逼近 1 时整根柱子（含管口外沿线条）一律不绘制，杜绝轮廓 / 直线穿模
    if (fogA > 0.955) return;
    // 火+岩：横向裂痕（裂痕以上的半截已被岩浆球切断）
    const magmaCut = !!p.magmaCut;
    const cutY = p.magmaCutY || 0;
    // 火+岩：残桩断裂切口 —— 沿柱宽生成向下的锯齿（只向下、绝不向上），切口极度不平整
    const cutPts = [];
    if (magmaCut) {
      for (let i = 0; i <= N; i++) {
        const jag = Math.abs(Math.sin(i * 1.73 + seed * 2.3)) * 6.0
                  + Math.abs(Math.sin(i * 4.31 + seed * 5.7)) * 2.8;
        cutPts.push({ x: p.x + (CFG.PIPE_W / N) * i, y: cutY + jag });
      }
    }

    ctx.save();
    if (qy !== 0) ctx.translate(0, qy);
    if (fogA > 0.002) ctx.globalAlpha *= Math.max(0.03, 1 - fogA * 0.96);
    // 火+草 第三阶段：灰化消散 —— 由缝隙向两端把已烧尽的部分整体擦除（绝不留下实体）
    if (charAshP > 0 || magmaCut) {
      const ashTopH = hTop * charAshP;
      const ashBotH = hBot * charAshP;
      ctx.beginPath();
      ctx.rect(0, 0, CFG.W, CFG.H + 200);
      if (ashTopH > 0.5) ctx.rect(p.x - capOver, hTop - ashTopH, CFG.PIPE_W + capOver * 2, ashTopH + 1);
      if (ashBotH > 0.5) ctx.rect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, ashBotH + 2);
      // 火+岩：擦掉 [缝隙底, 裂痕] 这半截，只留裂痕以下的残桩
      if (magmaCut) ctx.rect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, Math.max(1, cutY - gapBottom) + 1);
      ctx.clip('evenodd');
    }
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = bodyStroke;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';

    // 上管道 / 下管道本体（侵蚀时按 W/V/M 锯齿轮廓裁掉）
    pathTop(); ctx.fill(); ctx.stroke();
    pathBot(); ctx.fill(); ctx.stroke();
    // 冰+岩：顶部 / 底部缺口已由 pathTop / pathBot 的端点钳制补齐（不再叠加矩形补块）
    // 管口板子（一旦侵蚀发生即彻底消失，不留矩形）
    if (erodeP < 0.02) {
      // 先填色再描边；向柱体方向多填 1px，彻底消除 fillRect 与柱身路径之间的抗锯齿白缝
      ctx.fillStyle = bodyColor;
      ctx.fillRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH + 1);
      ctx.strokeStyle = bodyStroke;
      ctx.strokeRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH);
      // 火+岩：裂痕以下的半截已倒塌 → 残桩不再画管口板。
      // （描边线宽有一半在裁剪框外，若继续绘制就会漏出「⌐」形虚框）
      if (!magmaCut) {
        ctx.fillStyle = bodyColor;
        ctx.fillRect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, capH + 1);
        ctx.strokeStyle = bodyStroke;
        ctx.strokeRect(p.x - capOver, gapBottom, CFG.PIPE_W + capOver * 2, capH);
      }
    }

    // 【铁律八】岩灰化：基础环境附着表现（独立持久通道 envRockA，绝不因触发其它反应而被跳过）
    // 统一中的自然中灰岩石色（不偏绿、不发黑、不偏褐），纹理清晰可见
    // 被风化的那 6 组柱子自身不再叠加石化（它们呈现的是风化外观）
    const rockA = p.erodeOn ? 0 : (p.rockGray ? 1 : envRockA);
    if (rockA > 0.002) {
      ctx.save();
      // rockA = 1 时柱体精确等于 ROCK_BASE（与风化柱完全同色，杜绝黑白/褐黑色差）
      ctx.globalAlpha = rockA;
      ctx.fillStyle = ROCK_BASE;
      ctx.strokeStyle = ROCK_EDGE;
      ctx.lineWidth = 2;
      pathTop(); ctx.fill(); ctx.stroke();
      pathBot(); ctx.fill(); ctx.stroke();
      // 管口板子必须同样上色：矩形左右各比柱身宽 capOver 的「肩部」若不覆盖就会露出纸白底缝
      if (erodeP < 0.02) {
        ctx.fillStyle = ROCK_BASE;
        ctx.fillRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH + 1);
        ctx.strokeStyle = ROCK_EDGE;
        ctx.strokeRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH);
        if (!magmaCut) {
          ctx.fillStyle = ROCK_BASE;
          ctx.fillRect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, capH + 1);
          ctx.strokeStyle = ROCK_EDGE;
          ctx.strokeRect(p.x - capOver, gapBottom, CFG.PIPE_W + capOver * 2, capH);
        }
      }
      // 冰+岩：顶部缺口已由 pathTop 端点钳制补齐（岩石层同样覆盖，不会露出纸白横条）
      const hh2 = s => { const v = Math.sin(s * 63.1 + seed * 197.3) * 43758.5453; return v - Math.floor(v); };
      const clipStone = (pf, fn) => { ctx.save(); pf(); ctx.clip(); fn(); ctx.restore(); };
      // 【冰+岩】纹理必须覆盖「震动钳制出的延伸段」：顶部延伸到屏幕顶、底部延伸到地面，
      // 否则延伸段只有平涂 ROCK_BASE、没有石纹 → 读作顶部黑块 / 底部缺失。
      const texTopY = Math.min(0, pinTopY);
      const texTopH = hTop - texTopY;
      const texBotH = pinBotY - gapBottom;
      // 表面粗糙感：随机微小麻点 / 凹坑（深一档的灰 + 少量略亮颗粒，全部贴近底色）
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, texTopY, CFG.PIPE_W, texTopH); }, () => {
        for (let i = 0; i < 30; i++) {
          const sx = p.x + 4 + hh2(i * 3.1 + 1) * (CFG.PIPE_W - 8);
          const sy = texTopY + hh2(i * 5.7 + 2) * texTopH;
          ctx.globalAlpha = (0.22 + 0.20 * hh2(i * 9.3 + 5)) * rockA;
          ctx.fillStyle = i % 3 === 0 ? '#7C7F7D' : '#5C5F5E';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 1.2 + hh2(i * 11.3 + 5) * 2.8, 0.9 + hh2(i * 13.7 + 6) * 1.9,
                      hh2(i * 17.1 + 7) * 3.14, 0, 6.283);
          ctx.fill();
        }
      });
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, gapBottom, CFG.PIPE_W, texBotH); }, () => {
        for (let i = 0; i < 30; i++) {
          const sx = p.x + 4 + hh2(i * 2.7 + 11) * (CFG.PIPE_W - 8);
          const sy = gapBottom + hh2(i * 6.1 + 12) * texBotH;
          ctx.globalAlpha = (0.22 + 0.20 * hh2(i * 8.9 + 15)) * rockA;
          ctx.fillStyle = i % 3 === 0 ? '#7C7F7D' : '#5C5F5E';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 1.2 + hh2(i * 12.7 + 15) * 2.8, 0.9 + hh2(i * 15.3 + 16) * 1.9,
                      hh2(i * 19.9 + 17) * 3.14, 0, 6.283);
          ctx.fill();
        }
      });
      // 自然石纹：极细的略深灰纹（不刺眼），沿柱身蜿蜒 + 少量横向层理
      ctx.globalAlpha = 0.42 * rockA;
      ctx.strokeStyle = 'rgb(' + ROCK_GRAIN + ')';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, texTopY, CFG.PIPE_W, texTopH); }, () => {
        drawRockVeins(p.x, texTopY, CFG.PIPE_W, texTopH, seed);
      });
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, gapBottom, CFG.PIPE_W, texBotH); }, () => {
        drawRockVeins(p.x, gapBottom, CFG.PIPE_W, texBotH, seed + 4.7);
      });
      // 自然分叉裂纹（常态岩石同样具备 2~3 条，形状随机、不贯穿柱身）
      ctx.globalAlpha = rockA;
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, texTopY, CFG.PIPE_W, texTopH); }, () => {
        drawRockCracks(p.x, texTopY, CFG.PIPE_W, texTopH, seed + 13.7, 0.5, 0.34);
      });
      clipStone(() => { ctx.beginPath(); ctx.rect(p.x, gapBottom, CFG.PIPE_W, texBotH); }, () => {
        drawRockCracks(p.x, gapBottom, CFG.PIPE_W, texBotH, seed + 21.3, 0.5, 0.02);
      });
      // 边缘立体感：左侧一条细长浅灰高光线，右侧一条微弱暗线（都很克制）
      ctx.globalAlpha = rockA;
      clipStone(() => {
        ctx.beginPath();
        ctx.rect(p.x, texTopY, CFG.PIPE_W, texTopH);
        ctx.rect(p.x, gapBottom, CFG.PIPE_W, texBotH);
      }, () => {
        ctx.fillStyle = 'rgba(198, 203, 201, 0.34)';
        ctx.fillRect(p.x + 1.5, texTopY, 2, texTopH);
        ctx.fillRect(p.x + 1.5, gapBottom, 2, texBotH);
        ctx.fillStyle = 'rgba(58, 62, 61, 0.28)';
        ctx.fillRect(p.x + CFG.PIPE_W - 3.5, texTopY, 2, texTopH);
        ctx.fillRect(p.x + CFG.PIPE_W - 3.5, gapBottom, 2, texBotH);
      });
      ctx.restore();
    }

    // 冰+岩：极寒震荡 —— 原岩色整体「变浅」（叠在岩石层之上、冰霜层之下，构成冰岩复合质感）
    if (quakeK > 0.002) {
      ctx.save();
      ctx.globalAlpha = 0.34 * quakeK;
      ctx.fillStyle = '#FFFFFF';
      pathTop(); ctx.fill();
      pathBot(); ctx.fill();
      ctx.restore();
      // 管口矩形板：与柱身使用完全相同的提亮强度（不再叠加「中间深、两边浅」的水平暗块），
      // 冰层渐变由 drawFrostSeg 的「柱身+管口一体化竖直渐变」接管 → 管口与柱身之间绝对平滑过渡
      if (erodeP < 0.02) {
        ctx.save();
        ctx.globalAlpha = 0.34 * quakeK;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH + 1);
        if (!magmaCut) ctx.fillRect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, capH + 1);
        ctx.restore();
      }
    }

    // 冰：蓝白胶质冰冻层（碳化后期不再保留；冰+岩时必须与岩石层同时完整显示，绝不互相覆盖）
    if (frostA > 0 && charBurn < 0.5 && (erodeP < 0.8 || quakeK > 0.002)) {
      // 冰+岩：结霜层按比例半透明叠加，让柱身岩石底色透出来 → 冰与岩同时完整可见
      const fa = frostA * (1 - 0.42 * quakeK);
      const fTop = Math.min(0, pinTopY);                  // 顶部延伸段同样结霜
      // 柱身 + 管口肩部合并成「一段」绘制：同一个竖直渐变跨过管口接缝 → 绝对无断层
      const coF = (erodeP < 0.02) ? capOver : 0;
      // deep = iceDeep：水+冰反应期在原始冻底色上整体加深（碎片颜色与之严格同源）
      drawFrostSeg(p.x, fTop, CFG.PIPE_W, hTop - fTop, seed, fa, coF, capH, false, iceDeep);
      drawFrostSeg(p.x, gapBottom, CFG.PIPE_W, pinBotY - gapBottom, seed + 3.7, fa, coF, capH, true, iceDeep);
    }

    // 草：藤蔓一圈一圈缠绕整根柱子（第一阶段点火燃烧；第二阶段起由焦黑层接管）
    if (vineA > 0 && charT < charV1) {
      const pfx = (reaction && reaction.id === 'cruise') ? 1 : 0;   // 雷+草：藤蔓紫色荧光描边
      drawVineColumn(p.x, 0, CFG.PIPE_W, hTop, seed, vineA, vineGrow, 0, false, pfx);
      drawVineColumn(p.x, gapBottom, CFG.PIPE_W, hBot, seed + 2.4, vineA, vineGrow, 0, true, pfx);
    }

    // 水+冰：柱体底色已由 drawFrostSeg(deep = iceDeep) 在「上一版冰冻底色」基础上整体加深，
    // 这里只在加深底色上叠加反应期激增的白霜裂纹网（越接近碎裂越密集，体现即将碎裂的张力）。
    if (iceDeep > 0) {
      // 反应期裂纹网只铺柱身：管口带让出（管口内裂纹由 drawFrostSeg 的 ②b 单独绘制）
      const cs = (erodeP < 0.02) ? capH : 0;
      drawIceSpread(p.x, 0, CFG.PIPE_W, Math.max(0, hTop - cs), seed, iceDeep);
      drawIceSpread(p.x, gapBottom + cs, CFG.PIPE_W, Math.max(0, hBot - cs), seed + 3.7, iceDeep);
    }

    // 【管口过渡死命令 · 第 4 次】水+冰 / 冰+岩：管口矩形必须是「中间深、两边浅」的平滑过渡。
    // 采用离屏预渲染软阴影（横向连续线性渐变 中心深→两侧全透明，纵向逐行 1px alpha 淡出），
    // 管口与柱身 / 肩部之间绝无生硬色块与接缝断层。
    if (erodeP < 0.02 && (iceDeep > 0.004 || quakeK > 0.004)) {
      const capShadeK = Math.max(iceDeep, quakeK);
      const shadeRGB = iceDeep > 0.004 ? '56, 112, 158' : '76, 88, 102';
      const cw = CFG.PIPE_W + capOver * 2;
      ctx.save();
      ctx.globalAlpha = 0.88 * capShadeK;
      // 上管口：缝隙在下端 → 深色向下收敛，向上（柱身）逐行淡出
      ctx.drawImage(capShadeSprite(cw, capH, shadeRGB, false), p.x - capOver, hTop - capH, cw, capH);
      if (!magmaCut) {
        // 下管口：缝隙在上端 → 深色向上收敛，向下（柱身）逐行淡出
        ctx.drawImage(capShadeSprite(cw, capH, shadeRGB, true), p.x - capOver, gapBottom, cw, capH);
      }
      ctx.restore();
    }

    // 火+冰：轨迹融化通道 —— 沿小鸟真实飞行轨迹逐帧捕捉出的贯穿洞（永久保留到柱子飞出屏幕）
    // 通道宽度 = 小鸟本体 1.5 倍；边缘由大小不一的圆弧叠加而成，绝不出现任何直线/矩形
    if (p.meltTrack && p.meltTrack.length) {
      const tr = p.meltTrack;
      const addCircle = (x, y, r) => {
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, Math.PI * 2);
      };
      ctx.save();
      ctx.beginPath();
      ctx.rect(p.x, 0, CFG.PIPE_W, hTop);
      ctx.rect(p.x, gapBottom, CFG.PIPE_W, hBot);
      ctx.clip();
      ctx.beginPath();
      // 1) 外层气化光晕：沿轨迹外扩一圈，柔和的白蓝雾感
      for (const s of tr) addCircle(p.x + s.x, s.y, s.r * 1.32);
      ctx.fillStyle = 'rgba(178, 226, 255, 0.36)';
      ctx.fill();
      // 2) 通道主体：冰蓝（入口）→ 极浅水汽 → 纯白（出口）的平滑渐变
      ctx.beginPath();
      for (let i = 0; i < tr.length; i++) {
        const s = tr[i];
        addCircle(p.x + s.x, s.y, s.r);
        // 隔点叠加偏移小圆 → 边缘呈不规则水滴 / 气化弧形，而非光滑直筒
        if (i % 2 === 0) {
          const wob = s.r * (0.34 + 0.16 * Math.sin(s.seed));
          addCircle(p.x + s.x + Math.cos(s.seed) * s.r * 0.62,
                    s.y + Math.sin(s.seed) * s.r * 0.62, wob);
        }
      }
      const cg = ctx.createLinearGradient(p.x, 0, p.x + CFG.PIPE_W, 0);
      cg.addColorStop(0.00, 'rgba(154, 216, 248, 0.78)');
      cg.addColorStop(0.45, 'rgba(212, 242, 255, 0.86)');
      cg.addColorStop(1.00, 'rgba(255, 255, 255, 0.62)');
      ctx.fillStyle = cg;
      ctx.fill();
      // 3) 高温白芯：紧贴轨迹中心的细长灼白通道
      ctx.beginPath();
      for (const s of tr) addCircle(p.x + s.x, s.y, s.r * 0.54);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.fill();
      // 4) 不规则洞缘高光：逐点圆弧描边，形成气化波浪边
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
      for (const s of tr) {
        const rr = s.r * (0.9 + 0.1 * Math.sin(s.seed * 3.1));
        ctx.beginPath();
        ctx.arc(p.x + s.x, s.y, rr, s.seed, s.seed + Math.PI * 1.55);
        ctx.stroke();
      }
      // 5) 出口水滴：通道末端向下拖出 1~2 颗融化的水滴，强化「高温融穿」质感
      const lastS = tr[tr.length - 1];
      if (lastS) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
        for (let d = 0; d < 2; d++) {
          const dr = lastS.r * (0.26 - d * 0.09);
          ctx.beginPath();
          ctx.ellipse(p.x + lastS.x - d * 3, lastS.y + lastS.r * (0.72 + d * 0.5),
                      dr * 0.86, dr, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // 火+草：三段式碳化层（藤蔓着火 → 柱体焦黑 → 灰化），火焰随灰化逗留熄灭
    if (charOn && (charVineP > 0.001 || charBodyP > 0.001)) {
      drawCharBody(p.x, 0, CFG.PIPE_W, hTop, seed, charVineP, charBodyP, false, charAshP);
      drawCharBody(p.x, gapBottom, CFG.PIPE_W, hBot, seed + 2.4, charVineP, charBodyP, true, charAshP);
    }
    // 灰化前沿：缝隙侧推进的余烬亮边（始终留在未灰化的一侧）
    if (charAshP > 0.001 && charAshP < 0.999) {
      const yT = hTop - hTop * charAshP;
      const yB = gapBottom + hBot * charAshP;
      const flick = 0.7 + 0.3 * Math.sin(frameCount * 0.5);
      ctx.save();
      ctx.globalAlpha = flick;
      const eg = ctx.createLinearGradient(p.x, 0, p.x + CFG.PIPE_W, 0);
      eg.addColorStop(0.00, 'rgba(255, 130, 76, 0)');
      eg.addColorStop(0.22, 'rgba(255, 168, 112, 0.44)');
      eg.addColorStop(0.50, 'rgba(255, 214, 166, 0.62)');
      eg.addColorStop(0.78, 'rgba(255, 168, 112, 0.44)');
      eg.addColorStop(1.00, 'rgba(255, 130, 76, 0)');
      ctx.fillStyle = eg;
      if (hTop > 6) ctx.fillRect(p.x, yT - 4, CFG.PIPE_W, 4);
      if (hBot > 6) ctx.fillRect(p.x, yB, CFG.PIPE_W, 4);
      ctx.restore();
    }

    // 风+岩：固定的风化裂纹、麻点与凹坑（外观锁定，颜色/透明度全程不变；缺口永久保留）
    // 全部使用与常态岩石同一套灰系：只在破损边缘 / 裂纹深处稍暗一点点，绝无黑白褐对比
    if (p.erodeOn && erodeP > 0.02) {
      ctx.save();
      ctx.globalAlpha = 1;   // 裂纹透明度由 drawRockCracks 内部 rgba 控制
      const clipDraw = (pf, fn) => { ctx.save(); pf(); ctx.clip(); fn(); ctx.restore(); };
      // 细长、向下蔓延的极细深灰风化裂纹（带分叉）
      clipDraw(pathTop, () => drawRockCracks(p.x, 0, CFG.PIPE_W, hTop, seed, erodeP, 0.40));
      clipDraw(pathBot, () => drawRockCracks(p.x, gapBottom, CFG.PIPE_W, hBot, seed + 5.3, erodeP, 0.04));
      // 与基础岩态一致的自然石纹（风化后依旧保持同一套岩石肌理，只比底色稍深）
      ctx.strokeStyle = 'rgb(' + ROCK_GRAIN + ')';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      clipDraw(pathTop, () => drawRockVeins(p.x, 0, CFG.PIPE_W, hTop, seed + 2.1));
      clipDraw(pathBot, () => drawRockVeins(p.x, gapBottom, CFG.PIPE_W, hBot, seed + 6.9));
      const hh2 = s => { const v = Math.sin(s * 73.1 + seed * 41.7) * 43758.5453; return v - Math.floor(v); };
      // 微小麻点：与基础岩态同款的细碎颗粒（略深 / 略亮各一半）
      clipDraw(pathTop, () => {
        for (let i = 0; i < 20; i++) {
          const sx = p.x + 4 + hh2(i * 3.3 + 21) * (CFG.PIPE_W - 8);
          const sy = 4 + hh2(i * 5.9 + 22) * Math.max(1, hTop - 8);
          ctx.globalAlpha = 0.20 + 0.16 * hh2(i * 8.1 + 23);
          ctx.fillStyle = i % 3 === 0 ? '#7C7F7D' : '#5C5F5E';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 1.0 + hh2(i * 11.7 + 24) * 2.2, 0.8 + hh2(i * 13.1 + 25) * 1.6,
                      hh2(i * 17.9 + 26) * 3.14, 0, 6.283);
          ctx.fill();
        }
      });
      clipDraw(pathBot, () => {
        for (let i = 0; i < 20; i++) {
          const sx = p.x + 4 + hh2(i * 2.9 + 31) * (CFG.PIPE_W - 8);
          const sy = gapBottom + 4 + hh2(i * 6.7 + 32) * Math.max(1, hBot - 8);
          ctx.globalAlpha = 0.20 + 0.16 * hh2(i * 8.3 + 33);
          ctx.fillStyle = i % 3 === 0 ? '#7C7F7D' : '#5C5F5E';
          ctx.beginPath();
          ctx.ellipse(sx, sy, 1.0 + hh2(i * 11.9 + 34) * 2.2, 0.8 + hh2(i * 13.3 + 35) * 1.6,
                      hh2(i * 17.7 + 36) * 3.14, 0, 6.283);
          ctx.fill();
        }
      });
      // 少量固定的风化凹坑（深一档的灰，不做强黑白对比）
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(78, 82, 81, 0.26)';
      clipDraw(pathTop, () => {
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(p.x + 8 + hh2(i * 11 + 4) * (CFG.PIPE_W - 16),
                      hTop * (0.45 + hh2(i * 13 + 6) * 0.5),
                      2.4 + hh2(i * 17) * 3.6, 1.6 + hh2(i * 19) * 2.4,
                      hh2(i * 23) * 3, 0, 6.283);
          ctx.fill();
        }
      });
      clipDraw(pathBot, () => {
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(p.x + 8 + hh2(i * 29 + 5) * (CFG.PIPE_W - 16),
                      gapBottom + hBot * (0.05 + hh2(i * 31 + 7) * 0.42),
                      2.4 + hh2(i * 37) * 3.6, 1.6 + hh2(i * 41) * 2.4,
                      hh2(i * 43) * 3, 0, 6.283);
          ctx.fill();
        }
      });
      // 边缘立体感：与基础岩态同款 —— 左侧细长浅灰高光，右侧微弱暗线
      clipDraw(pathTop, () => {
        ctx.fillStyle = 'rgba(198, 203, 201, 0.34)';
        ctx.fillRect(p.x + 1.5, 0, 2, hTop);
        ctx.fillStyle = 'rgba(58, 62, 61, 0.28)';
        ctx.fillRect(p.x + CFG.PIPE_W - 3.5, 0, 2, hTop);
      });
      clipDraw(pathBot, () => {
        ctx.fillStyle = 'rgba(198, 203, 201, 0.34)';
        ctx.fillRect(p.x + 1.5, gapBottom, 2, hBot);
        ctx.fillStyle = 'rgba(58, 62, 61, 0.28)';
        ctx.fillRect(p.x + CFG.PIPE_W - 3.5, gapBottom, 2, hBot);
      });
      ctx.restore();
    }

    // 风+水：迷雾白纱 —— 越远越白（配合整体透明度：第 2 根只剩一团白影，第 3 根完全不可见）
    if (fogA > 0.02) {
      ctx.fillStyle = 'rgba(250, 251, 253,' + (0.72 * fogA).toFixed(3) + ')';
      pathTop(); ctx.fill();
      pathBot(); ctx.fill();
      // 管口肩部（柱身之外 capOver 的外沿）同样蒙白：消除雾中「多出直线」的穿模
      ctx.fillRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH + 1);
      ctx.fillRect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, capH + 2);
    }

    ctx.restore();

    // 火+岩：横向熔融裂痕（画在裁剪之外，让橙光能微微溢出柱面）
    if (magmaCut) {
      ctx.save();
      if (qy !== 0) ctx.translate(0, qy);
      if (fogA > 0.002) ctx.globalAlpha *= Math.max(0.03, 1 - fogA * 0.96);
      const flick = 0.82 + 0.18 * Math.sin(frameCount * 0.42 + seed);
      const cg = ctx.createLinearGradient(p.x, 0, p.x + CFG.PIPE_W, 0);
      cg.addColorStop(0.00, 'rgba(255, 122, 53, 0.12)');
      cg.addColorStop(0.50, 'rgba(255, 168, 92,' + (0.92 * flick).toFixed(3) + ')');
      cg.addColorStop(1.00, 'rgba(255, 122, 53, 0.12)');
      ctx.fillStyle = cg;
      ctx.fillRect(p.x - 2, cutY - 3.4, CFG.PIPE_W + 4, 6.8);
      // 熔融亮线沿「不平整断裂切口」起伏，而不是一条直线
      ctx.strokeStyle = 'rgba(255, 240, 216,' + (0.9 * flick).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      if (cutPts.length > 1) {
        ctx.moveTo(cutPts[0].x, cutPts[0].y - 0.6);
        for (let i = 1; i < cutPts.length; i++) ctx.lineTo(cutPts[i].x, cutPts[i].y - 0.6);
      } else {
        ctx.moveTo(p.x, cutY); ctx.lineTo(p.x + CFG.PIPE_W, cutY);
      }
      ctx.stroke();
      // 断面下方的高温灼烧余辉（沿切口向内渗入一小段）
      const ig = ctx.createLinearGradient(0, cutY, 0, cutY + 22);
      ig.addColorStop(0, 'rgba(198, 58, 24,' + (0.5 * flick).toFixed(3) + ')');
      ig.addColorStop(1, 'rgba(150, 46, 20, 0)');
      ctx.fillStyle = ig;
      ctx.fillRect(p.x, cutY, CFG.PIPE_W, 22);
      // 沿残桩向下流淌的岩浆
      for (let d = 0; d < 3; d++) {
        const dx2 = p.x + 12 + ((seed * (d + 5) * 37) % (CFG.PIPE_W - 24));
        const len = 6 + d * 5 + Math.abs(Math.sin(frameCount * 0.05 + d)) * 5;
        ctx.strokeStyle = 'rgba(255, 138, 64, 0.68)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(dx2, cutY + 2);
        ctx.lineTo(dx2, cutY + 2 + len);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ===== 彩虹覆盖层（最上层）=====
    // 彩虹色只是「叠加在普通柱体上的涂色」，褪色 = rainbowA 逐帧递减，
    // 底下的结霜 / 岩石 / 藤蔓 / 焦黑从第一帧起就完整可见 → 褪色与形态变化严格同步，绝不出现「等褪完再加特效」。
    if (p.rainbow) {
      const rbA = (typeof p.rainbowA === 'number') ? p.rainbowA : 1;
      if (rbA > 0.012) {
        // 冰 / 岩附着：冰层保持彩虹鲜明（冰晶釉面单独叠加，薄冰下透出彩色）；
        // 岩层上彩虹适度压低（露出石纹）
        let capA = 1;
        if (rockA > 0.02) capA = Math.min(capA, 0.62);
        ctx.save();
        if (qy !== 0) ctx.translate(0, qy);        // 冰+岩震荡：彩虹层与柱身同步位移，杜绝错位重叠
        // 裁剪区 = 柱体真实轮廓 + 两侧管口的「肩部」竖条。柱身轮廓只有 PIPE_W 宽，
        // 若只裁柱身，管口左右各外扩 capOver 的肩部会被裁掉 → 两端漏出纸白底（缺色根源）。
        // 【关键】肩部必须用两条不重叠的 6px 竖条，绝不能用整块 84px 矩形：
        // pathBot 的绕向与 ctx.rect 相反，整块矩形与下柱轮廓重叠时会被非零环绕规则
        // 相互抵消 → 下管口中部被裁空、只剩两侧肩部上色（正是「两端有颜色、中间漏白」的根因）。
        ctx.beginPath();
        pathTop(true);
        pathBot(true);
        const capTopY = hTop - (capH - 1);
        ctx.rect(p.x - capOver, capTopY, capOver, capH + 2);
        ctx.rect(p.x + CFG.PIPE_W, capTopY, capOver, capH + 2);
        if (!magmaCut) {
          ctx.rect(p.x - capOver, gapBottom - 1, capOver, capH + 2);
          ctx.rect(p.x + CFG.PIPE_W, gapBottom - 1, capOver, capH + 2);
        }
        ctx.clip();
        drawRainbowPipe(p, rbA * capA, { topH: hTop, gapBottom: gapBottom });
        // 【冰附着 · 通透冰晶】彩虹色在薄冰下透出来：冰蓝玻璃釉 + 四角星棱面闪光，
        // 半透明质感取代以往「被白霜压灰」的浑浊观感
        if (frostA > 0.02) {
          const fa = Math.min(1, frostA);
          const iceG = ctx.createLinearGradient(0, 0, 0, CFG.H - CFG.GROUND_H);
          iceG.addColorStop(0.00, 'rgba(216, 244, 255,' + (0.21 * fa).toFixed(3) + ')');
          iceG.addColorStop(0.42, 'rgba(168, 226, 255,' + (0.12 * fa).toFixed(3) + ')');
          iceG.addColorStop(0.72, 'rgba(198, 238, 255,' + (0.14 * fa).toFixed(3) + ')');
          iceG.addColorStop(1.00, 'rgba(236, 252, 255,' + (0.18 * fa).toFixed(3) + ')');
          ctx.fillStyle = iceG;
          ctx.fillRect(p.x, 0, CFG.PIPE_W, hTop);
          ctx.fillRect(p.x, gapBottom, CFG.PIPE_W, hBot);
          ctx.fillRect(p.x - capOver, hTop - capH, CFG.PIPE_W + capOver * 2, capH + 1);
          if (!magmaCut) ctx.fillRect(p.x - capOver, gapBottom - 1, CFG.PIPE_W + capOver * 2, capH + 2);
          // 冰晶闪光：固定分布（种子决定），随时间细微闪烁，落点只允许在柱身 / 管口内
          const ih = s => { const v = Math.sin(s) * 43758.5453; return v - Math.floor(v); };
          const gyI = CFG.H - CFG.GROUND_H;
          for (let i = 0; i < 26; i++) {
            const sx = p.x + 5 + ih(i * 3.7 + seed * 9.1) * (CFG.PIPE_W - 10);
            const sy = 18 + ih(i * 7.3 + seed * 4.7) * Math.max(1, gyI - 36);
            if (!(sy < hTop - 2 || sy > gapBottom + 2)) continue;
            const tw = 0.5 + 0.5 * Math.abs(Math.sin(frameCount * 0.055 + i * 1.7 + seed));
            const r = 1.2 + ih(i * 5.1 + 3.3) * 2.0;
            ctx.globalAlpha = fa * (0.35 + 0.55 * tw);
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(sx, sy - r * 2.2);
            ctx.lineTo(sx + r * 0.55, sy - r * 0.55);
            ctx.lineTo(sx + r * 2.2, sy);
            ctx.lineTo(sx + r * 0.55, sy + r * 0.55);
            ctx.lineTo(sx, sy + r * 2.2);
            ctx.lineTo(sx - r * 0.55, sy + r * 0.55);
            ctx.lineTo(sx - r * 2.2, sy);
            ctx.lineTo(sx - r * 0.55, sy - r * 0.55);
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        ctx.restore();
        // 草附着：藤蔓必须缠绕在彩虹色之上（先彩虹后藤蔓 → 视觉上藤蔓是缠绕物）
        if (vineA > 0.02 && charT < charV1) {
          const rpfx = (reaction && reaction.id === 'cruise') ? 1 : 0;
          drawVineColumn(p.x, 0, CFG.PIPE_W, Math.max(0, hTop), seed, vineA, vineGrow, 0, false, rpfx);
          drawVineColumn(p.x, gapBottom, CFG.PIPE_W, Math.max(0, hBot), seed + 2.4, vineA, vineGrow, 0, true, rpfx);
        }
      }
    }
  }

  /** 绘制一枚金币（用椭圆的宽度变化模拟旋转，并增加金色光晕） */
  function drawCoin(c) {
    const w = Math.max(2, Math.abs(Math.cos(c.phase)) * c.r);

    // 金色光晕
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(255, 210, 63, 0.6)';
    
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, w, c.r, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd23f';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#c98a00';
    ctx.stroke();
    
    ctx.restore();

    // 高光（白色小点）
    ctx.beginPath();
    ctx.ellipse(c.x - w * 0.3, c.y - c.r * 0.3, Math.max(0.5, w * 0.3), c.r * 0.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fill();
  }

  /* ============================================================
   * 元素符号本体（纯符号，无外圈圆球）
   * 设计坐标系：以图标中心为原点，绘制范围 -20 ~ +20（即 40×40 设计框）。
   * 统一使用多层填充 + 柔和描边 + 轻微 shadowBlur，模拟蜡笔/彩铅质感。
   * ============================================================ */
  /** 每种元素的符号配色（同时用于贴身荧光弱光层的取色） */
  const ICON_COLORS = {
    '火': '#FF4500',
    '水': '#1E90FF',
    '冰': '#00FFFF',
    '雷': '#9C27B0',
    '草': '#32CD32',
    '岩': '#DAA520',
    '风': '#00FA9A'
  };

  /**
   * 绘制一个元素符号本体。
   * @param key  元素汉字（风/火/水/岩/冰/雷/草）
   * @param x,y  图标中心
   * @param size 设计尺寸（40 = 世界掉落物全尺寸；26 = HUD 缩小版）
   * 桌面端：静态符号（风/冰/水/草/岩）预渲染成一张贴图（含柔和 shadowBlur 发光），
   *         主循环只 drawImage —— 不再每帧重复贝塞尔路径 + 阴影模糊。
   *         火/雷 的符号本身带逐帧动画（火星跳动 / 电流激荡），仍走原路径绘制，动画完整保留。
   * 移动端：全部保持原路径绘制（移动端已关闭 shadowBlur，路径本身开销可接受）。
   */
  const _iconCache = Object.create(null);
  function iconSprite(key) {
    let c = _iconCache[key];
    if (c) return c;
    const BOX = 60, SS = 3, S = BOX * SS;    // 60 单位画布：容纳 40 尺寸符号 + 阴影外溢
    c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.setTransform(SS, 0, 0, SS, S / 2, S / 2);
    const prev = ctx;
    ctx = g;
    try {
      switch (key) {
        case '风': iconWind(); break;
        case '火': iconFire(); break;
        case '雷': iconThunder(); break;
        case '冰': iconIce(); break;
        case '水': iconWater(); break;
        case '草': iconGrass(); break;
        case '岩': iconRock(); break;
      }
    } finally {
      ctx = prev;
    }
    _iconCache[key] = c;
    return c;
  }
  function drawElementIcon(key, x, y, size) {
    if (!IS_MOBILE && key !== '火' && key !== '雷') {   // 火/雷 符号自带逐帧动画，保持原路径
      const spr = iconSprite(key);
      const k = size / 40, half = 30 * k;
      ctx.drawImage(spr, x - half, y - half, half * 2, half * 2);
      return;
    }
    const s = size / 40;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    switch (key) {
      case '风': iconWind(); break;
      case '火': iconFire(); break;
      case '雷': iconThunder(); break;
      case '冰': iconIce(); break;
      case '水': iconWater(); break;
      case '草': iconGrass(); break;
      case '岩': iconRock(); break;
    }
    ctx.restore();
  }

  /** 风：三道向右吹拂的流线型曲线，圆头笔触，粗细渐变，轻盈流动 */
  function iconWind() {
    ctx.save();
    ctx.shadowColor = 'rgba(0, 250, 154, 0.55)';
    ctx.shadowBlur = 7;
    const rows = [-10, 0, 9];
    for (let i = 0; i < 3; i++) {
      const y0 = rows[i];
      const len = i === 1 ? 31 : 25 - i * 2;          // 中段最长，上下略短
      const x0 = -17 + i * 3;
      const w = 3.9 - i * 0.9;                        // 起笔粗 → 收笔细（粗细渐变）
      ctx.strokeStyle = '#00FA9A';
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.bezierCurveTo(x0 + len * 0.32, y0 - 7,
                        x0 + len * 0.64, y0 + 7,
                        x0 + len, y0 + 1);
      ctx.stroke();
      // 笔尖收细的第二段：浅薄荷色叠在弧线尾部，模拟笔压变化
      ctx.strokeStyle = 'rgba(185, 255, 240, 0.9)';
      ctx.lineWidth = Math.max(0.9, w * 0.42);
      ctx.beginPath();
      ctx.moveTo(x0 + len * 0.42, y0 + 0.4);
      ctx.bezierCurveTo(x0 + len * 0.66, y0 + 3.2,
                        x0 + len * 0.84, y0 + 2.2,
                        x0 + len, y0 + 1);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** 火：向上升腾的火焰，赤红外轮廓 + 浅黄内焰 + 深红描边 + 火星点 */
  function iconFire() {
    ctx.save();
    ctx.shadowColor = 'rgba(255, 69, 0, 0.6)';
    ctx.shadowBlur = 8;
    // 外焰
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.bezierCurveTo(5, -12, 9, -6, 9, 1);
    ctx.bezierCurveTo(9, 9, 5, 15, 0, 15);
    ctx.bezierCurveTo(-5, 15, -9, 9, -9, 1);
    ctx.bezierCurveTo(-9, -4, -6, -7, -4.5, -11);
    ctx.bezierCurveTo(-3.5, -7, -1.5, -6, 0.5, -9);
    ctx.bezierCurveTo(2, -12, 1, -15, 0, -18);
    ctx.closePath();
    ctx.fillStyle = '#FF4500';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = '#B22222';
    ctx.stroke();
    // 内焰
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(0, -5.5);
    ctx.bezierCurveTo(3.5, -1, 5, 3, 4, 7);
    ctx.bezierCurveTo(3, 11, -3, 11, -4, 7);
    ctx.bezierCurveTo(-5, 3, -3.5, 0, 0, -5.5);
    ctx.closePath();
    ctx.fillStyle = '#FFD700';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 205, 70, 0.9)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 火星（轻微上下跳动）
    const sparks = [[-13, -9, 1.5], [12.5, -6, 1.2], [-11, 7, 1.1], [13, 9, 1.4], [0.5, -19, 0.9]];
    for (let i = 0; i < sparks.length; i++) {
      const sp = sparks[i];
      const j = Math.sin(frameCount * 0.12 + i * 2.1) * 1.6;
      ctx.beginPath();
      ctx.arc(sp[0] + j * 0.3, sp[1] - j, sp[2], 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#FFD700' : '#FF4500';
      ctx.fill();
    }
    ctx.restore();
  }

  /** 雷：圆角粗折线闪电（高亮紫 #9C27B0 填充 + 深紫粗描边）+ 浅紫电流激荡点缀 */
  function iconThunder() {
    ctx.save();
    // 电流激荡（浅紫折线，画在底层）
    ctx.strokeStyle = 'rgba(206, 147, 216, 0.85)';
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(frameCount * 0.2);
    const sparkArcs = [[-16.5, -12, -9.5, -8, -12.5, -3],
                       [16, -10, 9.5, -5, 12.5, 1],
                       [-15.5, 6, -8.5, 9, -12, 13]];
    for (let i = 0; i < sparkArcs.length; i++) {
      const a = sparkArcs[i];
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(a[2], a[3]);
      ctx.lineTo(a[4], a[5]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // 主闪电
    ctx.shadowColor = 'rgba(156, 39, 176, 0.75)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(3, -18.5);
    ctx.lineTo(-8.5, -2);
    ctx.lineTo(-1.5, -2);
    ctx.lineTo(-6, 18.5);
    ctx.lineTo(10, -1);
    ctx.lineTo(2, -1);
    ctx.closePath();
    ctx.fillStyle = '#9C27B0';
    ctx.fill();
    ctx.lineWidth = 3.2;
    ctx.strokeStyle = '#6A1B9A';
    ctx.stroke();
    ctx.restore();
  }

  /** 冰：清晰的六角雪花 —— 中心小正六边形 + 六条主枝干 + 枝干末端「V」字分叉，浅冰蓝与白色交织 */
  function iconIce() {
    ctx.save();
    ctx.shadowColor = 'rgba(173, 216, 230, 0.95)';
    ctx.shadowBlur = 6;
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3;
      const ca = Math.cos(a), sa = Math.sin(a);
      const tx = ca * 16.5, ty = sa * 16.5;                    // 枝干末端
      ctx.strokeStyle = (k % 2 === 0) ? '#ADD8E6' : '#FFFFFF'; // 交替配色 = 折射感
      ctx.lineWidth = 3;
      // 主枝干
      ctx.beginPath();
      ctx.moveTo(ca * 4.6, sa * 4.6);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      // 末端「V」字分叉（向两侧张开）
      ctx.lineWidth = 2.4;
      for (let sg = -1; sg <= 1; sg += 2) {
        const b = a + sg * 0.55;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - Math.cos(b) * 5.6, ty - Math.sin(b) * 5.6);
        ctx.stroke();
      }
    }
    // 中心小正六边形（白色填充 + 冰蓝勾边）
    ctx.shadowBlur = 0;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3;
      const px = Math.cos(a) * 4.8, py = Math.sin(a) * 4.8;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = '#ADD8E6';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.restore();
  }

  /** 水：一滴居中的大水滴 —— 底部圆润、顶部收尖，深蓝 #1E90FF，内部右下角白色月牙高光 */
  function iconWater() {
    ctx.save();
    ctx.shadowColor = 'rgba(30, 144, 255, 0.6)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, -17.5);
    ctx.bezierCurveTo(6.4, -7.2, 11, -0.6, 11, 5.4);
    ctx.bezierCurveTo(11, 12.8, 6.2, 17.5, 0, 17.5);
    ctx.bezierCurveTo(-6.2, 17.5, -11, 12.8, -11, 5.4);
    ctx.bezierCurveTo(-11, -0.6, -6.4, -7.2, 0, -17.5);
    ctx.closePath();
    ctx.fillStyle = '#1E90FF';
    ctx.fill();
    ctx.lineWidth = 2.1;
    ctx.strokeStyle = '#0D47A1';
    ctx.stroke();
    // 内部右下角：白色月牙形高光
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(2.6, 7.2, 4.9, -Math.PI * 0.42, Math.PI * 0.38);
    ctx.stroke();
    // 水滴正下方涟漪：一道中间略凹的 U 型波浪托住水滴 + 左右错开向外扩散的短弧
    // （细线、圆头、浅蓝 #87CEEB 与青 #20B2AA 交织带透明度，线条不闭合、层层荡开）
    ctx.lineCap = 'round';
    // 中间 U 型主波（托底，中央略凹）
    ctx.strokeStyle = 'rgba(135, 206, 235, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-13, 19.5);
    ctx.quadraticCurveTo(-7, 24, 0, 22);
    ctx.quadraticCurveTo(7, 24, 13, 19.5);
    ctx.stroke();
    // 左右交错向外扩散的短弧
    ctx.strokeStyle = 'rgba(32, 178, 170, 0.75)';        // 左内弧（青）
    ctx.beginPath();
    ctx.moveTo(-19.5, 22);
    ctx.quadraticCurveTo(-16, 24.4, -11.5, 23.4);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(135, 206, 235, 0.6)';        // 右内弧（浅蓝，略低错位）
    ctx.beginPath();
    ctx.moveTo(11.5, 24);
    ctx.quadraticCurveTo(16, 25.4, 19.5, 22.8);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(32, 178, 170, 0.45)';        // 左外弧（更淡更远）
    ctx.beginPath();
    ctx.moveTo(-24.5, 24.6);
    ctx.quadraticCurveTo(-21.5, 26.4, -18, 25.6);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(32, 178, 170, 0.45)';        // 右外弧
    ctx.beginPath();
    ctx.moveTo(18, 26.2);
    ctx.quadraticCurveTo(21.5, 27.4, 24.5, 25.6);
    ctx.stroke();
    ctx.restore();
  }

  /** 草：四叶草 —— 四个圆润心形叶片、尖端交汇于中心；按「左上 → 右上 → 左下 → 右下」
      顺序层叠绘制，后画叶片压住先画的，形成自然生长的遮挡层次。
      翠绿 #32CD32 填充，被遮挡边缘用深绿 #2E7D32 描边区分层次 */
  function iconGrass() {
    ctx.save();
    ctx.shadowColor = 'rgba(50, 205, 50, 0.5)';
    ctx.shadowBlur = 6;
    ctx.lineJoin = 'round';
    // 叶片绘制顺序：左上 → 右上 → 左下 → 右下（后画压先画）
    const order = [Math.PI * 1.25, Math.PI * 1.75, Math.PI * 0.75, Math.PI * 0.25];
    for (let k = 0; k < 4; k++) {
      ctx.save();
      ctx.rotate(order[k]);                                  // 转到该叶片所在的对角方位
      ctx.translate(0, -9.6);                                // 叶尖朝中心、叶面朝外
      // 圆润心形叶片（局部坐标：尖端朝 +y 即朝中心）
      ctx.beginPath();
      ctx.moveTo(0, 6.2);                                    // 叶尖（指向中心交汇点）
      ctx.bezierCurveTo(-8.4, 0.4, -7, -7.2, -2.9, -6.9);
      ctx.bezierCurveTo(-1.1, -6.7, 0, -5.2, 0, -4);
      ctx.bezierCurveTo(0, -5.2, 1.1, -6.7, 2.9, -6.9);
      ctx.bezierCurveTo(7, -7.2, 8.4, 0.4, 0, 6.2);
      ctx.closePath();
      ctx.fillStyle = '#32CD32';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#2E7D32';                           // 深绿描边：区分被遮挡的层叠边缘
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  /** 岩：双峰雪山 —— 小雪山在后（左侧后方探出、缩小约 12%）、主峰在前（更宽更高、坡面带岩石棱角折线）；
      山顶纯白积雪下缘为不规则锯齿，像挂在岩脊上；底部一条又细又长的地平线（超出山体左右边缘） */
  function iconRock() {
    ctx.save();
    ctx.shadowColor = 'rgba(90, 90, 90, 0.4)';
    ctx.shadowBlur = 6;
    ctx.lineJoin = 'round';
    // ---- 小雪山（后层，左后侧方探出、整体缩小约 12%，右半被主峰遮挡） ----
    ctx.beginPath();
    ctx.moveTo(-17, 12);
    ctx.lineTo(-12, 1.8);                          // 左坡岩石折角
    ctx.lineTo(-8.8, -1.5);                        // 峰顶
    ctx.lineTo(-6, -0.5);                          // 右坡折角
    ctx.lineTo(-1, 12);
    ctx.closePath();
    ctx.fillStyle = '#808080';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#4A4A4A';
    ctx.stroke();
    // 小雪山积雪：盖顶，下缘锯齿状挂在岩脊上
    ctx.beginPath();
    ctx.moveTo(-10.6, -0.2);
    ctx.lineTo(-8.8, -1.5);                        // 峰顶
    ctx.lineTo(-6.8, 0.6);                         // 右坡雪线起点
    ctx.lineTo(-7.7, 2.2);                         // 锯齿下探
    ctx.lineTo(-8.6, 0.8);                         // 回抬
    ctx.lineTo(-9.7, 2.8);                         // 左侧锯齿下探最深
    ctx.lineTo(-10.9, 1.1);
    ctx.closePath();
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    // ---- 主峰（前层：更宽更高，坡面带岩石棱角折线，压住小雪山右半） ----
    ctx.beginPath();
    ctx.moveTo(-13, 12);
    ctx.lineTo(-9, 3.5);                           // 左坡岩棱①
    ctx.lineTo(-6.8, 4.8);                         // 左坡岩棱②（外凸台阶）
    ctx.lineTo(-4, -3.5);                          // 左坡岩棱③
    ctx.lineTo(-1.8, -2);                          // 左坡小凹口
    ctx.lineTo(0.5, -9);                           // 左肩
    ctx.lineTo(1.8, -14.5);                        // 主峰顶（更高）
    ctx.lineTo(4, -12.2);                          // 峰顶右脊折角
    ctx.lineTo(6.5, -6.5);                         // 右坡岩棱①
    ctx.lineTo(9, -7.6);                           // 右坡小凹口
    ctx.lineTo(12, -0.5);                          // 右坡岩棱②
    ctx.lineTo(14.5, 0.8);                         // 右坡岩棱③（外凸台阶）
    ctx.lineTo(18, 12);
    ctx.closePath();
    ctx.fillStyle = '#808080';
    ctx.fill();
    ctx.lineWidth = 2.2;
    ctx.stroke();
    // 主峰积雪：盖顶，下缘不规则锯齿/波浪，像挂在岩石上
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(-1.2, -7.2);                        // 左坡雪线起点
    ctx.lineTo(0.5, -9);
    ctx.lineTo(1.8, -14.5);                        // 峰顶
    ctx.lineTo(4, -12.2);
    ctx.lineTo(5.4, -8.8);                         // 右坡雪线末端
    ctx.lineTo(4.2, -6.6);                         // 锯齿①浅回
    ctx.lineTo(3.1, -9.4);                         // 锯齿②深挂
    ctx.lineTo(2, -6);                             // 锯齿③浅回
    ctx.lineTo(0.9, -9.8);                         // 锯齿④深挂（最低）
    ctx.lineTo(-0.3, -6.4);                        // 锯齿⑤浅回
    ctx.lineTo(-1.6, -8.6);                        // 锯齿⑥中挂
    ctx.closePath();
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = 'rgba(74, 74, 74, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // ---- 地平线底座：又细又长，贯穿图标底部并略超出雪山左右边缘 ----
    ctx.beginPath();
    ctx.moveTo(-22, 14.5);
    ctx.lineTo(22, 14.5);
    ctx.strokeStyle = '#4A4A4A';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.restore();
  }

  /**
   * 绘制盲盒：高级感「彩虹流光」魔法球 ——
   * ① 外围彩虹色发光阴影（色相随时间流转 + 光晕呼吸）；
   * ② 七色高饱和锥形渐变铺满整球（红橙黄绿青蓝紫平滑环状过渡，起始角缓慢旋转 = 流光）；
   * ③ 正中白色粗体大问号（细描边，任何彩虹底色上都清晰可见）。
   */
  function drawMysteryOrb(o) {
